[package]
name = "budget-book"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "budget-book"
path = "src/main.rs"

[features]
# Test-only injection points (backend/src/test_hooks.rs, TASK-147). Never
# enabled for release builds; mise backend:test / backend:lint turn it on.
test-hooks = []

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
http = "1"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
subtle = "2.6"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs", "sync"] }
tokio-util = "0.7"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1"
url = "2.5.7"
uuid = { version = "1.28.0", features = ["v4"] }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
webauthn-rs-proto = "0.5.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
webp = { version = "0.3.1", default-features = false }
kamadak-exif = "0.6.1"
ulid = "3.0.0"
futures-util = "0.3.34"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["pkcs8"] }
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1"
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softpasskey"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
sha2 = "0.11.1"
