[[condition]]
id = "web-shell.home-fresh-window"
target_function = "web/App.vue（shell 層の共通 URL 同期 composable〔useBrowsingUrlSync〕の baseline におけるホーム進入時の鮮度判定とログイン着地時のリセット）・web/stores/period.ts（lastActivityAt・HOME_FRESH_WINDOW_MS・resetToDefault）"
source = "Issue #9（GitHub TomoTom0/kakeiboot#9・ユーザー原則「ホームへのアクセスはごく短時間以内の復帰でのみ直前の期間を引き継ぐ。それ以外は当月から始まる。セッションの新規・継続は無関係」）・PR #10（実装）。バック進入の committed 同一キーの扱い・取り込み不能キーの扱い・ログイン着地でのリセットは PR #10 独立レビュー（2026-11-16）の指摘による追補"
source_lines = "frontend/tests/unit/web/period-store.test.ts:290, frontend/tests/unit/web/url-sync.test.ts:1247, frontend/tests/unit/web/url-sync.test.ts:1260, frontend/tests/unit/web/url-sync.test.ts:1287, frontend/tests/unit/web/url-sync.test.ts:1301, frontend/tests/unit/web/url-sync.test.ts:1330, frontend/tests/unit/web/url-sync.test.ts:1356"
description = "ホーム進入時の期間の扱い: (1) コールドスタート（セッション最初の閲覧画面着地）でホームに着地した場合は URL の期間キーを取り込まず当月から始める（labels は復元する。他画面のコールドスタートは従来どおり取り込む） (2) セッション内のホーム進入では、最後の期間活動（lastActivityAt）から HOME_FRESH_WINDOW_MS（10分）以内なら立っている期間を引き継ぎ、超過していればデフォルト（当月）へリセットする (3) 期間キーを明示的に運ぶ進入はキー取り込みが優先される。ただしキーが直近の committed snapshot と同一なら、それは書戻しが自ら塗った状態であって明示指定ではないため鮮度判定の対象になる（browser・端末バックでのホーム再訪は履歴 entry にキーが塗られているため、常にキー付き進入になる問題への対処） (4) 空値・形式不正・from のみ等、fromQuery が取り込めないキーはキー付き進入とみなさない (5) ログイン画面への着地で期間はデフォルトへ戻り、コールドスタートは再武装する（SPA のログアウト→再ログインで前セッションの期間を持ち越さない）"
given = "ホームで期間を 2026-09 にして /receipts へ移り、5分後に browser バックで戻る / 11分後にバックで戻る / 11分後に /?month=（空値）へ進入する / ログアウトしてログイン画面へ着地した後、再ログインして /?month=2026-05 へ着地する"
expect_return_shape = "5分後のバックでは Home の期間は 2026-09 のまま / 11分後のバックでは当月 2026-10 へリセットされ URL も ?month=2026-10 へ書き換わる / 空値キー進入でもリセットは抑止されない / ログイン着地時点で期間は当月に戻り、再ログイン後のキー付きホーム着地はコールドスタートとして扱われ 2026-05 は取り込まれない"

