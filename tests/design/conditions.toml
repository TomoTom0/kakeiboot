description = "month/yearモードのトレンドzoneはグラフ左右に前次chevron button対（.trend-nav・aria-label/title「前の範囲」「次の範囲」・読み上げ専用で画面上にテキストなし・PeriodPicker の送りbuttonと同型）を持ち、押下でfocus（period）を変更せず表示窓を窓幅（month 6か月・year 12か月）ずつ過去方向へページ送りして（前窓との重複なし）表示窓の取得は trend API のみを対象とする（analysis・ranking・recent と Home月モードのweek fetch〔TASK-103・load() 残留〕は走らず他zoneの表示も不変。TASK-115: 移動先窓が結果cache済みなら表示fetchなしで即時コミット〔loading にしない〕・未取得なら trend API をfetch）。窓stateは composable useTrendWindow に集約し、初期窓（offset=0・focus変更直後）は month が選択月を含む6か月窓〔trendQuery(5) と一致〕・year が選択年12か月〔anchor は右端の12月で period.range と一致〕で、前へ押下ごとに窓が自幅（month 6・year 12）分入れ替わる（隣接ページと月の重複なし）。次へは TASK-161 で offset 依存条件から対称の全zero floor（web-home.trend-window-floor）へ改められ（絶対窓化により offset 概念は廃止。未来方向へのpagingも data のある限り可能）。focus変更は TASK-161 §1 のイベント別仕様: 窓内移動（E2a）は窓不動・fetchなし（web-home.trend-window-absolute）・窓外近傍 k≤span（E2b）は最小slide（web-home.trend-window-min-slide）・窓外 k>span（E2c）は正規窓reset・mode/labelQuery/家計簿切替（E3/E4）は正規窓reset＋cache clear を行う。fetch確定窓は windowKey（'<from>..<to>'・label_colors を含まない範囲ベース）として composable に保持され、初回fetch確定までは TrendBars は v-if で描かれず（zone に棒は描かれず中間表示もない）・確定で即時描画（slideなし）する。labelQuery 切替・refresh による同一窓の再fetchでは windowKey が不変で表示窓は変化しない〔slide遷移の契約は web-home.trend-window-slide〕。fetch引数は axis（AxisDetail は画面の軸・他画面は category/store）・metric=amount・granularity=month（active時つねに月粒度）・limit=5・labelQuery があれば label_colors も流れる。TASK-115: 窓取得結果は keyOf(args)（引数込みのJSON）をkeyとする resultCache へ保存され（表示fetch成功確定時・prefetch成功時。windowKey は from..to 同一でも引数が異なれば別cacheで誤ヒストしない）、prev/next押下では既存の冪等ガードより先に cache ヒット判定を行う（ヒットで fetch なしコミット・canPrev は同式で即時再計算・TASK-112 P2 の pending無効化はこの経路へ移植〔web-home.trend-window-cache-return〕）。コミット確定時（表示fetch成功・cacheヒットコミットとも）には prev 方向の隣接1窓を prefetch する〔web-home.trend-window-prefetch〕ため trend API 呼び出し総数はコミットあたり最大+1。mode/range/labelQuery/家計簿の変更（flush）で resultCache・prefetch発行済み集合・slide・slide要求をクリアし offset=0 へリセットする（同じ窓へ戻っても再fetchする）。stacked bars の組立（上位3系列+残余「ほか」segment〔TASK-123: fetch は limit=5 のまま前端で上位3へ切り詰め〕+色は seriesColor(s.key, axis) の決定的写像〔TASK-105・web-common.series-color-assignment〕）も composable へ集約され4画面（Home・Categories・Stores・AxisDetail）で同一実装・同組立になる（slide中の表示配列は連結配列〔web-home.trend-window-slide〕）。TASK-161 レビュー中4で確定: 明示 refresh() は無効化操作（resultCache・prefetch発行済み集合をクリアし表示窓を再fetch。完了済み同引数も再発行する）。二重発火の抑制は進行中同一引数の skip のみが担う（AxisDetail の composable watch と route watch の二重発火でも実fetchは1回で、focus変更時のAPI呼び出し総数は TASK-115 の prefetch 分を除いて現行と同一。例外は AxisDetail の家計簿切替時のみ: useLedger 2回目以降の router.replace で一覧へ戻る〔unmount〕経路では composable watch が trend fetch を1回発行しうる）。ledger未確定（selectedLedgerId=null）ではfetchしない（prefetchもしない）。week/rangeモードとReceiptsPage inline・Home週zone（WeekRows）は対象外（button非表示・窓は選択期間そのもの・fetch内容も現行と同一・隣接窓prefetchは表示窓と同keyのため発行しない）。URL query・sessionStorageには反映しない（ephemeral・画面遷移・再読み込みで初期窓に戻る）。TASK-158（TASK-146 §3 #14 改訂。窓移動・cache・prefetch・flush の契約は不変）: TrendBars は windowKey で再 key 付けしない（key 付け fade を廃止）。focus変更後の初回確定は slide せず即時差替えのまま（web-home.trend-window-slide）で、期間移動時の windowKey 変化も trend fetch が pane の load commit と独立に先・後どちらに確定しても fade なしの即時差替え（.bars DOM 不変）で pane の ContentSwap が唯一の演出（廃止理由は web-common.content-swap。AxisDetail の subject 解決後の初回確定は TrendWindow mount 前に確定し対象外・refresh は windowKey 不変）"
