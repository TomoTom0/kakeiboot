description = "summarize_spending の report=monthly_overview・monthly_trend の2系統は結果の _meta に trend_matrix を返す（sections 本文・input schema は不変・モデル可視 payload は不変。monthly_overview は daily_cumulative と併存・monthly_trend は trend_matrix が常に非空になるため _meta が新規付与される）。trend_matrix は REST GET /analysis/trend と同一形状（dto の TrendResult: axis/metric/granularity/period/buckets/series/bucket_totals/truncated_rows）で、axis は REST trend と同一値の \"category\"（filters.category 指定時は系列がその小分類へ drill する REST category 軸と同規約・小分類固定の呼び分けは無い）・metric=\"amount\"・granularity=\"month\"。buckets は range の全月の零埋め昇順で section rows（monthly_section）と同順・同長（range は各 report の monthly_section と同一: monthly_overview では trend section と同じ直近6か月 sub-range・monthly_trend では指定 range 全体）。series は range 全体合計降順の上位5系列（key/label/values/total）で「その他」系列は含まず frontend が bucket_totals − series から残余 grey を作る（REST trend と同じ原則・widget の積み上げ組立は shared/lib stackedOf 共用。注記 TASK-123: この上位5の matrix 契約は不変で、前端の積み上げ描画は上位3+「ほか」へ組立替え〔web-common.stack-dimension-rules〕）。bucket_totals は各月の全軸値合計（上位5+残余）。label_colors 等の filters が matrix にも同条件で掛かる（monthly_section の合計も同条件のため整合）。入力引数は一切増やさない（deny_unknown_fields のまま）"
given = "2026-10 に 560円（未分類アイテム）の記録がある ledger で summarize_spending report=monthly_overview（period {month: \"2026-10\"}）・report=monthly_trend（period {from: \"2026-05-01\", to: \"2026-10-31\"}）を呼ぶ / filters.label_colors=[\"red\"]（red は 2026-10 に 480円分）を付けて呼ぶ"
expect_return_shape = "両 report の _meta.trend_matrix が axis=\"category\"・metric=\"amount\"・granularity=\"month\"・buckets=[\"2026-05\"..\"2026-10\"]（零埋め昇順・section rows と同順同長）・series は上位5（全軸が未分類なら key=null・label=未分類 の1系列）・bucket_totals=[0,0,0,0,0,560]・truncated_rows=0・「その他」を含まない / label_colors 指定では bucket_totals=[0,0,0,0,0,480] と series 値も 480 に絞り込まれる"

