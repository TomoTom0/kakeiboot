description = "積み上げ bar と行内横bar（TASK-129: ランキング行bar・widget bar_h・ShareBar を含む）の角はデータ端（縦 bar=上端・横 bar=右端）のみ丸め・baseline（基端）側は直角で、radius は cap 式 min(2px, 短辺/4)（縦 bar の短辺=幅・横 bar〔行内 bar〕の短辺=高さ。widget は等価 viewUnit。行内 bar 高さ 6px では 1.5px）。これにより最小幅 4px の daily 棒では radius は 1px に縮み幅の大部分を丸めるピル型化（旧上角 3px=幅の75%）を防ぐ。§2-1 の主因だった .bar-seg:first-child への border-radius 規則（中段角丸: .bar-stack が column-reverse のため DOM :first-child=視覚最下段の上辺角が丸く棒の途中が丸く見える）は削除され、中段（上端でも下端でもない位置）のセグメント角は全て直角になる。実装は web が最上段セグメントへの JS 計算値 border-radius {r} {r} 0 0（border が radius に追随）・行内 bar は .row-seg:last-child の border-radius 0 1.5px 1.5px 0。REVIEW-5 medium-2 で容器の静的 border-radius と overflow:hidden は削除確定: 容器 2px radius+overflow clip が幅 8px 未満で外形を支配し JS cap を描画上無効化（幅 4px bar で完全半円のピル型再発）するため、角の描画は最上段セグメント単独が担い容器は角も clip も持たない（規則D で clip 役割は既に無く配分は常に収まる）。週行・ランキング行bar は右端（データ端）のみ cap で左端（基端）直角（縦 bar の上端のみ丸め・baseline 直角と同型）・widget は最上段セグメント自体を上端角丸の path（下端直角・stroke が角丸に沿った全周輪郭・半径基準は外寸/4 で web と同一）で描き他セグメントは rect+stroke・clipPath は角丸部分の線を作れないため廃止（fallback 単一 bar も同一 path・規則F 時は inset なしの全外形）。TASK-129: widget bar_h の rx=2 四隅一律は廃止されデータ端（右端）のみ cap path・基端（左端）直角、ShareBar も右端のみ cap（共通 renderer BarSegs が描き chart 内部に個別実装なし）"
given = "trend 2セグメント棒（上段・下段セグメント）・daily 棒・ランキング行bar・週行 bar を 360px で実測 / styles.css の内容 / widget bar_v・bar_h・stacked_bar の DOM"
expect_return_shape = "trend 棒の最下段（第一系列・DOM first-child）セグメントの computed borderRadius が 4隅とも 0px（中段角丸なし）・最上段セグメントは上2隅が radius r（1<=r<=2・r<=短辺/4）で下2隅 0px / daily 棒・行内 bar（.row-seg）も同型（daily は上端のみ・行内 bar は右端のみ cap で左2隅 0px）で .daily-bar/.row-seg の中段角は 0px / styles.css に .bar-seg:first-child の border-radius 規則は存在せず・.bar-stack と .daily-bar は border-radius も overflow も定義しない（容器の computed radius は4隅 0px・overflow visible で、子セグメントの cap radius が外形を支配し容器クリップに上書きされない） / widget bar_v の各棒の最上段要素は rect でなく上端角丸の path で clipPath 要素は存在しない / widget bar_h・ShareBar のデータ端（右端）shape は角丸 path・基端（左端）は直角で bar_h rect の rx=2 は存在しない"

