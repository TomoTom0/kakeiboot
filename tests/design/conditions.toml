description = "作成は構造に沿った2導線のみ: 大分類は card 見出し行（h2 の右）の「+」（add-top・44px・aria-label「大分類を追加」）で一覧の先頭（ul.rows の外・直前の div.add-row。ul.rows の子は li.cat-group のみ）に追加行を展開し、小分類は大分類ヘッダの「+」（add-child-<id>・44px・aria-label「{大分類名}に小分類を追加」）でそのグループの子の末尾（li.row.add-row）に追加行を展開する（折り畳んでいる大分類の+は当該グループを展開してから開く）。path 直書き input は存在しない（親が必ず決まるため「親が無い」error は UI から発生しない）。追加行は input + 作成/やめる で行editorに準じる（Enter で作成・Escape でやめる・作成は busy または空欄で disabled・create path は小分類が ${親}/${入力}・大分類が入力そのまま。作成/やめる button は TASK-47 で check〔primary〕/ close の icon-only になる。詳細は web-manage.editor-icon-actions）。名前に / を含む場合は保存時 validation で拒否し（API を呼ばない）追加行の行内 status に error「/ は使えません。…」を出し入力と追加行を保持する。同名既存（created:false）は info「すでにあります」を追加行の行内 status に出し追加行と入力を保持、成功で追加行を閉じて一覧を再取得する"
