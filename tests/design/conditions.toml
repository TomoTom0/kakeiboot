# TASK-76 レシート一覧の絞り込みフォームの PopoverPanel 移設（tm-76。TASK-75 コードレビュー L4）。
# tm-28 design_browsing.md §6-3 末尾の規定「フォームを含む popover（絞り込み・期間範囲・検索入力）は
# D26 の PopoverPanel（role=dialog）を使う」（設計review 指摘6: 絞り込み・期間範囲はシート variant。
# PopoverMenu〔role=menu〕は「…」メニューだけ）が TASK-75 では未実装で、フォームは ReceiptsPage の
# filtersOpen によるインライン折りたたみ（v-if の card フォーム）のまま残っていた。本タスクで
# フォームをツールバー絞り込みボタンの PopoverPanel へ移設し、展開時に本文を消費しない形にする。
# 絞り込み機能自身（条件適用・クリア・URL 同期・チップ）の挙動は不変（web-receipts.dashboard ほか）。

[[condition]]
id = "web-receipts.filter-popover"
target_function = "web/pages/ReceiptsPage.vue（絞り込みフォームを PopoverPanel〔variant=sheet-narrow・filters-popover〕へ移設し v-if のインライン form を削除）・web/components/BrowseToolbar.vue（新設 filter slot: 絞り込みボタンを PopoverPanel ごとページから受け取る。filter-button/filters-open props と toggle-filters emit は廃止）・web/styles.css（.filters の dialog 内1列化・左端トリガの左寄せ規則・720px 1列化の削除）"
source = "docs/spec_mcp-tools.md §12（レシート一覧の絞り込みフォームはツールバー絞り込みボタンの PopoverPanel〔role=dialog・variant=sheet-narrow〕の中に出る〔TASK-75 コードレビュー L4 → TASK-76〕。PopoverMenu は「…」メニューだけに使う）"
source_lines = "frontend/tests/unit/web/styles.test.ts:538, frontend/tests/unit/web/view-pages.test.ts:808"
description = "レシート一覧の絞り込みフォーム（店名・品名・カテゴリ・削除済み+適用）はページ本文のインライン折りたたみ（card フォーム）ではなく、ツールバー1行の絞り込みボタン（filters-toggle・.toolbar-filter-btn のまま）から開く PopoverPanel（role=dialog・variant=sheet-narrow。部品自身の期待は web-shell.popover-panel）の中に出る。閉じているとき data-test=filters は DOM に存在せず、開いても本文（KPI・支払方法・日別・レシート一覧のカード類）は一切増えない（フォームは .page-toolbar 内の popover-host から浮く dialog の中で、.view-page 直下には増えない）。適用（submit）で dialog を閉じ、従来どおり filters へ反映し syncQuery による URL 同期と再取得が走る（draft の保持・×チップで外した条件の draft 同期消しも従来どおり）。Escape・外側押下（480px 以下の sheet では scrim 押下）で閉じトリガボタンへフォーカスが戻る（usePopover 既存）。dialog の中身は .filters の1列（旧3列 grid と 720px 1列化は削除）で、 anchored 時の dialog は左端トリガに左寄せ（共有の right:0 は右端メニュー用）"
given = "/receipts を開き絞り込みボタンを押す / 品名を入れて適用する / 開いたまま Escape・外側押下・480px 以下で scrim 押下 / styles.css を読む"
expect_return_shape = "閉状態で [role=dialog] と [data-test=filters] が存在しない / 押下で filters-toggle の aria-expanded=true・aria-controls が dialog の id と一致し [role=dialog] 内に data-test=filters（store/item/category/include-deleted/search）がある / dialog が .page-toolbar 内の popover-host に乗り .view-page の直下要素にフォームは増えない / 適用で dialog が閉じ URL に item= が載り一覧が再取得される / Escape・外側押下・scrim 押下で閉じ filters-toggle へフォーカスが戻る / styles.css に .filters の grid-template-columns: 1fr（repeat(3, は無い）と .filters-popover .popover-dialog:not(.is-narrow) の left: 0・right: auto（480px ボトムシートの is-narrow 全幅を :not() で保護。TASK-60 実測で発見した cascade バグの修正）が定義され 720px block に .filters は無い"

# ---------------------------------------------------------------------------
# TASK-61 loadSequence 完了時の currentId clobber 保証（tm-61）。TASK-49 設計レビュー
# 指摘（TASK-49 設計レビュー観点1）: loadSequence の await
# api.listReceipts の待ちの中で goTo・route watch・IO 配信（handleCurrent）が currentId を
# 変えると、完了時の anchor 分支の currentId 設定がそれを上書きしていた（同窓 clobber。
# URL は別経路の replace で新 id を指すのに表示中は anchor へ戻る不整合）。TASK-49 の
# capture-at-bump（mseq）は初期スクロール側のみ守り、currentId 自体の上書きは残っていた。
# 対応は moveSeq 世代と同様のガード: anchor 分支も自分の世代でなければ currentId を設定
# しない（後勝ち）。sequence・total・nextCursor の更新と markReady は従来どおり行う。

[[condition]]
id = "web-receipts.feed-loadsequence-generation"
target_function = "web/pages/ReceiptDetailPage.vue（loadSequence の anchor 分支における currentId 設定の世代ガード）"
source = "docs/spec_mcp-tools.md §12（レシート詳細の段: 一覧取得の待ち中に別経路（前後ボタン・route watch・IO 配送）が表示中レシートを変えた場合は後勝ちとし、取得完了時の anchor 設定は上書きしない〔TASK-61。TASK-49 設計レビュー観点1の指摘〕。勝者 id が着地 sequence に含まれない場合も placeholder 付きで全件描画され、IO 配信が支配的パネルを current へ挙げ直す〔自己修復〕）"
source_lines = "frontend/tests/unit/web/receipt-feed.test.ts:715, frontend/tests/unit/web/receipt-feed.test.ts:736, frontend/tests/unit/web/receipt-feed.test.ts:755"
description = "loadSequence は await api.listReceipts の待ちの間に別経路（goTo・route watch・IO 配信の handleCurrent）が currentId を変更していた場合、anchor が見つかった分支の完了時に currentId を anchor へ上書きしない（自分の moveSeq 世代でなければ設定しない。後勝ち）。自分の世代のままなら従来どおり anchor を設定する。上書き回避に限らず、sequence・total・nextCursor の更新・ensureObserved・markReady は従来どおり行う。勝者idが着地 sequence に含まれない場合も同じ後勝ちで扱い、その場合の着地状態と自己修復を仕様として明示する: currentId はどのパネルにも当てはまらない（currentIdx -1・描画窓は空・feed-position は '-'・前後ボタンは両方 disabled）が、パネル article は placeholder（18rem・日付+店名）付きで全件描画され observe 対象のままなので、IO 配信が sequence 内の支配的パネルを current へ挙げ直し URL もその id へ置き換わる（自己修復。窓が空でも panelEl(勝者) が null になるため優越判定は妨げない。着地が上方向補正の待ち〔compPending〕と重なった場合はその間の配信が呑まれ、次の交差変化の配信で修復する）"
given = "文脈A（10月）の sequence 表示中に文脈B（9月）へ push し、文脈B の listReceipts を gate で遅延させている間に、旧 sequence への IO 配信または前後ボタンで currentId を文脈B のリストにも含まれる id へ変更してから gate を開く / 同様に文脈B のリストに含まれない id（文脈A 側にしか無い id）へ変更してから gate を開き、着地後に IO 配信を1回行う / 待ち中に currentId を変える経路が無い通常の読み込み"
expect_return_shape = "gate 解放後も currentId は別経路が設定した id のまま（feed-position はその id の位置・URL もその id を指し、loadSequence の anchor へ引き戻されない） / 勝者idが着地 sequence に含まれない場合は窓空（ReceiptPanel 本体はどの article にも無い）・feed-position は '-'・前後ボタン両方 disabled で article は placeholder 表示、IO 配信1回でその id が current になり URL が置き換わり feed-position が 'n / total' に復帰する / 通常の読み込みでは従来どおり anchor が current になる（既存の直リンク・文脈読み込み条件で担保）"

