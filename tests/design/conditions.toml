# TASK-8 DBスキーマ実装と TASK-10 Phase A（パスキー・webセッション・運用者CLI・設定雛形）の条件書。
# TASK-8 の正本は docs/spec_data-model.md（§15 DDL・§9 seed・§12 TTL・§7 draft）。
# Phase A の正本は docs/spec_auth.md（§1 設定・§2 パスキー・§3 webセッション・§8〜9 回復・CLI・§10 セキュリティ規則）。
# draft の画像状態遷移の正本は docs/spec_mcp-tools.md §5（I1〜I6）。
[meta]
feature = "db-schema"
source_file = "backend/migrations/*.sql, backend/src/store.rs, backend/src/domain/dto.rs, backend/src/db.rs, configs/dev/auth.toml, backend/src/config.rs, backend/src/auth/*, backend/src/admin.rs, backend/src/mcp/*, backend/src/ratelimit.rs, backend/src/maintenance.rs, frontend/src/widget/*, frontend/src/shared/*"
verified = true
verified_at = "2026-10-16"
verified_by = "claude"
test_command = "mise run verify（backend:test = cargo test --workspace 全 366 件 pass: lib 単体 64・admin_cli 12・admin_cli_phaseb 6・auth_login_session 15・auth_passkeys 12・auth_register 15・config_load 6・db_drafts 29・db_schema 53・db_seed_ttl 17・healthz 4・mcp_auth 9・mcp_ping 4・mcp_tools_account 7・mcp_tools_catalog 5・mcp_tools_drafts_batch 27・mcp_tools_labels 6・oauth_flow 12・oauth_race 3・oauth_refresh 6・oauth_token 17・rate_limit 6・request_log 7・store_member_color 1・web_data_api 18・web_media 5。frontend vitest 192 件（33 ファイル）。verify-conditions.py も pass: 475 条件・70 除外。2026-10-16 TASK-26 管理ラベル化（色名テキスト全廃・LabelChip・LabelToggleGroup・付与/絞り込み popover・管理画面5行一覧+行内編集）後。2026-10-17 TASK-25 障害注入テスト（保存失敗 fetch_failed・承認tx内NotFound/Forbidden）追加: backend:test・backend:lint・verify-conditions はこの時点の実測に更新、frontend vitest と mise run verify 全体は統合時に再実施）"
source_hash = "f14ef9b6bf9827f494a98a7f916024d36888f2ca"
note = "承認tx（approve_draft）・reopen・TTL掃除・seedは library 層（backend/src/store.rs）の関数として検証する。TASK-10 Phase A（auth-* / auth-cli 条件）は docs/spec_auth.md 起点で条件化し、webauthn-rs 0.5 の SoftPasskey（webauthn-authenticator-rs dev-dependency）で実機なしの結合検証を行う。TASK-10 Phase B（auth-oauth / auth-mcp / auth-ledger / auth-ratelimit / auth-cleanup 条件）も docs/spec_auth.md 起点で条件化し、CIMD/JWKS はローカルモック HTTP サーバ（http://127.0.0.1、[auth.oauth.dev].allow_insecure_loopback）で、client assertion は rsa 2048 鍵の実署名で検証する。request_recovery の匿名経路と §8-2 の DB rate limit 本体は TASK-7 項目17 の実装ゲート中（除外記録参照）。単一ファイル運用のため meta.feature とファイル stem は一致しない。source_hash は Phase A 検証時点のもの（Phase B 差分は test_command の件数で裏付け）。TASK-11 widget（widget.* 28 条件）は frontend の vitest（tests/unit/widget/ 35 件、2026-10-14 pass）で fake host と fixture により backend 非依存に検証する"

