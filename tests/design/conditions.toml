expect_return_shape = "直リンクで品目tab（aria-selected）・期間 2026年10月・ラベル red の結果が再取得され検索欄 draft・topbar ラベルチップが URL と一致 / タブ切替で aria-selected が移り URL は items のときのみ tab=items を持つ / all への切替で scope key・期間 keys を共に除去（URL は q〔・tab〕のみを残す）/ 空欄確定で q のみ除去（tab/scope/期間は保持）/ 期間変更・ラベル切替で URL の期間3形・labels= が最新へ書き換わる"

[[condition]]
id = "web-search.input-commit"
target_function = "web/pages/SearchPage.vue（commit/commitSoon・timer・composing・keydown.enter・watch(route.query.q) の draft 同期・load の seq guard）"
source = "docs/spec/spec_mcp-tools.md §12（/search 検索欄の確定操作の段〔TASK-41 で追記〕）"
source_lines = "frontend/tests/unit/web/search-page.test.ts:466, frontend/tests/unit/web/search-page.test.ts:512, frontend/tests/unit/web/search-page.test.ts:539"
description = "ページ内検索欄の確定は Enter 即時＋入力停止 300ms の debounce 併用（timer は置き換え・unmount で clear）で、いずれも router.replace（履歴を積まない）で URL の q へ反映する。IME composition 中は debounce timer を始めず・変換確定の Enter（isComposing）では検索が走らない（compositionend 後に debounce を掛け直す）。空欄確定は q を外して結果をクリアし、min 文字数の門は設けない（backend が正規化後3文字未満を LIKE で処理するため）。逐次入力の race は load の seq guard で最後の1つのみを採用する。検索 dialog 実行（/search 内）等で URL の q が変化したら draft が追従し残留 timer を停止する（停止しないと 300ms 後に古い語で q を上書きする競合が起きる）"
given = "「牛乳」を入力して 300ms 待つ / Enter を押す / IME 変換中に Enter / compositionend 直後 / 空欄で Enter / 結果取得中に語を変えて再度確定 / 検索 dialog から別の語を実行"
expect_return_shape = "入力停止 300ms 後と Enter の両方で URL の q が置き換わる（replace）/ isComposing の Enter では q が変わらず composition 中は timer が始まらない / 空欄で q が除去される / 遅い旧応答は破棄され最後の語の結果のみ表示 / dialog 実行で draft が新語へ同期し 300ms 後の古い語への上書きが起きない"

[[condition]]
id = "web-search.queued-ack"
target_function = "web/pages/SearchPage.vue（commit の pendingAcks 記録・watch(route.query.q) の ack 判別・browsing.onBoundary での pendingAcks 破棄）"
source = "PR#5 レビュー指摘（codex-code-review P2・TASK-178）: TASK-174 の URL sync FIFO 直列化により、pending期間pushの背後に積まれた q 確定の書き込みの ack が route.query.q へ遅れて届くようになった（dialog 実行〔外部ナビゲーション〕や back-navigation と異なり boundary を越えない owned write であるため、watcher での外部変更追従と衝突する）"
source_lines = "frontend/tests/unit/web/search-page.test.ts:562"
description = "検索欄の確定は TASK-174 以降 useBrowsingQuery の FIFO を経るため、ack の landing が後続入力より遅れうる。ページは確定済み term の pending FIFO（pendingAcks）を持ち、watch(route.query.q) は到着値が pending 内の自確定と一致すれば owned ack として draft・debounce timer を保持し（追い入力の debounce が自分で確定を上書きする）、一致しなければ外部変更として従来どおり draft へ追従し残留 timer を停止する。logical q と同値の確定は coordinator が no-op patch を落とすため ack が来ず、pending にも記録しない。boundary（back/forward・外部ナビゲーション・ledger 切替）は queue 内の書き込みを破棄するため pending も破棄し draft は route から復元する（外部変更の追従経路は web-search.input-commit のまま）"
given = "/search?scope=period で期間操作（push）を in flight に保ったまま検索語 a を Enter 確定（q=a の書き込みが queue に積まれる）→ 引き続き ab と追い入力して 300ms debounce を pending / この間に push が完了し q=a の ack が route.query.q へ landing する"
expect_return_shape = "ack landing 後も検索欄 draft は ab のままで debounce timer が生存し（a へ巻き戻らない・timer クリアされない）、300ms 経過で q=ab が確定・検索される / pending に無い値の変化（dialog 実行・back-navigation）は従来どおり draft が追従し timer を停止する"

