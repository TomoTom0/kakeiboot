source = "ユーザー実機指摘 2026-11-03 TASK-161 指摘2「月を移動すると前後の月（の表示・導線）が消えるのはおかしい」・設計 tmp/tasks/tm-161/design_period_ui.md（v2）§1-1（E2b）・§1-2（連結列・moveCols・境界・軸label・trim契約）"
source_lines = "frontend/tests/unit/web/trend-window.test.ts:1184, frontend/tests/unit/web/trend-window.test.ts:1705, frontend/tests/unit/web/trend-window.test.ts:1735"
description = "E2b: focus移動で新月が窓外で距離 k ≤ span なら k か月ぶんの最小slide（窓がkか月移動し新月が近傍端に入る）。連結列は旧窓と新窓の bucket key の和集合（月順・重複keyは1本・列数 ≤ 2×span）で、keyed v-for（key=bucket key）により重複月のDOMは1本再利用される（旧窓と新窓で当該月の値は同一fetch条件で一致するためどちらの結果を描いても同じ）。移動距離 moveCols=k（新規侵入列数）で prev（過去へ）は連結列先頭にk列追加（初期transform=−k列分→終了0）・next（未来へ）は末尾にk列追加（初期0→終了−k列分）。k列ぶんの実測距離は boundary(bars, k)（先頭からk番目の子のoffsetLeft。現行 boundary(bars, N) の引数一般化）。軸labelはslide中も新窓単体で計算した間引き位置（幅ベース間引き: web-browse.trend-axis-minimal）のlabelを連結列grid上の該当bucket key位置に表示する key→label map で trim 前後でlabel位置が不変（TASK-115 の「trimで間引きが入れ替わらない」契約を維持。旧 axisWindows〔窓ごと間引き〕はE1全幅移動も含め key→label map へ統一し廃止）。trim契約（transitionend/watchdog/再press/flush・pin再利用）は web-home.trend-window-slide の現行不変。TASK-161 レビューで確定した例外: 進行中のslideを中断するfocus移動は同tickでtrimし窓だけ移動する（slideRequestもクリアし確定コミットでは再組立しない — 中断されたslide状態からもう一度組立てることはなく、E2bのslide組立は中断なしだけ）。yearモードの期待窓: stepはfocus（選択年の12月）をちょうどspanだけ動かすため正規窓からは k=span のE2b（全幅slide）・paged位置からは k>span でE2c reset になり、±1か月移動窓がcommit対象になることはない（±1移動窓prefetchはmonthモードのみ）。コミット確定時の prefetch は ±1 か月移動窓（E2b の k=1 がcache hitで同期commitされる。E1用 ±span 窓 prefetch も従来通り維持し next側へ拡張）"
given = "composable を月モード（選択月 2026-10・正規窓 2026-05..10 コミット確定後）で初期化し setMonth('2026-11')（窓外・k=1・prefetch 済み）→ setMonth('2026-08')（k=2）"
expect_return_shape = "setMonth('2026-11') で slide が組まれ連結列が 2026-05..10 の6本+2026-11 の和集合7本（重複なし・moveCols=1・dir='next'）・表示fetchなし（cache hit）で trim 後は新窓 bar-2026-06..11 の6本（前月 2026-10 は窓内に残る）/ setMonth('2026-08') は先頭に2列追加の連結（moveCols=2）・trim後 bar-2026-03..08 / 軸label位置（間引き）は trim 前後で不変（key→label map） / コミット確定後に未来側 ±1 か月移動窓も prefetch される"

