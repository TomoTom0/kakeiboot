description = "browsing 系画面（home・categories・stores・receipts・axes 5種・search）の topbar に ‹ が置かれる（brand 直後・icon-only・aria-label「戻る」）。app 内履歴があるときの押下は router.back() で直前の閲覧操作を1件戻す（案a-nocap）。back入口は元関数を呼ぶ前から要求IDでロックし、navigation状態（未観測/処理中/終端）と履歴状態（awaiting-pop/pop-active/restoration-pending/settled）を別々に管理する: 一意なpop成功終端かつ他の履歴待機・未解決navigationがない場合にだけsettledとして解除し、一意なpop拒否のfailure afterEachはnavigationだけの終端として履歴はrestoration-pendingへ移す。待機中（awaiting-pop/pop-active/restoration-pending）は再押下を無視し追加のprogrammatic history要求を発行しない。期間push cancelではbackロックを解除しない。「back発行 → pop未通知 → 外部replace → replaceのPromise終端 → 再押下」では成功/duplicatedとも未通知要求を保持し追加backなし。後着する旧pop・通常解除後に到着する旧pop・新ロック中の旧終端は新しい境界/IDとして扱い誤解除しない。browser popとの競合・pop未通知・対応不明例外では成功を捏造せず追加backなし・境界待機を維持する（因果の完全識別は要求しない）。境界判定で実backを出せない場合の親へのfallback pushは従来どおりで、独立した履歴待機がない場合に限り自身の返却Promiseで完了管理し、確認済み成功時だけ履歴境界を更新する"
given = "境界 position 1 で shell 起動し position 2 へ push した各 browsing 画面（/・/receipts・/categories・/stores・/axes/category/1・/search）で ‹ を押下する / back 完了前に2回連打する / unit用history（createManualHistory）で pop通知を保留した ‹ 押下 → 外部replace → 再押下 → 後着pop・pop拒否（failure afterEach）後の復元前再押下を行う"
expect_return_shape = "6画面すべてで [data-test=topbar-back] が存在し（aria-label「戻る」）押下で router.back が1回・push は呼ばれず直前の entry（'/'）へ戻る / 連打でも back は1回のみ / 未通知backのawaiting-popは外部replaceのPromise終端では解消されず再押下でgo要求が増えない（goCalls 1回のまま） / 後着旧pop・復元前の再押下でもbackロック・drain停止が維持され追加のhistory要求・writeがない（詳細は web-browse.url-queue-boundary・url-queue-failure が検証）"
