description = "レシート一覧の日別の支出zone（.daily-bars の等分トラック。TASK-105 で card から zone 化・.dash-cols 左列〔chart 系〕への割当で支払方法zoneは右列・summary(kpi) とレシート一覧は .dash-cols の外〔web-common.zone-layout〕）は期間の長さだけで粒度が決まり、どの期間でも表示され続ける: 62日以下は日別（月モードの31本など従来どおり・見出し「日別の支出」〔TASK-105 で可視 zone-title 化〕・棒の title は dayLabel）、63..366日は週別（月曜アンカー・見出し「週別の支出」〔可視 zone-title〕・title は bucket 実範囲「8/3〜8/9」・軸は両端 shortDate）、366日超は月別（見出し「月別の支出」〔可視 zone-title〕・title は月ラベル・軸は axisMonthLabels）。データは TASK-89 以降 getAnalysisTrend（axis=category・granularity=spanGranularity(range)・analysisFilters 辿み・呼び出し回数は従来どおり listReceipts/getAnalysis/getAnalysisTrend の3 fetch のまま）で、TASK-116 で棒の積み上げ化に伴い limit を 1→5 へ上げ series を受け取る（追加の API 呼び出しはしない）。棒は上位3系列+残余の積み上げ（TASK-123: fetch limit=5 は不変で前端 slice(0,3)。セグメント文法は trend の .bar-stack/.bar-seg と同値: shared/lib stackedOf 共通組立・残余「ほか」は var(--series-rest)・値0セグメント省略・各セグメント全周 1px var(--seg-outline) 縁取り〔web-common.stack-segment-outline〕・§4-5 寸法配分規則〔構成比5%未満合算・最小寸法=縁取り込み 3px・規則C/F・明示計算値・web-common.stack-dimension-rules〕・角は上端のみ cap 式 min(2px, 幅/4)・baseline 直角で中段角丸なし〔web-common.stack-corner-rules〕・棒高さ=合計/max の現行式と110px 容器・トラックの最小幅は web-receipts.daily-bars-min-track（TASK-162 コードレビュー高1で 0.25rem→--bar-label-w 15px へ引き上げ・収まらない期間は .hscroll）・TASK-123 規則D で上端 overflow clip による切り落としは廃止〔配分計算が必ず収めるため・overflow hidden は角形状のためのみ残る〕）。0円 bucket は .daily-bar が height 0% の要素として存在し続け子セグメントを持たない（棒として見えない・現行と同じ描画結果）。セグメントに「名称 金額（構成比%）」の title を付け（trend .bar-seg と同形式）・.daily-col の title（日付/週範囲/月+合計）は維持。絞り込み中はその条件を通した series 上位3が積み上がる（現行の合計値も同条件なので整合）"
