description = "カテゴリ一覧（品目・店カテゴリ両方）は大分類を折り畳めるグループヘッダ（.cat-head: chevron button・名前〔非 button〕・折り畳み中のみ子数の (2) 表示〔muted 小・aria-hidden〕・ヘッダの+・行末⋯）で構造化し、小分類はその子ブロック ul.cat-children（左端 2px のガイド線+インデント）内の li として表示する。chevron button（44px）でその大分類の子を開閉し（aria-expanded・aria-controls・aria-label「{大分類名}の子カテゴリ N 件を開く/閉じる」）、折り畳んだ大分類の id を sessionStorage（key bb-cat-fold・値 {\"<ledgerId>:<kind>\": number[]}・読み書き失敗時は component 内 state のみ）に保持する。既定は全開で、再 mount・kind tab 切替・ledger 切替で当該 key の状態を復元し、新規作成した大分類は開。アーカイブ済みの大分類も（「アーカイブ済みを表示」ON 時）グループヘッダとして出る。ヘッダの行editor展開中は chevron を disabled にする"
