source = "docs/spec_mcp-tools.md §12（カテゴリ一覧は大分類を折り畳めるグループヘッダで構造化し〔開閉状態は sessionStorage に ledger×kind で保持・既定は全開〕、子ブロックは ul.cat-children。chevron の aria-label・子数表示は aria-hidden）"
