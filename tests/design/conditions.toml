source = "TASK-14（ユーザー指摘: home と settings の混同、タブがアイコンでない、サイドバーが無い）・docs/spec/spec_mcp-tools.md §12（NAV はデータ4節、設定・接続中のアプリは右上メニュー、pageTitle は SECTION_TITLES。ホームでは title 省略〔TASK-16〕。sidebar 見出しの brand リンクを削除し sidebar はナビ + 利用者表示のみ〔TASK-27〕。TASK-35: SECTION_TITLES を {title, icon} に拡張し NAV と一本化、表題テキストの左に該当節の AppIcon を併記）・docs/spec/spec_mcp-tools.md §12（TASK-56: sidebar の主 nav の下に区切り付きで設定 nav を追加。tabbar は4節のまま）"
source_lines = "frontend/tests/unit/web/dashboard-shell.test.ts:857"
description = "ログイン後の画面はアイコン付きサイドバーとアイコン付き下部タブを持ち、主 nav はデータの4節（ホーム・レシート・カテゴリ・店）で現在の節を active 表示する（TASK-56: 主 nav の下に区切り線付きの第2 group として設定（nav-settings）が加わり、詳細は web-shell.sidebar-settings-nav。接続中のアプリはサイドバー・下部タブとも無い）。sidebar に brand 見出し（ロゴのリンク）は置かずナビと利用者表示のみ。下部タブの列数は --tab-count=4。topbar の page title は NAV に依存せず SECTION_TITLES の {title, icon} から引き、表題テキスト（.topbar-title-text）の左に該当節の AppIcon（20px・aria-hidden・テキストと同色）を併記し、ホームでは表題自体を省略する。アカウント設定は /settings でホームとは別画面で、右上メニューの設定項目に aria-current=page が付く。レシート詳細はレシート節"
given = "/ を開き、/settings、/receipts/101 へ遷移"
expect_return_shape = "サイドバー・下部タブとも主 nav 項目はホーム・レシート・カテゴリ・店の4件で各 svg アイコン（sidebar はこの下に区切り付きの nav-settings がある）・nav-apps は存在しない・sidebar に brand リンク（sidebar-head）が存在しない・tabbar の style に --tab-count: 4・ホーム active・topbar に page title なし（svg も無い） / 設定画面（settings-nav）が表示されアカウント番号は無くダッシュボードも無い・トップバー表題「設定」・表題内に svg（aria-hidden=\"true\"） / 右上メニューの設定項目に aria-current=\"page\" / レシート active・表題「レシート」・表題内に svg（aria-hidden=\"true\"）"

[[condition]]
id = "web-shell.menus"
target_function = "web/App.vue（topbar の menu ボタンによる drawer 開閉・scrim・inert・右上アカウントメニュー（PopoverMenu）・LedgerSwitcher の配置）"
source = "TASK-14（ユーザー指摘: メニューボタンが無い）・docs/spec/spec_auth.md §3（ログアウト）・docs/spec/spec_mcp-tools.md §12（menu-btn を topbar の最初の子。右上メニューは aria-haspopup=menu、設定 → 接続中のアプリ → ログアウト。ledger-select を LedgerSwitcher に置換〔TASK-16〕。menu ボタンは常に見え同じ位置のクリックで開閉・aria-expanded・aria-label とアイコンの切替・開くと現在節のリンクへフォーカス・閉じる手段（再押下・Escape・scrim・遷移）で menu ボタンへフォーカス・scrim も closeDrawer に一本化・開いている間 main-col / tabbar が inert・sidebar 見出しの drawer-close を削除〔TASK-27〕。実機指摘改訂〔TASK-33 追加指摘〕で menu ボタンは全幅で常時表示し desktop では sidebar 列の折りたたしに使う。TASK-37: アカウントメニューに「使い方」を追加〔設定 → 接続中のアプリ → 使い方 → ログアウト〕）・docs/spec/spec_mcp-tools.md §12（TASK-52: 開閉で icon を menu ↔ chevron-left へ切替。ユーザー指摘「開くときも閉じるときも同じハンバーガーicon」）"
source_lines = "frontend/tests/unit/web/dashboard-shell.test.ts:1025"
description = "左上の menu ボタン（topbar の最初の要素・押すたびに開閉・全幅で常時表示。desktop では同じ overlay の開閉で詳細は web-shell.sidebar-overlay / web-shell.menu-btn-always-visible / web-shell.nav-open-state-on-resize）でドロワーを開閉する。開くと aria-expanded=true・aria-label「メニューを閉じる」・アイコン chevron-left（TASK-52: サイドバーは左端にあるため閉じる方向 = 左向き chevron。ハンバーガーと形が似た close〔X〕はやめた）になり、現在節のリンク（.side-link.active、無ければ先頭）へフォーカスする。開いている間 .main-col と .tabbar が inert になり topbar は inert にならない。閉じるのはボタン再押下・Escape・scrim クリック・別ルートへの遷移で、閉じると aria-expanded=false・aria-label「メニューを開く」・アイコン menu（ハンバーガー）に戻り menu ボタンへフォーカスが戻る。ボタンは aria-controls=app-sidebar を持ち、sidebar 内に drawer-close は存在しない。右上のアバターボタンは aria-haspopup=menu を持ち、アカウントメニューに表示名と、項目 設定・接続中のアプリ・使い方・ログアウト（この順）がある（アカウント番号は web UI 非表示〔TASK-38 実機再々指摘〕）。ログアウトで POST /api/auth/logout 後ログイン画面へ（ログアウトはこのメニューのみ。設定画面には置かない）。家計簿切替は select でなく LedgerSwitcher（ledger-switch）で、ledger-select は存在しない"
given = "menu ボタン押下（現在節レシートで .side-link.active あり / active なし〔nav に無い節〕） → Escape → 再度押下 → scrim クリック → /stores へ遷移、アカウントボタン押下 → ログアウト"
expect_return_shape = "menu-button が header.topbar の最初の子で aria-controls=\"app-sidebar\" / 押下で drawer-open・aria-expanded=true・aria-label=\"メニューを閉じる\"・svg が chevron-left（M15 18l-6-6 6-6）・フォーカスが active な side-link（active が無ければ先頭の side-link）/ 開いている間 .main-col と .tabbar に inert・header.topbar に inert なし・drawer-close 要素は存在しない / Escape・scrim クリック・遷移・再押下のいずれでも閉じ、閉じたら aria-expanded=false・aria-label=\"メニューを開く\"・svg が menu（M4 6h16）・menu-button へフォーカス / アカウントボタンに aria-haspopup=\"menu\"・メニュー項目が 設定・接続中のアプリ・使い方・ログアウト の順・表示名表示（アカウント番号は含まない）・logout 1回・/login へ / ledger-select なし・ledger-switch あり"





[[condition]]
id = "web-receipts.dashboard"
target_function = "web/pages/ReceiptsPage.vue"
source = "TASK-14（同上）・docs/spec/spec_mcp-tools.md §7-8・§10 monthly_overview / by_payment_method・§12（TASK-75: KPI 2行化〔1行目 ラベル+合計〔差チップ無し〕 / 2行目 レシート・1件あたり・前期の1行要約。レシート一覧行は日付・店名〔ellipsis〕・ラベル・金額の1行 44px〔grid 3.2rem minmax(0,1fr) auto auto・34px アイコン廃止〕。日ごとのグループ見出しは 28px。720px 以下はカード gap 0.75rem・カード padding 12px〕。レビュー L5: ラベル部 .row-labels は nowrap 化し溢れは overflow: hidden で切る。TASK-76: 絞り込みフォームの popover 化〔配置・開閉の期待は web-receipts.filter-popover〕）+ TASK-105（zone 化・見出し可視化・.dash-grid→.dash-cols・支払方法行の系列色・設計 tmp/tasks/tm-105/design_dashboard-visual.md §4-4・§5）+ TASK-167（一覧行は web-common.data-row-grammar の共通2行文法へ移行〔主行 店名+金額 / 副行 代表品目+時刻+LabelDots〕。旧1行 44px grid と .recent-row 語彙は廃止。設計 tmp/tasks/tm-167/design_row_hierarchy.md v2 §2 D-1〜D-3）"
source_lines = "frontend/tests/unit/web/data-pages.test.ts:768, frontend/tests/unit/web/styles.test.ts:318, frontend/tests/unit/web/view-pages.test.ts:410"
description = "レシート画面は選択期間の合計・件数・1日あたり・1件あたり（TASK-75 §6-4 の2行 KPI: 1行目は {period.label}（TASK-161 指摘5で「の支出」suffix は除去・web-receipts.kpi-parity）と合計金額、2行目は レシート N件 ・ 1日あたり ・ 1件あたり の1行要約。語彙の期待は web-receipts.kpi-parity。TASK-105 で summary(kpi) は PeriodHeader と同型の非 zone 扱いで .dash-cols の外の全幅）、日別の支出zone（粒度は期間の長さに追従し棒の積み上げは web-receipts.trend-card-granularity 参照。.dash-cols 左列）、支払方法zone（.dash-cols 右列・RankedList 行は swatch と系列色〔支払方法は名称 string の共通写像・web-common.series-color-assignment〕）、日付ごとの一覧（.dash-cols の外の全幅）を表示する（レイアウト割当は web-common.zone-layout。TASK-105 で .dash-grid から .view-stack+.dash-cols 構造へ）。zone見出し（支払方法・日別/週別/月別の支出・レシート）は可視 zone-title〔TASK-105・web-common.zone-headings-visible〕。一覧行は web-common.data-row-grammar の共通2行（主行=店名〔ellipsis〕+金額。副行=代表品目〔web-common.row-top-items-display〕+時刻 HH:MM〔無しは -〕: web-receipts.group-time-column+LabelDots。ラベル部 row-labels は副行内で wrap せず溢れた点は切れる——レビュー L5）で、日ごとのグループ見出しは 28px。絞り込み（店・品名・カテゴリ・支払方法〔web-receipts.payment-filter〕・削除済み）はツールバーの絞り込みボタンから開く PopoverPanel（web-receipts.filter-popover）で、適用中の条件はチップで外せ、URL に残る。編集操作は無い。TASK-146 §3 #18: 一覧の「さらに表示」で append された行は出現 fade（bb-appear 語彙・web-common.appear-fade）で現れ、既存行は不動"
given = "/receipts を開き、品名「牛乳」で絞り込み、条件を外す"
expect_return_shape = "948円・レシート 3件・1件あたり 316円・日別31本・現金・10月10日（土）見出し・一覧行が .data-row の2行（主行 .row-name+.amount・副行 .row-items+.row-labels+.row-fig）で .recent-row/.recent-icon 語彙は無く・編集操作なし / query.item=牛乳・1 件・102 が消える / 102 が戻る / styles.css に .row-labels の flex-wrap: nowrap・overflow: hidden が定義される"

