# TASK-40 カテゴリ・店管理画面の行操作と階層表示の再設計（TASK-45 の⋯導線移行を土台に、行操作を
# 行末⋯〔RowMenu〕の menu 選択式へ集約・カテゴリ一覧を折り畳みグループヘッダで構造化・作成を見出し行/
