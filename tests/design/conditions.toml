description = "期間ヘッダ（カードでなく余白+細罫線の区画・タイポ主役）は TASK-161 で「[‹] 期間label [›] …（右）総額」の1行構成へ再構成する: 左は PeriodStep（web-common.period-step）で挟んだ期間label（period.label のみ。全呼び出し元から「の支出」suffixを削除——指摘5。label propは period.label のみ渡す形へ簡素化）。右は期間合計の特大数値（2.25rem/700/tabular-nums維持・backend totals.amount を formatYen のまま）。合計の「総額」の語は置かない（数値の位置と大きさが担う。説明ラベル禁止）。gap大小関係は2段階: button↔label の視覚間隔 = 0.25rem（icon-btn 文法の視覚gap。tap target 自体は44pxで隣接可）・label組↔総額 = flex space-between + 最小gap 1.5rem（現行 .period-head の gap を維持）。狭幅・長label規則: flex-wrap で溢れ時に総額が第2行へ右寄せwrap（現行 .period-head と同一fallback。wrap判定はCSS・測定不要）。総額font-sizeは縮めずwrapで対応。週label・range labelも同wrap。44px tap target は全幅で維持。下端hairline維持・直下に§5の内訳bar（web-home.breakdown-absolute-ticks）。期間labelの方向micro move（§2-2・web-common.period-move-voice）はこのcomponent内に実装。対比差・比較対象選択器・as-of echo 等 UI を言葉や追加部品で説明する要素は持たない。Home の月モードは4 fetch（analysis〔axis=category・limit=50〕・推移〔月6か月窓。TASK-104 で useTrendWindow composable からの発行へ移り load() からは除去〕・週card用 trend〔granularity=week・TASK-146 §2 から月1日の週の月曜〜月末を含む週の日曜の拡張range・limit=5。TASK-103・load() に残留。TASK-116 で週行の内訳化に伴い limit 1→5〕・最近のレシート）に、TASK-115 §3-2（設計 tmp/tasks/tm-115/design_trend-continuous-window.md）で月/年モードの初回コミット確定後の prev隣接窓 prefetch〔web-home.trend-window-prefetch〕が+1され、月モードは5 request・年モードは4 request（推移表示+prefetch）、週/rangeモードは隣接窓が表示窓と同keyのため prefetch なしの従来3 fetch のまま"
given = "10月合計 948円 の mock で / を開く / 週・range モードでも開く"
expect_return_shape = "period-label に期間label（「2026年10月」——「の支出」suffix なし）・period-total に合計数値（tabular-nums）があり、compare-* 系の部位・旧 KPI カード形式・「の支出」「総額」の語が存在しない / period-label の前後に period-step-prev・period-step-next がある（web-common.period-step。range モードは step pair なしで from〜to label のみ） / Home の analysis 取得は1 fetch（axis=category・limit=50） / 月モードの trend 呼び出しは3回（月窓 granularity=month from=2026-05-01 to=2026-10-31 limit=5 と TASK-115 §3-2 の prev隣接窓 prefetch〔granularity=month from=2025-11-01 to=2026-04-30 limit=5〕と週 granularity=week from=2026-09-28 to=2026-11-01 limit=5〔TASK-146 §2 の月跨ぎ拡張range〕）"

