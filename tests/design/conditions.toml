description = "推移は積み上げ金額の1形固定で、mode（積み上げ/合計）・数値軸（金額/件数/単価）の語tabを持たない（trend-controls は存在しない）。各棒は上位3系列セグメント+残余セグメントで構成する（TASK-123: fetch は limit=5 のまま上位5系列を受け前端の slice(0,3) のみで上位3へ切り詰め、4-5位は「ほか」へ合算され「ほか」セグメントがやや膨らむ。窓・fetch 仕様は不変）、bar 高さ=合計（TASK-100 で分母は niceMax・web-browse.trend-y-axis）。セグメント色は TASK-105 で seriesColor(s.key, axis) の決定的写像（web-common.series-color-assignment・CSS 変数 --series-1..7 参照）に置き換わり（旧 PALETTE/--c1..5 配列は削除）、残余「ほか」は var(--series-rest)。セグメントtitle は「名称 金額（構成比%）」（formatYen・構成比は total>0 ガードで total=0 では省略）。値0の series セグメントは組立時に省く（描画されるセグメントはすべて値>0）。TASK-123 でセグメントの分離と寸法は web-common.stack-segment-outline（各セグメント全周 1px の縁取り・隣接境界 2px・gap/境界線 border-top は廃止）と web-common.stack-dimension-rules（§4-5 配分規則: 構成比5%未満合算・最小寸法=縁取り込み 3px・規則C 段階的合算→第一系列単色・bar 全体 3px 未満は縁取りなし塗りのみ=規則F・上端 overflow clip は廃止で配分が常に収まる・寸法は JS 計算の明示値）へ置き換わり、角は web-common.stack-corner-rules（中段角丸なし・上端のみ cap 式 min(2px, 幅/4)・baseline 直角）になる。値ラベル（.bar-val）は TASK-100 で TASK-75 §6-4 の current 限定を撤回し全棒に付く（compactYen・Home の月6か月窓は非denseのため全棒・0円は空）。TrendBars の rows 単系列描画と format prop は廃止済み。TASK-116: この組立（上位系列+残余「ほか」・値0省略・seriesColor 写像・TASK-123 の上位3化と配分規則）は shared/lib の共通純関数 stackedOf（+配分純関数）として trend 窓（trendWindow.ts）・Home 週行・Receipts daily 棒・widget 月次推移の4箇所で共用される（trendWindow.ts は import のみで委譲・trend 表示の契約は不変）。注記（TASK-123）: 棒の「ほか」は上位3外+構成比5%未満+最小寸法未満の合算で、内訳ランキング行の「ほか n件・計xx円」（上位5外・web-home.breakdown-rest-row の現行契約）とは内容が異なる（ランキング側の契約は変えない）"
given = "3系列の積み上げデータ（2系列+残余）で / を開く"
expect_return_shape = "trend-card に trend-stacked・trend-total・trend-metric-* のいずれも存在しない / 現在月の棒が .stacked で2セグメントを持ち（値0 series はセグメントを持たない）、セグメントtitle が「名称 〜円（n%）」形式 / series セグメントの色が seriesColor 写像の CSS 変数値で残余セグメントは var(--series-rest) / 6本すべての棒に .bar-val がある（compactYen・0円は空）"

