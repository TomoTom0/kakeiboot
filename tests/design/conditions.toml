description = "期間合計+軸別内訳を Home と軸詳細で 1 fetch で返す API（TASK-93 で比較・増減・新規/消失を全廃し現期間のみ）。axis（category|store|item|label|payment_method・既定 category。category filter 指定時の品目カテゴリ軸はその小分類=by_category 規約踏襲）×metric（amount=SUM(amount_incl)〔値引行含む〕|count=COUNT(DISTINCT receipt_id)〔レシート件数ベース〕|unit=amount÷count〔f64・1桁丸め・count=0 は null〕・既定 amount）で、rows は対象期間にデータのある軸値のみを metric 値降順・上位 limit（既定50・1..=stats_max_rows）で返し、溢れは truncated_rows に行数のみ（「その他」集約行は作らない。残余はフロントが truncated_rows と totals から組む）。各 row は amount/count/unit・share（=metric 値÷軸合計・metric=unit は null）を持つ（prev_*/diff_*/status は存在しない）。対象期間にデータのない軸値（前期間のみの値）は rows にも truncated_rows にも現れない。品目軸 key=品名文字列（同名品目=1品目。/analysis/item の item_query と同じ品名概念〔REVIEW-13 M-3〕）・ラベル軸 key=色 or null（無ラベル）。response は period/totals（amount・count・unit・days）/filters echo（serde(skip) 規約どおり）を含む"
given = "10月に Aマート 400円（2レシート・うち1件は同品目2行）・9月に Aマート 180円・B薬局 200円 のレシートがある家計簿で viewer が axis=store&month=2026-10 / axis=item / metric=count / metric=unit / limit=1 / 無指定"
expect_return_shape = "rows が Aマート のみ（amount=400・count=2・unit=210・share=1.0）で B薬局（9月のみ）は rows にも truncated_rows にも現れず「その他」行を含まない / metric=count は同一レシートの同品目2行が 1件 / metric=unit は amount÷count の小数1桁・share=null / axis=item の key が品名文字列で同名明細（別 item_id）が1行に集約 / limit=1 は rows 1行+truncated_rows=1（現期間の溢れ行のみ） / 無指定は category×amount"

[[condition]]
id = "web-data-api.analysis-stacked-trend"
target_function = "web::api get_analysis_trend（GET /api/ledgers/{l}/analysis/trend・domain::stats 積み上げ SQL〔GROUP BY bucket_expr, key_expr・週 bucket は月曜アンカー式・品目軸等は期間全体の軸値合計で上位 N 確定→IN 句絞り込みの2段〕）"
source = "TASK-89 起票・tmp/tasks/tm-89/design_backend.md §1-B・§2（docs/spec/spec_mcp-tools.md §12・docs/spec/spec_data-model.md §13-3 へ反映後はそちらが正本）"
source_lines = "backend/tests/web_data_api.rs:2078"
description = "axis×metric の積み上げ行列 API。granularity=day|week|month（省略時 auto: 62日以下=day・366日以下=week・超=month。frontend trend.ts の 62/366 閾値と同値だが表示判断は frontend に残すため明示指定を期待）。buckets は zero-fill 済み昇順（day=日付・week=月曜日・month=YYYY-MM）。series は期間全体の metric 合計降順で上位 limit（既定10・系列数上限）のみを {key,label,values〔bucket 順〕,total} で返し、落ちた系列数は truncated_rows へ（「その他」系列は返さない=bucket_totals - series からフロントが作る原則）。bucket_totals は各 bucket の全軸値合計（limit 内 series + 残余）。期間・filters parse は analysis と同一"
given = "2週にまたぐ期間で granularity=week / granularity 省略（62日以下・63..366日・366日超の3区分）/ 系列数が limit を超える軸値（11系列で limit=10）"
expect_return_shape = "buckets が月曜日の zero-fill 済み昇順（値なし bucket も 0 で並ぶ）/ series が合計降順の上位 limit で values の長さ=buckets 数 / bucket_totals[b] が全軸値合計で limit 内 series の values[b] の和以上 / limit 超過は truncated_rows=1 / auto は期間長で day/week/month を選択"

[[condition]]
id = "web-data-api.analysis-trend-filter-predicates"
target_function = "domain::stats axis_bucket_totals（GET /api/ledgers/{l}/analysis/trend の bucket_totals SQL。filters 述語〔filt.0〕は WHERE 句内・GROUP BY の前に組み立てる）"
source = "PR#1 Codex review P1（comment 4384458986）TASK-110: base() が GROUP BY 1 で終わる SQL に filt.0 と label 軸の NOT EXISTS を後置 append し、SQLite が 'GROUP BY 1 AND f.store_id = ?' を grouping 式として解釈して filter が行絞り込みにならない不具合の修正"
source_lines = "backend/tests/web_data_api.rs:2171"
description = "trend の bucket_totals は filters（store_id 等）で行を絞り込んだ上で bucket ごとに合計する。axis_bucket_totals の全branch（label 軸 labeled/unlabeled・汎用軸）で述語は WHERE 句内・GROUP BY の前に置かれ、GROUP BY の後への append をしない（label 軸 unlabeled の NOT EXISTS も同位置）"
given = "2店で選択店が各bucket 100/300・選択外が同bucket 50/70（axis=store&store_id=1・granularity=week の2週）"
expect_return_shape = "series が選択店のみ（values=[100,300]）/ bucket_totals=[100,300]（選択外の 50/70 が混入しない・[150,370] にならない）"

[[condition]]
id = "web-data-api.analysis-trend-label-unlabeled-buckets"
target_function = "domain::stats axis_bucket_totals の label 軸（labeled+unlabeled の bucket 合算）"
source = "PR#1 Codex review P1（comment 4384458986）TASK-110: label 軸 unlabeled tail が filter なしでも GROUP BY 後置で常に破壊されていた箇所の修正"
source_lines = "backend/tests/web_data_api.rs:2207"
description = "label 軸 trend の bucket_totals は ラベル付き（JOIN receipt_labels）と ラベルなし（NOT EXISTS）の両方を bucket ごとに合算する。ラベルなし支出が bucket から落ちない"
given = "red ラベル 10/05 100円・ラベルなし 10/12 400円（axis=label・granularity=week・filter なし）"
expect_return_shape = "bucket_totals=[100,400] / series は ラベルなし（key=null・label=ラベルなし）が合計降順で values=[0,400]、red が values=[100,0]"

[[condition]]
id = "web-data-api.analysis-trend-null-key"
target_function = "domain::stats axis_matrix の汎用軸 IN 制限（GET /api/ledgers/{l}/analysis/trend の series cell 取得）"
source = "PR#1 Codex review P2（comment 4384458989）TASK-111: ranking 上位に NULL key があると IN が NULL 行にマッチせず series が全 bucket ゼロ埋めになる修正 + 同一比較の affinity 修正（key_expr が COALESCE 式で affinity を持たず text bind の IN が integer 値に一致しないため CAST(key AS TEXT) で比較）"
source_lines = "backend/tests/web_data_api.rs:2244"
description = "matrix の IN 制限は ranking が返した text key と同型で比較する（CAST(key AS TEXT) IN (...)）。上位に NULL key（未分類カテゴリ等）が含まれる場合は (CAST(key AS TEXT) IN (...) OR key IS NULL)、上位が NULL のみの場合は key IS NULL 単体（IN () の恒偽を避ける）。NULL key を含む上位系列も実際の bucket cell を持ちゼロ埋めにならない"
given = "食費（seed）のレシートが各bucket 500/50・未分類（category_id NULL）が 100/300（axis 既定 category・granularity=week）"
expect_return_shape = "series[0]=食費（values=[500,50]・CAST 比較で cell が取れる）/ series[1]=未分類（key=null・values=[100,300]）/ bucket_totals=[600,350]"

[[condition]]
id = "web-data-api.analysis-item-stats"
target_function = "web::api get_analysis_item（GET /api/ledgers/{l}/analysis/item・domain::stats 品目stats〔item_price_history の SQL 流用+by_store/monthly/summary〕）"
source = "TASK-89 起票・tmp/tasks/tm-89/design_backend.md §1-C・§2（docs/spec/spec_mcp-tools.md §12 へ反映後はそちらが正本）"
source_lines = "backend/tests/web_data_api.rs:2290"
description = "品目stats（widget item_price_history の web 版）。item_id または item_query のどちらか必須（item_id 優先。item_query は既存 item_match〔FTS trigram>=3字/LIKE〕で品目群にマッチ=widget 互換）。response は item（複数マッチ時は最新購入名の代表）・summary（count/amount/avg_unit_price/min_unit_price/max_unit_price/last_purchased_on/stores）・prices（date/store_id/store_name/unit_price/quantity/amount_incl の日付昇順・stats_max_rows 上限）・by_store（count/amount/avg_unit_price）・monthly（ym/count/amount の期間内 zero-fill）・truncated_rows。単価規約は item_price_history と同一: unit_price ないし round(amount_incl / quantity)（quantity は NOT NULL DEFAULT 1）。期間既定 last_12_months・filters は analysis と同一"
given = "2店・複数回の購入歴があり unit_price 明記行と単価なし（金額÷数量）行を混ぜた品目で item_id=1 / item_query=品名 / item_id も item_query も無し"
expect_return_shape = "prices が日付昇順で単価は unit_price 優先・無し行は round(amount_incl/quantity) / by_store が店別集計・monthly が期間内 zero-fill（購入なし月も 0 行で並ぶ）/ summary の min/max/avg が単価規約どおり・last_purchased_on が最終購入日・stores に購入店 / 両方無しは 400 invalid_request"

