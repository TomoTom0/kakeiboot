source = "docs/spec_mcp-tools.md §12（/search 画面・topbar 検索チップの段〔TASK-41 で追記〕）"
source_lines = "frontend/tests/browser/verify.spec.ts:490, frontend/tests/unit/web/styles.test.ts:198"
description = "実測（TASK-19 体系の -real 系・chromium）: /search は 360px 幅で検索欄行（検索欄＋期間スコープチップ）とタブ行の2行に収まり横溢れがない。検索欄入力 → 結果表示・topbar 検索 dialog の開閉 → 実行で /search へ遷移・結果行 → Feed → 戻るで文脈（q=）が保たれる一連の実挙動が流れる。360px 実機での最終確認はユーザーが行う"
given = "360px viewport で /search を表示し（chromium・stub）、検索欄へ入力 → 結果表示 → 検索 dialog を開閉して実行 → 行押下で Feed → 戻る"
expect_return_shape = ".search-head と .search-tabs が2行で document に横スクロール（横溢れ）なし / 入力確定で結果行が表示される / 検索チップ（filter-chip-search）の dialog 実行で /search へ遷移する / Feed から戻ると一覧が同じ q で復元される"

[[condition]]
id = "web-data-api.receipt-list-text-query"
target_function = "web::api list_receipts（domain::search::search_receipts・text_condition の OR 結合・receipt_conditions の store_id 分）"
source = "docs/spec_mcp-tools.md §12（web API /search の節〔TASK-41 で追記〕）を正本とし §7-8（search_receipts の一致方式 item_match/store_like〔3文字以上 FTS5 trigram・未満 LIKE 部分一致・別名込み〕と matched_items・行 DTO。web 専用パラメータ q・store_id の注記を TASK-41 で追記）を参照"
source_lines = "backend/tests/web_data_api.rs:558"
description = "GET /receipts の q は品目名 OR 店名（stores.name_norm / store_aliases.alias_norm の別名込み。NFKC+lowercase+ひらがな→カタカナ正規化後に一致）で絞り込み、store_id は店 id の完全一致で絞り込む（いずれも web 専用・MCP の store〔名前部分一致〕とは独立）。trim 後空の q はフィルタなし扱い（既存の無 filter 挙動と同じ）。記号のみの q は正規化（NFKC+lowercase+空白除去+カタカナ統一）でも記号が残るため通常の検索語として LIKE 照合し、該当がなければ 0 件の 200（q・store_id に起因する 400 は無く、400 invalid_request は不正な日付文字列〔from/to〕等の既存枠のみ）。q は既存 filter（category・label_colors・期間）および item_query と AND で併存する。他 ledger の store_id は ledger 条件と合わさって結果が空になる（エラーにしない）。text ありの行には matched_items を付与し（item_query と同じ挙動。店名のみヒット行は []）、total_count はヒットレシート数・sum_amount はヒットレシートの全品目合計（店名ヒット行も全品目）"
given = "品目「牛乳」を含むレシートと店「Aマート」（別名「エーマート」登録済み）のレシートがある ledger で q=牛乳 / q=Aマート / 正規化差のある表記（全角・ひらがなカタカナ）の q / q=牛乳&item_query=内容量 / q=!!（記号のみ）/ 他 ledger の store_id / q=牛乳&category=食費&from,to"
expect_return_shape = "品目ヒットと店名（別名含む）ヒットのレシートが OR で返り正規化差の表記も一致 / item_query・category・期間とは AND / 記号のみの q は 0 件の 200（400 は不正日付等の既存枠のみ）/ 他 ledger の store_id は空結果（200）/ 行の matched_items にヒット品目（店名のみヒット行は []）が入り total_count・sum_amount はヒットレシート基準（店名ヒット行も全品目合計）"

[[condition]]
id = "web-data-api.items-search"
target_function = "web::api list_items（GET /api/ledgers/{ledger_id}/items・domain::search::search_items・item_conditions 共有）"
source = "docs/spec_mcp-tools.md §12（web API /search の節〔TASK-41 で追記〕）を正本とし §7-8（search_items の行 DTO〔store_id を追加した11フィールド〕を参照）"
source_lines = "backend/tests/web_data_api.rs:675"
description = "GET /api/ledgers/{l}/items は /search 品目tab の品目一覧を返す（domain::search::search_items を MCP search_receipts mode:items と共有。ledger の member なら role を問わず閲覧可）。q は品目名のみ（item_match。FTS/LIKE 両パス。trim 後空の q はフィルタなし扱いで、記号のみの q は通常の検索語として LIKE 照合し該当がなければ 0 件の 200）。from/to（片側だけ・不正な日付文字列も 400）・category（存在しない path は 400）・store_id（完全一致・他 ledger は結果が空）・label_colors・include_deleted（既定 false で削除済み除外）・limit（既定 20・上限 50 へ clamp）・cursor（keyset・不正 cursor は 400）を受け、非メンバー・session 無しは list_receipts と同一経路の拒否応答。応答は {total_count, sum_amount, items, next_cursor} で items 行は item_id / receipt_id / purchased_on / store_id / store_name / name / quantity / unit / unit_price / amount_incl / category（path 表記）"
given = "品目「牛乳」を含む削除済みでないレシートと削除済みレシートがある ledger で、member（viewer 含む）が q=牛乳 / q=!! / category=無効な path / from だけ・from=2026-13-99 / 不正 cursor / limit=999 / 他 ledger の store_id / session 無し・非メンバー"
expect_return_shape = "応答 {total_count, sum_amount, items（store_id 入りの11フィールド行）, next_cursor}・q=牛乳 は品目名ヒットのみ / 記号のみの q は 0 件の 200 / 400 invalid_request（無効 category・片側だけの日付・不正日付・不正 cursor）/ limit は 50 へ clamp / 削除済みは既定で除外（include_deleted=true で含む）/ 他 ledger の store_id は空結果（200）/ 非メンバー・session 無しは list_receipts と同一の拒否応答"

