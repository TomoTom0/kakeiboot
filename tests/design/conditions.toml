expect_return_shape = "各行の root は button.data-row.is-link で .row-main（店名/品名と .amount）と .row-sub を持つ / top_items あり行の .row-sub は代表品目（品目A・品目B 形式）と日時を含み LabelDots は副行内 / top_items 欠落・空配列の行の .row-sub は日時のみ（matched_items の品目名は現れない）/ 行テキストに item_count に由来する「N 行」は無い / item_list 行の .row-sub は日付・店名・category を含む / widget/style.css に .bb-list 系規則は存在しない"

