#     優越判定を追加（web-receipts.feed-current-dominance）。
# (2) /search 360px 横溢れ 13px — TASK-74 で /search が ledgerScoped 化し家計簿chip が
#     topbar 右帯に加わり、検索語つき検索チップと合わせ 360px 帯を溢れさせた。
