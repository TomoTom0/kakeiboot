# TASK-11 web 画面（frontend/src/web）。正本は docs/spec/spec_auth.md（§2 登録・ログイン・step-up・パスキー管理、§3 web セッション・CSRF・§3-2 API 表、§4-2・§4-6 同意、§4-11・§6-1 接続中のアプリ）と
# docs/spec/spec_mcp-tools.md（§12 web 画面とのサービス層共有、§7-9〜7-14 レシート・カテゴリ・店の操作、§13 店の統合は web のみ、§11-6 XSS）、docs/spec/spec_data-model.md §5（カテゴリ・店・名寄せ・merge）。
# 補助データ画面（カテゴリ・店・レシート）の backend API は未実装のため、型付き API クライアント + in-memory モックで検証する（TASK-11 body: web 担当分）。

[[condition]]
id = "web-http.same-origin-json-request"
target_function = "web/api/http.ts request"
source = "docs/spec/spec_auth.md §3-1（Origin 一致・/api/* は application/json のみ）・§1（単一 origin、CORS なし）"
source_lines = "frontend/tests/unit/web/http.test.ts:11"
description = "API 呼び出しは同一 origin の相対パスに credentials=same-origin で送り、ブラウザが Origin を自動付与する形にする。body は JSON で Content-Type: application/json を付ける"
given = "request('POST', '/api/auth/logout-all', {a: 1})"
expect_return_shape = "fetch が '/api/auth/logout-all' と {method: POST, credentials: same-origin, headers の Content-Type=application/json, body='{\"a\":1}'} で呼ばれる"

[[condition]]
id = "web-http.unauthorized-hook"
target_function = "web/api/http.ts request"
source = "docs/spec/spec_auth.md §3（サーバー側セッション。期限切れ・失効は 401）"
source_lines = "frontend/tests/unit/web/http.test.ts:22"
description = "セッション切れ（401 unauthorized）はログイン画面へ戻すため onUnauthorized hook を呼び、ApiError を throw する"
given = "fetch が 401 {error: unauthorized} を返す、onUnauthorized hook 設定済み"
expect_throw = "ApiError(status=401, code=unauthorized)。onUnauthorized が1回呼ばれる"

[[condition]]
id = "web-http.auth-optional-skips-hook"
target_function = "web/api/http.ts request"
source = "docs/spec/spec_auth.md §2-4（ログイン finish の 401 は不一致。ログイン画面自身の失敗でありリダイレクト対象ではない）"
source_lines = "frontend/tests/unit/web/http.test.ts:30"
description = "ログイン・登録など未ログイン前提の呼び出しでは 401 でも onUnauthorized を呼ばない"
given = "authOptional=true で 401 応答"
expect_throw = "ApiError(status=401)。onUnauthorized は呼ばれない"

[[condition]]
id = "web-http.reauth-retries-once"
target_function = "web/api/http.ts request"
source = "docs/spec/spec_auth.md §2-6（401 reauth_required なら frontend が modal のパスキー認証を行ってから再送する）"
source_lines = "frontend/tests/unit/web/http.test.ts:38"
description = "reauth_required を受けたら onReauthRequired（step-up）を待ってから同じリクエストを1回だけ再送する"
given = "1回目 401 {error: reauth_required}、step-up 成功、2回目 204"
expect_return_shape = "onReauthRequired が1回呼ばれ、fetch が計2回呼ばれ、例外なく完了する"

[[condition]]
id = "web-http.reauth-cancel-throws"
target_function = "web/api/http.ts request"
source = "docs/spec/spec_auth.md §2-6"
source_lines = "frontend/tests/unit/web/http.test.ts:49"
description = "step-up がキャンセル・失敗したら再送せず、元の操作は失敗として扱う"
given = "1回目 401 reauth_required、onReauthRequired が reject"
expect_throw = "ApiError(code=reauth_required)。fetch は1回のみ"

[[condition]]
id = "web-http.forbidden-error-code"
target_function = "web/api/http.ts request"
source = "docs/spec/spec_auth.md §3-1（Origin 不一致は 403）"
source_lines = "frontend/tests/unit/web/http.test.ts:56"
description = "403 は error コード付きの ApiError にし、ログイン画面への遷移はしない"
given = "fetch が 403 {error: origin_mismatch}"
expect_throw = "ApiError(status=403, code=origin_mismatch)。onUnauthorized は呼ばれない"

[[condition]]
id = "web-http.no-content"
target_function = "web/api/http.ts request"
source = "docs/spec/spec_auth.md §3-2（DELETE /api/passkeys/{id}・logout は 204）"
source_lines = "frontend/tests/unit/web/http.test.ts:64"
description = "204 応答は本文を parse せず undefined を返す"
given = "fetch が 204（本文なし）"
expect_return = "undefined"

[[condition]]
id = "web-http.dev-proxy"
target_function = "vite.config.ts server.proxy"
source = "TASK-11 統合作業 8（dev proxy: /api,/oauth,/.well-known,/mcp を backend へ。port は configs/dev/app.toml 参照）"
source_lines = "frontend/tests/unit/web/vite-proxy.test.ts:13, frontend/tests/unit/web/vite-proxy.test.ts:24"
description = "Vite dev server は同一 origin パスを backend（configs/dev/app.toml の [server].port）へ proxy する。port の直書きなし"
given = "vite.config.ts の内容"
