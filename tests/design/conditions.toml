[[condition]]
id = "auth-cli.backup-snapshot"
target_function = "admin::run Backup variant（read-only open → VACUUM INTO → fs::rename）"
source = "docs/spec/spec_auth.md §9（admin backup〔TASK-83 実装で追記予定〕。設計: tmp/tasks/tm-83/design_backup-automation.md v4 §4-5〔REVIEW-15承認済み〕）"
source_lines = "backend/tests/admin_cli_backup.rs:222"
description = "admin backup --dest <file> は --config-dir の config から db path を解決して read-only open（SqliteConnectOptions に .read_only(true)・create_if_missing(false)・migration 不実行。既存 db.rs::connect_file は流用しない）で開き、VACUUM INTO を bind parameter で <dest>.tmp へ 1 文実行（transaction 外・auto-commit）した後に fs::rename で dest へ置く。成功時 exit 0 で <dest>.tmp は残存しない。read-only 接続のため本 db への書込・migration 実行は起きない。実装形状は admin::Command への flat なトップレベル variant Backup { dest }（単一動作・引数 1 つのためサブグループを切らない）で、Backup は admin::run の全 variant 共通 connect_file（create_if_missing(true) + run_migrations 付き read-write open）を通らない run 構造とする"
given = "WAL 運用の実 db（数行のデータあり）に --config-dir 指定で存在しない dest path を指定して admin backup を実行"
expect_return_shape = "exit 0 で dest に単一 file が存在し <dest>.tmp は無い・source db へ書込・migration 実行が無い（db file が書き換わらない）"

[[condition]]
id = "auth-cli.backup-integrity"
target_function = "admin::run Backup variant（VACUUM INTO の snapshot 一貫性）"
source = "docs/spec/spec_auth.md §9（admin backup〔TASK-83 実装で追記予定〕。設計: tmp/tasks/tm-83/design_backup-automation.md v4 §4-5・§4-1・§8-4）"
source_lines = "backend/tests/admin_cli_backup.rs:271"
description = "生成 file は PRAGMA integrity_check が ok の単一 file snapshot になる。VACUUM INTO は read transaction＝WAL reader として動作するため並行 writer をブロックせず（WAL では reader は writer をブロックしない）、稼働中の db へ書込が混ざっていても取得結果は単一時点（時点T）のトランザクション整合を持つ（未 checkpoint の書込が失われない。db.sqlite 単体 copy との差が online backup 必須の根拠）"
given = "別接続からの書込が行われる稼働中の db（test 内で backup 実行に書込を混ぜる: 設計§7）に対する admin backup"
expect_return_shape = "生成 file で PRAGMA integrity_check = ok・内容が書込前後の混在でなく単一時点の整合 snapshot（行数等がいずれかの時点の値に一致）"

[[condition]]
id = "auth-cli.backup-error-exits"
target_function = "admin::run Backup variant（open error・失敗時の中途 file 掃除）"
source = "docs/spec/spec_auth.md §9（admin backup〔TASK-83 実装で追記予定〕。設計: tmp/tasks/tm-83/design_backup-automation.md v4 §4-5）"
source_lines = "backend/tests/admin_cli_backup.rs:362"
description = "失敗系はすべて非ゼロ exit し中途 file を残さない: dest の親 dir 不在、db file 不在（--config-dir の path 誤り。create_if_missing(false) のため空 db を新規作成しない・migration も実行しない＝Backup variant が共通 connect_file を通らない run 構造であることの観測面）は open error として即座に失敗する。VACUUM INTO 失敗時は tmp を掃除して非ゼロ exit する"
given = "存在しない親 dir を含む dest path / 存在しない db file path を指す config での admin backup"
expect_return_shape = "いずれも非ゼロ exit・dest も <dest>.tmp も存在せず・誤指定 path に db file が新規作成されない"

[[condition]]
id = "auth-cli.backup-tmp-idempotent"
target_function = "admin::run Backup variant（既存 <dest>.tmp の事前削除）"
source = "docs/spec/spec_auth.md §9（admin backup〔TASK-83 実装で追記予定〕。設計: tmp/tasks/tm-83/design_backup-automation.md v4 §4-5〔v4 L-1: 既存 tmp 削除による冪等化〕）"
source_lines = "backend/tests/admin_cli_backup.rs:408"
description = "VACUUM INTO は出力先 file が既に存在すると失敗する仕様（SQLite は既存 file へ上書きしない）のため、実行前に既存の <dest>.tmp があれば削除してから VACUUM INTO を実行する。kill・OOM 等で tmp が残留していても失敗せず、同名再実行・同日再実行が冪等に走る。dest 自体の既存 file は fs::rename で上書きされる（script 側の日次冪等＝同日再実行は同 dir へ上書き、の下支え）"
given = "<dest>.tmp が既に存在する状態（前回中断の残留を模擬）と dest が既に存在する状態での再実行"
expect_return_shape = "いずれも exit 0 で dest が新しい snapshot に更新され・残留 tmp に起因する失敗が起きない"

