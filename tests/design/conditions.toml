expect_return_shape = "400 エラー画面・redirect なし"

[[condition]]
id = "auth-oauth.consent-info-binding"
target_function = "auth::oauth::authorize::consent_info"
source = "docs/spec/spec_auth.md §4-2・§4-6"
source_lines = "backend/tests/oauth_flow.rs:323"
