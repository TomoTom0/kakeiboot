source = "docs/spec_auth.md §5-1（クエリの access_token、body の token は拒否）"
reason = "body は rmcp の Streamable HTTP service が消費するため middleware での事前検査は body のバッファリングを必要とする。クエリパラメータ拒否は実装・条件化済みで、HTTP レベルの Bearer 強制により body token では認証されない"
decided_at = "2026-10-14"
decided_by = "claude"

