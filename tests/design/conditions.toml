# TASK-145（TASK-124 コードレビュー LOW 2件の解消: /search carry 期間 keys 残留〔LOW-1〕と AxisDetail
# 二重 init〔LOW-4〕）。設計: tmp/tasks/tm-145/design_search-carry.md v1（D1: carry 廃止+writeBack strip
# 対称化+toggleScope 期間付与条件固定・D2: 再取得 watch の source 狭域化+D2-2 parentTo リアクティブ導出。
# 設計レビュー MED3・LOW1 反映・承認済み。spec §12 の改訂は実装工程）。テスト先行の条件書追記
# （実装前のため新設3条件の新 case と改訂期待値の追加 case は赤）。
# 併せた既存条件の改訂（元の位置）: web-search.url-scope-all-period-keys（carry 流入・keys 付き流入の
# strip・labels 不変ケースを期待値へ追加〔D1-1/D1-2〕）・web-search.topbar-entry（run() は q のみを渡す形へ
# 〔D1-1〕）・web-search.url-restore（period→all 切替で期間 keys を落とす形へ〔D1-3〕）。

[[condition]]
id = "web-search.scope-toggle-period-keys"
target_function = "web/pages/SearchPage.vue（toggleScope: dropPeriodQuery 後の期間 keys 再付与を next=period 限定へ）"
source = "設計 tmp/tasks/tm-145/design_search-carry.md v1 §決定 D1-3（設計レビューMED2 で追加: toggleScope は dropPeriodQuery 後に ...period.urlQuery を無条件で再付与しており period→all 切替でも期間 keys が載る。「違反流入は run() carry のみ」は誤りで、違反流入は run() carry と toggleScope の 2 経路だった）・背景 LOW-1・§影響。TASK-174（設計 tmp/tasks/tm-174/design_url-history-entries.md v4 影響>条件書の改訂方針）: 既存責務を維持し回帰確認する（1操作1entry化・FIFO化でも本条件の期待値は不変）"
source_lines = "frontend/tests/unit/web/url-sync.test.ts:364"
description = "/search の scope チップ（toggleScope）は next=period（期間スコープへの切替）のときだけ store の現在期間（period.urlQuery）を URL に付与する。next=all への切替は dropPeriodQuery の結果のまま（期間 keys を付与しない。「載せてから shell が削る」往復を自前の遷移で起こさない。旧 URL・外部流入の残存は web-search.url-scope-all-period-keys の writeBack strip が是正する）。よって period→all 切替で URL から期間 keys（month/week/year/from/to）が消え、all→period 切替でのみ載る"
given = "/search?q=牛乳&scope=period&month=2026-10 で scope チップを押して all へ切替える / /search?q=牛乳（scope=all 既定）で scope チップを押して period へ切替える"
expect_return_shape = "period→all で URL は q（・tab・labels）のみになり scope・month・week・year・from・to は消える / all→period で scope=period と store の現在期間 key（例: month=2026-10）が載る / 切替後の再取得は scope に追従（all は全期間・period は期間付き）"

[[condition]]
id = "web-browse.url-echo-no-double-init"
target_function = "web/pages/AxisDetailPage.vue（再取得 watch の source 狭域化: route.fullPath を外し period.range・period.labelQuery・route.path・load が extraFilters で読む掛け合わせ query keys〔category / store_id / store_category 等〕のみを見る）"
source = "設計 tmp/tasks/tm-145/design_search-carry.md v1 §決定 D2（LOW-4: keys-less 流入の writeBack echo〔URL replace〕が fullPath 変化で init を二重発火させ analysis 系+recent を再取得する。echo は表示にも取得条件にも影響しない URL 変化）・§決定 D3 3項（設計レビューLOW4: 集計単位は request 種別ごと。正常 1 回の load でもカテゴリ軸は cross/own の 2 getAnalysis が発行されるため「呼び出し回数 1 回」では不当に fail する）・代替案 c（echo 番人は TASK-124 の実装決定〔不採用〕を再検討するため不採用）。TASK-174（設計 tmp/tasks/tm-174/design_url-history-entries.md v4 影響>条件書の改訂方針）: 既存責務を維持し回帰確認する（1操作1entry化・FIFO化でも本条件の期待値は不変）"
source_lines = "frontend/tests/unit/web/url-sync.test.ts:387"
description = "keys 無し流入（keys なし直リンク・browser 戻るで keys-less entry へ戻る等）で /axes/* に着地したとき、shell の URL 同期（useBrowsingUrlSync）が直ちに書き戻す router.replace（echo）は表示にも取得条件にも影響しない URL 変化であり、AxisDetail の再取得 watch を発火させない（初回 init は useLedger の immediate watch の1回のみ）。観測は request 種別ごとに1回: listReceipts（最近の明細）1回・getAnalysis は request 種別ごと（category 軸大分類なら cross=store 軸 1 回+own=category 軸 1 回）・getCatalog は catalog store の in-flight dedupe で1回。同一 component 内の params 変化（top→sub の昇り・軸移動）は route.path 変化で、labels 絞り込み変更は period.labelQuery で、期間変更は period.range で、それぞれ現行どおり再取得する（missing= 等 redirect 専用 key では発火しない）"
given = "/axes/category/1 を keys 無しで開く（shell 同期込みで mount し、echo の replace と初回取得が収束した後に検証）"
expect_return_shape = "URL は ?month=2026-10 へ書き戻る（echo は1回） / getAnalysis が axis=store〔cross〕1回・axis=category limit=50〔own〕1回 / listReceipts 1回 / getCatalog 1回（dedupe）"

# ---------------------------------------------------------------------------
# TASK-140 refresh rotation 猶予内再発行で差し替えた旧子の失効と、その提示の盗用扱い。
# 正本: docs/spec/spec_auth.md §4-9（手順1・3）・§4-10・§11-5、docs/spec/spec_data-model.md §14・§15 0012
# （spec 改訂は実装工程。改訂文案と判定順は設計 tmp/tasks/tm-140/design_refresh-grace-revoke.md 5-2 と 6章〔6章が優先〕）。
# 既存改訂: auth-oauth.refresh-grace-reissue・auth-oauth.race-refresh-same-token・auth-oauth.refresh-invalid-grants（source のみ）・
# db-schema.migrations-apply-cleanly（0001〜0012）。

[[condition]]
id = "auth-oauth.refresh-superseded-child-reuse"
target_function = "auth::oauth::token::refresh"
source = "docs/spec/spec_auth.md §4-9 手順1・3・§4-10・docs/spec/spec_data-model.md §14（設計 tmp/tasks/tm-140/design_refresh-grace-revoke.md 1-2 S1/S2・2章 案B+A・5-3・6章 L6）"
source_lines = "backend/tests/oauth_refresh.rs:557, backend/tests/oauth_refresh.rs:592"
description = "猶予内再発行で差し替えられた旧の子の提示は盗用とみなし、grant を refresh_reuse で失効させて COMMIT してから invalid_grant を返す。攻撃者と正規 client のどちらが先に rotation しても 2 つの family は並存しない。S1 では攻撃者側の A1 は手順3で失効済みのため C1 提示より前に 401"
given = "(S1) 親 R で rotation→C1/A1（攻撃者）、猶予内に R を再送→C2/A2（正規）、A1 で Bearer、C1 で refresh。(S2) R→C1（正規）、R 再送→C2/A2（攻撃者）の後、C1 で refresh。いずれも最後に C2 での refresh と A2 での Bearer 呼び出し"
expect_return_shape = "S1 の A1 Bearer は C1 提示前に 401。C1 の提示は 400 invalid_grant、応答後に grant の revoked_at 非 NULL・revoked_reason=refresh_reuse が観測できる。C2 の refresh も 400 invalid_grant、A2 の Bearer は 401"

[[condition]]
id = "auth-oauth.refresh-superseded-child-expired"
target_function = "auth::oauth::token::refresh"
source = "設計 tmp/tasks/tm-140/design_refresh-grace-revoke.md 6章 L1（「失効済み」を「期限切れ」より先に判定。§2 決定・§5-2 文案・5-3 の「期限切れの旧子は単に拒否（ROLLBACK）」を置き換え）・docs/spec/spec_auth.md §4-9 手順1"
source_lines = "backend/tests/oauth_refresh.rs:677"
description = "grant が有効なら、期限切れの差し替え済み旧子の提示も reuse として grant を失効させる（S2 で正規 client が 30 日超休眠した場合に攻撃者系列が残る余地を塞ぐ）。失効済みでない行の期限切れは従来どおり ROLLBACK（auth-oauth.refresh-invalid-grants）"
given = "R→C1、R 再送→C2 の後、C1 の expires_at を過去（1）に操作して C1 を提示"
expect_return_shape = "400 invalid_grant、grant の revoked_at 非 NULL・revoked_reason=refresh_reuse"

[[condition]]
id = "auth-oauth.refresh-grace-retry-no-false-positive"
target_function = "auth::oauth::token::refresh"
source = "設計 tmp/tasks/tm-140/design_refresh-grace-revoke.md 3章（正規 client の再試行には影響しない）・6章 L6・docs/spec/spec_auth.md §4-9 手順3（応答を受け取れずに再送した正規 client は旧の子を持たないため検知に掛からない）"
source_lines = "backend/tests/oauth_refresh.rs:618"
description = "猶予の存在理由である再試行（R を送ったが C1 の応答を失い R を再送）では、client は C1 を持たず C2 で継続するため盗用検知に掛からず family は有効なまま"
given = "R→C1（応答喪失として破棄）、R 再送→C2、C2 で refresh→C3/A3、A3 で Bearer"
expect_return_shape = "C2 の refresh は 200、grant の revoked_at・revoked_reason は NULL、A3 の Bearer は 401 以外"

[[condition]]
id = "auth-oauth.refresh-superseded-child-grandchild"
target_function = "auth::oauth::token::refresh"
source = "設計 tmp/tasks/tm-140/design_refresh-grace-revoke.md 6章 総評（孫世代: R→C1、R→C2、C2→C3 の後に C1 提示）・L6"
source_lines = "backend/tests/oauth_refresh.rs:633"
description = "差し替え済み旧子 C1 は、新しい系列が孫世代まで進んでいても提示された時点で family を失効させる"
given = "R→C1、R 再送→C2、C2→C3/A3 の後に C1 を提示し、続けて C3 で refresh・A3 で Bearer"
expect_return_shape = "C1 の提示は 400 invalid_grant で grant の revoked_reason=refresh_reuse、C3 の refresh は 400 invalid_grant、A3 の Bearer は 401"

[[condition]]
id = "auth-oauth.refresh-grace-reissue-repeated"
target_function = "auth::oauth::token::refresh"
source = "設計 tmp/tasks/tm-140/design_refresh-grace-revoke.md 6章 総評（猶予内3回以上の再発行）・L6（猶予内3回再発行で C1・C2 とも失効）・docs/spec/spec_data-model.md §14 手順3（生きている子は常に1本）"
source_lines = "backend/tests/oauth_refresh.rs:652"
description = "猶予内に同じ親を3回再提示すると、差し替えられた C1・C2 の refresh 行はいずれも失効し C3 だけが生きる。失効済みのどちらを提示しても family が失効する"
given = "R→C1、R 再送→C2、R 再送→C3 の後に各 refresh 行を確認し、C2 を提示"
expect_return_shape = "C1・C2 の revoked_at 非 NULL、C3 の revoked_at NULL、親の child_hash は C3。C2 の提示は 400 invalid_grant で grant の revoked_reason=refresh_reuse"

[[condition]]
id = "auth-oauth.refresh-superseded-child-check-order"
target_function = "auth::oauth::token::refresh（手順1の判定順）"
source = "設計 tmp/tasks/tm-140/design_refresh-grace-revoke.md 6章 M3（判定順: 期限切れ〔失効済みでない行〕・grant 失効・grant 絶対期限・user 無効 → resource 不一致 → client 不一致 → token の失効〔reuse〕 → scope）・L2（resource 不一致が reuse より先の現行順序を維持しテストで固定）・L6（判定順の固定）・docs/spec/spec_auth.md §4-9 手順1・docs/spec/spec_data-model.md §14 手順1"
source_lines = "backend/tests/oauth_refresh.rs:733"
description = "失効済み（差し替え済み）の旧子が他の失敗要因と重なったときの優先順位: grant 失効・user 無効・resource 不一致は reuse より先に ROLLBACK で拒否し grant の状態を変えない。client 不一致は reuse より先で client_mismatch として失効。不正 scope は reuse より後なので reuse として失効する"
given = "R→C1、R 再送→C2 で C1 を差し替え済みにした上で、ケースごとに新しい app で (a) grant を revoked_reason='user' で失効 (b) user を無効化 (c) 異なる resource を指定 (d) grant の client_id を別 client に変更 (e) scope=ledger.admin を指定 して C1 を提示"
expect_return_shape = "いずれも 400 invalid_grant。grant は (a) revoked_reason='user' のまま (b)(c) revoked_at NULL のまま (d) revoked_reason=client_mismatch (e) revoked_reason=refresh_reuse"

[[condition]]
id = "auth-oauth.refresh-reuse-diagnostic-kind"
target_function = "auth::oauth::token::refresh（refresh_reuse の tracing 出力）"
source = "設計 tmp/tasks/tm-140/design_refresh-grace-revoke.md 2章 3（診断用 tracing::warn! の判別フィールド）・3-1（§12-6 実機確認で正規 client の検知を見分ける）・6章 L4（既存 2 経路にも kind を付け、出力は grant_id と client_id まで。token・token_hash・assertion は出さない）"
source_lines = "backend/tests/oauth_refresh.rs:830"
description = "refresh_reuse で grant を失効させる 3 経路は、それぞれ判別用の kind（grace_exceeded / child_used / superseded_child）と grant_id・client_id を持つ WARN 行を出す。token の値・その hash は出力しない"
