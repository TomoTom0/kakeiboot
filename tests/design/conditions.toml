[[condition]]
id = "web-browse.scroll-restore"
target_function = "web/router.ts（scrollBehavior: push〔pageKey 異なる〕は {top: 0}・replace と同一 pageKey 内遷移は false・pop は pendingRestore へ退避して false）・web/composables/navDirection.ts（pendingRestore ref・navKind ref）・web/composables/usePageReady.ts（markReady・notifyPageEntered・resetPageReady・1.5秒タイムアウト）・web/App.vue（provide page-ready・pageKey 変化で reset・after-enter）"
source = "docs/spec_mcp-tools.md §12（push 遷移は常に先頭へスクロールし、戻る・進むは履歴位置の復元を試みる〔最大1.5秒。replace や同一ページ内の遷移では動かさない〕〔TASK-74〕）"
source_lines = "frontend/tests/unit/web/transition.test.ts:443, frontend/tests/unit/web/transition.test.ts:497"
description = "router の scrollBehavior は (1) pop（savedPosition あり）は保存位置を pendingRestore（navDirection module の ref）へ退避して false を返す（その場では動かさない——同期描画前の復元は着地がずれるため）(2) replace（history position 不変。navDirection の navKind==='replace'——afterEach の position 比較結果を scrollBehavior が next tick で読む）と同一 pageKey（route.path 第1セグメント）内の遷移は false を返しスクロールに触れない（Feed のスクロール id 書き換え・チップ ×・期間変更・/search の debounce replace・/categories/1/5→/categories/1 の‹ 親戻り・一覧→Feed〔Feed は anchor パネルへ自前 position する〕。replace で {top:0} を返すと連続フィードが最上部へ巻き戻る）(3) それ以外の push（pageKey 異なる）は {top: 0}。復元は遷移先ページのデータ読み込み完了（markReady。usePageReady の inject から呼ぶ・App.vue が provide。load の成功・失敗の確定時に呼ぶ）と Transition の after-enter（direction が none なら即時）の両方が済んだ時点で window.scrollTo({top: pendingRestore}) を実行して pendingRestore を消す。1.5 秒経っても揃わなければ復元を諦めて pendingRestore を破棄する。pageKey（第1セグメント）が同じで remount しない遷移は after-enter が発火せず復元条件が成立しないが、DOM が入れ替わらずスクロール位置が自然維持されるため復元を要しない（対象外）。markReady を呼ぶページは ledgerScoped の閲覧系ページのみ（Home・Categories・CategoryDetail・Stores・StoreDetail・Receipts・Receipt〔Feed〕・Search の load 確定時。管理・公開系は呼ばず savedPosition があってもタイムアウトで諦める）"
given = "mount での push・replace・同一 pageKey 内 push 遷移 / pendingRestore に保存位置を退避した状態での notifyPageEntered・markReady の順・不定の呼び出し（fake timer で 1.5 秒経過）"
expect_return_shape = "pageKey の異なる push でのみ window.scrollTo が top 0 へ呼ばれる / replace（同一 pageKey・pageKey 異なるの両方）と同一 pageKey 内の push では window.scrollTo が呼ばれない / after-enter 済みでも markReady 前は復元せず、markReady で scrollTo({top: 保存位置}) が1回呼ばれ pendingRestore が null に / 1.5 秒経過後の markReady では復元しない（pendingRestore 破棄済み）"

