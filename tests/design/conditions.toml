source_lines = "frontend/tests/unit/web/receipt-context.test.ts:13, frontend/tests/unit/web/receipt-context.test.ts:60, frontend/tests/unit/web/receipt-feed.test.ts:99, frontend/tests/unit/web/receipt-feed.test.ts:176"
description = "Feed は route の文脈 query を ReceiptListQuery に変換して listReceipts を呼び、一覧と同じ並びで現在 id の前後のパネルを並べる。変換は CONTEXT_FIELDS（ReceiptListQuery の limit / cursor を除く全フィールド）の1表だけで対称に行い、往復で一致する。文脈には q（品目名 OR 店名の横断検索）と store_id（店 id 完全一致）も含まれ（TASK-41 で /search の行リンクから乗る）、q 付きで開いた Feed の一覧取得と「戻る」の文脈は同じ q を保つ"
