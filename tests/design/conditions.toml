[[condition]]
id = "deploy-ops.promote-rsync-flags"
target_function = "kakeiboot_ops.build_promote_commands step7-12（配置2 install・dist rsync・モード正規化・所有付け替え2 step）"
source = "docs/ops/ops_deploy.md §promote〔TASK-189 実装で追加。設計: tmp/tasks/tm-189/design_promote.md D-3（--checksumの付与判断）・D-6手順7-9。サービスアカウント移行の repo 追随で単file配置は kakeiboot-deploy ラッパーの install-file へ変更し・--checksum 付き rsync は廃止（配置後の同一性は step2/3 のsha256照合と install の原子的配置が担う）〕"
source_lines = "scripts/deploy/test_kakeiboot_ops.py:1054"
description = "stg運用dir→prod運用dirの配置（運用機上実行・remote_exec）: binary単fileとbackup script単fileは sudo /usr/local/sbin/kakeiboot-deploy install-file（ラッパーが宛先の tree 内検証を行い install -o kakeiboot -g srvops -m 770 で配置と所有・mode設定が単一stepで原子的。移行前は -a --checksum -i の rsync で・所有は運用者のままだった）・frontend/dist/ は木構造のため rsync のまま -a --no-perms --omit-dir-times --delete -i で--checksum無し（--no-perms と --omit-dir-times は配置先がサービス所有ツリーのため: ビルド側モード 0755/0644 の伝播やフォルダ時刻の設定は、運用者が所有しないフォルダへの chmod/utime で rsync が exit 23 になり・グループ書き込みも落ちる。モードは転送直後に運用者自身が行う正規化が正〔deploy-ops.mode-normalization〕）（file数が多くremote上の全file読取が毎promoteで走るcostに対し (a) distにはsha256等の個別同一性表示が無い (b) stg:deployのbuild成果物をstg運用dir経由で丸ごと移すことが目的でfile単位同一性判定が本質でないため。-i はfile単位の配布差分〔更新・--delete削除含む〕をrsync出力で見せる）。配置直後の step10 で dist のモードを運用者が正規化し・step11/12 で dist と releases 世代の所有をラッパーの chown-tree（chown -R kakeiboot:srvops のみ）へ付け替える（releases は step12 の guard 内で正規化→付け替えの順。deploy-ops.artifact-placement-owner）"
given = "transport=local でのpromote操作列構成"
expect_return_shape = "第7要素が [sudo, /usr/local/sbin/kakeiboot-deploy, install-file, <stg>/budget-book, <prod>/budget-book]・第8要素が [sudo, /usr/local/sbin/kakeiboot-deploy, install-file, <stg>/bin/kakeiboot-backup.sh, <prod>/bin/kakeiboot-backup.sh]・第9要素が [rsync, -a, --delete, -i, <stg>/frontend/dist/, <prod>/frontend/dist/]・第10要素が dist のモード正規化（運用者の find/chmod sh -c）・第11要素が [sudo, /usr/local/sbin/kakeiboot-deploy, chown-tree, <prod>/frontend/dist]・第12要素が releases dir の存在時のみモード正規化に続けて sudo /usr/local/sbin/kakeiboot-deploy chown-tree <prod>/releases を実行する sh -c"

[[condition]]
id = "deploy-ops.artifact-placement-owner"
target_function = "kakeiboot_ops.deploy_install_artifact / deploy_chown_tree（deploy・promote の配置所有形）"
source = "サービスアカウント移行設計 step 3（deploy/promote の配置段のラッパー経由化・backup テンプレートの User=kakeiboot 化）〔当初は install-units の sudo_install（PR #12）と同型の直接呼出だったが、gt430 の sudo（sudo-rs 0.2.13）は sudoers のコマンド引数内ワイルドカードを一切受け付けず path で絞れないため、移行 step 4 が配置する root 所有ラッパー /usr/local/sbin/kakeiboot-deploy 経由へ変更。sudoers はラッパー本体のみを許可し、宛先の tree 内検証と install/chown の実行はラッパー内〕"
source_lines = "scripts/deploy/test_kakeiboot_ops.py:1055, scripts/deploy/test_kakeiboot_ops.py:1189"
description = "deploy/promote が配置する成果物の所有は専用サービスアカウント kakeiboot:srvops に統一される: 単一file（binary・backup script）は sudo /usr/local/sbin/kakeiboot-deploy install-file で配置され（ラッパーが宛先が kakeiboot tree 配下であることを検証し install -o kakeiboot -g srvops -m 770 で配置と同時に所有・modeが決まる。deploy は配布元が作業repo側fileのため target 側 staging dir へ rsync してから呼出・promote は運用機上の現物を直接呼出。staging は install-units と同じ target 側一時dir + 末尾 rm -rf の型）。木構造（frontend dist・releases 世代）は install に再帰形が無いため転送自体は rsync/cp のまま・配置後に sudo /usr/local/sbin/kakeiboot-deploy chown-tree（ラッパー内 chown -R kakeiboot:srvops のみ＝所有だけ）で所有を付け替える。モード正規化（フォルダ 2770・ファイル group 書き込み追加）はラッパーでなく ops ツールが転送直後・付け替え前に運用者自身で行う〔deploy-ops.mode-normalization〕（ラッパーは install-file / chown-tree の2プリミティブで凍結し、deploy 方針の変更で root 所有 file を差し替えない）。/etc 配布用の sudo_install の既定（root:root 644）は不変"
given = "transport=local の deploy（stg）・promote 操作列構成と・各helperへの直接呼出"
expect_return_shape = "sudo_install(src, dst) が [sudo, install, -o, root, -g, root, -m, 644, src, dst]（従来どおり）・deploy_install_artifact(src, dst) が [sudo, /usr/local/sbin/kakeiboot-deploy, install-file, src, dst]・deploy_chown_tree(path) が [sudo, /usr/local/sbin/kakeiboot-deploy, chown-tree, path] を返し・deploy 操作列の binary/backup script 配置と dist の chown・promote 操作列の配置2 step と所有付け替え2 step がこの形で現れる"

[[condition]]
id = "deploy-ops.mode-normalization"
target_function = "kakeiboot_ops.deploy_normalize_tree_modes / normalize_tree_modes_command（deploy・promote・configs の転送直後モード正規化）"
source = "サービスアカウント移行の是正（ラッパー凍結）: 当初 PR #17 の completion でラッパーの chown-tree にモード正規化（フォルダ 2770・ファイル group 書き込み追加）を入れたが、root 所有ラッパーの中身が deploy 都合で変わるたび root 再実行が要る構造になるため、正規化を ops ツール側へ移した。転送直後の file は運用者所有で chmod できるが、chown-tree の付け替え後は運用者は chmod できない -- 順序（転送→正規化→付け替え）がこの移行の本体"
source_lines = "scripts/deploy/test_kakeiboot_ops.py:1245"
description = "deploy/promote/configs が転送した木（deploy・promote の frontend dist、promote の releases 世代、configs の configs/<env>）のモードを、転送直後・ラッパー chown-tree の前に、運用者自身の sh -c（find <path> -type d -uid \"$(id -u)\" -exec chmod 2770 {} + && find <path> -type f -uid \"$(id -u)\" -exec chmod g+rw {} +）で正規化する。対象は運用者自身が所有する entry のみ: 転送は既存 entry の所有を変えないため、dist のフォルダは前回 chown-tree 後の kakeiboot 所有のまま・旧 releases 世代は他方の運用者所有のことがあり、それらへの chmod は（既に正しいモードでも）EPERM で plan を止める。他者所有の entry は、その所有者が作った時点で正規化済みの形のため触らなくてよい。ラッパーの chown-tree は所有付け替え（chown -R kakeiboot:srvops）のみで、正規化はラッパー内に存在しない。configs の --preview（転送なし・書き込みゼロ）では正規化 step も付かない"
given = "transport=local の deploy（stg）・promote・configs（preview 有無）操作列構成と・一時 dir 木への sh -c 実実行"
expect_return_shape = "deploy_normalize_tree_modes(path) が [sh, -c, -uid 付き find 連結文字列] を返し・deploy では dist rsync の直後・chown-tree の直前、promote では dist rsync の直後・chown-tree の直前と releases guard 内（chown-tree より前）、configs では rsync の直後（preview 時は不在）に現れる。実実行でフォルダが 2770・file が group 書き込み付き（644→664・600→660）になり・再実行も成功する"

[[condition]]
id = "deploy-ops.deploy-record"
target_function = "kakeiboot_ops.deploy_record_step（deploy 最終 step）/ build_promote_commands step2 の記録照合"
source = "promote /proc 照合の再設計（サービスアカウント移行後の follow-up）: deploy が検証完了の証跡を自分で残し、promote がそれを消費する形にすることで、他uidの /proc を読まずに「deploy が配置し再起動・healthz で検証したバイナリが、その検証時の起動以降の稼働とともに現存する」ことを担保する。記録の置き場所（<env> 直下）は gt430 実測で運用者が group srvops の書き込みで作成でき、binary は group 読み取りで hash 可能なことを確認済み"
source_lines = "scripts/deploy/test_kakeiboot_ops.py:1330, scripts/deploy/test_kakeiboot_ops.py:1490"
description = "deploy は restart・healthz の成功後にのみ最終 step で <deploy_root>/<env>/deploy-record を書く: promote が配布する3成果物すべての hash（binary の sha256・backup script の sha256・frontend dist の集約 hash〔ファイル毎 sha256sum 行を path 込みでソートした列の sha256。deploy/promote 双方が同一の dist_aggregate_command で計算〕）・healthz が検証した service run の ActiveEnterTimestamp（epoch 化した service_start_epoch）・記録時刻（recorded_at_epoch。情報フィールドで promote は参照しない。新鮮さの担保は service_start_epoch 側）の KEY=VALUE 5行。書き込みは同一 dir 内の一時 file（pid+epoch で呼出毎に一意・残骸は step 冒頭で除去）への printf → chmod g+rw → rename での差し替え（`>` の切り詰めは file 自体の書き込み権限が要り、先に deploy した運用者の 0644 記録を他方の運用者が上書きできないため。rename は group 書き込み可能な dir だけで成立する）。systemctl の出力は独立した代入で受けて成功と非空を確認してから date で parse する（$(...) を date -d の内側へ nest すると systemctl の失敗が捨てられ・GNU date は空文字列を当日 0 時の epoch として成功させてしまうため）。hash計算や起動時刻の取得に失敗したら step 全体が非零になり deploy が失敗する（中途状態の記録を残さない）。promote step2 はこの記録を消費する〔deploy-ops.promote-stg-precheck〕。記録は両運用者の操作間の整合アンカーであり、運用者自身へのセキュリティ境界ではない"
given = "transport=local の deploy 操作列構成と・stub systemctl（固定の ActiveEnterTimestamp を返す／exit 1 で失敗する／空出力で成功する）を置いた一時 layout での最終 step 実実行（既存の読み取り専用記録がある状態も含む）"
expect_return_shape = "deploy 操作列の最終要素が [sh, -c, <script>]（直前が healthz）で・script が 3成果物の hash 計算と systemctl show kakeiboot-<env> の独立代入と ActiveEnterTimestamp と一時 file 経由の <env>/deploy-record 差し替え（mv）を含む。実実行で deploy-record が作られ・3つの hash が実 hash（dist は集約値）と一致し・service_start_epoch が stub の返した日時の epoch と一致し・一時 file が残らず・記録が group 書き込み可になる。読み取り専用（0444）の既存記録も rename で差し替えられる。stub systemctl が失敗・空出力の場合は step が非零になり記録は作られない"
[[condition]]
id = "deploy-ops.promote-restart-healthz"
target_function = "kakeiboot_ops.build_promote_commands step13-14（restart・healthz）"
source = "docs/ops/ops_deploy.md §promote〔TASK-189 実装で追加。設計: tmp/tasks/tm-189/design_promote.md D-6手順10-11・D-6（port解決の分担）。サービスアカウント移行の repo 追随で所有付け替え2 stepが入り step番号は12-13へ移動・モード正規化 step の追加で13-14へ移動〕"
source_lines = "scripts/deploy/test_kakeiboot_ops.py:1546"
description = "配布後に systemctl restart kakeiboot-prod で再起動し・healthz（既存 healthz_command の5回retry）で起動確認する。prod側healthzのportもstg側と同様にprod運用dirの配布済みconfig <deploy_root>/prod/configs/prod/app.toml から解決する（repo configと独立〔deploy-ops.port-from-runtime-config〕）。healthz失敗（5回retry後の非零exit）はpromote自体の失敗となり・binaryとconfigsの不整合〔D-1残余リスク〕の事後検知を担う"
