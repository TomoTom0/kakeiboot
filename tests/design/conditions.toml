# 追記。追記後はそちらが正本。設計: tmp/tasks/tm-83/design_backup-automation.md v4〔REVIEW-15
# 承認済み〕§4-5・§4-1・§7）。テストは backend/tests/admin_cli*.rs へ追加予定（稼働中一貫性は
# test 内で db へ書込を混ぜて検証〔設計§7〕）。timer・script・unit・mise タスクは cargo/vitest
# 対象外（stg 実機・手順書ベース検証: 設計§6-2。実績は tm body へ記録）のため下記 [[excluded]]
# に記録。§4-1 の暗黙前提（画像 file 保存が DB insert より前）の新規条件化も [[excluded]] に
# 記録（既存条件 mcp-draft-batch.store-failure-outcome と web-data-api.ledger-import 系が同一の
# 不変条件を検証済みのため。成功経路の順序は実装タスクでの実装順確認に帰属）。実装・
# [covers:<id>] タグは後続のため、追記直後の本時点で新条件が uncovered で source_lines が空なのは
