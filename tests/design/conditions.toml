target_function = "web::api list_receipts（domain::search::search_receipts・text_condition の OR 結合・receipt_conditions の store_id 分）"
source = "docs/spec/spec_mcp-tools.md §12（web API /search の節〔TASK-41 で追記〕）を正本とし §7-8（search_receipts の一致方式 item_match/store_like〔3文字以上 FTS5 trigram・未満 LIKE 部分一致・別名込み〕と matched_items・行 DTO。web 専用パラメータ q・store_id の注記を TASK-41 で追記）を参照"
source_lines = "backend/tests/web_data_api.rs:558"
description = "GET /receipts の q は品目名 OR 店名（stores.name_norm / store_aliases.alias_norm の別名込み。NFKC+lowercase+ひらがな→カタカナ正規化後に一致）で絞り込み、store_id は店 id の完全一致で絞り込む（いずれも web 専用・MCP の store〔名前部分一致〕とは独立）。trim 後空の q はフィルタなし扱い（既存の無 filter 挙動と同じ）。記号のみの q は正規化（NFKC+lowercase+空白除去+カタカナ統一）でも記号が残るため通常の検索語として LIKE 照合し、該当がなければ 0 件の 200（q・store_id に起因する 400 は無く、400 invalid_request は不正な日付文字列〔from/to〕等の既存枠のみ）。q は既存 filter（category・label_colors・期間）および item_query と AND で併存する。他 ledger の store_id は ledger 条件と合わさって結果が空になる（エラーにしない）。text ありの行には matched_items を付与し（item_query と同じ挙動。店名のみヒット行は []）、total_count はヒットレシート数・sum_amount はヒットレシートの全品目合計（店名ヒット行も全品目）"
given = "品目「牛乳」を含むレシートと店「Aマート」（別名「エーマート」登録済み）のレシートがある ledger で q=牛乳 / q=Aマート / 正規化差のある表記（全角・ひらがなカタカナ）の q / q=牛乳&item_query=内容量 / q=!!（記号のみ）/ 他 ledger の store_id / q=牛乳&category=食費&from,to"
expect_return_shape = "品目ヒットと店名（別名含む）ヒットのレシートが OR で返り正規化差の表記も一致 / item_query・category・期間とは AND / 記号のみの q は 0 件の 200（400 は不正日付等の既存枠のみ）/ 他 ledger の store_id は空結果（200）/ 行の matched_items にヒット品目（店名のみヒット行は []）が入り total_count・sum_amount はヒットレシート基準（店名ヒット行も全品目合計）"

