description = "widget の3 chart（bar_v・bar_h・stacked_bar）のセグメント輪郭描画は共通 SVG renderer 1つ（BarSegs.vue）へ集約する: 各 chart は data→segments 組立・軸・label・title 等の表現固有部分のみを持ち、rect/path の輪郭（stroke=var(--seg-outline)・stroke-width 2 viewUnit・中心線から±1unit・規則F の縁取りなし切替・データ端 cap path〔縦=上端角丸・横=右端角丸〕・rect 寸法=配分寸法−2 viewUnit で stroke 含む外寸=配分寸法）は renderer が担う。renderer の出力する全 shape は class bb-seg と data-size（当該セグメントの stroke 込み外寸=配分寸法。SVG path は幅属性を持たないため寸法の観測点として shape へ載せる）を持つ（3 chart が renderer を通っていることの観測点）。allocateStack は ShareBar 向けに composition モード（allocateStack(segments, length, { mode: 'composition', rest: { label } })）を新設する: 規則A（値比率配分）と規則B（最小寸法 3unit 未満の foldIntoRest）と規則F（bar 全長 3unit 未満は縁取りなし）を適用し、規則C（段階的合算→第一系列単色の終端処理）は適用しない（構成比の表現で残余を落として第一系列を全長へ広げる描画は元 data の金額・割合と一致しないため。B の fold で最小寸法を確保できなかった系列セグメントは規則F と同じ運用〔縁取りなし・比率どおりの塗りのみ〕で残る）。fold 時は value が fold 先セグメントへ移動し総和は保存される（凡例の金額総和は元 data と一致）。残余識別は StackedSegment の rest フラグ（ラベル文字列「ほか」判定から変更 — ラベル「ほか」でもフラグ無しは通常系列）で行い、既存残余は ShareBar が ChartDatum.key===null を rest フラグへ写像（残余「その他」行は null key で届く現行契約と同一識別子・未分類の null key も同様に rest 扱いで実害なし — いずれも SERIES_REST 色の現行契約と一貫）、allocator が残余を新設する場合の表示名は呼出側引数 rest.label（ShareBar は「その他」・既定 mode='stack' では「ほか」）で供給され allocator は名称を内在しない"
given = "BarSegs 単体: 複数セグメント（outline true/false 混在）を縦・横で描く / ShareBar: null key 行（その他）を含む rows・最小寸法未満セグメント構成（fold 発生・null key 行への合算）・5行構成（上位3化・5% fold の不適用確認）・rows総和/scale の全長 / 3 chart の描画（bar_v の既存幾何期待と bb-seg class）"
expect_return_shape = "BarSegs は AllocatedSegment[] と同数の shape（class bb-seg・data-size=外寸・fill=color）を出力し outline=true は stroke=var(--seg-outline)・stroke-width=2（vector-effect なし）・outline=false は stroke なし、データ端（縦=上端・横=右端）の shape のみ角丸 path（arc を含む）で他は rect・rect 寸法=配分寸法−2 / 3 chart のセグメント shape がすべて class bb-seg を持ち bar_v の既存幾何（rect=配分−2・2unit 境界・最上段上端角丸 path・clipPath なし）は renderer 経由で不変 / composition モード: 規則C の単色化が起こらない（最小寸法未満系列は outline=false で比率どおり残る・同入力の stack モードは (d) 単色化に至る対照）・fold は rest フラグ付きセグメント（label「その他」でも可）へ value を移動して総和保存・rest セグメントが無い場合は rest.label で新設 / ShareBar: 全長=rows総和/報告scale×可用幅・5行構成は5セグメントのまま（上位3化なし・4%行も折り畳みなし）・fold 発生時の凡例は合算後の構成（%=bar 内構成比・金額は fold 先へ加算保持で総和=元 rows）・ラベル「ほか」でも rest フラグ無しは通常系列として扱われる"

