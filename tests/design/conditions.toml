[[condition]]
id = "auth-oauth.decision-allow"
target_function = "auth::oauth::authorize::decision"
source = "docs/spec_auth.md §4-2・§4-6・§3-1"
source_lines = "backend/tests/oauth_flow.rs:418, backend/tests/oauth_flow.rs:545"
