# 確定1回。同値再選択・無効range・rangeモードstep・年境界不変step は0操作）。決定: 操作完了通知に
# よる不変snapshot採取 + browsing URL書き込みを所有する単一FIFO（各push/replaceの返却Promiseと結果
# を確認してから次を開始）。識別に迷う場合はACKせず境界として扱う（ユーザー決定で内部観測patch不採用）。
# TASK-174実装・レビュー修正。unit用historyはpop通知とsilent restorationを独立制御する。
# frontend/tests/unit/web/helpers.ts の createManualHistory。改訂した既存条件（元の位置）:
# web-browse.url-user-period-push（同tick連続は1回、を削除）・web-browse.url-period-sync（同tick圧縮を
# 撤回）・web-shell.period-next-write-flag（原因付き完了通知の検査へ）・
# web-browse.url-next-write-discard-off-target（不受理・非再生へ）・web-browse.url-system-write-replace
# （FIFO順序・reset のentry置換を追加）・web-browse.url-diff-guard（system/FIFO・ACK区別の説明へ）・
# web-shell.browsing-back（D3-3完了管理へ）。維持（回帰確認）: web-browse.url-pop-restore・
# url-label-pop-asymmetry・url-keys-absent-store-continues・url-feed-excluded・
# web-search.url-scope-all-period-keys・web-search.scope-toggle-period-keys・
# web-browse.url-echo-no-double-init・web-browse.period-pop-scroll。
