source_lines = "frontend/tests/unit/web/styles.test.ts:131"
description = "topbar のページ表題は 1 行に制限し、収まらない分は ellipsis で切り詰める（折り返して topbar の高さを崩さない）。アイコン併記（TASK-35）により表題は icon + テキスト（.topbar-title-text）の flex 行で、アイコンは縮まずテキスト側が ellipsis になる。表題は幅帯で出し分けする（TASK-44: 〜360px は表題ごと非表示〔ホームと同じ〕・361〜390px は icon のみでテキスト非表示・391px〜 は icon＋テキスト。既存の 520px ロゴ・900px と同じ media query 運用）"
