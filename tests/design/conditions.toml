expect_return_shape = "ステータス 400、Location ヘッダ無し、HTML エラー画面"

[[condition]]
id = "auth-oauth.authorize-errors-redirect"
target_function = "auth::oauth::authorize::authorize_get"
source = "docs/spec/spec_auth.md §4-2・§4-5"
source_lines = "backend/tests/oauth_flow.rs:225"
description = "redirect 検証後のエラーは redirect_uri へ error + state + iss 付きで 302: unsupported_response_type、code_challenge 欠落/不正/方式 plain、invalid_scope、resource 欠落/不一致/fragment 付き"
given = "各不正パラメータでの GET /oauth/authorize（state 付き）"
expect_return_shape = "Location の query に error=<code>・state=<同一値>・iss=<issuer> が含まれる"

[[condition]]
id = "auth-oauth.authorize-duplicate-params"
target_function = "auth::oauth::parse_pairs_exclusive / authorize_get"
source = "docs/spec/spec_auth.md §4-5"
source_lines = "backend/tests/oauth_flow.rs:308"
description = "同一パラメータの重複出現は invalid_request（authorize では redirect 検証前なのでエラー画面）"
