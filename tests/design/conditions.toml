description = "行内横bar（ランキング行bar 6箇所・Home 週行）は一つの共通 DOM bar component で描く（設置箇ごとの個別実装・文法分岐なし。TASK-161 §7 で CSS 規則共有から RowBar.vue 実体化へ〔props: width・segs・per-segment title・in-bar label on/off〕）: 両者とも同じ要素構造（.row-bar の flex row + .row-seg 子セグメント）と同じ文法値（太さは CSS変数 --row-bar-h の一元管理〔web-common.row-bar-thickness。TASK-161 §7 で 6px→12px〕・各セグメント全周 1px var(--seg-outline) 縁取り〔web-common.stack-segment-outline〕・角はデータ端〔右端〕のみ cap 式 min(2px, 太さ/4)（--row-bar-h 12px では 2px）で基端〔左端〕直角〔web-common.stack-corner-rules〕・寸法は allocateStack 経由の JS 明示計算値〔web-common.stack-dimension-rules〕）を持ち、styles.css の .row-bar/.row-seg 規則は1組のみで設置箇別の上書き規則を持たない。ランキング行bar は単色1セグメント（allocateStack に length=行value/画面scale×track実測 px を渡し size=bar長px がそのまま返り規則F が最小寸法を判定・背景=--rank-color で swatch と同 token）で行 data 契約は不変・bar 固有の title は新設しない（行 label の title=全文・金額・share% が可視情報を既に担う。週行のセグメント title「名称 金額（構成比%）」は積み上げ文法としてそのまま）。行の下端は絶対配置 track（.ranked-bar-track: position:absolute・left/right/bottom 0・height 6px・padding を含む行全幅）になり .ranked-row は position: relative を持つ。旧 .ranked-row の下端 2px linear-gradient（--rank-fill 変数）は廃止（gradient は全周縁取り・cap・寸法規則を要素単位で適用できないため）され、.week-bar/.week-seg class も共通部品へ吸収されて削除される。0円（value=0/total=0）の行は bar 要素自体を描かない。bar 長は track 実測（mount 時に計測・ResizeObserver で追従）から再計算される（resize で value/scale 比を保ったまま追従）。TASK-162 §1-9/§1-10（レビュー4・9）の拡張: (1) segSelect?: (s: AllocatedSegment) => void props を追加し、segSelect が渡されたときだけ各segmentをbutton化する（span/button分岐 — WeekRows の親button内にbutton入れ子は発生しない: 週行はsegSelect不使用。BreakdownBar のsegment押下導線〔web-home.breakdown-absolute-ticks〕が使用）。キーボード: segment button はTab順に載り focus-visible は既存規則（--bb-accent 2px outline）。狭小segmentの当たり判定も24px高を下回らない（buttonのpaddingで確保・bar帯外は透明） (2) segment v-for keyは index→系列key（restは'rest'固定）へ変更（安定key: 系列の追加/削除/並べ替えがkeyed移動として処理されwidth transition 220msが発火） (3) segmentのenter/leave は fade 150ms（.row-seg に適用・bb-appear と同型）・label文言の変化はcrossfade（keyed span・opacity 150ms）・reduced-motion は即時化（既存統一規則）。TASK-162 §1 から BreakdownBar の1本barのDOMもこのcomponentが担う (4) TASK-162 コードレビュー中2（button segmentの塗り帯）: segmentのinline塗りは backgroundColor longhand（background shorthand は background-clip を border-box へresetし stylesheet の content-box 指定を上書きして24px全体を塗るため使用しない）・button.row-seg は align-self: center で24px box を16px bar の上下中央に置き（stretchだと上端pinで帯がずれる）・padding 4px 0 + background-clip: content-box により塗り帯は中央16pxに限られ span segment（.row-seg）の帯と同一線に揃う（bar帯外は透明）"
given = "Home（内訳ランキング行+週行+BreakdownBar 1本bar）と /receipts 支払方法 zone（button 行）を mock で開く / value=0 の行を含む rows / track 幅の変化（viewport resize）/ BreakdownBar を jsdom で mount（segSelect 渡し）"
expect_return_shape = "ランキング行・週行とも .row-bar（height var(--row-bar-h)・flex）とその子 .row-seg（border 1px・右端 cap 式 min(2, 太さ/4)・左2隅 0）を持ち class 名・文法規則が同一（.row-bar/.row-seg の CSS 規則は1組のみで .ranked-row/.week-row スコープの bar 文法上書きは存在しない）/ ランキング行の .row-seg は1件で background=--rank-color（swatch と同 token）・width=行value/scale×track px / 行 style に --rank-fill は無く styles.css に .ranked-row の background-image/linear-gradient 規則・--rank-fill トークン・旧 .week-bar/.week-seg 規則は存在しない / .ranked-bar-track は absolute・bottom/left/right 0・height var(--row-bar-h)・.ranked-row は position: relative / 0円行に .row-bar なし / resize で bar 長が value/scale 比を保ったまま追従する / segSelect 未渡し（週行・ランキング行）のsegmentは span のままでbuttonにならない（親button入れ子なし）/ segSelect 渡し（BreakdownBar）のsegmentは button（type=button・Tab順に載る・focus-visible 2px accent・高さ24px以上・inline style は background-color で background shorthand なし〔computed background-clip は content-box〕・buttonの塗り帯〔box上下端−4px〕は span segmentの帯と±0.5pxで一致）/ segment v-for key は系列key（indexでない・restは'rest'）"

