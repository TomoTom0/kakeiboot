source = "docs/spec/spec_mcp-tools.md §12（/search 画面・topbar 検索チップの段〔TASK-41 で追記〕）・TASK-77（tm-77）: TASK-74 で /search に ledgerScoped: true が付き家計簿切替chip が topbar 右帯に加わり、検索語つき検索チップと合わせ 360px 帯が 13px 溢れた回帰の修正（360px 以下で検索チップの検索語を折り畳む。web-browse.topbar-filter-bar とセット）"
source_lines = "frontend/tests/browser/verify.spec.ts:1983, frontend/tests/unit/web/styles.test.ts:231"
description = "実測（TASK-19 体系の -real 系・chromium）: /search は 360px 幅で検索欄行（検索欄＋期間スコープチップ）とタブ行の2行に収まり横溢れがない（topbar は TASK-74 以降 家計簿chip を含む構成で、360px 以下では検索チップの検索語 .chip-label-q が display: none に折り畳まれ icon 入力のみになる）。検索欄入力 → 結果表示・topbar 検索 dialog の開閉 → 実行で /search へ遷移・結果行 → Feed → 戻るで文脈（q=）が保たれる一連の実挙動が流れる。360px 実機での最終確認はユーザーが行う"
given = "360px viewport で /search を表示し（chromium・stub）、検索欄へ入力 → 結果表示 → 検索 dialog を開閉して実行 → 行押下で Feed → 戻る"
expect_return_shape = ".search-head と .search-tabs が2行で document に横スクロール（横溢れ）なし・.chip-label-q の computed display が none（360px 帯で検索語は折り畳み） / 入力確定で結果行が表示される / 検索チップ（filter-chip-search）の dialog 実行で /search へ遷移する / Feed から戻ると一覧が同じ q で復元される"

