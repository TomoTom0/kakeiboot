source = "TASK-162 §1-2・§1-6（設計レビュー5・6: top3縮約撤回で上位5+ほか維持・「ほか」の金額・件数契約確定）・設計 tmp/tasks/tm-162/design_breakdown_stack.md（v2）§1-6。ユーザー実機指摘 2026-11-04 22:28 指摘1"
source_lines = "frontend/tests/browser/verify.spec.ts:723, frontend/tests/browser/verify.spec.ts:3421, frontend/tests/unit/web/trend-window.test.ts:1771, frontend/tests/unit/web/trend-window.test.ts:1805"
description = "Home 内訳の1本bar（web-home.breakdown-absolute-ticks）の積み上げ組立は純helper stackedOfRows が担う: (1) 段数は上位5系列+「ほか」（TASK-161 の上位5行構成の引継ぎ・top3縮約〔v1案〕は撤回）(2) 「ほか」の残余金額 = 合計（totals.amount）− 保持系列（上位5）の値の和 で閉じる（返却rowsのtail合計依存を廃止 — 取得外rowを含む残余が正確に出る）(3) 「ほか」の件数 = 分類数（合計側で「ほか」に合流した分類の数: tail rows数+truncated_rows+foldされた上位系列の数。取引件数ではない。TASK-162 コードレビュー中3対応: truncated_rows は helper の第3引数（既定0）で受け取り count に加算し、呼び出し側（HomePage→BreakdownBar の truncated prop）が analysis.truncated_rows を渡す）(4) 5%未満fold（構成比5%未満の上位系列は「ほか」へ合流し value・count 双方に集約）(5) 寸法fold（allocateStack 規則B/C）・label高さfold（opts.labelMin〔web-common.allocate-label-min〕）の全fold段階で「ほか」へ合流した系列はこの件数と金額に集約される（ただし寸法foldは allocateStack 内で発生するため stackedOfRows の rest には5%fold分が載り、寸法/labelMin fold 分は描画側（BreakdownBar）が rest segment の title 件数へ加算する — 組立前後の系列数差分から算出）(6) 値0 series はsegmentを組まない（既存契約と同一）(7) 各 segment は系列keyを保持〔web-common.stack-series-key〕。BreakdownBar の tooltip「ほか n件・計xx円（p%）」はこの rest から組む"
given = "rows: 食費550〔key1〕・日用品398〔key4〕・交際120〔key7〕・娯楽100〔key2〕・衣服80〔key6〕・本50〔key3〕・交通30〔key5〕（合計1328）を stackedOfRows に渡す / 5%未満系列を含む構成 / 空rows"
expect_return_shape = "segments は上位5 series（食費・日用品・交際・娯楽・衣服・各key保持・値0省略）+ rest { value: 1328-1248=80, count: 2 }（tailの本50・交通30）…ただし5%未満系列（120/1328=9%は非該当・衣服80/1328=6%も非該当・本50=3.8%は該当）は fold され rest.value/count へ合流する（fold 後の rest は value=80 のまま本がfold済みなら count に算入）/ 5%fold: 上位5内の5%未満系列が rest へ合流し（value 加算・count +1）上位5からは外れて次位系列が繰り上がる / 残余金額は常に 合計−保持系列和（truncated_rows が非0でも取得外row込みで正確）/ truncated 引数: stackedOfRows(rows, 1600, 6) の rest.count = tail 2 + truncated 6 = 8（unit で値と件数の双方を検証）/ browser: BreakdownBar の rest segment title が「ほか n件・計xx円（p%）」で n = tail+5%fold+truncated（+寸法fold分）の合計（例: 7 fold + truncated 2 = 9件・計148円（16%））/ 空 rows は segments 空・rest { value: total, count: 0 } または描画側の空状態〔web-home.breakdown-absolute-ticks〕"

