description = "StackedSegment と AllocatedSegment に key: string | number | null を追加し、stackedOf・stackedOfRows がAPI series の系列keyを落とさず allocation 後まで保持する。遷移・操作の識別子はこの key（同名分類・label/color による逆引きは禁止 — 同名別key・色衝突で誤識別するため）。rest flag（TASK-129: fold対象のidentityはFLAG・label文字列でない）が「ほか」と未分類の区別を担う: key=null かつ rest flag=「ほか」segment・key=null かつ非rest=未分類（/axes/category/uncategorized 導線〔web-home.breakdown-absolute-ticks〕）・key 非 null=当該分類のAxisDetail 導線。allocateStack の fold（規則B/C・labelMin・5%fold）で「ほか」へ合流した系列の key は rest に集約され消える（identity は value/count 集約で保存〔web-common.stacked-of-rows〕）。既存消費者（WeekRows の segTitle・TrendBars の title）は key を無視して従来どおり label/title を組む（契約不変）"
