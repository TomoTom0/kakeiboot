[[condition]]
id = "deploy-ops.install-units-plan"
target_function = "kakeiboot_ops.build_install_units_commands / install-units subcommand（env引数なし）"
source = "docs/ops/ops_deploy.md §backupの導入・検証〔TASK-119 実装で更新。2026-11-19: gt430 の system service 化（2026-11-17・host変換script）へ追随し system unit + polkit rule の sudo install 配布へ変更〕"
source_lines = "scripts/deploy/test_kakeiboot_ops.py:746, scripts/deploy/test_kakeiboot_ops.py:1004"
description = "install-units の操作列が sudo による system unit 配布として構成される: mkdir -p（target側staging dir）→ staging dirへのrsync（render済みservice・timer・polkit rule の3点。sudo install はtarget上のpathを読むためtmp/ staging を先にtargetへ置く）→ sudo install -o root -g root -m 644 による /etc/systemd/system/{service,timer} と /etc/polkit-1/rules.d/49-dual-operator-kakeiboot-backup.rules への配布（root:root 644）→ sudo systemctl daemon-reload（system scope）→ sudo systemctl enable --now kakeiboot-backup@{stg,prod}.timer（host変換scriptのend state と同一）→ 操作列末尾の rm -rf によるtarget側staging dirの後片付け。target側staging dir は呼出ごとの一意dir（BACKUP_UNIT_STAGE_PREFIX + local staging dir名のbasename）で・共有固定pathではない（先に実行した運用者の一時dir 0700 が共有pathへ残って別運用者の rsync を妨げる事態を防ぐ）。polkit rule は tool 内定数として生成（template fileを増やさない。両運用者 tomo/muse-agent が全 backup unit instance を自分の身分で manage-units できる内容）で・実行user（User=kakeiboot）は .in 正本に記載。操作列に --user と ~/.config/systemd/user は現れない。subcommand は --env を取らない（unit は %i template 1組で両env共通のため）"
given = "transport=local と transport=ssh・runtime_host=gt430 の各cfgと・render済みservice・timer・polkit rule をstagingした一時dirのpath"
expect_return_shape = "9 command: [mkdir -p /tmp/kakeiboot-units-install-<staging dir名>, <staging dir>/ → /tmp/kakeiboot-units-install-<staging dir名>/ のrsync, sudo install による staging/kakeiboot-backup@.service → /etc/systemd/system/kakeiboot-backup@.service, 同 timer, 同 49-dual-operator-kakeiboot-backup.rules → /etc/polkit-1/rules.d/49-dual-operator-kakeiboot-backup.rules, sudo systemctl daemon-reload, sudo systemctl enable --now kakeiboot-backup@stg.timer, sudo systemctl enable --now kakeiboot-backup@prod.timer, rm -rf /tmp/kakeiboot-units-install-<staging dir名>]。ssh時は mkdir・sudo install・daemon-reload・enable・rm が ssh -o BatchMode=yes -o ConnectTimeout=10 gt430 -- wrap され・rsyncに -e option と host:接頭が付く。install-units は --env なしで parse される"

