source = "設計 tmp/tasks/tm-124/design_spa-url-routing.md v2 §7（未判明事項: 360px 帯の収容・/apps の親）・§3 D1（反映しない状態の列挙）・D3（PageHead との共通化）・§6（親マップ）・D5（spec 更新は実装対象）"
