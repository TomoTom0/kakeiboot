[[condition]]
id = "web-http.dev-spa-fallback"
target_function = "vite.config.ts devSpaFallbackPlugin configureServer"
source = "TASK-29（Vite dev のみ spa_fallback 欠落: 既定 appType spa の html fallback は /index.html 決め打ちだが本構成は index.html 不在のため / や /receipts/101 が404。本番 backend〔backend/src/web/static_files.rs spa_fallback・INDEX_FILE=web.html〕と同じ導線を dev でも担保する。Vite 8.3.4 は server.rewrites option を消費しないため configureServer post-hook で /index.html を /web.html へ書換える）"
source_lines = "frontend/tests/unit/web/vite-proxy.test.ts:34, frontend/tests/unit/web/vite-proxy.test.ts:44, frontend/tests/unit/web/vite-proxy.test.ts:84"
description = "Vite dev server は静的 asset・html 以外の clean URL（/ ・/receipts/101 等）を web shell（web.html）へ導く。/widget.html・/@vite/client・proxy 対象パス（/api,/oauth,/.well-known,/mcp）は書換えない"
given = "vite.config.ts の内容（html fallback の後に動く dev spa fallback plugin）"
expect_return_shape = "Vite の html fallback が決め打ちで向ける /index.html を /web.html へ書換える configureServer post-hook（devSpaFallbackPlugin）が plugins に組み込まれ、消費されない server.rewrites option を使わない"

[[condition]]
id = "web-http.dev-strict-port"
target_function = "mise.toml tasks.\"dev:frontend\" run"
source = "TASK-29 副次改善（configs/dev/app.toml [frontend].dev_port=40281 は固定割当: 占用時に知らぬ間に別 port で立ち上がる事故防止。frontend/playwright.config.ts の webServer command と同一パターン）"
source_lines = "frontend/tests/unit/web/vite-proxy.test.ts:19, frontend/tests/unit/web/vite-proxy.test.ts:98"
description = "mise の dev:frontend タスクは --strictPort 付きで Vite を起動し、40281 が占有されていたら別 port へ移動せず失敗する"
given = "mise.toml の dev:frontend タスク定義"
expect_return_shape = "run が \"pnpm dev --strictPort\" である"

[[condition]]
id = "web-http.build-id-define"
target_function = "vite.config.ts define（__BUILD_ID__）"
source = "docs/spec/spec_mcp-tools.md §12（アカウントメニュー末尾の build マーカー: 構築コミットの短縮ハッシュで古い shell と現在の構築を判別する。git checkout でない構築では dev）"
source_lines = "frontend/tests/unit/web/vite-proxy.test.ts:105"
description = "vite の define で __BUILD_ID__ に構築時点の git HEAD の短縮ハッシュを注入する。git が使えない構築（checkout でない配布物等）では 'dev' に fallback する"
given = "git checkout 内で vite.config.ts を読み込む（vitest 実行時）。設定ファイルの本文も読む"
expect_return_shape = "読み込んだ config の define.__BUILD_ID__ が現在の HEAD の短縮ハッシュ（git rev-parse --short HEAD）の JSON 文字列と一致する。本文に git rev-parse --short HEAD の実行と、失敗時に 'dev' を返す fallback がある"

