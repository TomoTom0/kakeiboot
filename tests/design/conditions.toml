[[condition]]
id = "auth-oauth.authorize-invalid-client-no-redirect"
target_function = "auth::oauth::authorize::authorize_get"
source = "docs/spec_auth.md §4-2・§10-4"
source_lines = "backend/tests/oauth_flow.rs:179"
description = "client_id 不正（allowlist 外・URL 不正・CIMD 取得不能）と redirect_uri 未登録は redirect せず 400 エラー画面"
