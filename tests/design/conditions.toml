source = "docs/ops/ops_deploy.md §backupの導入・検証〔TASK-119 実装で更新。2026-11-19: gt430 の system service 化（2026-11-17・host変換script）へ追随し unit は system 形式のみとなる。サービスアカウント移行の repo 追随で固定実行userは専用アカウント kakeiboot へ変更〕"
source_lines = "scripts/deploy/test_kakeiboot_ops.py:658"
description = "unit正本が kakeiboot-backup@.service.in（{{deploy_root}} placeholder入り）へrenameされ・WorkingDirectory= と ExecStart= の2行が {{deploy_root}}/%i 形式になる。[Service] に User=kakeiboot が固定で入る（unit は system unit のみになり実行userの暗黙前提が消えるため。移行前は User=tomo 固定だった）。冒頭comment（.in 直接scp禁止・units:install による /etc/systemd/system/ への sudo install を使う旨）が付く（render前のunitの誤配布防止）。旧 kakeiboot-backup@.service（直書き正本）は存在しない。timer は pathを含まないため .in 化されずそのまま（render対象外・placeholderを含まない）"
given = "repo の scripts/systemd/ 配下のfile群"
expect_return_shape = "kakeiboot-backup@.service.in が存在し・WorkingDirectory={{deploy_root}}/%i と ExecStart={{deploy_root}}/%i/bin/kakeiboot-backup.sh %i と User=kakeiboot の行と冒頭の # comment 行を持ち・拡張子なしの kakeiboot-backup@.service は不在。kakeiboot-backup@.timer は .in 化されず存在し本文に {{ を含まない"

