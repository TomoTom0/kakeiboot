description = "Home 月モードは選択月に重なる週（月の1日を含む週の月曜から月末日を含む週の日曜まで・月曜アンカー・4〜6行・昇順）を行とする「週ごとの支出」zone を推移zoneと内訳zoneの間に持つ（zone の v-if は mode==='month' と weeks.length>0 の二重ガード〔mode切替からload完了までの空zone描画防止〕で、週/年/rangeモードはzoneごと非表示）。週fetch（getAnalysisTrend granularity=week・limit=5）の from/to は TASK-146 §2 から月を跨ぐ1本の拡張range（weekStart(range[0])=月1日の週の月曜 〜 月末日を含む週の日曜）へ拡げ、各週の total・segments は隣接月の数日を含む完全な7日分になる（端週の月クリップ廃止。行数は月の曜日構成により4〜6行のまま）。行は週label（bucketSpan に拡張 from/to を渡した全幅の「10/5〜10/11」形式で月跨ぎはそのまま書く: 端週は「9/28〜10/4」「10/26〜11/1」。年の略記は shortDate 踏襲で年跨ぎ週「12/28〜1/3」は開始<=終了の制約から年跨ぎと読める）+ formatYen 金額（bucket_totals）+ 行内比率bar をのせ、行全体が全幅の button（min-height 44px — TASK-162 §4 の bar 16px 化で行内容は ~45.6px となり min-height を少し超える。is-link 常時付与・RankedList の button 行と同文法）で押下は period.setWeek(key)（週モード遷移・TrendBars 週棒と同契約・keyは月曜で正規化済み）。current 強調（当週）は表示されている週行に当週が含まれる限り継続する（currentTrendKey の週分岐に拡張 from/to を渡す: 今日が隣接月側にいてもその週が表示月に重なっていれば当該行を強調。旧の「表示月range内に当週の月曜が入る場合のみ」から改訂）。帰結として Σ週合計 ≠ 月合計（端週が隣接月分を含むため週行は「月の部分集合」でなく「月に重なる週」の集計）を受け入れる。行内 bar は TASK-123 で DOM 積み上げ bar（横方向）へ変更（旧 TASK-116 の多停止 linear-gradient 文字列は廃止・週行は共有規則 .ranked-row,.week-row の下端 2px gradient から分離し行自体は gradient を描かない）し、TASK-129 でその bar 部品はランキング行bar と同一の共通 DOM bar component（.row-bar+.row-seg・web-common.row-bar-component）へ差し替わる: 太さは web-common.row-bar-thickness の --row-bar-h 一元管理（TASK-161 §7）、構成は他3系統と同一文法（上位3+「ほか」・残余 grey・値0セグメント省略・各セグメント全周 1px 縁取り・fill 長内の§4-5 横方向配分〔最小幅=縁取り込み 3px・5%未満+寸法未満合算・明示計算値〕・配列順=左から上位降順+残余右端で trend 棒の column-reverse 下端=第一系列と同じ対応・角はデータ端〔右端〕のみ cap 式 min(2px, 高さ/4) で基端〔左端〕直角）、bar 全長は絶対scale（週合計/画面scale×track実測・web-common.bar-scale。旧 fill=週合計/max 週比の 1% 底上げは廃止）が体現し、セグメントに「名称 金額（構成比%）」の title を付ける（trend/daily と同形式。行単位の title は新設しない）。0円週（total=0）は bar 要素自体を描かない（意味のない1%スリバー廃止。web-common.series-color-assignment (4)）。説明文・注記行・share% 表示は持たない。見出しは可視 zone-title（TASK-105・web-common.zone-headings-visible）。backend・mock・WeekRows の props 契約・bucketSpan/currentTrendKey の規則自体は無変更（渡す range の拡張のみ）"
given = "今日=2026-10-15。mock 10月（10/5・10/8・10/10 の3レシート計948円）で / を月モードで開く / 週・年・range モードでも開く / 今日=2026-10-01 でも月モードで開く（当週の月曜 2026-09-28 が隣接月側）"
expect_return_shape = "月モード: week-card zone に button 5行・data-test=row-<月曜>=['2026-09-28','2026-10-05','2026-10-12','2026-10-19','2026-10-26']・label=['9/28〜10/4','10/5〜10/11','10/12〜10/18','10/19〜10/25','10/26〜11/1']（月跨ぎをそのまま書く完全7日）・金額=['0円','948円','0円','0円','0円']・row-2026-10-12 が current（今日=2026-10-15）/ 今日=2026-10-01 では row-2026-09-28 が current（当週が隣接月側でも継続）/ 記録のある週（948円週）の button 内に .row-bar とその子 .row-seg 2件（食費=var(--series-1)・日用品=var(--series-4)。配列順=左から上位降順+残余右端・セグメント色は内訳ランキング行の --rank-color と同 CSS 変数値・title「名称 金額（n%）」）で行 button 自体は background-image なし・0円行の button に .row-bar なし / 行押下で mode='week'・week=押下行の月曜 / 週fetchは axis=category・metric=amount・granularity=week・from=2026-09-28・to=2026-11-01・limit=5 で label_colors も流れる / 週・年・range モードは week-card zone なし・trend呼び出しは週/range モードが1回（日粒度のみ・隣接窓prefetchは表示窓と同keyのためなし）・年モードは2回（月12か月窓表示+TASK-115 §3-2 の prev隣接窓 prefetch from=2025-01-01 to=2025-12-31）"

