target_function = "web/components/ReceiptPanel.vue・pages/ReceiptDetailPage.vue（Feed）・api/data/mock.ts deleteReceipt"
source = "docs/spec_mcp-tools.md §7-11（confirm なしは preview と revision を返す、confirm:true は revision 必須、論理削除で90日以内なら復元可〔TASK-16 で ReceiptPanel に確定〕）"
source_lines = "frontend/tests/unit/web/data-pages.test.ts:742"
description = "削除は閲覧表示には出さず、修正モード内の危険な操作からのみ行う。preview（対象の要約と90日以内なら復元できる旨）を表示してから、revision 付き confirm で実行する"
given = "Feed 内のパネルで閲覧表示に削除が無いことを確認 → 「内容を修正」→「削除の確認へ」→ preview 表示 → 「削除する」"
expect_return_shape = "1回目は confirm なし、2回目は confirm=true と preview の revision。パネルは Feed に残ったまま削除済み表示（deleted-banner と復元ボタン）になり、feed-position の表示・route（URL）・listReceipts の呼出回数は削除前と変わらない"

[[condition]]
id = "web-receipts.restore"
target_function = "web/components/ReceiptPanel.vue・pages/ReceiptDetailPage.vue（Feed）・api/data/mock.ts deleteReceipt"
source = "docs/spec_mcp-tools.md §7-11（restore は非破壊で confirm 不要〔TASK-16 で ReceiptPanel に確定〕）"
source_lines = "frontend/tests/unit/web/data-pages.test.ts:774"
description = "削除済みレシートは確認なしで復元でき、削除済み表示が消える"
given = "Feed 内の削除済みレシートのパネルで「復元」"
expect_return_shape = "deleteReceipt が restore=true で呼ばれ、そのパネルの削除済み表示が消えて通常表示に戻る。feed-position の表示・route（URL）・listReceipts の呼出回数は変わらない"

[[condition]]
id = "web-receipts.detail-image"
target_function = "backend/web/api.rs get_receipt（image_url 発行）・web/components/ReceiptPanel.vue"
source = "docs/spec_mcp-tools.md §11-5（短命 token URL）・§11-7（/media/img/ 由来の URL のみを src に使う。TASK-16: target を ReceiptPanel へ、期待不変）"
source_lines = "frontend/tests/unit/web/data-pages.test.ts:811"
description = "レシート詳細は API 応答の image_url（短命 /media/img/<token>）を画像表示し、URL が /media/img/ 配下でなければ表示しない。読込失敗（期限切れ）は再取得ボタン、画像なしは省略"
given = "画像付きレシートの詳細取得・/media/img/ 外の URL・期限切れによる img 読込エラー"
expect_return_shape = "img の src は API の URL のみ。失敗時はメッセージと再取得（詳細再取得で新 token）、URL 不正・画像なしは img を出さない"

[[condition]]
id = "web-xss.text-rendering"
target_function = "web 画面全般（Vue テンプレート補間のみ）"
source = "docs/spec_mcp-tools.md §11-6（店名・品名・note は任意文字列。v-html 禁止、テキストノードで描画）"
source_lines = "frontend/tests/unit/web/data-pages.test.ts:795"
description = "利用者・OCR 由来の文字列は HTML として解釈せずテキストとして表示する"
given = "店名 '<img src=x onerror=alert(1)>' のレシート・店"
expect_return_shape = "img 要素は生成されず、文字列がそのままテキストで表示される"

[[excluded]]
item = "web 画面で users.default_ledger_id（web 側の既定家計簿）を変更する UI"
source = "docs/spec_auth.md §6・§6-1"
reason = "変更 API が backend に存在しない（§3-2 の API 表にも無い）。web 画面の家計簿選択は画面内の一時選択（me.ledgers から選ぶ）に留める。API 追加の要否はユーザー判断（TASK-11 web 担当の引継ぎ事項）。TASK-16 で me が default_ledger_id を返すようになり、初期選択に default_ledger_id（所属している場合）を使う（web-shell.ledger-initial-default で条件化）が、変更 UI 自体は引き続き除外（TASK-16 項目3 決定10）"
decided_at = "2026-10-14"
decided_by = "claude"

[[excluded]]
item = "web 画面のレシート詳細での bbox 枠の描画"
source = "docs/spec_mcp-tools.md §11-5・§12"
reason = "画像表示（API 応答の短命 /media/img/<token> URL のみを src に使う・期限切れの再取得・画像なしの省略）は web 用 image_url 発行の実装後に web-receipts.detail-image で条件化済み。web の詳細は画像のみを表示し bbox 枠を描画しない（枠の描画は widget の ImageWithBoxes のみ）ため、web での枠描画の要否と設計が決まった時点で条件化する"
decided_at = "2026-10-16"
decided_by = "claude"

[[excluded]]
item = "web 画面のフォーム直接確定（receipts.source=manual）"
source = "docs/spec_mcp-tools.md §5-5・§12（create_confirmed を web のフォーム直接確定と共用）"
reason = "TASK-11 web 担当の実装範囲（ログイン・登録・同意・ホーム・接続中のアプリ・カテゴリ・店・レシート一覧/詳細/編集/削除）に含まれない。backend の web API 実装と合わせて後続で条件化する"
decided_at = "2026-10-14"
decided_by = "claude"

[[excluded]]
item = "2本目のパスキーを勧める表示を出さない"
source = "docs/spec_auth.md §2-7・§2-8"
reason = "表示しないことの要求で分岐を持たない（§8「書かない」: 挙動に差を生まない）。実装に該当表示が無いことはレビューで確認する"
decided_at = "2026-10-14"
decided_by = "claude"

