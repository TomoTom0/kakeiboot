[[condition]]
id = "deploy-ops.promote-plan"
target_function = "kakeiboot_ops.build_promote_commands / promote subcommand（--envなし・stg→prod固定）"
source = "docs/ops/ops_deploy.md §promote〔TASK-189 実装で追加。設計: tmp/tasks/tm-189/design_promote.md D-6（手順11 step・順序固定）・D-1（配布対象と配布元）〕"
source_lines = "scripts/deploy/test_kakeiboot_ops.py:1053, scripts/deploy/test_kakeiboot_ops.py:1826"
description = "promote 操作列が設計D-6の固定順序（サービスアカウント移行の repo 追随で11 stepから13 stepへ・モード正規化の ops ツール移行で14 stepへ拡張）で構成される: 1.stg healthz 2.deploy配置記録との照合（stg運用dir binaryのsha256が記録と一致し・現在のActiveEnterTimestampが記録された検証済み起動時刻以降〔deploy-ops.promote-stg-precheck〕） 3.sha256表示 4.configs乖離preview（--dry-run・転送なし） 5.旧成果物退避 6.mkdir -p <prod>/bin <prod>/frontend <prod>/configs/prod（前提dirを機構側で用意。rsync・installは途中階層を作らないため） 7.kakeiboot-deploy ラッパーの install-file で binary 配置（ラッパー内 install で kakeiboot:srvops 770・stg運用dir→prod運用dir・運用機上実行） 8.同 install-file で backup script 配置 9.rsync dist（同・--delete） 10.dist のモード正規化（運用者自身の find/chmod〔deploy-ops.mode-normalization〕） 11.ラッパーの chown-tree で dist の所有付け替え（kakeiboot:srvops） 12.releases 世代のモード正規化＋所有付け替え（guard 内で正規化→ラッパーの chown-tree の順・releases dir 不在時は skip する sh -c） 13.systemctl restart kakeiboot-prod 14.healthz。step1-4はprodへ書き込まない読み取り専用で・step5の退避が配布step（7-9）による上書きの直前に必ず実行される。configsはpromoteの配布対象に含まれない（D-1: configsのprod配布は独立subcommand〔deploy-ops.configs-command〕。手順にconfigs実配布stepが存在しない）・var/（runtimeデータ）にも触れない。miseタスクのdependsを持たない＝repoのbuild成果物を一切参照せず配布元はstg運用dirの現物のみ（deploy-ops.promote-mise-tasks）"
given = "deploy_root=/srv/opt/tomo/run/app/tool/kakeiboot・stg healthz port=40282・prod healthz port=40283・transport=local と transport=ssh・runtime_host=gt430 の各cfg"
expect_return_shape = "14 argv が設計順序どおり: 第1要素が healthz_command(stg port)・第6要素が mkdir -p の3宛先・第7/8要素が [sudo, /usr/local/sbin/kakeiboot-deploy, install-file, <元>, <宛先>] の binary / backup script 配置・第10要素が dist のモード正規化（運用者の find/chmod sh -c）・第11要素が [sudo, /usr/local/sbin/kakeiboot-deploy, chown-tree, <prod>/frontend/dist]・第13要素が [systemctl, restart, kakeiboot-prod]・第14要素が healthz_command(prod port)。configs/prod を宛先に持つ rsync は --dry-run 付きのpreview 1つのみ（実配布stepが存在しない）・配布元はすべてstg運用dir配下の絶対path。ssh時はstep4（repo→prod方向・rsync_exec）のみ -e ssh option と host:接頭を持ち・他13 stepは shlex.join 単一remote文字列の ssh wrap（stg→prod の配置〔step7-9〕は運用機上実行のためhost:接頭を持たない）"

[[condition]]
id = "deploy-ops.promote-stg-precheck"
target_function = "kakeiboot_ops.build_promote_commands step1-2（stg前段チェック）"
source = "docs/ops/ops_deploy.md §promote〔TASK-189 実装で追加。設計: tmp/tasks/tm-189/design_promote.md D-2。サービスアカウント移行後の再設計で /proc 照合から deploy 配置記録方式へ置換（gt430 実測: 専用アカウント kakeiboot 実行の stg は他uidから /proc/<pid>/exe を読めず Permission denied・一方 stg運用dir binary の sha256sum と systemctl show の ActiveEnterTimestamp は srvops / 通常権限で読み取り可）〕"
source_lines = "scripts/deploy/test_kakeiboot_ops.py:1478"
description = "promote手順の最初にstg稼働確認の前段チェック2種が置かれ・いずれかの失敗（非零）で既存 run_commands の失敗停止により即停止する: (1) stg healthz（既存 healthz_command の5回retry。portの解決先はstg運用dirの配布済みconfig <deploy_root>/stg/configs/stg/app.toml でrepo configではない〔deploy-ops.port-from-runtime-config〕） (2) deploy配置記録との照合（remote sh -c 1 step: <stg>/deploy-record の3つの hash（binary・backup script・dist 集約）と disk 上の現行 hash の一致、かつ systemctl show kakeiboot-stg -p ActiveEnterTimestamp --value を epoch 化した現在起動時刻が記録の service_start_epoch 以降であること。systemctl の出力は独立代入で受けて成功・非空を確認してから parse する〔date -d の空文字列フォールバック回避。deploy-ops.deploy-record と同じ作法〕）。(2)はbinary配布済み・restart前/失敗の中途状態（diskは新binary・稼働は旧プロセス＝現在の起動時刻が記録より前）を機械的に排除する。記録不在・記録のparse不能・systemctl/date失敗・hash不一致はすべて非零で停止（fail-closed・実行ベース検証は deploy-ops.promote-shell-execution）。旧来の /proc/<pid>/exe 照合は、移行後 stg が専用アカウント実行で他uidから読めず全員 fail-closed になるため廃止した。記録方式が証明するのは「disk上の3成果物が deploy が配置・検証したものと一致し、現在の稼働が検証時の起動以降であること」で、/proc 方式が証明した「稼働中プロセスの実体そのものが disk 上 binary と同一」は証明しない（成果物を差し替えて再起動し記録どおりの bytes へ戻す操作は検出できない。書けるのは両運用者とサービスアカウントに限定され、promote が配布する disk 上成果物自体は hash で固定されるため許容）。なおこれらはstgで人間による検証が行われたことの担保ではなく（D-2境界）「stg運用dirの現物がそのままprodへ入る」ことの機械確認"
given = "transport=local・stg port=40282・prod port=40283 でのpromote操作列構成"
expect_return_shape = "第1要素が healthz_command(stg port) と同一argv・第2要素が sh -c 1 stepで <deploy_root>/stg/deploy-record と 3成果物（budget-book・bin/kakeiboot-backup.sh・frontend/dist）の hash 照合と systemctl show kakeiboot-stg と ActiveEnterTimestamp を含み・/proc/ と MainPID を含まない照合script"

