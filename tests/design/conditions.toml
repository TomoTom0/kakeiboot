[[condition]]
id = "web-receipts.feed-current-dominance"
target_function = "web/pages/ReceiptDetailPage.vue（onIntersect の優越判定・visibleShare）"
source = "docs/spec_mcp-tools.md §12（レシート詳細の段: 表示中の判定は IntersectionObserver の配送ベースで、候補パネルが live の見えている範囲で実際に表示中パネルより多く見えているときのみ交代する——交差が変化した target のみ届く部分配送が、下端にわずかに覗く下パネル単独で current を奪い URL を1件先へ書き換えないための優越判定〔TASK-77。TASK-75 の browser 実行で顕在化した race の切り分けに基づく〕）"
source_lines = "frontend/tests/unit/web/receipt-feed.test.ts:652, frontend/tests/unit/web/receipt-feed.test.ts:673"
description = "IO 配送による表示中パネル（current）の交代は、候補が live のレイアウトで実際に表示中パネルより多く見えている場合にのみ起こる（sticky の topbar とフィード操作バーの下端より下の見えている範囲を px で比較し、候補が同幅以下なら無視する）。交差が変化した target のみ届く部分配送——着地済みの表示中パネルを含まない、下端にわずかに覗く下パネル単独の配送——では current も URL も置き換わらず、次の前後ボタン押下は隣のパネルへ着地する（1件スキップしない）。スクロールで候補が実際に支配的になった配送は従来どおり current を交代させる。レイアウトが測定不能（jsdom の全 rect 0）な場合は従来どおり配送の entries を信頼する"
given = "着地済み表示中パネル（120..720px・768px viewport）の下パネルが 720..768px のみ覗く状態で、下パネル単独の部分 IO 配送（ratio 0.08）を届ける / 表示中パネルが -400..200px にほぼ出て下パネルが 200..768px を占める状態で同様の配送（ratio 0.9）を届ける / 部分配送の無視後に feed-next を押す"
expect_return_shape = "覗きのみの配送では router.replace が呼ばれず URL は /receipts/101 のまま・feed-position も「1 / 3」のまま / feed-next 押下は receipt-panel-102 へ scrollIntoView し URL は /receipts/102（103 へスキップしない） / 支配的な配送では router.replace が1回呼ばれ URL は /receipts/102・feed-position は「2 / 3」"

