# ---------------------------------------------------------------------------
# TASK-10 Phase B（OAuth 2.1 認可サーバー・MCP Bearer 検証・ledger 切替・rate limit・運用者CLI残り）
# 正本は docs/spec/spec_auth.md §3-1・§4〜§7・§10、docs/spec/spec_mcp-tools.md §7-16〜7-18・§14。

[[condition]]
id = "auth-oauth.as-metadata-shape"
target_function = "auth::oauth::authorization_server_document / wk_authorization_server"
source = "docs/spec/spec_auth.md §4-1"
source_lines = "backend/tests/oauth_flow.rs:21"
description = "AS メタデータの全フィールドが仕様の固定値（endpoints、S256、private_key_jwt/none、client_id_metadata_document_supported、authorization_response_iss_parameter_supported）。registration_endpoint を載せない"
given = "GET /.well-known/oauth-authorization-server"
expect_return_shape = "issuer/authorization_endpoint/token_endpoint/revocation_endpoint が <issuer> 导出値、grant_types = [authorization_code, refresh_token]、code_challenge_methods = [S256]、auth methods = [private_key_jwt, none]、scopes = [ledger.read, ledger.write]、registration_endpoint キー無し"

[[condition]]
id = "auth-oauth.prm-metadata-shape"
target_function = "auth::oauth::protected_resource_document"
source = "docs/spec/spec_auth.md §4-1"
source_lines = "backend/tests/oauth_flow.rs:71"
description = "protected-resource メタデータが /mcp 付き・なし両パスで同内容、Cache-Control public max-age=3600。openid-configuration は 404"
given = "GET /.well-known/oauth-protected-resource と /mcp 付き、GET /.well-known/openid-configuration"
expect_return_shape = "resource = <issuer>/mcp、authorization_servers = [<issuer>]、bearer_methods = [header]、resource_name = budget-book、両者 max-age=3600、openid-configuration は 404"

[[condition]]
id = "auth-oauth.cimd-client-id-static-validation"
target_function = "auth::oauth::cimd::validate_client_id_url"
source = "docs/spec/spec_auth.md §4-3"
source_lines = "backend/src/auth/oauth/cimd.rs:439, backend/src/auth/oauth/cimd.rs:518"
description = "client_id URL の静的検証: https（dev フラグ時は loopback http も可）、allowlist host 完全一致、port/userinfo/query/fragment/dot segment/`//`/path=/ 拒否、再シリアライズ不一致拒否、512 文字上限"
given = "表形式の不正 URL 群と正当 URL"
expect_return = "不正は Err、正当（https://chatgpt.com/clients/abc 等）は Ok"

[[condition]]
id = "auth-oauth.cimd-document-validation"
target_function = "auth::oauth::cimd::validate_document"
source = "docs/spec/spec_auth.md §4-3"
source_lines = "backend/src/auth/oauth/cimd.rs:622, backend/src/auth/oauth/cimd.rs:686"
description = "CIMD 文書検証: client_id 完全一致、client_name 必須、redirect_uris 非空配列で全 https、token_endpoint_auth_method は none（省略可）/private_key_jwt、private_key_jwt は jwks_uri（host allowlist）か inline jwks 必須、client_secret* 系拒否"
given = "各不正文書と正当文書"
expect_return_shape = "不正は Unavailable エラー、正当は ClientRecord（auth_method・jwks_uri・redirect_uris が復元される）"

[[condition]]
id = "auth-oauth.cimd-fetch-cache"
target_function = "auth::oauth::cimd::get_client"
source = "docs/spec/spec_auth.md §4-3・§4-2"
source_lines = "backend/tests/oauth_token.rs:823"
description = "CIMD 取得は oauth_clients にキャッシュされ TTL 内は再取得しない（モックの fetch カウンタ）、If-None-Match で 304 のときはキャッシュを保持したまま期限を更新、期限切れで再取得"
given = "ローカルモック CIMD サーバ（Cache-Control max-age 指定）と期限切れに操作したキャッシュ行"
expect_return_shape = "TTL 内は fetch 回数増加なし、304 で文書保持、期限切れ後の get_client で再取得（fetch 回数 +1）"

[[condition]]
id = "auth-oauth.cimd-stale-if-error"
target_function = "auth::oauth::cimd::get_client"
source = "docs/spec/spec_auth.md §4-3"
source_lines = "backend/tests/oauth_token.rs:853"
description = "期限切れ後の取得失敗は expires_at から 24 時間まで旧文書（stale-if-error）、超過後は invalid_client（authorize では 400 エラー画面・redirect なし）"
given = "キャッシュ期限切れ + モック停止（または 500）。DB で expires_at を 25 時間前に操作したケース"
expect_return_shape = "24 時間以内は旧 ClientRecord、超過は ClientError::Unavailable"

[[condition]]
id = "auth-oauth.safe-fetch-rules"
target_function = "auth::oauth::net::FetchClient::fetch_json"
source = "docs/spec/spec_auth.md §4-3"
source_lines = "backend/tests/oauth_token.rs:889"
description = "safe_fetch: 3xx redirect は失敗、64KiB 超過ボディは失敗、private/loopback 宛は dev フラグなしでは接続拒否（URL host 判定）"
given = "リダイレクトを返すモック・巨大ボディを返すモック・private host URL"
expect_return_shape = "いずれも FetchError（Redirect / TooLarge / ForbiddenHost）、成功時は body と etag と max_age"

[[condition]]
id = "auth-oauth.cache-control-parsing"
target_function = "auth::oauth::net::parse_max_age / clamp_max_age"
source = "docs/spec/spec_auth.md §4-3"
source_lines = "backend/src/auth/oauth/net.rs:254"
description = "Cache-Control max-age の parse（no-store は None）と clamp(5分, 24時間)（無指定は 5分）"
given = "各 Cache-Control 文字列"
expect_return = "max-age=1200→1200、max-age=10→300、max-age=1000000→86400、no-store/無指定→300"

[[condition]]
id = "auth-oauth.private-ip-classification"
target_function = "auth::oauth::net::is_forbidden_ip / FetchClient::check_url"
source = "docs/spec/spec_auth.md §4-3"
source_lines = "backend/src/auth/oauth/net.rs:269, backend/src/auth/oauth/net.rs:300"
description = "private / loopback / link-local / CGNAT(100.64/10) / ULA(fc00::/7) / link-local IPv6、および IPv4-mapped IPv6（::ffff:a.b.c.d は IPv4 として再判定）を接続禁止と判定。dev フラグは loopback の http のみ許可"
given = "各 IP と URL"
expect_return_shape = "列挙アドレスは禁止、パブリックは許可。dev フラグで http://127.0.0.1 と http://localhost は許可、http://192.168.x は不許可"

[[condition]]
id = "auth-oauth.authorize-happy-path"
target_function = "auth::oauth::authorize::authorize_get"
source = "docs/spec/spec_auth.md §4-2・§11-3"
source_lines = "backend/tests/oauth_flow.rs:137"
description = "検証済みパラメータで oauth_authorization_requests に行を作り、ログイン済みなら 302 /oauth/consent?req=R、未ログインなら 302 /login?req=R"
given = "CIMD 登録済み client・正しい PKCE・resource・state での GET /oauth/authorize（session の有無）"
expect_return_shape = "Location が各遷移先、R は 43 文字の b64url、DB 行の client_id/scope/resource がパラメータどおり"

[[condition]]
id = "auth-oauth.authorize-invalid-client-no-redirect"
target_function = "auth::oauth::authorize::authorize_get"
source = "docs/spec/spec_auth.md §4-2・§10-4"
source_lines = "backend/tests/oauth_flow.rs:179"
description = "client_id 不正（allowlist 外・URL 不正・CIMD 取得不能）と redirect_uri 未登録は redirect せず 400 エラー画面"
