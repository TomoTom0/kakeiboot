source = "設計 tmp/tasks/tm-124/design_spa-url-routing.md v2 §3 D1（/search は現行維持: 期間 keys は scope=period のときのみ載せる。scope=all〔全期間検索〕では期間は結果に影響しないため載せない。labels は常時）・§3 D5 テスト計画 (g)。改訂 2026-11-02 TASK-145（TASK-124 レビューLOW-1）: 「載せない」を書き両面へ — run() carry 廃止（D1-1）と writeBack strip の対称化（D1-2: scope=all でも PERIOD_KEYS を next から delete し、replace 発行条件を「labels 差分あり、または現在の URL が next に無い PERIOD_KEY を持つ」へ拡張。設計レビューMED1: labels 不変ケースでも残留検出が必要）。TASK-174（設計 tmp/tasks/tm-174/design_url-history-entries.md v4 影響>条件書の改訂方針）: 既存責務を維持し回帰確認する（1操作1entry化・FIFO化でも本条件の期待値は不変）"
source_lines = "frontend/tests/unit/web/url-sync.test.ts:296, frontend/tests/unit/web/url-sync.test.ts:329, frontend/tests/unit/web/url-sync.test.ts:349"
description = "/search の URL への期間 keys の書き足し・書戻しは scope=period のときのみ。scope=all では store の期間がどうであれ period keys を URL に載せない（keys 無し流入の書戻しでも month/from/to は書かず、期間変更でも書かない）に加え、載ってしまった形を最初の writeBack 機会に落とす: (1) 他画面の検索 dialog 実行（run()）の carry は q のみで期間 keys を載せない（着地は keys 無し流入） (2) 期間 keys 付き流入（旧 bookmark・共有リンク由来の /search?month=... 直リンク）は URL の期間を取り込んだ上で、writeBack が PERIOD_KEYS を URL から落として正規形（?q=...+labels）へ replace する。この strip の replace は labels に差分がないケース（labels 未選択）でも発行する（差分ガードの比較は owned keys のみであり、delete しただけでは比較が一致して replace が抑止されるため、期間 keys の存在を発行条件に明示的に含む）。labels= は scope によらず常時同期される"
