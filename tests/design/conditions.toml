[[condition]]
id = "deploy-ops.promote-shell-execution"
target_function = "kakeiboot_ops.build_promote_commands step2-5（安全性を担う sh -c stepの実行時挙動）"
source = "tmp/tasks/tm-189/design_promote.md D-2・D-6〔コードレビュー指摘対応: 部分文字列一致のみではshell連鎖のfail-closedを検証できないため実行ベース検証を追加〕"
source_lines = "scripts/deploy/test_kakeiboot_ops.py:1556"
description = "promoteの安全性を担う sh -c step（プロセスsha256照合・sha256表示・旧成果物退避）を実際に実行してexit codeを検証する: 一時deploy layoutにスタブ systemctl（PATH先頭へ配置しMainPID相当を出力）と実sha256sum/cp/dateで (a) 退避step: 3対象（binary・bin/・frontend/）存在でrc 0かつreleases/<timestamp>/へ3対象がcopy済み・frontend不在などcopy失敗で非零・prod未配備でrc 0かつreleases/不作成 (b) 配置記録照合step: 記録は実 deploy_record_step で生成し（両側の計算が単独では drift しない形）・3成果物が記録と一致し stub systemctl の返す起動時刻が記録の service_start_epoch と同時刻でrc 0・記録不在で非零・binary/script/dist のいずれかの hash 不一致で非零・現在起動時刻が記録より前（稼働が記録より前の旧プロセス）で非零・stub systemctl が stdout 無しで失敗する場合と空出力で成功する場合も非零（空文字列の date parse で当日0時になり通過してしまう形でないこと） (c) sha256表示step: stg binary不在で非零・prod不在でrc 0かつ `prod: budget-book not deployed yet` 表示・両側存在でrc 0。後続step不実行の確認は run_commands の既存契約〔deploy-ops.dry-run-plan・promote-failure-report〕に任せstep単体の終了code検証とする"
given = "一時dirのdeploy layout（transport=local・deploy_root=tmp）でスタブsystemctlをPATH先頭に置いた環境での sh -c step実行"
expect_return_shape = "各stepのsubprocess実行が上記の期待exit code（成功0・各失敗系非零）と一致し・退避成功時はreleases/<timestamp>/配下に3対象が実在する"

[[condition]]
id = "deploy-ops.promote-dry-run-port-resolution"
