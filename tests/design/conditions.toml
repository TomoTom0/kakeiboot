source = "ユーザー実機指摘 2026-10-29 21:50 TASK-123（縁取りとか知らないんですか?）・設計 tmp/tasks/tm-123/design_breakdown-visual.md v5 §4-4（縁取り: 半透明 ink・各セグメント全周 1px・隣接境界は自線+相手線の計 2px・gap 廃止・border-box 内側消費で bar 外形不変・widget は 1 viewUnit×2・効能の実測〔線 vs 塗り worst 1.6:1・3:1 未満の受容運用〕）+ TASK-129（ランキング行bar・widget bar_h・ShareBar を適用系統へ追加・規則値は不変。ユーザー実機指摘 2026-10-30 13:22「支出の内訳の方は縁取りなどないままに見える」・設計 tmp/tasks/tm-129/design_ranked-row-bar.md v3 §4-2）"
source_lines = "frontend/tests/browser/verify.spec.ts:290, frontend/tests/browser/verify.spec.ts:516, frontend/tests/unit/web/styles.test.ts:850"
description = "積み上げ4系統（trend .bar-seg・daily .daily-seg・行内 bar .row-seg〔旧 .week-seg〕・widget bar_v セグメント）と TASK-129 追加系統（ランキング行bar〔.row-seg の単色1セグメント〕・widget bar_h・stacked_bar/ShareBar）の境界は各セグメント全周 1px（widget は stroke-width 2 viewUnit・中心線から±1unit）の縁取り var(--seg-outline) で担保する。縁取り色は半透明 ink（light rgb(0 0 0 / 0.4)・dark rgb(255 255 255 / 0.4)）で単一トークンを全塗りに一律適用する。隣接セグメント境界は自線 1px+相手線 1px の計 2px（widget 2 viewUnit）で線同士の重なりは無い。旧来の分離手段（web 1px var(--bb-surface) の border-top 境界線・widget SEG_GAP 1 unit 隙間・TASK-116 までの多停止 gradient）は廃止し gap は 0。web は * { box-sizing: border-box } により border は配分寸法の内側に消費され bar の外形は不変（外寸=配分寸法）・widget は rect 寸法=配分寸法−2 viewUnit で stroke 含む外寸=配分寸法（§4-4 境界幾何）。濃度 40% は実機（TASK-72 紐付け）で調整しうる基準値で、線 vs 塗りの contrast は 3:1 未満（worst 約 1.6:1）であることを受容運用とする（境界の視認は contrast と線の連続性の両方で担う）"
given = "trend 2セグメント棒・daily 記録日棒・ランキング行bar・週行 DOM bar（light）を 360px で実測 / dark へ切替 / styles.css と widget/style.css の内容"
expect_return_shape = "全 .bar-seg/.daily-seg/.row-seg の computed border が4辺とも 1px solid・色は light で黒40%（rgba(0,0,0,.4) 相当）・dark で白40% / セグメント外寸の合計が bar 外寸（.bar-stack/.daily-bar の高さ・.row-bar の長さ）を超えない（外形不変・border-box 内側消費） / styles.css・widget/style.css に light/dark 両方の --seg-outline 定義と .bar-seg/.daily-seg/.row-seg への border: 1px solid var(--seg-outline) 規則があり・.bar-seg + .bar-seg / .daily-seg + .daily-seg の border-top 規則は存在しない / widget bar_v・bar_h・stacked_bar の全セグメント（共通 renderer BarSegs の出力）に stroke=var(--seg-outline)・stroke-width=2 属性（vector-effect なし）"

