source = "ユーザー実機指摘 2026-11-03 TASK-161 指摘1「bug: 9月にfocusすると次の月に移動できなくなる」・指摘2「月を移動すると前後の月（の表示・導線）が消えるのはおかしい」・設計 tmp/tasks/tm-161/design_period_ui.md（v2）§1-1・§1-3・§1-4（指摘元実機指摘 2026-11-03・§0-2 の原因特定: 選択月=窓右端の再anchor+offset前提のcanNext）"
source_lines = "frontend/tests/browser/verify.spec.ts:2893, frontend/tests/unit/web/trend-window.test.ts:1680"
description = "trend窓は「focus変更で全resetする右端anchor+offset窓」でなく明示的な絶対範囲 {from,to} の窓である（offset・anchor概念は廃止。「窓の右端=選択月」はE2c/E3後の正規窓〔初期形状〕の規則としてのみ残る。yearの正規窓は選択年12か月）。イベント別仕様: E2a focus移動・新月が現在窓内 → 窓は一切動かない・fetchしない（highlight〔current〕のみ移動し隣接月barは消えない。page本体〔analysis・recent・週行〕の再取得は各pageのwatch(period.range)が従来通り行う）。E2c focus移動・窓外で距離k>span（URL直link・popover jump等） → slideなし・正規窓（右端=新月）へresetし§2のin-place語彙で入れ替わる（refetch中は旧窓が不透明のまま残る）。E3 mode/ledger切替 → 正規窓reset・cache/slide完全clear（現行通り）。E4 label変更 → 窓保持・条件付き再fetch。fetchが走るのは窓の[from,to]が変わった（E1/E2b/E2c）か条件が変わった（E4。keyOfは条件込みのため必ずfetch）場合のみ。cache clearはE3と明示refresh()のみ（E2/E4では保持。cacheは条件込みkeyなので別条件の結果が誤serveされない。label A→B→A往復は同期commit）。lastDone idempotency guard（同一key再fetch抑止）不変。step +1（E2b k=1）で窓も+1移動するため前月は窓内に残る（span≥2）。stepで窓の反対端の月が窓外へ出るのは窓幅の制約として自然（chevronで戻れる）"
given = "composable を月モード（選択月 2026-10・正規窓 2026-05-01..2026-10-31 コミット確定後）で初期化し setMonth('2026-09')（窓内）→ setMonth('2027-06')（窓外・k>span）→ mode切替（year）→ label変更して戻す / browser では 9月bar押下後の 10月bar 存在を実測"
expect_return_shape = "setMonth('2026-09') 後も windowKey='2026-05-01..2026-10-31' 不変・表示fetch再発行なし・bar-2026-05〜10 の6本が描かれたまま（9月focusで10月barが消えない・currentのみ移動）/ setMonth('2027-06') で windowKey='2027-01-01..2027-06-30'（正規窓・右端=新月）へ・slide は組まれない（in-place 差替え・refetch 中は旧窓がそのまま）/ mode切替で cache clear・正規窓再fetch / label変更は窓不変・条件違い fetch、復帰は cache hit で同期commit / page 本体（analysis・recent・週行）は各pageの watch(period.range) が E2a でも従来どおり再取得する（再fetchしないのはtrend窓自身の表示fetchのみ）"

