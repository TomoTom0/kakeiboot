source_lines = "frontend/tests/unit/web/browsing-navigation.test.ts:36, frontend/tests/unit/web/url-sync.test.ts:795, frontend/tests/unit/web/url-sync.test.ts:813, frontend/tests/unit/web/url-sync.test.ts:840, frontend/tests/unit/web/url-sync.test.ts:880, frontend/tests/unit/web/url-sync.test.ts:926, frontend/tests/unit/web/url-sync.test.ts:1170, frontend/tests/unit/web/url-sync.test.ts:1196"
description = "system書き込み（keys-less補完・import正規化・reset・labels・Receipts filter・Search tab/q・TopbarFilterBar検索確定・Stores店カテゴリ・Axis chip削除・scope切替）は期間pushと同じ単一FIFOを通り、pending期間push中に発行されても先行pushをcancelせず順番どおり後続のsystem replaceとして確定する。受付順が守られ、非所有queryは維持され、entry数は期間pushの数だけ増える。resetはuser push群の後に現在entryをデフォルト期間へ置換する（user B→user C→resetならB/Cのpush成功後にCのentryを置換・backでBへ戻る）。scope切替は順序付き境界要素として先行期間操作を完了してからscopeをreplaceし、allへの切替受付後はreplace確定前でも期間user操作を誤受理しない。periodへの再切替受付後は確定前から期間user操作を受理する。pending期間push中の①TopbarFilterBarのSearch検索確定②Storesの店カテゴリ設定/解除③Axisのcategory/store_id/store_category chip削除④SearchのEnter確定⑤Searchのdebounce確定は先行pushがcancelされずpatchだけが後続replaceされる。両検索writer（topbar dialog・Search入力）の連続確定は受付順となる"
given = "guard で期間pushを保留した状態で各system操作（labels選択・home再押下reset・/receipts の支払filter適用・/search のtab切替・/stores の店カテゴリ設定/解除・/axes のcategory/store_id/store_category chip削除・検索語確定×3経路〔topbar dialog・Enter・debounce〕・scope切替）を与えてから解放する"
expect_return_shape = "先行pushはcancelされず成功確定し system replace が後続する（履歴entryは期間pushの数だけ追加・system replaceは現在entryを置換しentry数を増やさない） / 非所有query（payment_method・store_category・store_id・q・tab）と labels は維持 / Receiptsの導出from/toは適用時の期間から算出される / reset は user push 群の後に現在entryをデフォルト期間へ置換（backで直前のuser期間へ戻れる） / scope=all 切替受付後かつreplace確定前の期間操作もentryを作らない / 検索語の連続確定は受付順（後着の確定語が最終URL）"

