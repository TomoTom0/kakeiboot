source = "docs/spec/spec_mcp-tools.md §3-4（_meta は widget 専用チャネル: グラフ描画用の追加データ）・§10（グラフ描画用の追加データは _meta に置く）+ TASK-116・設計 tmp/tasks/tm-116/design_breakdown-expansion.md §3-3-1"
