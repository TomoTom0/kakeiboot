item = "TASK-161 のうち条件化しない項目: (1) micro move距離（約16-24px・150ms）・tween（rAF約300ms）・crossfade（150ms）等の期間内変化語彙の数値 (2) §7の太さ12px・gap 4px・角半径2pxが「gridline交点・bar内文字の視認」「行の主従逆転なし」を満たすかの実機視認と3段階簡約判断（§8実機確認条件①〜⑥） (3) §4狭幅wrapの視認（週/range label・長額面）と「総額」語の要不要 (4) E2b実装の複雑度が想定超過となった場合の代替案(v)（E2bもE2c reset+in-placeへ格下げ）への格下げ判断（実装時判断・§1代替案）"
source = "ユーザー実機指摘 2026-11-03 TASK-161 指摘3/7/8/9・設計 tmp/tasks/tm-161/design_period_ui.md（v2）§1代替案(v)・§2-2・§5・§7（作業仮説の明記）・§8実機確認条件①〜⑥"
reason = "(1) は既存の視覚文法数値除外（slide 220ms 等）と同趣旨で、発火条件・語彙の種別（micro move・tween・crossfade）は web-common.period-move-voice が、bar transition は web-common.row-bar-thickness が条件化し数値は対象外。(2)(3) は TASK-72 紐付けの実機確認帰属（数値は作業仮説と明記されているため実機確認後に確定値となる）。(4) は実装時判断の reserved 代替案で、格下げ時は web-home.trend-window-min-slide の条件が E2c（web-home.trend-window-absolute）契約へ置き換わる（条件書への明記は実装時に実施）"
decided_at = "2026-11-03"
