description = "bar の長さ基準は表現ごとの list 内 max 比（現行の混在）でなく、適用単位（web=画面・widget=報告）で共有する絶対scaleへ統一する: (1) scale 値は集約対象の max を nice 1/2/5 段階へ切り上げた共通純関数 barScale(maxValue)（niceMax と同値の段階値・shared/lib が単一管理元。headroom は切り上げ幅に内包し追加倍率を置かない）で1つ定める (2) 集約対象は各 bar の外形を決める金額（=各表現が満長に写像しうる最大金額。行ごとの value でなく bar 全体の量）— ランキング行bar・widget bar_h=各行 value の max・Home 週行=各週合計の max・積み上げ縦棒=各 bucket の合計（系列値の max ではない）・widget stacked_bar=rows の総和（bar 全長=合計額で決まるため行 max の集約では全長が scale を超過する）— の全体 max（期間の混在〔縦棒の6か月窓と選択月のランキング等〕はそのまま載る。報告単位〔widget〕の集約には報告の代表額〔envelope の totals.value〕も max に参加し scale の下限となる — フィルタ済み section や fold 後の rows 総和が代表額を下回る構成でも bar が報告全体の金額感の尺度で描かれるため。REVIEW-6 指摘1対応で正本に追記）(3) bar 長は常に 金額/scale×可用寸法 の直接写像（規則E の JS 明示計算・formatYen でない生の value を使う。share は bar 計算に一切使わない — 絶対scale化で share 丸め・「ほか」行 share 欠落・limit 超過・分母混在の4問題が構造解消し ranked-share の % は表示専用） (4) 保証するのは同一尺度での一致（どの bar も bar長/そのbarの可用寸法=value/scale で描かれる）で物理実寸の一致は保証しない（横 track と縦 plot で可用寸法が本質的に異なるため。実寸一致は同じ可用寸法を持つ表現間〔同画面のランキング行barと週行bar〕でのみ従属性質として成り立つ。test の期待値も比率一致で書き実寸一致を要求しない） (5) value=0 の bar は描かず・value>0 で bar 外寸が最小寸法 3px 未満になる場合は規則F（web-common.stack-dimension-rules）(6) 期間一貫性の限界: nice段階を跨ぐ期間比較では scale が変わる（精度の段階切り替えであり同一画面内の比較は常に正確）"
given = "barScale 単体: 948・999・1000（段階値）・1001・340000・0・負・非有限 / Home 月モード（mock 948円月・内訳 食費550+日用品398・週合計 max 948・画面scale=barScale(948)=1000）で内訳行bar と週行bar の長さ / reseed（内訳 食費1600・週 798/1200・画面scale=barScale(1600)=2000）でも / Categories ranking（日用品698・食費550・画面scale=1000）/ widget monthly_overview（bar_h max 30000・bar_v bucket合計 max 52000・報告scale=barScale(52000)=100000）・by_category（stacked_bar・rows総和 52000・報告scale=100000）"
expect_return_shape = "barScale(948)=1000・barScale(999)=1000・barScale(1000)=1000・barScale(1001)=2000・barScale(340000)=500000・barScale(0)=1（負・非有限も 1・niceMax と全定義域で同値）/ Home: 内訳 食費行の bar長/track=0.55・日用品=0.398・948円週の bar長/track=0.948（同一scale 1000・max 週でも全長でない）・同画面の行bar 同士は 金額比=長さ比（track 幅が同一なら同一金額=同一長さ）/ reseed: 798円週=0.399・1200円週=0.6・食費1600行=0.8 / Categories: 日用品行=0.698・食費行=0.55（画面ごとに集約 max が違う） / widget: bar_h 先頭行 幅/可用幅=30000/100000=0.3・top_stores 先頭=22000/100000=0.22・stacked_bar 全長/可用幅=52000/100000=0.52"

