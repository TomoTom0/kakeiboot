source = "docs/spec/spec_mcp-tools.md §12（catalog は frontend で ledger ごとに getCatalog(l, false) をキャッシュ〔同一 ledger は1回のみ〕。ledger 切替と /settings 配下からの退出で破棄〔管理画面でカテゴリ・店を変更しうるため〕。MCP 由来変更の stale は invalidate() で対応〔TASK-74〕）"
source_lines = "frontend/tests/unit/web/catalog-store.test.ts:40, frontend/tests/unit/web/catalog-store.test.ts:61, frontend/tests/unit/web/catalog-store.test.ts:76, frontend/tests/unit/web/catalog-store.test.ts:102, frontend/tests/unit/web/catalog-store.test.ts:125"
description = "catalog store（pinia）は ledger ごとに getCatalog(ledgerId, false)（アーカイブ済みを含まない）の結果をキャッシュし、item / store 両 kind のツリー探索 API（nodeById・pathOf〔親の名前を / で連結〕・resolve〔パス→node〕・parentIdOf・childrenOf）を同期で提供する。キャッシュは selectedLedgerId の変化・/settings 配下からの退出（router.afterEach で from が /settings 始点かつ to がそうでないとき）・invalidate() の手動呼出で破棄され、次アクセスで再取得される（同一 ledger への連続アクセスは1回の取得で済む）。invalidate() は進行中の load promise（loading Map）も破棄する——invalidate 後に解決した promise が取得データをキャッシュへ復活させ、続く load() がそれを待って pre-invalidate の Catalog を採用するのを防ぐ（invalidate 後の load は必ず新しい取得を始める）。archived なノードは includeArchived=false で読むため結果に含まれない。MCP 側で rename/move が行われた直後の stale は検知しない（許容）"
given = "mock catalog（item: 食費>食料品/外食・日用品・archived な 趣味・store: スーパー等）で選択 ledger を読み込み各種検索 / selectedLedgerId 切替 / /settings/categories → /categories 遷移 / invalidate() 後の再アクセス / getCatalog を遅延させ load() 進行中に invalidate() を呼ぶ"
expect_return_shape = "nodeById('item', 食料品id) が食料品 node・pathOf('item', 食料品id) が「食費/食料品」・pathOf('item', 食費id) が「食費」・parentIdOf('item', 食料品id) が食費id・childrenOf('item', 食費id) が食料品/外食の2件 / resolve('item', '食費/外食') が外食 node・resolve('item', '存在しない') が null・nodeById の未知 id が null / archived な 趣味 は nodeById・resolve いずれにも出ない / getCatalog は同一 ledger で1回のみ（2回目のアクセスで再取得されない） / ledger 切替・settings 退出・invalidate() のいずれかの後のアクセスで getCatalog が再度呼ばれる / 進行中 load への invalidate() 直後の load() は新しい getCatalog を始める（古い promise を待たない・採用しない）"

