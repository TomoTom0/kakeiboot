source = "TASK-14（ユーザー指摘: home と settings の混同、タブがアイコンでない、サイドバーが無い）・TASK-16 設計 tmp/tasks/tm-16/design_ui-feedback.md 項目6 実装設計（NAV はデータ4節、設定・接続中のアプリは右上メニュー、pageTitle は SECTION_TITLES）・項目4 topbar の表示規則（ホームでは title 省略）・TASK-27 設計 tmp/tasks/tm-27/design_shell.md §3-3（sidebar 見出しの brand リンクを削除し sidebar はナビ + 利用者表示のみ）・TASK-35 設計 tmp/tasks/tm-35/design_title-icon.md §2-1〜2-2（SECTION_TITLES を {title, icon} に拡張し NAV と一本化、表題テキストの左に該当節の AppIcon を併記）（docs/spec_mcp-tools.md §12 へ反映）"
source_lines = "frontend/tests/unit/web/dashboard-shell.test.ts:226"
description = "ログイン後の画面はアイコン付きサイドバーとアイコン付き下部タブを持ち、どちらもデータの4節（ホーム・レシート・カテゴリ・店）だけを並べ（設定・接続中のアプリは無い）、現在の節を active 表示する。sidebar に brand 見出し（ロゴのリンク）は置かずナビと利用者表示のみ。下部タブの列数は --tab-count=4。topbar の page title は NAV に依存せず SECTION_TITLES の {title, icon} から引き、表題テキスト（.topbar-title-text）の左に該当節の AppIcon（20px・aria-hidden・テキストと同色）を併記し、ホームでは表題自体を省略する。アカウント設定は /settings でホームとは別画面で、右上メニューの設定項目に aria-current=page が付く。レシート詳細はレシート節"
given = "/ を開き、/settings、/receipts/101 へ遷移"
expect_return_shape = "サイドバー・下部タブとも nav 項目はホーム・レシート・カテゴリ・店の4件で各 svg アイコン・nav-settings / nav-apps は存在しない・sidebar に brand リンク（sidebar-head）が存在しない・tabbar の style に --tab-count: 4・ホーム active・topbar に page title なし（svg も無い） / 設定画面（settings-nav）が表示されアカウント番号は無くダッシュボードも無い・トップバー表題「設定」・表題内に svg（aria-hidden=\"true\"） / 右上メニューの設定項目に aria-current=\"page\" / レシート active・表題「レシート」・表題内に svg（aria-hidden=\"true\"）"

[[condition]]
id = "web-shell.menus"
target_function = "web/App.vue（topbar の menu ボタンによる drawer 開閉・scrim・inert・右上アカウントメニュー（PopoverMenu）・LedgerSwitcher の配置）"
source = "TASK-14（ユーザー指摘: メニューボタンが無い）・docs/spec_auth.md §3（ログアウト）・TASK-16 設計 tmp/tasks/tm-16/design_ui-feedback.md 項目2 実装設計（menu-btn を topbar の最初の子）・項目6 実装設計（右上メニューは aria-haspopup=menu、設定 → 接続中のアプリ → ログアウト）・項目3（ledger-select を LedgerSwitcher に置換）・TASK-27 設計 tmp/tasks/tm-27/design_shell.md §3-3 実装設計（menu ボタンは常に見え同じ位置のクリックで開閉・aria-expanded・aria-label とアイコンの切替・開くと現在節のリンクへフォーカス・閉じる手段（再押下・Escape・scrim・遷移）で menu ボタンへフォーカス・scrim も closeDrawer に一本化・開いている間 main-col / tabbar が inert・sidebar 見出しの drawer-close を削除。実機指摘改訂〔TASK-33 追加指摘〕で menu ボタンは全幅で常時表示し desktop では sidebar 列の折りたたしに使う）・decisions_user.md（menuボタンは常に見え、同位置クリックで閉じる）・TASK-37 設計 tmp/tasks/tm-37/design_usage.md 導線1（アカウントメニューに「使い方」を追加。設定 → 接続中のアプリ → 使い方 → ログアウト）（docs/spec_mcp-tools.md §12 へ反映）"
source_lines = "frontend/tests/unit/web/dashboard-shell.test.ts:278"
description = "左上の menu ボタン（topbar の最初の要素・押すたびに開閉・全幅で常時表示。desktop では同じ overlay の開閉で詳細は web-shell.sidebar-overlay / web-shell.menu-btn-always-visible / web-shell.nav-open-state-on-resize）でドロワーを開閉する。開くと aria-expanded=true・aria-label「メニューを閉じる」・アイコン close になり、現在節のリンク（.side-link.active、無ければ先頭）へフォーカスする。開いている間 .main-col と .tabbar が inert になり topbar は inert にならない。閉じるのはボタン再押下・Escape・scrim クリック・別ルートへの遷移で、閉じると aria-expanded=false・aria-label「メニューを開く」・アイコン menu に戻り menu ボタンへフォーカスが戻る。ボタンは aria-controls=app-sidebar を持ち、sidebar 内に drawer-close は存在しない。右上のアバターボタンは aria-haspopup=menu を持ち、アカウントメニューに表示名と、項目 設定・接続中のアプリ・使い方・ログアウト（この順）がある（アカウント番号は web UI 非表示〔TASK-38 実機再々指摘〕）。ログアウトで POST /api/auth/logout 後ログイン画面へ（ログアウトはこのメニューのみ。設定画面には置かない）。家計簿切替は select でなく LedgerSwitcher（ledger-switch）で、ledger-select は存在しない"
given = "menu ボタン押下（現在節レシートで .side-link.active あり / active なし） → Escape → 再度押下 → scrim クリック → /stores へ遷移、アカウントボタン押下 → ログアウト"
expect_return_shape = "menu-button が header.topbar の最初の子で aria-controls=\"app-sidebar\" / 押下で drawer-open・aria-expanded=true・aria-label「メニューを閉じる」・フォーカスが active な side-link（active が無ければ先頭の side-link）/ 開いている間 .main-col と .tabbar に inert・header.topbar に inert なし・drawer-close 要素は存在しない / Escape・scrim クリック・遷移・再押下のいずれでも閉じ、閉じたら aria-expanded=false・aria-label「メニューを開く」・menu-button へフォーカス / アカウントボタンに aria-haspopup=\"menu\"・メニュー項目が 設定・接続中のアプリ・使い方・ログアウト の順・表示名表示（アカウント番号は含まない）・logout 1回・/login へ / ledger-select なし・ledger-switch あり"

