description = "共有 URL からログインへ回った user はログイン後に /share へ戻り、ログイン自体では参加しない"
given = "sessionStorage に kb_share_token がある状態でログインが成功する（req は無い）"
expect_return_shape = "route が '/share' になり参加ボタンが表示され、share/info は body {token} で呼ばれる。share/accept は呼ばれない"

[[condition]]
id = "web-login.share-return-req-wins"
target_function = "web/pages/LoginPage.vue"
source = "docs/spec/spec_auth.md §2-4（完了時は {next: consent} のみ返し、frontend が保持している平文 req で /oauth/consent?req=R へ遷移）・§2-1A（kb_share_token の退避）"
source_lines = "frontend/tests/unit/web/auth-pages.test.ts:114"
description = "OAuth の req 往復がある場合は kb_share_token による /share への復帰より同意画面への遷移が優先する"
given = "sessionStorage に kb_share_token があり、/login?req=R でログインし login/finish が {next: 'consent'} を返す"
expect_return = "'/oauth/consent?req=R' へ遷移し、'/share' へは戻らない"

[[condition]]
id = "web-register.invite-no-default-choice"
target_function = "web/pages/RegisterPage.vue"
source = "docs/spec/spec_auth.md §2-1（invite で登録した user も個人 ledger を持ち、default_ledger_id は常に個人 ledger とする。登録画面に既定の選択肢は置かず、register/finish の use_invited_ledger_as_default は互換のため受理するがサーバーは無視する〔2-1A の分離に伴う変更〕）・§2-1A（旧形式 invite の受理は移行期間のみ）・§3-2 POST /api/webauthn/register/info・register/finish"
source_lines = "frontend/tests/unit/web/auth-pages.test.ts:208"
description = "invite の登録画面は招待元家計簿を示すが既定化の選択肢は置かず、finish にも送らない。share_migrated の invite では登録済み者向けに新しい共有 URL の依頼を案内する"
given = "info が {kind: 'invite', needs_display_name: true, ledger_name: '家族', role: 'editor', share_migrated: true} で登録画面を開き、表示名を入れて送信する"
expect_return_shape = "招待元家計簿名と role（編集）が表示され、既定化のチェックボックスは画面のどこにも無い。share-migrated の案内（新しい共有 URL を依頼する旨）が出る。finish の body は {credential} のみで use_invited_ledger_as_default を含まない"

[[condition]]
id = "web-register.invite-no-migrated-note"
target_function = "web/pages/RegisterPage.vue"
source = "docs/spec/spec_auth.md §2-1A（互換: 旧形式 invite の受理は移行期間のみ。share_migrated は移行対象の invite にだけ立つ）・§3-2 POST /api/webauthn/register/info"
source_lines = "frontend/tests/unit/web/auth-pages.test.ts:233"
description = "share_migrated でない invite には移行導線を出さない"
given = "info が {kind: 'invite', needs_display_name: true, ledger_name: '家族', role: 'viewer'}（share_migrated 無し）で登録画面を開く"
expect_return_shape = "invite-info は表示されるが、share-migrated の案内は表示されない"

[[condition]]
id = "web-settings.register-invite-no-share"
target_function = "web/pages/settings/RegisterInvitePanel.vue（認証tab /settings/auth 内のカード）"
source = "docs/spec/spec_auth.md §2-1（register は新規 user と個人 ledger の作成で、家計簿への参加を伴わない）・docs/usage/usage_share-ledger.md（登録の招待では相手専用の家計簿が作られ、発行者の家計簿は見えない）"
source_lines = "frontend/tests/unit/web/account-pages.test.ts:538"
description = "登録の招待カードは家計簿を共有しない旨を示し、共有カードと混同させない"
given = "'/settings/auth' の登録の招待カードを表示する"
expect_return_shape = "カードに「家計簿は共有されません」旨が表示される"

[[condition]]
id = "web-settings.share-tickets-list"
target_function = "web/pages/settings/InvitePanel.vue（認証tab /settings/auth 内の共有カードの open チケット一覧）"
source = "docs/spec/spec_auth.md §2-1A（一覧・失効: 発行者は自分の未受諾チケットを一覧でき、ticket_ref で失効できる。平文 URL は発行時にしか表示されない）・§3-2 GET /api/share-tickets・DELETE /api/share-tickets/{ticket_ref}・docs/usage/usage_share-ledger.md（発行した URL は一覧に残るが URL 自体は表示されず、一覧から取り消せる）"
source_lines = "frontend/tests/unit/web/account-pages.test.ts:496"
description = "共有カードの open チケット一覧は平文 URL を再表示せず、失効は行内の確認を経て DELETE が成功した後に行が消える"
given = "GET /api/share-tickets が open チケット1件（ticket_ref・ledger_name・role: 'viewer'・inviter_note・created_at・expires_at）を返し、失効の icon button を押して行内確認を確定する"
expect_return_shape = "一覧に「再表示できません」旨と行のメモ・家計簿名・権限（閲覧のみ）・作成と期限の JST 日時が表示され、token= は含まれない。失効 button は icon-only（aria-label に「失効」）で、押下直後は確認文が出るだけで DELETE は呼ばれず、確認の確定で DELETE /api/share-tickets/{ticket_ref} が1回呼ばれ、成功後に行と一覧が消える"

[[condition]]
id = "web-share.accept-already-member"
target_function = "web/pages/ShareAcceptPage.vue"
source = "docs/spec/spec_auth.md §2-1A（既に自分が受諾済みのチケットの再送は already_member として冪等に成功する）・§3-2 POST /api/share/accept（outcome は joined / already_member）"
source_lines = "frontend/tests/unit/web/auth-pages.test.ts:360"
description = "accept が already_member を返した場合は既参加の完了表示にする"
given = "share/info が成功した状態で参加ボタンを押し、accept が {ledger: {id: 3, name: '家族', role: 'editor'}, outcome: 'already_member'} を返す"
expect_return_shape = "「追加済みです」の完了表示が出て、kb_share_token は削除される"

[[condition]]
id = "web-share.accept-invalid"
target_function = "web/pages/ShareAcceptPage.vue"
source = "docs/spec/spec_auth.md §2-1A（受諾時点でも不存在・期限切れ・受諾済みは同一視して invalid_token）・§3-2 POST /api/share/accept"
source_lines = "frontend/tests/unit/web/auth-pages.test.ts:397"
description = "info 成功後に accept の時点で invalid_token になった場合は無効表示へ切り替える"
given = "share/info が成功した状態で参加ボタンを押し、accept が 400 {error: 'invalid_token'} を返す"
expect_return_shape = "無効（invalid）の表示へ切り替わる"

[[condition]]
id = "web-share.info-already-member"
target_function = "web/pages/ShareAcceptPage.vue"
source = "docs/spec/spec_auth.md §2-1A（照会はセッションがある場合は所属済みかを返す）・§3-2 POST /api/share/info（already_member）"
source_lines = "frontend/tests/unit/web/auth-pages.test.ts:373"
description = "info の時点で所属済みなら参加ボタンを出さず既参加であることを示す"
given = "share/info が already_member: true を返す"
expect_return_shape = "「既にこの家計簿に参加しています」が表示され、参加ボタンは無い"

[[condition]]
id = "web-share.invalid-token"
target_function = "web/pages/ShareAcceptPage.vue"
source = "docs/spec/spec_auth.md §2-1A（照会: 不存在・期限切れ・受諾済みは同一視して 400 invalid_token）・§3-2 POST /api/share/info（それ以外は一律 400 invalid_token）"
source_lines = "frontend/tests/unit/web/auth-pages.test.ts:326"
description = "info の invalid_token では理由を区別せず、一文の無効表示のみを出す"
given = "share/info が 400 {error: 'invalid_token'} を返す token で '/share' を開く"
expect_return_shape = "「共有 URL が無効か、期限切れか、使用済みです。」の一文のみが表示され、再発行の依頼や開き直しの案内は無く、参加ボタンも無い"

[[condition]]
id = "web-share.join-flow"
target_function = "web/pages/ShareAcceptPage.vue"
source = "docs/spec/spec_auth.md §2-1A（照会は家計簿名・role・発行者表示名・期限と session の表示名を返す。受諾は本人が「参加する」を押したときにだけ消費し所属を付与する。受諾画面の提示は招待文→家計簿名→できること→ボタン→期限の優先順で、期限は日付のみ小さく出す）・§3-2 POST /api/share/info・POST /api/share/accept・GET /api/auth/me"
source_lines = "frontend/tests/unit/web/auth-pages.test.ts:336"
description = "ログイン済みの受諾画面は招待文・家計簿名・できること・参加先の本人を優先順に示し（期限は最下部に日付のみ小さく）、参加ボタンで accept して完了表示になり、退避した token を消して所属を再取得する"
given = "session 付きの share/info が {ledger_name: '家族', role: 'editor', issuer_display_name: '太郎', expires_at, session: {display_name: '花子'}, already_member: false} を返し、参加ボタンを押して accept が {ledger: {id: 3, name: '家族', role: 'editor'}, outcome: 'joined'} を返す"
expect_return_shape = "見出しは招待文「太郎 さんが家計簿を共有しました」で、家計簿はマーク付きのパネルとして出て（名前「家族」）、権限は項目表ではなく家計簿マークに重ねたバッジ「編集」で示され、アカウントバーに「花子」がアバター付きで表示され、期限は最下部に「2026/10/24 まで有効」と日付のみ（時刻なし）小さく静かに右揃えで出る。accept の body は {token} で、完了表示「家計簿『家族』を追加しました」とホームへの導線が出て、kb_share_token は削除され、GET /api/auth/me が1回再取得される"

[[condition]]
id = "web-share.needs-login"
target_function = "web/pages/ShareAcceptPage.vue"
source = "docs/spec/spec_auth.md §2-1A（受諾は web セッション必須。対象者は登録済み user のみとし、未登録者向けに共有 URL から登録へ橋渡しする経路は持たない。受諾画面に登録への言及は置かず、アカウントを持たない受領者を画面から登録へ誘導しない。チケットは消費しない）・§3-2 POST /api/share/info（session があれば付加情報を返す）"
source_lines = "frontend/tests/unit/web/auth-pages.test.ts:380"
description = "未ログインでは招待文と家計簿を示し、ログインと無効状態の追加ボタンを固定配置で出し、登録への言及は置かず、チケットは消費しない"
given = "share/info が session: null を返し、ログイン導線を押す"
expect_return_shape = "見出しは招待文「太郎 さんが家計簿を共有しました」で、家計簿名が表示され、有効な追加ボタンは無く、第1段にログイン操作を兼ねるアカウントバー、第2段に無効状態の「この家計簿を追加する」が固定配置で出る。登録の招待やアカウントを持たない場合への言及は画面に出ない。ログイン押下で '/login' へ遷移し、share/accept は呼ばれず、kb_share_token は保持される"

[[condition]]
id = "web-share.no-token"
target_function = "web/pages/ShareAcceptPage.vue"
source = "docs/spec/spec_auth.md §2-1A（開封・照会では消費しないため、タブを閉じた場合は元の URL から開き直せる）・§3-2 POST /api/share/info"
source_lines = "frontend/tests/unit/web/auth-pages.test.ts:319"
description = "token が無い場合は info を呼ばず、元の共有 URL からの開き直しを案内する"
given = "query にも sessionStorage にも token が無い状態で '/share' を開く"
expect_return_shape = "「元の共有 URL から開き直してください」の案内が表示され、share/info は呼ばれない"

[[condition]]
id = "web-share.token-restored"
target_function = "web/pages/ShareAcceptPage.vue"
source = "docs/spec/spec_auth.md §2-1A（frontend は token を同一タブの sessionStorage〔kb_share_token〕へ退避し、以降は POST body で送る）・§3-2 POST /api/share/info"
source_lines = "frontend/tests/unit/web/auth-pages.test.ts:311"
description = "query に token が無ければ sessionStorage に退避した token で受諾画面を再開する"
given = "sessionStorage の kb_share_token に 'T2' がある状態で '/share'（query 無し）を開く"
expect_return_shape = "share/info の body が {token: 'T2'} で呼ばれ、share-info が表示される"

[[condition]]
id = "web-share.token-stashed-and-removed"
target_function = "web/pages/ShareAcceptPage.vue"
source = "docs/spec/spec_auth.md §2-1A（URL は https://<host>/share?token=<T>。frontend は token を同一タブの sessionStorage〔kb_share_token〕へ退避してから URL から消し、以降は POST body で送る）・§3-2 POST /api/share/info"
source_lines = "frontend/tests/unit/web/auth-pages.test.ts:302"
description = "共有 URL の token は開いた直後に sessionStorage へ退避して URL から消し、info には body で送る"
given = "'/share?token=T' を開く"
expect_return_shape = "route が '/share' で query に token が無く、sessionStorage の kb_share_token が 'T' になり、share/info の body が {token: 'T'}"

[[excluded]]
item = "invite 登録画面で招待元 ledger を既定にする選択（旧条件 web-register.invite-default-ledger-choice）"
source = "docs/spec/spec_auth.md §2-1（2-1A の分離に伴い登録画面に既定の選択肢は置かず、default_ledger_id は常に個人 ledger とする）"
reason = "仕様変更で振る舞い自体が廃止されたため旧条件を削除した。現行の期待（既定化の選択肢が無く finish にも送らない）は web-register.invite-no-default-choice が条件化する"
decided_at = "2026-11-21"
decided_by = "claude"

