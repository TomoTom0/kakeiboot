[[condition]]
id = "share-tickets.info-never-consumes-and-accept-grants-membership-only"
target_function = "auth::api::share_info / share_accept（auth::share_ticket::accept）"
source = "docs/spec/spec_auth.md §2-1A（照会はチケットを消費しない・受諾は web セッション必須で未ログインは 401 かつ消費しない・消費点は受諾の1か所だけ・同じ tx で所属付与と audit〔entity_type=share_ticket・action=share_accept〕・受諾済みチケットの受諾者自身の再送は already_member として冪等・受諾は user を作らず default_ledger_id を変更しない）・§3-2 POST /api/share/info・POST /api/share/accept・docs/spec/spec_data-model.md §14（ledger_share_tickets はアカウントを作らない。消費は accepted_at の条件付き UPDATE のみ）"
source_lines = "backend/tests/share_tickets.rs:116"
description = "share/info は認証任意で繰り返し照会でき消費せず、share/accept はログインした本人だけが所属付与を受け、受諾は membership の付与のみで user 作成・既定家計簿の変更を伴わない"
given = "owner が editor の参加チケットを発行し、未所属の登録済み user が匿名 info を2回・session 付き info・未ログイン accept・ログイン accept・受諾後の info・受諾者自身の再 accept を行う"
expect_return_shape = "info は繰り返し 200 {role: 'editor', issuer_display_name, ledger_name, session（匿名は null・session 付きは表示名）, already_member: false} で消費しない。未ログイン accept は 401 でチケットは open のまま。ログイン accept は 200 {outcome: 'joined', ledger: {id, role: 'editor'}} で ledger_members は1行のみ増え users 数と default_ledger_id は不変で share_accept の audit がある。受諾後の info は 400 invalid_token、受諾者自身の再送は 200 already_member で所属行は1行のまま"

