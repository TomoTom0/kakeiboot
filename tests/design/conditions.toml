item = "admin backup の実行を audit_events（DB 監査表）に記録しないこと"
source = "tmp/tasks/tm-83/design_backup-automation.md v4 §4-5（audit 不記録の設計判断）"
reason = "操作主体が運用者で日次の noise になるため記録しない旨の設計判断（journal・last_success で足りる）であり、記録する実装経路が存在しないため検証対象の分岐がない。既存 auth-cli.audits-system-actions は token 発行・破壊操作の記録を検証するもので backup はその対象外"
decided_at = "2026-10-24"
decided_by = "claude"

[[excluded]]
item = "admin backup の --dest 省略時の引数エラー"
source = "tmp/tasks/tm-83/design_backup-automation.md v4 §4-5（budget-book admin backup --dest <file>）"
reason = "clap の required arg 検証で framework 保証済み（§8「書かない」の型システムで保証済みの分岐に相当）。--dest 指定時の解釈（flat variant Backup { dest } としての受け取り）は auth-cli.backup-snapshot の given・description が担う"
decided_at = "2026-10-24"
decided_by = "claude"

[[excluded]]
item = "§4-1 同一時点性の暗黙前提「画像 file 保存が DB insert より前」の新規条件化（設計§7: backend画像保存実装の順序確認を実装タスクの検証条件に含める）"
source = "tmp/tasks/tm-83/design_backup-automation.md v4 §4-1・§7（REVIEW-15 未判明事項→検証条件化として解消）"
reason = "同一の不変条件を既存条件が検証済み: mcp-draft-batch.store-failure-outcome は保存失敗注入で images テーブル 0 行（＝fs 書き出しが INSERT に先行）を期待値として明示検証しており、TASK-58 import 経路も web-data-api.ledger-import（file 実在・byte 一致）と web-data-api.ledger-import-invalid（失敗時 file 残存なし・行無増加）で検証済み。成功経路の書込順序そのものは cargo test で観測できる分岐がなく（失敗注入で観測できる上記の副作用のみ）、実装タスクでの実装順確認（domain::images::store_image は fs::write → INSERT INTO images の順）に帰属するため、新設条件は重複する"
decided_at = "2026-10-24"
decided_by = "claude"
