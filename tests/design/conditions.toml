[[condition]]
id = "web-shell.sidebar-overlay"
target_function = "web/App.vue（drawerOpen・isDesktop・drawerModal・toggleMenu・closeDrawer）・web/styles.css（.sidebar・.shell-body・.scrim）"
source = "TASK-33 実機指摘（sidebar の開閉にアニメーションが無い・sidebar の出し入れで main の位置が変わるのはおかしい）・docs/spec/spec_mcp-tools.md §12（desktop 折りたたみの grid 列切替を廃止し overlay に統一）"
source_lines = "frontend/tests/unit/web/dashboard-shell.test.ts:1171, frontend/tests/unit/web/styles.test.ts:445"
description = "sidebar は全幅で常時 fixed overlay で、開閉は transform: translateX(-100%) ↔ none の slide（transition 0.2s・prefers-reduced-motion で無効）で行う。.shell-body は main 1列のみ（grid 列切替・display:none・sidebar-collapsed は廃止。main は常に全幅で位置不変）。desktop（900px 以上）は初期 open で menu ボタンでのみ開閉し、open 時も scrim 無し・.main-col/.tabbar は inert にしない・html に drawer-lock を付けない・ナビゲーション遷移でも Escape でも閉じない。899px 以下は従来の modal drawer（scrim・inert・Escape・フォーカス管理・drawer-lock）"
given = "matchMedia('(min-width: 900px)') を true にして App を mount し menu ボタン・nav link・Escape を押す。frontend/src/web/styles.css を読む"
expect_return_shape = "mount 直後 .shell に drawer-open があり .main-col・.tabbar は inert でなく html に drawer-lock が無い。nav link 押下・Escape でも drawer-open が外れず menu ボタン押下でのみ外れる / styles.css の .sidebar（top-level）に position: fixed・transform: translateX(-100%)・transition: transform 0.2s ease、.drawer-open .sidebar に transform: none、.shell-body に grid-template-columns: minmax(0, 1fr)、sidebar-collapsed が無く、.drawer-open .scrim の display: block が899px 以下の media query 内のみ、reduced-motion で .sidebar の transition: none"

[[condition]]
