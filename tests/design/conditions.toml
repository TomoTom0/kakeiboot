[[condition]]
id = "deploy-ops.transport-local"
target_function = "kakeiboot_ops.build_deploy_commands / build_backup_status_commands（transport=local）"
source = "docs/ops/ops_deploy.md §運用操作（miseタスク・scripts/deploy/kakeiboot_ops.py）〔TASK-118。旧mise run配列からの移行で操作列は同一順序・同一文字列。TASK-189 で deploy --env は stg 専用化し prod run配列は廃止（設計: tmp/tasks/tm-189/design_promote.md D-4）。サービスアカウント移行の repo 追随で deploy の配置段が変わり旧run配列との byte 一致は終了（単一file成果物は target 側 staging 経由で root 所有ラッパー kakeiboot-deploy の install-file・dist は rsync + 運用者のモード正規化 + ラッパーの chown-tree。配置の所有形は deploy-ops.artifact-placement-owner・モード正規化は deploy-ops.mode-normalization）〕"
source_lines = "scripts/deploy/test_kakeiboot_ops.py:246"
description = "transport=local で deploy 操作列が14 stepで構成される（invocation毎に一意な target側staging dir作成 → binary の staging rsync → backup script の staging rsync → sudo /usr/local/sbin/kakeiboot-deploy install-file で binary 配置（ラッパー内 install -o kakeiboot -g srvops -m 770） → mkdir bin → 同形式で backup script を bin/ へ配置 → rsync configs (-a --no-perms --omit-dir-times --delete) → rsync dist (-a --no-perms --omit-dir-times --delete) → dist のモード正規化（運用者自身の find/chmod: フォルダ 2770・ファイル group 書き込み〔deploy-ops.mode-normalization〕） → sudo /usr/local/sbin/kakeiboot-deploy chown-tree で dist を付け替え → staging dir の rm -rf → systemctl restart → healthz sh -c → 配置記録 deploy-record の書き込み〔deploy-ops.deploy-record〕。prod deploy は TASK-189 で廃止し prod への配布経路は promote に一本化〔deploy-ops.promote-plan〕。backup-status は旧4行〔cat last_success の sh -c・ls -1 の sh -c・list-timers・show〕と同一のまま。backup_dir は shlex.quote で sh -c 文字列へ埋め込み〔REVIEW-4 Low-3: 空白入り deploy_root でも単語分割しない〕）"
given = "deploy_root=/srv/opt/tomo/run/app/tool/kakeiboot・transport=local・healthz port=40282（stg）"
expect_return_shape = "build_deploy_commands の返す14 argv（stg）の shlex.join がサービスアカウント移行後の plan（staging + ラッパー install-file ×2 + モード正規化 + ラッパー chown-tree + 後片付け + 配置記録を含む）と行単位で一致し・build_backup_status_commands の4 argv は旧配列（raw_{stg,prod}-backup-status.before.txt）と一致する"

