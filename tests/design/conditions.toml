target_function = "admin::token_list / admin::token_revoke（両表merge）"
source = "docs/spec_auth.md §9（--kind register は register_invitations から表示（issued_by=・inviter: 接頭辞）・--kind 無しは両表を日時降順で merge・token revoke は両表から prefix 解決）・§7-2（招待者メモが運用者の確認した情報ではないことを区別して表示）・TASK-32 設計 tmp/tasks/tm-32/design_register-invite.md 3-6"
source_lines = "backend/tests/admin_cli.rs:401, backend/tests/admin_cli.rs:415"
description = "token list（--kind 無し）は invitations と register_invitations の両表を created_at 降順で merge し、register 行は issued_by=<user_id>（created_by は NOT NULL のため常に値がある）と inviter_note が inviter: 接頭辞付きで出る（operator_note との区別）。--kind register は register 行のみ（--user との併用は引数エラー: register token に target user の概念が無い）。token revoke <hash prefix> は両表を prefix 検索し、合算 0件は NotFound・2件以上（両表1件ずつも含む）は Ambiguous・合算1件なら解決済み hash を所持表の revoke_by_hash に渡して行削除（audit entity_type='register_invitation'）し5本上限の解放経路となる"
given = "register と invite の token が混在する状態での token list（--kind 無し / --kind register）・--kind register --user 併用・token revoke <hash prefix>（両表0件・合算1件・両表1件ずつ）"
expect_return_shape = "list: 両表を日時降順で merge し register 行は issued_by=<user_id> と inviter: <note> で表示。revoke: 合算1件は削除（audit entity_type='register_invitation'）・0件は NotFound・複数件は Ambiguous"

