# TASK-154 step-up再認証（reauth）の counter 鮮度・tx外更新是正（テスト先行: 条件書とテストの先行更新。実装は未着）。
# 正本: docs/spec/spec_auth.md §2-6（spec 改訂文案は設計 §5-2 を実装工程で反映）・
# 設計 tmp/tasks/tm-154/design_reauth-counter.md §2（take_ceremony 原子消費・tx外の ceremony 消費と検証→
# BEGIN IMMEDIATE 内 所有検査/load/counter再判定/update/auth_at 更新・auth_at 影響0行は失敗）。
# 共通前提（設計レビューMED2）: 競合loginへ session cookie を渡さない（渡すと login が session を失効させ
# counter 検証に届かない401になる）・reauth 用 session/ceremony cookie は個別に明示・
# assertion 生成順は reauth 用（c+1）を先に（SoftPasskey の counter は署名順に進む）。
# 並行注入は feature test-hooks の reauth_before_write_lock（backend/src/test_hooks.rs。
# 実装工程で reauth_finish が呼び、呼ばれない間 park は実質 no-op で逐次進行する）。

[[condition]]
id = "auth-reauth.concurrent-counter-monotonic"
target_function = "auth::ceremony::reauth_finish（同一 credential の並行 step-up と login・sign counter 単調性）"
source = "docs/spec/spec_auth.md §2-6・設計 tmp/tasks/tm-154/design_reauth-counter.md §2（BEGIN IMMEDIATE 内の counter 再判定: (受信>0||保存>0)&&受信<=保存 なら counter_regression で 401）・§5-3 条件1・設計レビューMED2（cookie 分離の共通前提）"
source_lines = "backend/tests/auth_passkeys.rs:459"
description = "同一 credential で reauth assertion R（先に署名・counter c+1）が reauth_finish の write lock 直前で停止している間に、session cookie を一切持たない競合 login（後に署名・c+2）が完走しても、保存 $.cred.counter は巻き戻らず、再開された R は最新保存値への逆行として 401 になる（login と同じ counter 規則の step-up 適用）。step-up 失敗は WARN のみで audit_events への行を書かない"
given = "file DB + test hook reauth_before_write_lock で R を停止（競合 login は reauth 用 session を失効させないよう cookie なしの新規 context で完走させ、reauth 用 session/ceremony cookie は個別に明示）→ R 再開。/api/webauthn/* は 6 要求で IP 上限 20/分以内"
expect_return_shape = "R は 401。保存 $.cred.counter は競合 login 完了時の値のまま（c+1 へ巻き戻らない）。counter_regression の audit_events 行は増えない（step-up 失敗は audit 挿入なし）"

[[condition]]
id = "auth-reauth.delayed-assertion-rejected"
target_function = "auth::ceremony::reauth_finish（ceremony snapshot と最新保存 counter の乖離）"
source = "docs/spec/spec_auth.md §2-6・設計 tmp/tasks/tm-154/design_reauth-counter.md §1-2 問題1（検証基準が TTL 内に古くなる snapshot）・§2（counter 再判定）・§5-3 条件2（hook 不要・決定的）"
source_lines = "backend/tests/auth_passkeys.rs:529"
description = "reauth_start が取り込む counter snapshot（c）に対して assertion（c+1）を作った後、ceremony TTL 内に session cookie を持たない login で保存 counter を進めてから reauth_finish すると、開始時 snapshot の基準は満たす assertion でも write lock 下の最新保存値へ逆行しているため 401（TTL 窓の直接再現）。失敗は auth_at を更新しない"
given = "register（session A）→ reauth_start（session A・snapshot c）→ assertion R（c+1）を先に署名 → cookie なしの競合 login で保存 counter を進める → R で reauth_finish（session A・ceremony cookie は明示）"
expect_return = "401。保存 $.cred.counter は login 後の値のまま・session A の auth_at は不変"

[[condition]]
id = "auth-reauth.sequential-both-succeed"
target_function = "auth::ceremony::reauth_start / reauth_finish（逐次 step-up の誤拒否なし）"
source = "docs/spec/spec_auth.md §2-6・設計 tmp/tasks/tm-154/design_reauth-counter.md §3（counter 0固定 authenticator は received=0/stored=0 で規則を通るため誤拒否なし。SoftPasskey では作れないため規則としての記載）・§5-3 条件3"
source_lines = "backend/tests/auth_passkeys.rs:580"
description = "生成順どおりに到着する reauth（逐次複数回）はすべて 200 で、保存 $.cred.counter は単調に進み、同一 session 行の auth_at が更新される（最新保存値基準の再判定が正規の逐次 step-up を誤拒否しない担保）"
given = "register → reauth_start→finish を2回、生成順（先に署名した方を先に提出）に逐次実行"
expect_return_shape = "いずれも 200。保存 $.cred.counter は各 finish ごとに増加・有効 session 行の auth_at が更新される"

[[condition]]
id = "auth-reauth.atomic-rollback-on-session-vanish"
target_function = "auth::ceremony::reauth_finish（auth_at 更新の影響行数確認と tx 原子性）"
source = "設計 tmp/tasks/tm-154/design_reauth-counter.md §2（UPDATE web_sessions の影響行数が0なら WARN+rollback+401）・§5-3 条件4（設計レビューMED3）・docs/spec/spec_auth.md §2-6"
source_lines = "backend/tests/auth_passkeys.rs:630"
description = "reauth_finish が write lock 直前で停止している間に session 行が削除された場合、auth_at 更新の影響行数 0 を失敗扱いとし、credential 更新（passkey_json の counter・last_used_at）もろとも rollback して 401 を返す。counter 再判定だけを追加して読込・更新を autocommit のままにする不完全実装では保存 counter が進んでしまうため、tx 外更新の再発を検出する"
given = "file DB + test hook reauth_before_write_lock で reauth finish を停止（assertion は生成順）→ web_sessions の行を直接 DELETE → 再開"
expect_return_shape = "401。保存 $.cred.counter は reauth 実行前の値のまま・last_used_at も NULL のまま（rollback）"

[[condition]]
id = "auth-reauth.ceremony-single-consume"
target_function = "auth::ceremony::reauth_finish（ceremony の原子消費・take_ceremony 切替）"
source = "設計 tmp/tasks/tm-154/design_reauth-counter.md §1-5（peek/delete の非原子性・設計レビューMED1）・§2（take_ceremony 1本への切替）・§5-3 条件5・docs/spec/spec_auth.md §2-5（ceremony は1回限り消費）"
source_lines = "backend/tests/auth_passkeys.rs:694"
description = "同一 ceremony への再提出は2回目が受理されない: 1回目の finish が検証を終えて write lock 直前で停止（= ceremony 消費後）している間の同一 ceremony・同一 assertion での再提出は ceremony 不存在として 400 ceremony_invalid になり、成功は高々1回。原子性そのもの（並行 peek→delete 分割で両者が検証へ進む退行）は take_ceremony=単文 DELETE...RETURNING の構造保証によるもので、テストは逐次挙動（2回目400・ceremony 表が空・1回目のみ成功）の green-pinning に留まる（park 位置は ceremony 削除後のため peek/delete 分割への退行でもこのテストは緑のままで、決定的red化には旧実装の race 窓内に hook が必要で現行 code には存在しない。退行検出は code review が担う）"
given = "reauth_start → assertion → test hook で1回目の finish を停止 → 同一 ceremony/assertion で2回目の finish → 1回目を再開"
expect_return_shape = "2回目は 400 error=ceremony_invalid。再開された1回目は 200。成功は高々1回で webauthn_ceremonies に行が残らない"

[[excluded]]
item = "TASK-154 設計§5-3の任意案6 auth-login.parked-login-vs-reauth（login 側を hook で停止して reauth が進む交叉型）"
source = "設計 tmp/tasks/tm-154/design_reauth-counter.md 軸6・§5-3 任意6（(d) login parked → reauth が進める、は login 側既存テストの交叉型で優先度低）"
reason = "同一 credential の書き込み競合の判定経路は auth-login.concurrent-counter-monotonic（TASK-147）と auth-reauth.concurrent-counter-monotonic（TASK-154）の両側で固定済みで、交叉型に新たな振る舞い分岐がない。設計が任意・優先度低と明記"
decided_at = "2026-11-02"
decided_by = "claude"

