source = "docs/ops/ops_deploy.md §運用操作 dry-run〔コードレビュー指摘対応で仕様として明文化: dry-runの精神は副作用なしなので読み取りは許容され・ssh接続不能時にdry-runが失敗するのは事前発見として有益〕"
source_lines = "scripts/deploy/test_kakeiboot_ops.py:1789"
description = "promote --dry-run は配布stepを一切実行しないが・port解決（resolve_runtime_port による運用dirconfig読み取り・ssh時はremote cat 2回〔stg・prod〕）を読み取り専用のplan構築前段として実行する。したがってdry-runのplan表示には解決済みportのhealthz行が現れ・subprocess呼び出しはport解決の2回のみ（14 stepは実行なし）。この仕様によりssh接続不能・運用dirconfig不在はdry-runの段階で失敗する"
given = "config_pathsをtransport=sshのdeploy.tomlへ差し替え・subprocess.run をmock化してremote catのstdout（stg 40282・prod 40283）を返す構成での main([promote, --dry-run]) 実行"
expect_return_shape = "rc 0・subprocess.run呼び出し回数が2回（両port解決のみ）・stdoutのplanに localhost:40282/healthz と localhost:40283/healthz の両healthz行が現れる"

[[condition]]
id = "deploy-ops.promote-failure-report"
target_function = "kakeiboot_ops.cmd_promote（失敗時の実行済みstep一覧報告）"
source = "docs/ops/ops_deploy.md §promote〔TASK-189 実装で追加。設計: tmp/tasks/tm-189/design_promote.md D-6（cmd_deployと同じ失敗時報告を適用）・§影響（途中失敗と再実行）〕"
source_lines = "scripts/deploy/test_kakeiboot_ops.py:1959"
description = "途中stepの失敗でpromoteが停止した際に・cmd_deploy / cmd_install_units と同じ形式で実行済みstepの一覧をstderrへ報告する（14 stepのどこまで実行されたかの特定用）。失敗時の復旧は原因確認後に同じコマンドを再実行するのが原則で・全stepが冪等（rsync収束・mkdir -p・退避はtimestamp付き別dirが新たに作られるのみ）のため部分復元の手順分岐は作らない"
given = "config_pathsを一時deploy.toml（transport=local・運用dir配下に両envのapp.toml配置）へ差し替え・subprocess.run をmock化してstep3（sha256表示）で非零を返す構成での main([promote]) 実行"
expect_return_shape = "rcが当該stepのexit codeで・stderrに `steps executed before failure:` と実行済みstep（stg healthz・mtime比較・sha256表示）のみが一覧表示され・未実行step（kakeiboot-prod再起動等）は一覧に現れない"

[[condition]]
id = "deploy-ops.port-from-runtime-config"
target_function = "kakeiboot_ops.resolve_runtime_port（運用dirconfig読み・promote用新helper）"
source = "docs/ops/ops_deploy.md §promote〔TASK-189 実装で追加。設計: tmp/tasks/tm-189/design_promote.md D-6（port解決の分担）〕"
source_lines = "scripts/deploy/test_kakeiboot_ops.py:1750"
