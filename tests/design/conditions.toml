[[condition]]
id = "web-http.dev-spa-fallback"
target_function = "vite.config.ts devSpaFallbackPlugin configureServer"
source = "TASK-29（Vite dev のみ spa_fallback 欠落: 既定 appType spa の html fallback は /index.html 決め打ちだが本構成は index.html 不在のため / や /receipts/101 が404。本番 backend〔backend/src/web/static_files.rs spa_fallback・INDEX_FILE=web.html〕と同じ導線を dev でも担保する。Vite 8.3.4 は server.rewrites option を消費しないため configureServer post-hook で /index.html を /web.html へ書換える）"
source_lines = "frontend/tests/unit/web/vite-proxy.test.ts:33, frontend/tests/unit/web/vite-proxy.test.ts:43, frontend/tests/unit/web/vite-proxy.test.ts:82"
description = "Vite dev server は静的 asset・html 以外の clean URL（/ ・/receipts/101 等）を web shell（web.html）へ導く。/widget.html・/@vite/client・proxy 対象パス（/api,/oauth,/.well-known,/mcp）は書換えない"
given = "vite.config.ts の内容（html fallback の後に動く dev spa fallback plugin）"
expect_return_shape = "Vite の html fallback が決め打ちで向ける /index.html を /web.html へ書換える configureServer post-hook（devSpaFallbackPlugin）が plugins に組み込まれ、消費されない server.rewrites option を使わない"

