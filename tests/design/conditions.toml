id = "web-browse.url-queue-boundary"
target_function = "web/composables/useBrowsingUrlSync.ts（境界の共通処理: drain停止・generation更新・未送信要求と古いtimer/draftの破棄・自発ACK候補の無効化・確定route/importの整合・旧queue非再生）・web/router.ts 周辺（history/programmatic入口adapter: router公開前にrouter.push/replace/go/back/forwardを包みRouterHistory.listenをcreateRouterへ渡す前に包む）"
source = "設計 tmp/tasks/tm-174/design_url-history-entries.md v4 D3-1（境界処理への写像表: 同一URL外部要求・hook前cancel/leave拒否・外部Promise観測不能・redirect競合・backとbrowser popの競合・pop未通知/復元未確認。Topbarの他画面→Search と Axis redirectも境界。公開兆候のない迂回要求は検出保証外）・D3-2（外部入口/pop通知で旧queueは中断。境界を跨いだ成功を現generationのACKにしない。ledger切替は論理中断・dispose後は無write/無store更新・再mountは確定URLを新baselineとしてimport）・D3-3（未通知の履歴要求はsupersede先navigationと独立して保持。back発行→pop未通知→外部replace→Promise終端でもawaiting-popを消さない。後着旧pop・通常解除後の旧popは新しい境界として誤解除しない）"
source_lines = "frontend/tests/browser/verify.spec.ts:2743, frontend/tests/browser/verify.spec.ts:2787, frontend/tests/unit/web/browsing-navigation.test.ts:59, frontend/tests/unit/web/browsing-navigation.test.ts:77, frontend/tests/unit/web/browsing-navigation.test.ts:172, frontend/tests/unit/web/browsing-navigation.test.ts:183, frontend/tests/unit/web/url-sync.test.ts:980, frontend/tests/unit/web/url-sync.test.ts:1004"
description = "外部境界（adapter入口を通った外部push・同一URL要求・history listenerのpop通知・leave guard拒否・redirect・TopbarFilterBarの他画面→Search・Axisのsubject変更/不正axis redirect・ledger切替・dispose）は、drain停止・未送信要素と古いtimer/draftの破棄・自発ACK候補の無効化・確定route/importの整合を行い、旧queueを再生しない。境界を跨いだ旧要求の成功は現generationのACKにしない（旧要求との対応が公開APIで確認できる成功だけstale-ownedとし、それ以外は境界）。ledger切替は論理中断であり捕捉済み旧in-flightのPromise終端を待ち、旧成功が一意に識別できれば新baseline補正・不明なら外部境界を優先する。dispose後はwrite・store更新をせず、再mountは確定URLを新baselineとしてimportする。公開兆候のない迂回要求は検出保証外とし、入口を閉じられない区間ではACKしない。回帰条件: 「back発行 → pop未通知 → 外部replace完了 → 再押下」では成功/duplicated とも未通知要求を保持し追加backなし。browserは同一JS taskのback後・pop通知前に外部replaceを開始し、Promise終端時のpop未通知・再押下/期間変更の追加writeなしを記録する。任意の通知順序はunitで制御する。「後着する旧pop」「通常解除後に到着する旧pop」は新しい境界/IDとして扱い旧IDのACK・解除に利用しない"
given = "通知遅延制御可能なunit用history（frontend/tests/unit/web/helpers.ts createManualHistory: go要求受付・pop通知・通知なし復元を独立制御）とguard保留で: 保留中のuser pushへ外部 router.push を重ねる / pop通知を保留したまま外部replaceを完了させてtopbar ‹ を再押下する / 保留していたpopを後から届ける / 外部push後の期間操作"
expect_return_shape = "境界検出時点でFIFOの未送信要素は破棄され（解放後に発行されない）・確定routeがimport/整合され・旧queueは再生されない（backで破棄された操作のentryに戻らない） / 未通知backのawaiting-popは外部replaceのPromise終端では解消されず再押下は無視される（goCalls のback要求が1回のまま） / 後着旧popは新しい境界として処理され旧IDのACK・解除・queue再生に利用されない（後続の期間操作は書き込まれない） / 要求from・delta・方向（履歴が公開する場合は行先・positionも）を照合し、不一致popは独立境界として元待機を保持する。逆方向・異なるdelta・異なるfromはunitで検証 / 外部push境界後のbackは外部push前のentryへ戻る（破棄分のentryを挟まない）"

[[condition]]
id = "web-browse.url-queue-failure"
target_function = "web/composables/useBrowsingUrlSync.ts（failure処理: 返却Promise/public hook から cancelled/aborted/duplicated/reject/redirect を観測し成功entryに数えず停止・整合。再開条件はnavigation終端・未通知履歴要求なし・履歴復元待ちなし・未解決競合なし・baseline整合の全成立）・web/App.vue（topbar戻るの完了管理）"
source = "設計 tmp/tasks/tm-174/design_url-history-entries.md v4 D4（failure処理表: duplicatedはbeforeEach到達を要求せず返却Promiseのfailureで判別。cancelled/abortedはgeneration停止・未送信分破棄・確定route/確定snapshotへ整合。redirectは境界として破棄・遷移先import。成功entryは巻き戻さず再開条件を全成立まで待つ。履歴待機が残ればbackロック解除・新規操作受付・drain再開・補正replaceを禁止）・D3-3（一意なpop拒否のfailure afterEachはnavigationだけの終端で履歴はrestoration-pendingへ。復帰は確定routeへの明示的な文書再読込のみで次のpop・外部replace・時間経過では解除しない）"
source_lines = "frontend/tests/browser/verify.spec.ts:2825, frontend/tests/unit/web/browsing-navigation.test.ts:110, frontend/tests/unit/web/browsing-navigation.test.ts:124, frontend/tests/unit/web/browsing-navigation.test.ts:196, frontend/tests/unit/web/url-sync.test.ts:1035, frontend/tests/unit/web/url-sync.test.ts:1061, frontend/tests/unit/web/url-sync.test.ts:1102"
description = "書き込みnavigationの結果は返却Promiseと公開hookで観測し、cancelled・aborted・duplicated・reject・redirectを成功entryに数えず停止・整合する（設計v4 D4に従いstoreは確定snapshotへ整合し、未送信分は破棄）。duplicatedはbeforeEach通過を要求せず返却Promiseのfailureで識別する。同一URLへの外部replace競合はcancelledになり得るため境界として扱う。duplicated自体は確定済み同一URLへの要求で検証し、成功entryに数えない。keys-less補完・週正規化・search期間key除去のreplaceが継続拒否されても整合処理から再生成せず、追加writeなし・新規操作は受理する。公開終端・履歴待機解消・baseline整合後は新規操作のみ再開できる。pop拒否（一意なfailure afterEach）はnavigation終端のみの終わりで履歴はrestoration-pendingとし、「pop拒否 → failure afterEach → 復元前の再押下/期間変更」ではbackロック・drain停止を維持し追加のhistory要求・writeを発しない。通知されない復元は公開観測で確認できない限り待機し、次のpop・外部replace・時間経過だけでは解除しない。明示的な文書再読込後は新baselineで新規操作のみ受理し旧queueは再生しない。navigation終端・履歴待機解消・baseline整合を別々に検証し、不明終端では再開しない"
given = "guard保留とunit用historyで: navigation開始前に保留guardと拒否guardを登録し、保留pushを解放して拒否する（aborted） / 同一URLの外部replace競合後に保留pushを解放する（cancelled）・確定済み同一URLへの要求でduplicatedを観測する / topbar ‹ のpop navigationを保留したまま再押下・期間変更してから拒否して解放する（pop拒否→failure afterEach→復帰前）"
expect_return_shape = "aborted/duplicated/reject/redirect はいずれも成功entryに数えず・未送信分破棄・確定route/確定snapshotへ整合する（URLは失敗前の確定位置のまま・storeは確定snapshotへ整合・破棄した後続操作のwriteがない） / duplicatedはbeforeEach通過の有無に依存しない / pop拒否後の復帰前に再押下・期間変更してもbackロック・drain停止が維持され追加のback要求（goCalls）・writeがない / routerの復元go（triggerListeners=false）が発行された後も公開確認不能な限りロック・待機は維持される / unitは復元を独立保留しfailure通知済み・履歴位置未復元の窓で再押下と期間変更、解放後も待機維持を検証。browserは実Web historyのfailure callback内で復元前positionと再操作を記録し、復元pop後も追加writeなし・待機状態から文書reload後に新規操作のみ1entry追加する。browserで任意に復元通知を停止・並べ替えることは要求せずunitで担保する"

