description = "期間変更（topbar 時期チップ・PeriodPicker のモード切替と‹ ›送り・trend 棒押下の setMonth/setWeek）は閲覧系5画面（/・/categories・/stores・/receipts・/axes/*）で URL の period keys へ反映される。書くのは当該 mode の key のみ（month モードなら month= に置換。mode key が正で from/to は range モードの key〔D2-4 導出値〕のため、期間単独の変更では from/to は載らない。TASK-174 D2のfilter patchは適用時期間のfrom/toを併存させ、後続の期間操作では全期間keysの置換により落とす）。書戻しは TASK-164 §2-2-1 の原因別判定: 利用者の期間変更（step・setMonth/setWeek・setMode/setRange による mode 切替と range 指定）は router.push で履歴に積み（1操作1entry・labels 同時差分は同一 push に載る・browser back で直前の期間へ戻る）、利用者以外（取り込み一致・keys-less 補完・正規化・reset・labels 単独・search strip）は router.replace のまま（web-browse.url-user-period-push / web-browse.url-system-write-replace）。push も同一画面（path 不変）のため slide 無し・scrollBehavior は scroll しない既存 rule のまま（TASK-125 帰属の slide 遷移を壊さない）。未来期間への送り（TASK-146 §1 の上限解放後）も利用者変更のため同じ push 書戻しで month=<未来月> が URL へ載る（web-shell.period-uncapped-step）"
given = "各閲覧画面を ?month=2026-10 で開き時期チップ dialog の ‹ 送りで 2026-09 へ / Home で mode-year へ切替え・trend 棒（bar-2026-05）を押下"
expect_return_shape = "URL query の month が 2026-09 へ置換され from/to は付かない（5画面すべて） / mode-year では year=2026 に置換（month は消える） / 棒押下では month=2026-05 / 利用者変更の書戻りは router.push で scrollTo は呼ばれず・browser back で直前の期間（2026-10）へ戻り取り込みで復元される / 同tickの連続変更は操作ごとに別entry（同tick圧縮は撤回・1操作1entryは web-browse.url-user-period-push が検証）"

