[[condition]]
id = "web-manage.row-editor"
target_function = "web/components/RowMenu.vue（新設）・web/pages/ManageCategoriesPage.vue・web/pages/ManageStoresPage.vue（行editor・行内 status）・web/styles.css（.row-action-btn・.row-editor・.row-status）"
source = "TASK-40 設計（正本）tmp/tasks/tm-40/design_manage-pages.md §1-1（A2 改訂2: 行末⋯の menu に全操作を集約。行本体は押し先でない）・§1-6（保存は editor の「保存」のみ・アーカイブは即時実行）・§2-1（RowMenu 仕様）・§2-2（行editor・アーカイブ即時実行・viewer 非活性）・§2-3（店は「編集」1件で入口を統一）・§2-6（aria）・TASK-26 設計 tmp/tasks/tm-26/design_managed-labels.md §1-6 M2・§2-5（「押した行だけ編集」・Enter/Escape・未保存時の1回止め・結果は行内表示の正本）"
source_lines = "frontend/tests/unit/web/data-pages.test.ts:269, frontend/tests/unit/web/data-pages.test.ts:553"
description = "カテゴリ・店の管理画面とも行は常時の操作 button（改名/移動/アーカイブ/編集）を持たず、行末⋯（RowMenu・trigger は 44px の .row-action-btn・dots・aria-haspopup=menu・aria-label「{名前}の操作」・data-test=row-menu-<id>）の menu 項目（role=menuitem の button）から操作を選ぶ。カテゴリ小分類は 名前を変更(menu-rename)/移動先を変更(menu-move)/アーカイブする(menu-archive)〔archived 行は アーカイブから戻す(menu-unarchive)〕、大分類は 名前を変更/アーカイブ(戻す) の2件（移動先は実質 no-op のため無い）、店は 編集(menu-edit) の1件。名前・移動（店は名前・店カテゴリ）の選択でその行だけ行editor（input〔新しい名前〕+select〔移動先〕+保存/やめる・選択した操作の入力へ focus）となり、Enter で保存・Escape でやめる。同時に開けるのは1行で、editor 開中も他の行の⋯は開き、項目選択による切替の時点で未保存の変更があれば「保存されていません」を出して1回止める（同じ⋯の同じ項目をもう1度選ぶと切替。TASK-26 §2-5 と同一）。アーカイブ/戻すは editor を開かず confirm 無しで即時実行（成功で一覧を再取得・失敗はその行の行内 status）。editor・即時実行の結果（error・info）は editor 行の直下の行内 status（.row-status。error は role=alert・成功 info は role=status）に出る。viewer（editor 未満）は⋯・「+」を押せない（disabled で menu が開かない）"
given = "小分類の⋯→「名前を変更」で editor を開き入力したまま他行の⋯→「名前を変更」を選ぶ → 同じ⋯の同じ項目をもう1度選ぶ → Escape / ⋯→「アーカイブする」 / viewer で⋯を押す / 店の⋯→「編集」"
expect_return_shape = "全行に 改名/移動/アーカイブ/編集 の常時 button が存在せず⋯（row-menu-<id>）のみ / menu-rename 選択でその行だけ editor が開き名前 input に focus / 未保存のままの他行項目選択は「保存されていません」で切替しないが、同じ⋯の同じ項目の再選択では切替する / Escape で editor が閉じ API は呼ばれない / menu-archive は editor を開かず即時実行され一覧が再取得される（失敗はその行の .row-status に role=alert）/ viewer の⋯は disabled で menu が開かない / 店は menu-edit 選択でその行だけ editor（input2つ+保存/やめる）が開く"

