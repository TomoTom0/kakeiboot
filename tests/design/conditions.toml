source_lines = "backend/tests/oauth_flow.rs:379"
description = "同意情報の形状: client_display は allowlist host 由来の固定名（ChatGPT）、client_id 併記、scope の日本語説明、初期選択 ledger 名（6-1 の初期値）、ログイン中の表示名"
given = "1 ledger 所属 user が開いた R（default_ledger_id 設定済み）"
expect_return_shape = "client_display=ChatGPT、scopes=[{name, description}]、ledger_name=<default ledger 名>、ledger_color=<初期選択 ledger の表示色 palette key（未選択・所属喪失は null）>、user_display_name=<表示名>"

[[condition]]
id = "auth-oauth.decision-allow"
target_function = "auth::oauth::authorize::decision"
source = "docs/spec/spec_auth.md §4-2・§4-6・§3-1"
source_lines = "backend/tests/oauth_flow.rs:445, backend/tests/oauth_flow.rs:572"
description = "decision allow は Origin 必須・session 必須・R.user_id 一致必須。成功時 R を削除し code 行（60 秒・grant_id NULL）を作り redirect_to に code+state+iss"
given = "Origin/session 正常な POST {req, decision:allow}、Origin 欠落、他 user の R"
expect_return_shape = "200 {redirect_to: <redirect_uri>?code=..&state=..&iss=..}。code 行は expires_at = now+60s・grant_id NULL・R 行は削除済み。Origin 欠落は 403、他 user は 400"

[[condition]]
id = "auth-oauth.decision-deny"
target_function = "auth::oauth::authorize::decision"
source = "docs/spec/spec_auth.md §4-2"
source_lines = "backend/tests/oauth_flow.rs:525"
description = "decision deny は R を削除し redirect_to に error=access_denied + state + iss"
given = "POST {req, decision:deny}"
expect_return_shape = "redirect_to に error=access_denied・state・iss、R 行削除、code は発行されない"

[[condition]]
id = "auth-oauth.pkce-verification"
target_function = "auth::oauth::authorize::pkce_matches / token::code_exchange"
source = "docs/spec/spec_auth.md §4-5・§4-7"
source_lines = "backend/tests/oauth_token.rs:115"
description = "code_verifier 検証は BASE64URL(SHA256(verifier)) == challenge（不一致は invalid_grant で code 消費済み）、verifier の形式違反（短い・長い・不正文字）も invalid_grant で code 消費"
given = "正しい verifier での交換成功と、不正 verifier・形式違反での交換"
expect_return_shape = "成功は 200 トークン応答、不一致・形式違反は invalid_grant かつ code 行の used_at が設定される"

[[condition]]
id = "auth-oauth.code-single-use-replay"
target_function = "auth::oauth::token::code_exchange"
source = "docs/spec/spec_auth.md §4-7・§4-10・§11-4"
source_lines = "backend/tests/oauth_token.rs:173"
