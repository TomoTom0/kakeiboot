description = "shell の section・ledgerScoped 判定は route.meta から行う（route.name ベースの特別扱い〔receipt→receipts・path 前置 /settings・usage- 前置・manage- 前置〕を廃止し全ルートの meta に記載。RouteMeta 型に section?: string・depth?: number・ledgerScoped?: boolean を拡張）。閲覧系ルートは section・depth・ledgerScoped を持つ（home=1・receipts=1・receipt=receipts の2・categories=1・stores=1・search=1。階層ルート4件は category・category-uncategorized が categories の2・subcategory が categories の3・store が stores の2〔段階5 で追加〕）、manage-* 3件は親 /settings record の section: 'settings' を継承し ledgerScoped: true のみ追加（設定tab 4件は section のみで ledgerScoped 無し）、apps・usage・usage-connect は section のみ、公開系（login/register/consent）は meta.section を持たない（shell 外で表題は使われず fallback は空文字）。SECTION_TITLES に search: { title: '検索', icon: 'search' } を追加し /search の topbar 表題が空でなくなる（TASK-41 遺留の解消）。search は ledgerScoped に含まれ ledger 色帯（topbar.ledger-scoped）と account menu 内の家計簿切替 section が出る（TASK-101 から LedgerSwitcher は account menu 内・topbar 独立トリガは無い）。nav・tabbar の active は section 比較で決まり、search はデータ4節のどの tab も active にしない"
given = "/search と /settings/categories・/usage を mount / router.resolve による各ルートの meta。App.vue・router.ts の source"
expect_return_shape = "/search の topbar 表題が「検索」で icon 付き・topbar に ledger-scoped class・account menu 内に家計簿切替 section が表示される（topbar に独立トリガは無い）・nav4項目いずれも active でない / route.meta が各ルートで上記どおり（home・receipts・receipt・categories・stores・search は section+depth+ledgerScoped: true・category と category-uncategorized は categories の depth 2・subcategory は categories の depth 3・store は stores の depth 2・manage-* は section: settings + ledgerScoped: true・設定tab は section: settings で ledgerScoped falsy・apps/usage 系は section のみ） / App.vue の section computed が route.meta.section を読み（name ベースの分岐なし）・pageTitle が SECTION_TITLES[section]・SECTION_TITLES に search がある"

[[condition]]
id = "web-browse.transition-direction"
target_function = "web/composables/navDirection.ts（direction ref・setNavIntent 一次性フラグ・updateDirection の規則1〜4・reduced-motion 上書き）・web/router.ts（afterEach から updateDirection・scrollBehavior）・web/App.vue（transitionName・:css 切替・pageKey）・web/styles.css（.slide-*・.app-main の position/overflow・reduced-motion 二重化）"
source = "docs/spec/spec_mcp-tools.md §12（遷移は slide 遷移で、方向は history position と route depth から判定する〔TASK-74: afterEach で window.history.state.position を前回値と比較〕）+ TASK-146 §3 遷移全数表 #2（規則3の改訂: push/pop で方向なしの遷移全般は fade 対象・replace のみ無演出。設計 tmp/tasks/tm-146/design_period_navigation.md §3）"
source_lines = "frontend/tests/unit/web/transition.test.ts:316, frontend/tests/unit/web/transition.test.ts:407, frontend/tests/unit/web/transition.test.ts:485"
description = "shell 側 RouterView の遷移演出の方向は router.afterEach 内で window.history.state.position（vue-router が history state へ保存する位置番号）を module 内の前回値と比較して決める（catalog・history.listen 不使用）: (1) navigation failure、または position 不変〔replace。Feed のスクロール id 書き換え・チップ ×・期間変更〕→ none (2) position 減〔戻る〕→ back (3) position 増〔push〕: navIntent='back' または to.meta.depth < from.meta.depth → back / to.meta.depth > from.meta.depth → forward / 同 depth かつ両方 1 → none / 同 depth かつ depth >= 2 → forward（depth 未設定〔設定・管理・公開系〕は比較のどれにも該当せず none）(4) position 不変で name 変化〔replace による別ルート。家計簿切替の Feed → 一覧〕→ none。初回（前回値なし）は none。TASK-146 §3 #2 で規則3・4の『none』の意味を改訂する: direction の値自体は none のままだが、それは無演出を意味しなくなる——App.vue の transitionName 計算が navKind も参照し、direction なし かつ navKind が push/pop（同depth(1)同士のtab切替・depth未設定route への移動を含む）は fade（name=\"page\"）へ、navKind が replace のみ空文字 + :css=false の無演出へ振り分ける（アニメーションがない変更は残らない。web-shell.page-transition）。navIntent は PageHead の ‹ が push 直前に setNavIntent('back') でセットする一次性フラグで、afterEach の全経路で読み取り直ちにリセットされる。direction（forward/back/none の ref）と navKind（push/pop/replace の ref）は App.vue の transitionName へ反映する。CSS は .app-main に position: relative と overflow-x: clip を追加し、slide-forward は enter-from translateX(100%)・leave-to translateX(-30%) + opacity 0、slide-back は対称（-100% / +30%）。leave-active は position: absolute; top: 0; left: 0; width: 100% で旧ページを flow から外し、transition は transform 220ms cubic-bezier(.2,.7,.2,1) + opacity 220ms・mode 指定なし（同時動作）。prefers-reduced-motion: reduce では matchMedia を見て direction の結果を none へ上書きし（fade 化経路も無演出になる）、CSS 側でも同じ media query 内で slide 系・page 系の transform・transition を無効化する（二重化）"
given = "history.state.position を任意値に設定しての遷移（position 増減・不変）と depth 付き/無しルートの組合せ・navIntent セット済みの push・failure・初回。実 mount での push（一覧→詳細）と戻り・同depth同士の push（/receipts→/categories）・depth未設定routeへの push（/receipts→/settings/general）"
expect_return_shape = "規則どおり direction が forward/back/none に決まり navIntent は1遷移で消費される（次は none）・方向なしの push では navKind='push' が観測される / 実 mount の push で入ってくるページの root に slide-forward-enter-active・-enter-from class・離れる側に slide-forward-leave-active が付き（jsdom は stylesheet 無しでも patch 内で付与）戻りは slide-back 側の同構成 / 同depth同士の push・depth未設定routeへの push は direction='none'・navKind='push' で page-enter-active・page-enter-from class の fade（replace は class なし） / reduced-motion では class なし・direction も none / styles.css に .app-main の position: relative と overflow-x: clip・slide 両方向の対称 transform・leave-active の absolute 化・220ms の transition・reduce 内の無効化がある"

[[condition]]
id = "web-browse.feed-no-remount"
target_function = "web/App.vue（Transition の :key=pageKey: route.path の第1セグメント）・web/pages/ReceiptDetailPage.vue（スクロール同期の router.replace）"
source = "docs/spec/spec_mcp-tools.md §12（slide 遷移の pageKey は route.path の第1セグメント〔/receipts/123 は 'receipts' に固定され name ベースの特別扱い不要。Feed のスクロール replace のたび再マウントしない〕〔TASK-74〕）"
source_lines = "frontend/tests/unit/web/receipt-feed.test.ts:100, frontend/tests/unit/web/transition.test.ts:435"
description = "Feed（/receipts/:id）がスクロール中に router.replace で URL の id を書き換えてもページは再マウントしない・演出も出ない。shell 側 Transition の :key は route.path の第1セグメントのため、同名ルート内の params/query 変化は key も component type も変わらず patch のみで済む（direction も replace で none・navKind=replace は TASK-146 §3 #2 後も無演出のまま）。同一 component・同一 key の param 変化（後続段階の /categories/:top ↔ /:top/:sub 等）も同様に remount・演出なしでページ側 watch の再取得が初期化を兼ねる。一覧→詳細（/receipts → /receipts/101）は key が同じでも component type が変わるため通常どおり遷移演出が走る。TASK-146 §3 #5 で Feed の内容再取得（文脈・期間・ledger 変更の sequence 再fetch・未読込id の anchor並び替え）は ContentSwap の内容wrapperにのみ fade が付く（ページrootには slide/enter/leave class が付かないまま——remount なしとの両立・web-common.content-swap・web-receipts.feed-external-nav）"
given = "/receipts/101 を開き（実 Transition で mount）スクロール同期と同じ router.replace('/receipts/102') を実行 / 別文脈への遷移で sequence を取り直す"
expect_return_shape = "ページ root の DOM node が同一のまま（再マウントなし）・slide/enter/leave の class が一切付かない・direction は none / 別文脈の再fetch確定時もページ root に class は付かず ContentSwap の内容wrapper（content-swap）の子にのみ fade の class が付く"

[[condition]]
id = "web-browse.reduced-motion"
target_function = "web/composables/navDirection.ts（updateDirection の matchMedia 上書き）・web/styles.css（prefers-reduced-motion 内の slide 系無効化）"
source = "docs/spec/spec_mcp-tools.md §12（prefers-reduced-motion: reduce では slide 遷移を無効〔JS 側 matchMedia で direction を none・CSS 側でも同じ media query で transform・transition を無効化の二重化〕〔TASK-74〕）"
source_lines = "frontend/tests/unit/web/transition.test.ts:452, frontend/tests/unit/web/transition.test.ts:527"
description = "prefers-reduced-motion: reduce の環境では、遷移方向の判定結果が forward/back でも direction を none へ上書きして shell 側 RouterView の遷移演出を出さない（新ページが即表示・旧ページも即除去。:css=false 経由）。TASK-146 §3 で遷移語彙が拡大したのに合わせ、方向なし遷移の fade 化（web-shell.page-transition）・ContentSwap（web-common.content-swap）・開閉系 appear fade（web-common.overlay-transition）・行追加/行内状態変化の出現 fade（web-common.appear-fade）もすべて無効化する（JS skip + CSS 二重化を全語彙で維持。判定は web/composables/reducedMotion.ts に一元化し navDirection.ts・trendWindow.ts の私有 matchMedia 判定は廃止）。CSS 側でも同じ media query の中で slide 系の transform と transition を無効化し、JS 側と二重化する（matchMedia が読めない環境でも演出が残らない）"
given = "matchMedia('(prefers-reduced-motion: reduce)').matches を true にして一覧→詳細への push と同depth同士の push（/receipts→/categories）を実行（実 Transition で mount）"
expect_return_shape = "direction が none のまま・ページ root に slide 系 class も page 系 class も付かない・app-main 内にページが1つだけ（旧ページの残留なし）・styles.css の reduce ブロックに slide 系の transition: none と transform: none がある"

[[condition]]
id = "web-browse.scroll-restore"
target_function = "web/router.ts（scrollBehavior: push〔pageKey 異なる〕は {top: 0}・replace と同一 pageKey 内遷移は false・pop は pendingRestore へ退避して false）・web/composables/navDirection.ts（pendingRestore ref・navKind ref）・web/composables/usePageReady.ts（markReady・notifyPageEntered・resetPageReady・1.5秒タイムアウト）・web/App.vue（provide page-ready・pageKey 変化で reset・after-enter）"
source = "docs/spec/spec_mcp-tools.md §12（push 遷移は常に先頭へスクロールし、戻る・進むは履歴位置の復元を試みる〔最大1.5秒。replace や同一ページ内の遷移では動かさない〕〔TASK-74〕）"
source_lines = "frontend/tests/unit/web/transition.test.ts:568, frontend/tests/unit/web/transition.test.ts:624"
description = "router の scrollBehavior は (1) pop（savedPosition あり）は保存位置を pendingRestore（navDirection module の ref）へ退避して false を返す（その場では動かさない——同期描画前の復元は着地がずれるため）(2) replace（history position 不変。navDirection の navKind==='replace'——afterEach の position 比較結果を scrollBehavior が next tick で読む）と同一 pageKey（route.path 第1セグメント）内の遷移は false を返しスクロールに触れない（Feed のスクロール id 書き換え・チップ ×・期間変更・/search の debounce replace・/categories/1/5→/categories/1 の‹ 親戻り・一覧→Feed〔Feed は anchor パネルへ自前 position する〕。replace で {top:0} を返すと連続フィードが最上部へ巻き戻る）(3) それ以外の push（pageKey 異なる）は {top: 0}。復元は遷移先ページのデータ読み込み完了（markReady。usePageReady の inject から呼ぶ・App.vue が provide。load の成功・失敗の確定時に呼ぶ）と Transition の after-enter（direction が none なら即時）の両方が済んだ時点で window.scrollTo({top: pendingRestore}) を実行して pendingRestore を消す。1.5 秒経っても揃わなければ復元を諦めて pendingRestore を破棄する。pageKey（第1セグメント）が同じで remount しない遷移は after-enter が発火せず復元条件が成立しないが、DOM が入れ替わらずスクロール位置が自然維持されるため復元を要しない（対象外）。markReady を呼ぶページは ledgerScoped の閲覧系ページのみ（Home・Categories・CategoryDetail・Stores・StoreDetail・Receipts・Receipt〔Feed〕・Search の load 確定時。管理・公開系は呼ばず savedPosition があってもタイムアウトで諦める）"
given = "mount での push・replace・同一 pageKey 内 push 遷移 / pendingRestore に保存位置を退避した状態での notifyPageEntered・markReady の順・不定の呼び出し（fake timer で 1.5 秒経過）"
expect_return_shape = "pageKey の異なる push でのみ window.scrollTo が top 0 へ呼ばれる / replace（同一 pageKey・pageKey 異なるの両方）と同一 pageKey 内の push では window.scrollTo が呼ばれない / after-enter 済みでも markReady 前は復元せず、markReady で scrollTo({top: 保存位置}) が1回呼ばれ pendingRestore が null に / 1.5 秒経過後の markReady では復元しない（pendingRestore 破棄済み）"

