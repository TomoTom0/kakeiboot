source = "docs/spec_mcp-tools.md §7-23（前段の後に draft の消失・role の変更が起きた場合も、承認 tx 内の検出をその件の not_found / forbidden として返す〔TASK-25 の注入〕）"
source_lines = "backend/tests/mcp_tools_drafts_batch.rs:2285"
description = "MCP 層の前段解決（c.draft・require_role）を通過した後に draft が削除されても ApproveKind::NotFound、role が viewer に変更されても ApproveKind::Forbidden になり、いずれも receipt を作らず他の件に影響しない。/mcp 経由での race 再現は決定的にできない（解決と tx の間に注入 seam が無い）ため、解決済み DraftRow（domain::drafts::load_draft）を渡して DB を先に変更する注入で domain 層から直接検証する。tx 内検出本体は db-schema.approve-requires-editor-role / approve-not-found-unknown-id、MCP 層の kind→件ごと結果への写像は mcp-approve-batch.per-item-results と同一機構で検証済み（race の結合再現は除外記録参照）"
given = "unit: insert_pending_draft + load_draft で解決済み DraftRow を作り、DELETE FROM drafts / UPDATE ledger_members SET role='viewer' を先行実行してから domain::draft_intake::approve_one を直接呼ぶ（無変更の control も併せる）"
expect_return_shape = "control は Approved（receipt 1 件）。削除後は NotFound・role 変更後は Forbidden で、いずれも receipt_id=null・receipts は control の 1 件のみ・demote 済み draft は pending のまま"

