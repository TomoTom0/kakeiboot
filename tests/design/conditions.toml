description = "推移bar（TrendBars・4画面共用）の状態強調は列背景wash文法に一本化する: (1) hover強調は .bar-col:hover { background: var(--bb-hover) } の列wash（行系hover・.daily-col:hover と同一の面wash文法）で、@media (hover: hover) block 内に置く（touchでは適用されず sticky hover 残留による current wash の上書きを構造的に排除）。.bar-col は常時 border-radius: 6px（focus outline の radius と同値）と transition: background-color 0.15s を持つ。(2) current強調（当月・選択月。month granularity では選択中の月で bar 押下で移動する）は常時の列wash .bar-col.current { background: var(--bb-accent-soft) }（.side-link.active と同じ選択中token。列背景は0円bucket〔空の .bar-val + fallback .bar のみ〕でも存在するため0円の当月・当日・当週でも成立）を主軸に、.bar-col.current .bar-val { font-weight: 600; color: var(--bb-fg) } の値label前景強調（muted→fg・週行currentの weight 文法と同型。0円時はlabelが空のため自然に不発）を併用する。(3) 旧規則 .bar-col:hover .bar・.bar-col.current .bar（棒色変更）は積み上げbarの inline series 色（deterministic palette）と非両立のため復活させず削除し、.bar { transition: background-color 0.15s } もアニメーション対象がなくなるため削除する。棒（.bar-seg のseries色）はhover/currentで一切変えない。(4) hover wash は current wash と同specificity（0,2,0）のため source order で優先順位を決め、hover 規則を current 規則より後置する（desktop で current 列にhoverした際は accent-soft→hover に置き換わり反応が見え、非0円ならlabel前景強調がcurrent指標として残留）。Vue component・TS・DOM は不変（current/stacked class 付与・.bar-val 描画は既存実装）"
given = "styles.css の .bar-col/.bar 規則と @media block 構成（DOM 不変のため静的検査。実機視認は TASK-72 紐付け）"
