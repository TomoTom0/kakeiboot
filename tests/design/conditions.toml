expect_return_shape = "B確定後も store は C のままで B への import なし・B由来の再取得なし（2026-05 の analysis は setMonth 時の1回のみ）・追加writeなし・続く C の書き込みがFIFOから発行され URL は C へ進む / 外部popは戻り先entryのURLを import する（store が戻り先期間へ復元される） / ACK条件が崩れる区間ではACKせず境界処理する"

