[[excluded]]
item = "TASK-174 のうち条件化しない項目: (1) 内部観測patch（vue-router特定バージョン固定・pnpm patchedDependencies・lockfile変更）による内部試行の完全識別 — 設計冒頭のユーザー決定で不採用。保証は公開APIで識別可能な区間に限定し、識別不能時は境界処理する（url-queue-boundary 各条件が明記） (2) adapterを迂回し公開兆候もない要求の検出 — 検出保証外を明記済みで条件化する振る舞い分岐が存在しない（D3-1識別不能表） (3) vue-router依存更新時の公開通知順序の回帰確認 — 依存更新タスク帰属（設計「残リスク」が明記） (4) 境界倒し頻度の実装時評価と境界理由の観測可能化 — 実装・実運用の観察事項（同）"
source = "設計 tmp/tasks/tm-174/design_url-history-entries.md v4 決定冒頭（内部観測patchのユーザー不採用）・D3-1（迂回要求の検出不能）・影響>条件書の改訂方針（unit用historyと実Web history browser検証を必須範囲とする記述）・影響>残リスク（依存更新時回帰・境界頻度の評価）"
reason = "(1)(2) は設計が保証対象外と決定した事項で、振る舞い分岐の条件化対象外（境界処理への倒し方が各条件で担保する）。実Web history競合と文書reloadはbrowser条件、任意の通知順序・独立した復元保留はunit条件に含め、先送りしない。ledger/disposeはbrowsing-navigation.test.tsで検証する。(3) は依存更新時に発生する将来タスク。(4) は実装時の観察事項でテスト条件の形を持たない"
decided_at = "2026-11-10"
decided_by = "claude"

