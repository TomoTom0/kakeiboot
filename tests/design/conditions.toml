description = "月モード6か月窓（全画面統一）の TrendBars は360px幅で横スクロールせず収まる。間引き軸ラベル（.axis-labels）は .bars と同一 grid-template-columns・同一 gap で wrap の (row2, col2)〔grid-column: 2 明示〕にあり、各 span の中心が対応 .bar-col の中心と一致する（旧 .axis-ends の flex space-between と違い中間ラベルも棒直下）。y軸ラベル（.y-axis）は左 gutter 内にあり、水平スクロールが発生する場面（day/week・超長range）では port 左端へ sticky 固定（背景 var(--bb-surface)・z-index:1 で棒より上に描画）。gridline は2本で max線は棒100%上端（.plot 上端+1rem）・中間線は棒領域の中間（.plot 高の 50%+0.5rem）。.bar-val は headroom 1rem（.bar-val 高+gap <= 1rem）により棒高95-100%でも .plot 上端を割らない。棒ごとの月ラベル（.bar-label）は DOM に存在しない"
given = "360x780 の viewport で /categories?month=2026-10 を表示（chromium。月モード6か月窓 2026-05..10 の6本）"
expect_return_shape = ".hscroll の scrollWidth − clientWidth <= 2 / .axis-labels の各非空 span の中心 x と対応 .bar-col の中心 x の差 <= 2px / .y-axis の right <= .plot の left / .bar-label の数 0 / .gridline 2本の top が .plot 上端+1rem と .plot 高の 50%+0.5rem（±2px）/ 最大棒の .bar-val 上端 y >= .plot 上端 y（headroom 保証）"

