[[condition]]
id = "web-shell.nav-open-state-on-resize"
target_function = "web/App.vue（matchMedia('(min-width: 900px)') の change 監視・drawerOpen・isDesktop・drawerModal・toggleMenu）"
source = "TASK-33 実機追加指摘（desktop でも sidebar を閉じたい）・docs/spec/spec_mcp-tools.md §12（開閉状態を維持。900px 越えで drawer を閉じる処理は削除。overlay 統一により単一の drawerOpen 状態へ）"
source_lines = "frontend/tests/unit/web/dashboard-shell.test.ts:1125"
description = "ナビの開閉状態（単一の drawerOpen）は viewport 変化（双方向）で維持される。mobile で drawer を開いたまま 900px 以上へリサイズすると開いたまま desktop の overlay になり、mobile 専用の modal 効果（.main-col/.tabbar の inert・html.drawer-lock・scrim）だけ解ける（逆方向も開閉状態は維持され、開いていれば modal drawer として開いたまま）。desktop では同じ menu ボタンで overlay を閉じ（slide-out）・再度開ける。desktop は初期 open"
given = "drawer を開いた状態で matchMedia('(min-width: 900px)') の change リスナーを発火させ、その後 menu ボタンを2回押し、再度 change リスナーを逆方向に発火させる"
expect_return_shape = "resize 後も .shell の drawer-open が維持され .main-col・.tabbar の inert と html.drawer-lock が解かれる / menu ボタン押下で drawer-open が外れ aria-expanded=false・aria-label「メニューを開く」、再押下で付き aria-expanded=true・aria-label「メニューを閉じる」 / 逆方向の resize で drawer-open が維持され inert と drawer-lock が戻る"

[[condition]]
id = "web-shell.popover-panel"
target_function = "web/components/PopoverPanel.vue・web/composables/popover.ts（usePopover）"
source = "docs/spec/spec_mcp-tools.md §12（popover は共通 composable（usePopover）+ PopoverPanel・PopoverMenu の2部品）"
source_lines = "frontend/tests/unit/web/popover-panel.test.ts:78, frontend/tests/unit/web/popover-panel.test.ts:102, frontend/tests/unit/web/popover-panel.test.ts:119"
description = "PopoverPanel はトリガで開閉し、開くと role=dialog（aria-label 必須・非モーダル）のパネルが出て、data-autofocus の要素（無ければ最初のフォーカス可能要素）へフォーカスする。トリガ slot は aria-expanded と aria-controls を受け取る。外側の pointerdown と Escape で閉じ、閉じるとトリガへフォーカスが戻る。variant=sheet-narrow は 480px 以下の幅で狭幅シート用のクラスが付く（それより広い幅と anchored には付かない）。TASK-146 §3 #15 で開閉は appear fade を得る（web-common.overlay-transition: 開いた直後の .popover-dialog に fade 語彙の enter class・閉じる際に leave class・anchored は opacity+小translateY・sheet は下から・popover-scrim も fade。role/フォーカス/外側検知の契約は不変）"
given = "variant=anchored / sheet-narrow の PopoverPanel をマウントしトリガをクリック → Escape / 再度開いて外側を pointerdown / matchMedia('(max-width: 480px)') を true にして開く"
expect_return_shape = "パネルに role=\"dialog\"・aria-label。トリガに aria-expanded=true・aria-controls=パネルの id / 開くと data-autofocus 要素（無ければ最初のフォーカス可能要素）へフォーカス / Escape・外側 pointerdown で閉じトリガへフォーカス・aria-expanded=false / sheet-narrow は 480px 以下で狭幅クラス、anchored には付かない / 開いた直後の .popover-dialog に fade 語彙の enter class（page-enter-active・page-enter-from）・閉じの際に leave class"

