[[condition]]
id = "db-schema.migration-0012-revoke-superseded-children"
target_function = "migration 0012（oauth_refresh_tokens の既存データ補正 UPDATE）"
source = "設計 tmp/tasks/tm-140/design_refresh-grace-revoke.md 6章 M1（補正 migration 必須化）・M2（条件を直接証拠＝同じ grant に参照されている未使用・未失効の先端が存在することへ変更。番号 0012・時刻は SQL 式）・5-3 の given・docs/spec/spec_data-model.md §15 0012"
source_lines = "backend/tests/db_schema.rs:1911"
description = "修正前に生じた孤児の旧子（未使用・未失効・どの child_hash からも参照されない、かつ同じ grant に参照される未使用・未失効の先端がある行）だけに revoked_at を現在時刻（ms）で設定し、現行の子・rotation のない初回 token・親が削除済みの子・TTL が単調でない場合の現行の子・使用済み行・既に失効済みの行は変えない"
given = "migrate_until(12) の DB に、(g1) R→C2 で C1 が孤児 (g2) rotation のない初回 token のみ (g3) 親が削除済みの子のみ (g4) TTL 非単調: より古い使用済み行が残り現行の子の親は削除済み (g5) 先端が使用済みで孫が先端: R→C2(使用済み)→G と孤児 C1 (g6) 失効済みの孤児と未失効の孤児が同居 を入れて残りの migration を適用"
expect_return_shape = "version 12 が適用済み。g1-C1・g5-C1・g6 の未失効孤児のみ revoked_at が適用時刻の ms 値（秒精度）。他の行の revoked_at は不変（g6 の失効済み孤児は元の値のまま）、全行の used_at 不変"

# ---------------------------------------------------------------------------
# TASK-147 パスキー login の sign counter TOCTOU（login_finish の user 解決〜検証〜更新を1つの BEGIN IMMEDIATE に）。
# 正本: docs/spec/spec_auth.md §2-4・§11-2（spec 改訂は実装工程。文案は設計 tmp/tasks/tm-147/design_login-counter-toctou.md 4-2 と 5章〔5章が優先〕）。
# 並行は feature test-hooks の test 専用 hook（AppState.test_hooks・login_finish の BEGIN IMMEDIATE 直前で待機）による決定的注入。
# 既存改訂: auth-login.counter-regression-rejected-audited・auth-login.mismatch-uniform-401-audited。

[[condition]]
id = "auth-login.concurrent-counter-monotonic"
target_function = "auth::ceremony::login_finish（同一 credential の並行ログイン）"
source = "docs/spec/spec_auth.md §2-4（counter 逆行の拒否）・設計 tmp/tasks/tm-147/design_login-counter-toctou.md 4-2（同一 credential の並行ログインでも保存 counter は単調増加し、同一または逆行した counter の assertion は後から write lock を得た側が counter_regression で拒否）・4-3・5章（hook による決定的注入・両方 200 経路の別ケース・401 件数はケースごとの差分・rate limit 内に抑える）"
source_lines = "backend/tests/auth_login_session.rs:435, backend/tests/auth_login_session.rs:524"
description = "同一 credential で別 ceremony の assertion A（c+1）と B（c+2）について、A が write lock 取得直前で止まっている間に B が完走しても、保存 counter は B の値から巻き戻らず、A は最新の保存値を基準に counter_regression で拒否・audit される。生成順どおり A→B の順に到着した場合は両方成功し保存 counter は大きい方になる"
given = "file DB の multi-connection pool。1つの SoftPasskey で 2 本の login/start を行い A→B の順に署名（ceremony cookie は個別に明示して finish を発行。/api/webauthn/* はケースあたり 6 要求で IP 上限 20/分以内）。(1) test hook で A を BEGIN IMMEDIATE 直前に停止→B を完走→A を再開 (2) hook なしで A→B の順に逐次 finish"
expect_return_shape = "(1) B は 200、A 再開後の保存 $.cred.counter は B 完了時の値と同じ（c+1 に戻らない）、A は 401、counter_regression audit の件数差分が 1。(2) A・B とも 200、B 後の保存 counter は A 後より大きく、counter_regression audit の件数差分は 0"

[[condition]]
id = "auth-login.concurrent-disable-during-login-rejected"
target_function = "auth::ceremony::login_finish（user 解決と session 発行の write lock 下での一体化）"
source = "設計 tmp/tasks/tm-147/design_login-counter-toctou.md 1-2 副次（検証から COMMIT までの間に credential 削除・user 無効化が並行 COMMIT されても session が発行される）・3章 案B'（owner 解決・削除・無効化を同じ write lock 下で評価）・4-1（tx 内で user 解決し行なしは mismatch audit を COMMIT して 401）・docs/spec/spec_auth.md §2-1（disabled user はログイン拒否）・§2-4"
source_lines = "backend/tests/auth_login_session.rs:477"
description = "login_finish が write lock 取得前に止まっている間に user が無効化された場合、無効化前の解決結果で session を発行せず、tx 内の再解決で行なしとして同じ形式の 401 にし login_mismatch を audit する"
given = "file DB で 1 本の login/start・署名の後、test hook で finish を BEGIN IMMEDIATE 直前に停止し、その間に users.disabled_at を設定してから再開"
expect_return_shape = "当該 user の有効 session 数は停止前と同じ（新規 session なし）、応答は 401、audit_events に action=login_mismatch の行が 1 件"

[[excluded]]
item = "TASK-147 新設案 auth-login.concurrent-same-counter-one-wins（同じ counter の assertion 2 本の並行 finish で成功は高々 1 本・clone 検知）"
source = "設計 tmp/tasks/tm-147/design_login-counter-toctou.md 4-3（統合または excluded をテスト作成工程で判断）・5章（concurrent-same-counter-one-wins は excluded とし理由に記載）"
reason = "同一 counter は webauthn-rs の `received <= stored` の等号ケースで、auth-login.concurrent-counter-monotonic の「A が 401」経路と同じ判定コードを通る（§8 書かない: 挙動に差を生まない重複 class）。SoftPasskey は署名ごとに counter を内部 increment するため同 counter の 2 本を直接作れない事情もある"
decided_at = "2026-11-01"
decided_by = "claude"

[[excluded]]
item = "TASK-147 のうち条件化しない項目: (1) counter 0 固定 authenticator（同期パスキー）の並行ログインがいずれも成功し backup flags が最新値に揃うこと (2) tx 内で pool から別 connection を acquire しない実装規律（self-deadlock 防止） (3) 失敗経路で COMMIT 自体が失敗したら 500（Db）を返し 401 に握りつぶさない (4) user 無効化側が無効化と同じ tx で既存 session を失効させている前提の確認 (5) identify 失敗経路と tx 内 mismatch 経路の応答時間差 (6) reauth（step-up）の counter 鮮度と tx 外更新（1-4・4-5） (7) spec_auth.md §2-4・§11-2 の文案改訂（「後から write lock を得た側」）"
source = "設計 tmp/tasks/tm-147/design_login-counter-toctou.md 3章（counter 0 authenticator への影響）・4-5（後続: reauth）・5章（実装規律・失敗経路の COMMIT 失敗・前提の明記・応答時間差・spec 文案）"
reason = "(1) SoftPasskey は counter を必ず increment し counter 0 の assertion を生成できず、counter 検査を行わないのは webauthn-rs の既定動作で本タスクの分岐ではない。(2) 違反すると既存・新設の login テストが busy_timeout まで停止して失敗するため既存テストで検出され、独立の振る舞い class ではない実装規律。(3) SQLite の COMMIT 失敗は結合テストで決定的に注入する手段がない（trigger は COMMIT を失敗させられない）。(4) 実装工程でコードを確認し報告する前提確認でありテスト条件ではない（設計5章）。(5) 設計が対応不要と判断（401 の形式の一様性は auth-login.mismatch-uniform-401-audited が担保）。(6) 別の仕組みが必要な後続タスクの範囲。(7) docs 更新という実装作業でありテスト条件ではない"
decided_at = "2026-11-01"
decided_by = "claude"

[[excluded]]
item = "TASK-140 のうち条件化しない項目: (1) token 行 SELECT 失敗（`.unwrap_or(None)`）を明示的な拒否として扱い fail closed を保つ書き換え（L3 後半） (2) 既に並存した family（同一 grant に参照される先端が 2 本以上）の運用者向け照会（L5） (3) parent_hash を正しく記録し手順2で盗用を検知する多重防御（案E・L7 の parent_hash 常時 NULL） (4) refresh の頻度・並行性が 60 秒猶予で足りるか・正規 client が検知に掛かるかの実機確認（3-1・spec_auth.md §12 項目6） (5) 猶予の短縮（案C）・猶予内再発行の廃止（案D）・冪等再送（案F）・sender-constrained token（案G） (6) spec_auth.md §4-9 手順1・3・§4-10・§11-5・spec_data-model.md §14・§15 の文案改訂（RejectedAfterRevocation→RejectedAfterCommit の表記修正を含む。L7・M3）"
source = "設計 tmp/tasks/tm-140/design_refresh-grace-revoke.md 3-1（既知のリスクと実機確認）・4章（代替案）・5-2（spec 改訂文案）・6章 L3・L5・L7・M3"
reason = "(1) 現行も SELECT 失敗は None として invalid_grant で拒否され観測される振る舞いが変わらない（§8 書かない: 挙動に差を生まない内部処理）上、SELECT だけを失敗させる注入手段がない。(2) 別タスク TASK-155 の範囲。(3) 既存 TASK-153 の範囲で本タスクは触れない（設計 L7）。(4) 実機確認であり自動テストの対象外（既存 §12 項目6 と一緒に別途起票）。(5) 不採用の代替案で振る舞いが存在しない。(6) docs 更新という実装作業でありテスト条件ではない（判定順そのものは auth-oauth.refresh-superseded-child-check-order が固定する）"
decided_at = "2026-11-01"
decided_by = "claude"

