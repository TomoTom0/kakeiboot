description = "画面内のデータ内容の遷移は共通component ContentSwap が唯一担う（設置箇ごとの個別実装をしない）。props は swapKey（コミット済み内容の識別子・例 ${ledgerId}|${mode}|${from}|${to}|${labels}）と dir（'forward' | 'back' | 'swap'）。swapKey は各ページの load() 確定時（コミット時）にだけ更新され、押下時・再取得中は不変——再取得中は既存のとおり旧データを dim 表示する二段描画（web-shell.loading-skeleton）が保存され、応答確定の瞬間に遷移が発火する（押してから応答までの間に旧表示がslideし去る不自然さがない）。dir は periodMove（period store を flush:'sync' で watch）が確定する: mode が変わった → swap / range の from が増えた → forward・減った → back（ISO日付文字列の辞書順=時間順比較）/ range 不変の変化（labelQuery・ledger・同範囲再取得）→ swap。期間step・mode切替・期間jump（trend bar 押下・週行押下・URL直link・range「表示」）・絞り込み変更・ledger切替がこれに乗る。dir='forward'/'back' は shell の RouterView と同じ構造・同じslide族CSS（slide-forward/slide-back・modeなし同時動作・leave-active absolute）を流用し、dir='swap' は reveal 語彙（.wipe: 進入 pane が不透明なまま clip で現れ、離脱 pane は下で不透明なまま待って消える。中間像を持たない）へ切り替える。初回出現（skeleton→実データの交代を含む）は appear reveal。prefers-reduced-motion では slide 語彙は class 付与なし（JS skip + CSS無効化の二重化）にし reveal 語彙は再生する（中間像を持たないため）・判定は reducedMotion.ts に一元化し navDirection.ts/trendWindow.ts の私有 matchMedia 判定は廃止）。Feed（ReceiptDetailPage）の内容再取得・並び替え（文脈・期間・ledger 変更の sequence 再fetch・未読込id の anchor並び替え）も ContentSwap・fade で遷移する（pageKey 不変のためページrootには class が付かない——web-browse.feed-no-remount との両立。読み込み済み sequence 内の prev/next は smooth scroll の移動語彙のまま・web-receipts.feed-prev-next）。TrendWindow の chart（TrendBars）は windowKey key 付けの fade を持たない（TASK-158 で廃止。設計上の発火想定だった「pane遷移を伴わない windowKey 単独変化」は実配線上存在しない——窓移動は slide が担い〔web-home.trend-window-slide〕、labelQuery・ledger 変化は windowKey 不変（窓は range 由来）で pane の fade に乗り、AxisDetail の subject 解決後の初回確定は TrendWindow の mount 前（各画面 v-if=win.result）に確定し、mode/range 変化は全4画面の committedKey が l|mode|range|labelQuery を含むため必ず pane commit が追従する。trend fetch は composable の flush:'sync' watch で page load と独立に確定するため、key 付け fade は期間移動の両方の到着順〔pane commit より先・pane 収束後〕で単独発火し二段演出になっていた——実機指摘「グラフを移動すると色が消える」）。windowKey 変化は TrendBars を再 key 付けせず即時差替え（.bars DOM 不変）で行われ、期間移動時は pane の slide のみが走り trend chart は pane 到着後の内容として現れる。ContentSwap は commit ごとに slot 内容を remount するため slot 内 component の局所stateはリセットされる（実装時確認事項: (1) slot 内の局所state〔scroll位置・展開状態・入力途中・測定値〕の棚卸し (2) remount で失って困る state は ContentSwap の外へ lift するか遷移keyへ織り込む (3) remount による focus 喪失・ResizeObserver 等の再登録副作用。WeekRows の trackW 測定値は onMounted の再測定で初回paintで確定・実害なし）。週行・ranked・recent などの個別zoneへの個別animationは設けない（ContentSwap が画面内容を1つの動きで遷移させ方向・位置のメリハリを1回で表現する）。値の書換（同一要素の text・icon名・数値の更新）は遷移対象外（topbar 文言・icon 等。設計§3「値の書換と遷移の境界」）。review MED1（dir の消費）: 方向値は1回のcommitで消費される——periodMove はページの committedKey に結び付き、その bump（load確定）を post flush で受けて dir を 'swap' へ戻す。よって期間step→commit の slide の後、period store を経由しないページ局所filter変更（Receipts の支払方法row押下等の listQuery 文脈・Search の条件・Feed の文脈等）の commit は常に fade で発火し、古い方向値の stale slide を再生しない。逆方向・連続stepは常に正しい方向を導出する（消費リセットは watch 導出を壊さない）。ContentSwap 側は commit の sync watch で語彙を capture して遷移に使い、commit 後に届く dir 変化（この commit 自体の消費リセット・遷移中の次押下）が走行中の遷移を再patchしない。review MED2（pane 再構築の行appear）: bb-appear 行list（Receipts 日グループ・Search 結果・Feed パネル群）は共通component AppearList が担い、ContentSwapActive が真の間の fresh mount（= pane 再構築そのもの）では行appearを切って pane の遷移を唯一の演出にする（全行への二重appear fadeを排除）。pane 遷移を伴わない fresh mount（「さらに表示」で開く新しい日グループ）は従来どおり行appear fade・既存list への追加行の enter は常に出現fadeのまま（appear 制御は fresh mount のみ対象）。TASK-161 §2-4（設計 tmp/tasks/tm-161/design_period_ui.md v2・指摘3）: 期間移動で content-pane 全体の slide/remount を発火させない——periodMove.ts は廃止され（micro move の方向は button/bar 押下側が直接渡す・SearchPage の import も削除）ContentSwap の page内利用は dir 既定 'swap'=fade のみになる（slide-forward/back 語彙は shell の RouterView 専用に残る）。committedKey から period 由来の range/query 成分は除外され期間変更が key を bump しない（画面別規則・行語彙は web-common.period-move-voice）。期間変更時の値単位の語彙（tween・micro move・crossfade・bar width transition・AppearList/FLIP）も web-common.period-move-voice が担う"
given = "ContentSwap を単体 mount（swapKey/dir を切替える・reduced-motion あり/なし）・periodMove を pinia 上で操作（committedKey の bump も含む）・ContentSwap+periodMove を1つの host に組んで step/局所filter commit を再現・AppearList を単体 mount（ContentSwapActive の provide true/false/なし）と ContentSwap pane 内で mount。Home を mount して時期チップ送りと mode 切替（load の fetch を遅延制御）・Feed で文脈変更。trend-window は windowKey 単独変化と slide 押下（期間stepの並走は Home mount で page load を gate し trend fetch 先確定を再現）"
expect_return_shape = "mount: slot 内容が1つ描画され wrapper root に content-swap class・初回は appear fade（子に page-enter-active・page-enter-from） / swapKey 切替 dir='forward': 入る子に slide-forward-enter-active・slide-forward-enter-from・出る子に slide-forward-leave-active（dir='back' は slide-back 側の同構成・dir='swap' は入る子 wipe-enter-active・出る子 wipe-leave-active）/ reduced-motion では swapKey 切替でも class 付与なし（即時入れ替え）/ ページ側: 期間step押下直後（load 未確定）は swapKey 不変で旧内容のまま dim（.view-stack の loading class）・応答確定の patch で子に slide class が発火 / mode 切替（月→週）は reveal（wipe-*）で発火 / trend chart: 期間移動の並走（trend fetch が pane commit より先に確定）でも chart 要素に enter/leave class なし・.bars DOM 不変（再 key 付けなし）で pane の slide が唯一の演出 / windowKey 単独変化でも chart 要素に page-enter-active なし（TASK-158 の即時差替え） / periodMove: setMonth(未来)→'forward'・setMonth(過去)→'back'・mode 変化→'swap'・range 不変の labelQuery 変化→'swap' / MED1 消費: committedKey bump の後 dir は 'swap' に戻る・bump を伴わない限り 'forward'/'back' は保持され、step→commit は slide-forward・その後の局所filterのみの commit は page-enter-*（slide class なし）・逆方向step→commit は slide-back-enter-* / MED2: AppearList は ContentSwapActive=true で mount された行に bb-appear class なし・false/未provide で mount された行に bb-appear-enter-from・追加行は true 中でも bb-appear-enter-from・ContentSwap 内では swapKey 切替で pane の ul のみ slide class を持ち行は bb-appear class なし / navDirection.ts・trendWindow.ts は reducedMotion.ts を import し私有の matchMedia 判定（function prefersReducedMotion 等）を持たない"

