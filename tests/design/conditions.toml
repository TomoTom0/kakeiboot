[[condition]]
id = "web-browse.url-pending-echo"
target_function = "web/composables/useBrowsingUrlSync.ts（ACK分類とURL import判定の経路集約: WeakMap による route 分類〔pending/owned-ack/stale-owned/boundary〕・未判定routeの保留・ACKならimport抑止・境界なら確定routeの通常import）"
source = "設計 tmp/tasks/tm-174/design_url-history-entries.md v4 D3-1（公開APIによる要求識別と観測写像）・D3-2（ACKの寿命: ACKは自身の返却Promiseがfailureなく完了し対応条件を満たし要求targetに確定した場合のみ。currentRouteのwatchが先に動く可能性を前提とし保留routeを同じ判定経路で解消。URL importはcoordinatorの判定経路に集約）・根拠（自発ACKをimportと区別することがstoreを最新操作の状態に保つために必須）"
source_lines = "frontend/tests/unit/web/url-sync.test.ts:771"
description = "識別可能区間では自発書き込みのACK分類とURL importを区別する。store=C のとき保留中の B へのpushがACKされても、storeを B へ巻き戻さず・B由来の再取得や追加のwriteを発しない。currentRouteのwatchが書き込みPromiseより先に動いてもrouteを保留して判定後に解消し、判定後のwatchでも分類を失わない（古いACKを新しい境界に流用しない）。外部popは境界として確定routeをimportする。同一URLへの外部要求や対応不明hookはACKせず境界処理へ移す。内部attemptの完全識別は要求しない"
