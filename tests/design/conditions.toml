[[condition]]
id = "web-browse.transition-direction"
target_function = "web/composables/navDirection.ts（direction ref・setNavIntent 一次性フラグ・updateDirection の規則1〜4・reduced-motion 上書き）・web/router.ts（afterEach から updateDirection・scrollBehavior）・web/App.vue（transitionName・:css 切替・pageKey）・web/styles.css（.slide-*・.app-main の position/overflow・reduced-motion 二重化）"
source = "docs/spec_mcp-tools.md §12（遷移は slide 遷移で、方向は history position と route depth から判定する〔TASK-74: afterEach で window.history.state.position を前回値と比較〕）"
source_lines = "frontend/tests/unit/web/transition.test.ts:288, frontend/tests/unit/web/transition.test.ts:358"
description = "shell 側 RouterView の遷移演出の方向は router.afterEach 内で window.history.state.position（vue-router が history state へ保存する位置番号）を module 内の前回値と比較して決める（catalog・history.listen 不使用）: (1) navigation failure、または position 不変〔replace。Feed のスクロール id 書き換え・チップ ×・期間変更〕→ none (2) position 減〔戻る〕→ back (3) position 増〔push〕: navIntent='back' または to.meta.depth < from.meta.depth → back / to.meta.depth > from.meta.depth → forward / 同 depth かつ両方 1 → none / 同 depth かつ depth >= 2 → forward（depth 未設定〔設定・管理・公開系〕は比較のどれにも該当せず none）(4) position 不変で name 変化〔replace による別ルート。家計簿切替の Feed → 一覧〕→ none。初回（前回値なし）は none。navIntent は PageHead の ‹ が push 直前に setNavIntent('back') でセットする一次性フラグで、afterEach の全経路で読み取り直ちにリセットされる。direction（forward/back/none の ref）は App.vue の transitionName（slide-forward/slide-back/空文字）へ反映し、none は :css=false で演出を出さない（name 空文字で v- 接頭辞 class を当てないため）。CSS は .app-main に position: relative と overflow-x: clip を追加し、slide-forward は enter-from translateX(100%)・leave-to translateX(-30%) + opacity 0、slide-back は対称（-100% / +30%）。leave-active は position: absolute; top: 0; left: 0; width: 100% で旧ページを flow から外し、transition は transform 220ms cubic-bezier(.2,.7,.2,1) + opacity 220ms・mode 指定なし（同時動作）。prefers-reduced-motion: reduce では matchMedia を見て direction の結果を none へ上書きし、CSS 側でも同じ media query 内で slide 系の transform・transition を無効化する（二重化）"
given = "history.state.position を任意値に設定しての遷移（position 増減・不変）と depth 付き/無しルートの組合せ・navIntent セット済みの push・failure・初回。実 mount での push（一覧→詳細）と戻り"
expect_return_shape = "規則どおり direction が forward/back/none に決まり navIntent は1遷移で消費される（次は none） / 実 mount の push で入ってくるページの root に slide-forward-enter-active・-enter-from class・離れる側に slide-forward-leave-active が付き（jsdom は stylesheet 無しでも patch 内で付与）戻りは slide-back 側の同構成 / reduced-motion では class なし・direction も none / styles.css に .app-main の position: relative と overflow-x: clip・slide 両方向の対称 transform・leave-active の absolute 化・220ms の transition・reduce 内の無効化がある"

