# TASK-39 画面遷移のアトミック化+アニメーション。実機指摘「遷移や変化のばらばらな切替・突然の変化が非常多い」の
# 原因（P1: showShell が route と session.me の独立非同期AND で中間フレーム必発、P2: loading が1行テキストで統一なし、
# P3: 家計簿切替でtopbar色だけ先に変わる、P4: 全route lazy import で初回遷移がchunk待ち、P5: Transition/Suspense 不在）へ の
# 対策。正本は docs/spec_mcp-tools.md §12（遷移と状態変化の統一〔A: アトミック化、B: 同期import、C: アニメーション、D: loading 統一〕）へ反映済み。
# 条件は web-shell.atomic-mount・sync-route-imports・page-transition・loading-skeleton の新設4件と
# web-shell.ledger-color-band の改訂（P3 の色帯・チップ遷移）。docs/spec_mcp-tools.md §12 へ反映。

[[condition]]
id = "web-shell.atomic-mount"
target_function = "web/main.ts（isReady 待ち mount）・web/pages/LoginPage.vue・RegisterPage.vue（完了時の me 確定→遷移）・web/App.vue（logout）・web/setup.ts（onUnauthorized）"
source = "docs/spec_mcp-tools.md §12（遷移と状態変化の統一: アトミック化〔対策A〕）"
source_lines = "frontend/tests/unit/web/auth-pages.test.ts:73, frontend/tests/unit/web/transition.test.ts:25"
description = "初回ロードは router.isReady() を待ってから mount する（未確定 route の空描画なし）。login・register の完了は遷移前に session.loadMe() で me を確定させてから router.replace('/') する（login/finish 応答は {next} のみで user を含まないため、確定に GET /api/auth/me を1回使う。guard は session.me があれば fetch しないため再fetch往復が消え、shell と main が同フレームで切り替わる。OAuth 同意の consent 分岐は公開画面のため me 確定不要で従来どおり clear して遷移）。logout・401 時は route 遷移が確定してから session.clear() する（shell 消滅と main 切替が同フレーム。setup.ts の 401 hook は replace の .finally で clear、公開画面にいるときは直接 clear）"
given = "login 完了（next=home）/ register 完了 / ログアウト押下 / 401 応答。main.ts・LoginPage・RegisterPage・App.vue・setup.ts の source"
expect_return_shape = "main.ts で router.isReady() が .mount('#app') より前 / login・register 完了後 route が / で shell（sidebar）が存在し GET /api/auth/me は1回のみ・await session.loadMe() が router.replace('/') より前・LoginPage の session.clear() は consent 分岐の1箇所のみ・RegisterPage に session.clear() なし / logout・401 は router.replace('/login') が session.clear() より前（setup.ts は .finally(() => session.clear())）"

[[condition]]
id = "web-shell.sync-route-imports"
target_function = "web/router.ts（route component の同期 import）"
source = "docs/spec_mcp-tools.md §12（遷移と状態変化の統一: 同期 import〔対策B〕）"
source_lines = "frontend/tests/unit/web/transition.test.ts:56"
description = "router.ts の全 route component は同期 import で登録し、`() => import()` の lazy import を持たない（ページ合計約4,700行で bundle 増は軽微）。初回遷移の度の chunk 読み待ちが無くなり、遷移のばらつきが出ない。テスト側 helpers.ts の preloadPages（lazy component の事前読み込み）も不要になり削除する"
given = "router.ts と frontend/tests/unit/web/helpers.ts の source"
expect_return_shape = "router.ts に () => import( の記述が無い・helpers.ts に preloadPages が無い"

[[condition]]
id = "web-shell.page-transition"
target_function = "web/App.vue（showShell の v-if/v-else branch 切替を包む外側・public 内 RouterView・shell 内 RouterView の方向ベース Transition〔transitionName・pageKey・after-enter〕）・web/pages/SettingsPage.vue（設定tab の内側 RouterView）・web/pages/settings/AuthPanel.vue（単一root）・web/styles.css（.page-*・.slide-*・.app-main・.msg・reduced-motion）"
source = "TASK-39 ユーザー追加指摘（アニメーションがなく突然の変化が多い）・docs/spec_mcp-tools.md §12（遷移と状態変化の統一: アニメーション〔対策C〕。実機再指摘〔設定tab 切替にアニメーションが効いていない。AuthPanel が複数root のため Transition が skip〕・実機follow-up〔login→home は showShell の v-if/v-else branch 切替を伴い、branch 切替には Transition が無かった〕。TASK-74: shell 側 RouterView の遷移を方向判定ベースへ改訂〔:name=transitionName〔forward→slide-forward・back→slide-back・none→空文字 + :css 切替〕・mode なし・:key は route.path の第1セグメント。外側分岐 fade・public 側 RouterView の fade・SettingsPage 内側 fade は不変〕）"
source_lines = "frontend/tests/unit/web/styles.test.ts:461, frontend/tests/unit/web/transition.test.ts:62, frontend/tests/unit/web/transition.test.ts:87, frontend/tests/unit/web/transition.test.ts:136, frontend/tests/unit/web/transition.test.ts:207, frontend/tests/unit/web/transition.test.ts:240"
description = "App.vue の shell/public 分岐を包む外側 Transition と public 側 RouterView（login/register/consent）は name=\"page\"・mode=\"out-in\" の fade のまま（login→home・logout・401 の branch 切替は外側 Transition が担う。両branch のroot は div.shell・main.public の単一root）。shell 側 RouterView は TASK-74 で方向ベースへ: Transition の :name は direction（forward→slide-forward・back→slide-back・none→空文字で :css=false も付き演出を出さない）・mode 指定なし（新旧ページの同時動作）・:key は route.path の第1セグメント（/receipts/123 は 'receipts'・/settings/general は 'settings'。Feed のスクロール URL 書き換えで remount しない・設定tab は全ルート同 key のため shell 側は remount せず SettingsPage 内側 RouterView の fade が維持される・一覧→詳細は component が変わるため通常どおりスライド）。SettingsPage の内側 RouterView（設定の水平tab）は name=\"page\"・mode=\"out-in\" の fade のまま component :is に route key を付ける。内側の切替が実挙動としてアニメーションするには切替成分が単一root element であることも必要: AuthPanel の3カードは1つの div（.settings-panel）にまとめ、component :is には route key を付ける（同名 component を使い回す切替でも remount させる）。複数root の panel は fragment のため Transition は class 付与を丸ごと skip する（Vue は \"renders non-element root node that cannot be animated\" を警告）。ページ遷移の fade（.page-*）は opacity + 8px の translateY の 0.2s ease で、prefers-reduced-motion: reduce では無効化する（transition-duration 0s・transform none）。スライド系 CSS（.slide-*・.app-main の position/overflow・leave-active の absolute 化）は web-browse.transition-direction・web-browse.reduced-motion 条件の期待に含む。.msg（エラー・情報メッセージ）とコピー完了表示は v-if で挿入されたとき 0.16s の fade-in（@keyframes bb-fade-in。reduced-motion では none）で出現する。popover・drawer の開閉機構は既存のまま変えない"
given = "ページ遷移・設定tab 切替・login→home / logout のbranch 切替・エラー/コピー完了の出現（reduced-motion あり/なし）。App.vue・SettingsPage.vue・AuthPanel.vue・styles.css の source と、設定tab・branch 切替を実際に切替えた mount"
expect_return_shape = "App.vue に name=\"page\" + mode=\"out-in\" の Transition が2箇所（branch 切替を包む外側1 + public RouterView 1。外側が v-if=\"showShell より前）・shell 側 RouterView は :name=\"transitionName\" + :css=\"transitionName !== ''\" + @after-enter で component :is に :key=\"pageKey\"（第1セグメント）付き・mode 指定なし / SettingsPage.vue に1箇所（RouterView v-slot）で component :is に :key（route.name）付き・AuthPanel.vue は単一root（div.settings-panel）・設定tab 切替（general→auth・auth→general）で離れる側の root に page-leave-active・page-leave-from class が付き（jsdom は stylesheet 無しのため inline transition-duration で観測）out-in により次の panel は leave 完了後に mount・旧 root は除去される・設定tab・manage 画面の切替を通じて settings-nav 要素は同一 DOM node のまま（shell 側の remount なし）・branch 切替（login→home・logout の replace→clear）で離れる側の root に page-leave-* class が付き out-in により次 branch は leave 完了後に mount・離れる branch の中身は切替前の画面のまま（login→home で home が旧branch 内に二重mount せず home の stats fetch は1回のみ）・全tab と manage 画面の切替で cannot be animated 警告なし / styles.css の .page-enter-active が opacity と transform の 0.2s ease・.page-enter-from が opacity 0 + translateY(8px)・.page-leave-to が opacity 0・prefers-reduced-motion 内で .page-* の transition-duration 0s と transform none・.msg が bb-fade-in 0.16s ease（reduced で animation none）"

