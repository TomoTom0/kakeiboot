description = "内訳ランキングの各行は行内 bar（TASK-129 から DOM bar・bar 長=行value/画面scale×track実測〔web-common.bar-scale・web-common.row-bar-component〕。bar 色は --rank-color〔RankedList が seriesColor(row.keys[0] ?? null, axis) を計算して渡す・axis prop 未指定なら共通写像・web-common.series-color-assignment〕）で示し、上位 N 外の残余は「ほか n件・計xx円」形式の集計行（旧「その他」行の形式変更）。残余「ほか」行は前端生成で share を持たないが、bar 長は残額 value から直接決まる（絶対scale化で share の丸め・欠落・limit 超過が bar 計算に不関与となり構造解消。ranked-share の % は表示専用で「ほか N件」行の % 空欄も現行どおり。TASK-161 §5: Home の内訳zone は PeriodHeader 直下へ移り（web-home.breakdown-absolute-ticks）、TASK-162 §1 で Home の内訳本体は 1本stacked bar（BreakdownBar）へ置換された — ranked-row の「ほか」行形式は /categories 等の ranking surface が現行どおり担ぎ、残余行は analysis 応答の truncated_rows > 0 で組み立てられる（browser 検証は上位5行+truncated tail の seed で行う）。% share 列は /categories 等の ranking surface では現行どおり残る）。行頭には 12px の丸 swatch（.ranked-swatch・background: var(--rank-color)）を全行で常時描画し（残余行・非リンク行を含む）、Home 内訳の上位行 swatch・bar は系列色・残余「ほか n件・計xx円」行と店不明行は null 写像で自動的に var(--series-rest)。残余行も上位行と同じ形式（行は web-common.data-row-grammar の共通2行 — TASK-167 で旧1行 44px min-height は廃止。上位行は主行+副行（代表品目+share）で ~72px・残余「ほか」行は副行なしの 52px floor・diff 列は TASK-93 で廃止）"
given = "上位5行+truncated tail（truncated_rows > 0）の内訳データで /categories を開く"
expect_return_shape = "各上位行に行内 DOM bar（.row-bar・長さ=value/scale×track）と swatch・残余行が「ほか n件・計xx円」で上位行と同じ形式（行罫。金額セルは残余金額） / 上位行の swatch と行内 bar が系列色（--rank-color=seriesColor 値）・残余行の swatch・bar は rest グレー（var(--series-rest)） / 残余行（share 無し）の bar 長も上位行と同一尺度（value/scale×track・他行との長さ比=金額比）で描かれる"

