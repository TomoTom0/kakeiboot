source = "TASK-72 ユーザー実機指摘「hoverの効果がない」〔TASK-42確認項目「当月の強調が棒色」の回帰。設計§1-1〕・設計 tmp/tasks/tm-130/design_trend-bar-hover-current.md v2 §2-1（hover=列背景wash・@media (hover: hover) ガード・radius/transition は .bar-col 側へ常時付与・旧 .bar-col:hover .bar は復活させない）・§2-2（current=常時の列背景wash主軸+値label前景強調の併用・0円currentでも成立・hover wash は current 規則より後置で優先）・§5（旧2規則と .bar transition の削除・DOM 不変）"
