description = "topbar は .main-col の外（.shell 直下）の全幅 sticky で、sidebar（全幅帯で fixed overlay）と mobile の scrim は topbar の下端（var(--topbar-h)）から下にだけ展開する。topbar の z-index は sidebar・scrim より大きい（topbar が覆われない）"
