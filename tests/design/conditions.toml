reason = "表示しないことの要求で分岐を持たない（§8「書かない」: 挙動に差を生まない）。実装に該当表示が無いことはレビューで確認する"
decided_at = "2026-10-14"
decided_by = "claude"

# ---------------------------------------------------------------------------
# TASK-11 widget（frontend/src/widget・frontend/src/shared）。正本は docs/spec_mcp-tools.md §11（widget）と §3-2・§6・§7・§10 の I/O、
# docs/spec_auth.md §6-3・§6-4（ledger 表示）。backend 非依存でモック host（window.openai 相当）と fixture で検証する。

[[condition]]
id = "widget.routes-by-view"
target_function = "widget App.vue / useWidgetStore.init（VIEWS・isWidgetEnvelope）"
source = "docs/spec_mcp-tools.md §11-1（1テンプレート SPA・structuredContent.view でルーティング）・§11-2（view 一覧）・TASK-18 設計 tmp/tasks/tm-18/design_mcp-batch.md 2-7（VIEWS と isWidgetEnvelope に draft_batch を追加。body.drafts が配列かつ batch_id が string か null のときだけ受理）"
source_lines = "frontend/tests/unit/widget/navigation.test.ts:20, frontend/tests/unit/widget/navigation.test.ts:38"
description = "toolOutput の view（draft / draft_list / draft_batch / receipt / receipt_list / item_list / stats）に応じて対応する画面コンポーネントを描画する。draft_batch は drafts が配列で batch_id が string か null のときだけ受理し、不正形は描画しない"
given = "各 view の fixture を toolOutput に持つ host で init + mount。draft_batch は batch_id=文字列と null に加え drafts 非配列・batch_id 欠落の不正形"
expect_return_shape = "view ごとに draft-screen / draft-list-screen / draft-batch-screen / receipt-screen / receipt-list-screen（receipt_list・item_list 共通）/ stats-screen が描画される。draft_batch の不正形は error 表示"

[[condition]]
id = "widget.initial-and-invalid-output"
target_function = "useWidgetStore.init / isWidgetEnvelope"
source = "docs/spec_mcp-tools.md §11-3（toolOutput で初期表示）・§3-2（envelope の view）"
source_lines = "frontend/tests/unit/widget/navigation.test.ts:52"
description = "toolOutput が無い間は初期表示、未知 view や本体キー欠落の structuredContent は描画せずエラー表示にする"
given = "toolOutput = null、toolOutput = {view: 'catalog'}、toolOutput = {view: 'draft'}（draft 欠落）"
expect_return_shape = "null は初期表示（initial）。後二者は error 表示で画面コンポーネントは描画されない"

[[condition]]
id = "widget.host-fallback-without-openai"
target_function = "host.resolveHost"
source = "docs/spec_mcp-tools.md §11-1（host.ts の adapter 経由・window.openai が無いホストへのフォールバック余地）・TASK-11 widget 委任指示（openai が無い開発環境はモックで動作）"
source_lines = "frontend/tests/unit/widget/host.test.ts:13, frontend/tests/unit/widget/host.test.ts:25"
description = "window.openai があれば openai host、無ければ開発時はモック host、本番 build ではどのホストにも接続しない null host を返す"
given = "window.openai あり / なし（dev=true）/ なし（dev=false）"
expect_return = "kind がそれぞれ openai / mock / none"

[[condition]]
id = "widget.call-result-normalization"
target_function = "host.normalizeCallResult"
source = "docs/spec_mcp-tools.md §11-3（callTool の戻り値の structuredContent / _meta で状態更新）・§14 T10（戻り値の形は実機確認待ち）"
source_lines = "frontend/tests/unit/widget/host.test.ts:40"
description = "callTool の戻り値は CallToolResult 形（structuredContent・_meta・isError・content）と {result: ...} 包みの両方を受け、structuredContent・meta・isError・text に正規化する。不正値は isError 扱い"
given = "CallToolResult 形、{result: CallToolResult}、null"
expect_return_shape = "前二者は同じ正規化結果（text は content の text 連結）、null は isError=true"

[[condition]]
id = "widget.approve-sends-revision"
target_function = "useWidgetStore.approve / DraftScreen 承認ボタン"
source = "docs/spec_mcp-tools.md §11-3（承認ボタンの状態遷移: disabled + 登録中 → callTool(approve_receipt_draft, {draft_id, revision})）・§7-4（revision 必須）"
source_lines = "frontend/tests/unit/widget/approve.test.ts:11"
description = "承認ボタンは表示中 draft の draft_id と revision を付けて approve_receipt_draft を callTool し、応答待ちの間は disabled で「登録中」を表示する"
given = "pending draft（draft_id=12, revision=2）表示中にボタンを押し、callTool を未解決のまま保持"
expect_return_shape = "callTool が ('approve_receipt_draft', {draft_id: 12, revision: 2}) で 1 回呼ばれ、ボタンは disabled かつ文言「登録中」"

[[condition]]
id = "widget.approve-success-persists-state"
target_function = "useWidgetStore.approve / persistState"
source = "docs/spec_mcp-tools.md §11-3（成功・冪等成功 → 「登録しました（家計簿 X / レシート #id）」、setWidgetState({approved_receipt_id})）・TASK-18 設計 tmp/tasks/tm-18/design_mcp-batch.md 2-7（承認済み状態を単一 approved_draft_id から approved: Record<draft_id, receipt_id> の map へ拡張。単一 view も map を参照）"
source_lines = "frontend/tests/unit/widget/approve.test.ts:29, frontend/tests/unit/widget/approve.test.ts:43"
description = "承認成功（冪等成功を含む）で「登録しました（家計簿 X / レシート #id）」を表示しボタンを消し、widgetState に承認済み map（draft_id → receipt_id）を保存する"
given = "approve_receipt_draft が isError=false・draft.status=approved・receipt_id=101 を返す"
expect_return_shape = "メッセージ「登録しました（家計簿 我が家 / レシート #101）」、承認ボタンなし、setWidgetState の引数の承認済み map に 12 → 101 が入る"

[[condition]]
id = "widget.approve-stale-rerenders"
target_function = "useWidgetStore.approve（stale_revision 分岐）"
source = "docs/spec_mcp-tools.md §11-3（stale_revision → 最新内容に描き直し「内容が更新されています。確認して再度登録してください」、自動で再承認しない）・§4（stale_revision は isError + 最新 draft）"
source_lines = "frontend/tests/unit/widget/approve.test.ts:54"
description = "isError で最新の pending draft が返ったら最新 revision で描き直し、案内文を出してボタンを再有効化する。自動で再承認しない"
given = "approve_receipt_draft が isError=true・draft.revision=3（pending、明細変更あり）を返す"
expect_return_shape = "rev 3 と変更後の明細が表示、「内容が更新されています」を含むメッセージ、ボタンは有効、callTool は 1 回のみ。再押下で revision=3 が送られる"

[[condition]]
id = "widget.approve-conflict-hides-button"
target_function = "useWidgetStore.approve（conflict 分岐）"
source = "docs/spec_mcp-tools.md §11-3（conflict（discarded / expired / 別 revision で approved）→ 状態表示、ボタン非表示）"
source_lines = "frontend/tests/unit/widget/approve.test.ts:73"
description = "isError で pending 以外（discarded / expired / approved）の draft が返ったら状態文言を出し、承認ボタンを表示しない"
given = "approve_receipt_draft が isError=true・draft.status=discarded を返す / status=approved（approved_receipt_id=77）を返す"
expect_return_shape = "それぞれ「破棄されています」「別の内容で登録済みです（レシート #77）」を含むメッセージ、承認ボタンなし"

[[condition]]
id = "widget.approve-other-error-reenables"
target_function = "useWidgetStore.approve（その他エラー分岐）"
source = "docs/spec_mcp-tools.md §11-3（その他エラー → エラー文表示、ボタン再有効化）"
source_lines = "frontend/tests/unit/widget/approve.test.ts:88"
description = "draft を含まない isError 応答や callTool の例外では、エラー文を表示してボタンを再有効化する（draft 表示は変えない）"
