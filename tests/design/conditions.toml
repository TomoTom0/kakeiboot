# TASK-11 web 画面（frontend/src/web）。正本は docs/spec_auth.md（§2 登録・ログイン・step-up・パスキー管理、§3 web セッション・CSRF・§3-2 API 表、§4-2・§4-6 同意、§4-11・§6-1 接続中のアプリ）と
# docs/spec_mcp-tools.md（§12 web 画面とのサービス層共有、§7-9〜7-14 レシート・カテゴリ・店の操作、§13 店の統合は web のみ、§11-6 XSS）、docs/spec_data-model.md §5（カテゴリ・店・名寄せ・merge）。
