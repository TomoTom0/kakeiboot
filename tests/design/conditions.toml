# TASK-39 画面遷移のアトミック化+アニメーション。実機指摘「遷移や変化のばらばらな切替・突然の変化が非常多い」の
# 原因（P1: showShell が route と session.me の独立非同期AND で中間フレーム必発、P2: loading が1行テキストで統一なし、
# P3: 家計簿切替でtopbar色だけ先に変わる、P4: 全route lazy import で初回遷移がchunk待ち、P5: Transition/Suspense 不在）へ の
# 対策。正本は docs/spec/spec_mcp-tools.md §12（遷移と状態変化の統一〔A: アトミック化、B: 同期import、C: アニメーション、D: loading 統一〕）へ反映済み。
# 条件は web-shell.atomic-mount・sync-route-imports・page-transition・loading-skeleton の新設4件と
# web-shell.ledger-color-band の改訂（P3 の色帯・チップ遷移）。docs/spec/spec_mcp-tools.md §12 へ反映。

[[condition]]
id = "web-shell.atomic-mount"
target_function = "web/main.ts（isReady 待ち mount）・web/pages/LoginPage.vue・RegisterPage.vue（完了時の me 確定→遷移）・web/App.vue（logout）・web/setup.ts（onUnauthorized）"
source = "docs/spec/spec_mcp-tools.md §12（遷移と状態変化の統一: アトミック化〔対策A〕）"
source_lines = "frontend/tests/unit/web/auth-pages.test.ts:127, frontend/tests/unit/web/transition.test.ts:46"
description = "初回ロードは router.isReady() を待ってから mount する（未確定 route の空描画なし）。login・register の完了は遷移前に session.loadMe() で me を確定させてから router.replace('/') する（login/finish 応答は {next} のみで user を含まないため、確定に GET /api/auth/me を1回使う。guard は session.me があれば fetch しないため再fetch往復が消え、shell と main が同フレームで切り替わる。OAuth 同意の consent 分岐は公開画面のため me 確定不要で従来どおり clear して遷移）。logout・401 時は route 遷移が確定してから session.clear() する（shell 消滅と main 切替が同フレーム。setup.ts の 401 hook は replace の .finally で clear、公開画面にいるときは直接 clear）"
given = "login 完了（next=home）/ register 完了 / ログアウト押下 / 401 応答。main.ts・LoginPage・RegisterPage・App.vue・setup.ts の source"
expect_return_shape = "main.ts で router.isReady() が .mount('#app') より前 / login・register 完了後 route が / で shell（sidebar）が存在し GET /api/auth/me は1回のみ・await session.loadMe() が router.replace('/') より前・LoginPage の session.clear() は consent 分岐の1箇所のみ・RegisterPage に session.clear() なし / logout・401 は router.replace('/login') が session.clear() より前（setup.ts は .finally(() => session.clear())）"

[[condition]]
id = "web-shell.sync-route-imports"
target_function = "web/router.ts（route component の同期 import）"
source = "docs/spec/spec_mcp-tools.md §12（遷移と状態変化の統一: 同期 import〔対策B〕）"
source_lines = "frontend/tests/unit/web/transition.test.ts:77"
description = "router.ts の全 route component は同期 import で登録し、`() => import()` の lazy import を持たない（ページ合計約4,700行で bundle 増は軽微）。初回遷移の度の chunk 読み待ちが無くなり、遷移のばらつきが出ない。テスト側 helpers.ts の preloadPages（lazy component の事前読み込み）も不要になり削除する"
given = "router.ts と frontend/tests/unit/web/helpers.ts の source"
expect_return_shape = "router.ts に () => import( の記述が無い・helpers.ts に preloadPages が無い"

[[condition]]
id = "web-shell.page-transition"
target_function = "web/App.vue（showShell の v-if/v-else branch 切替を包む外側・public 内 RouterView・shell 内 RouterView の方向ベース Transition〔transitionName・pageKey・after-enter〕）・web/pages/SettingsPage.vue（設定tab の内側 RouterView）・web/pages/settings/AuthPanel.vue（単一root）・web/styles.css（.page-*・.slide-*・.app-main・.msg・reduced-motion）"
source = "TASK-39 ユーザー追加指摘（アニメーションがなく突然の変化が多い）・docs/spec/spec_mcp-tools.md §12（遷移と状態変化の統一: アニメーション〔対策C〕。実機再指摘〔設定tab 切替にアニメーションが効いていない。AuthPanel が複数root のため Transition が skip〕・実機follow-up〔login→home は showShell の v-if/v-else branch 切替を伴い、branch 切替には Transition が無かった〕。TASK-74: shell 側 RouterView の遷移を方向判定ベースへ改訂〔:name=transitionName〔forward→slide-forward・back→slide-back・none→空文字 + :css 切替〕・mode なし・:key は route.path の第1セグメント。外側分岐 fade・public 側 RouterView の fade・SettingsPage 内側 fade は不変〕）+ TASK-146 §3 遷移全数表 #2（push/pop で方向の定まらない遷移全般の fade 化・navKind 区分。設計 tmp/tasks/tm-146/design_period_navigation.md §3）"
source_lines = "frontend/tests/unit/web/styles.test.ts:524, frontend/tests/unit/web/transition.test.ts:83, frontend/tests/unit/web/transition.test.ts:113, frontend/tests/unit/web/transition.test.ts:162, frontend/tests/unit/web/transition.test.ts:233, frontend/tests/unit/web/transition.test.ts:268, frontend/tests/unit/web/transition.test.ts:485, frontend/tests/unit/web/transition.test.ts:507"
description = "App.vue の shell/public 分岐を包む外側 Transition と public 側 RouterView（login/register/consent）は name=\"page\"・mode=\"out-in\" の fade のまま（login→home・logout・401 の branch 切替は外側 Transition が担う。両branch のroot は div.shell・main.public の単一root）。shell 側 RouterView は TASK-74 で方向ベースへ: Transition の :name は direction（forward→slide-forward・back→slide-back）・mode 指定なし（新旧ページの同時動作）・:key は route.path の第1セグメント（/receipts/123 は 'receipts'・/settings/general は 'settings'。Feed のスクロール URL 書き換えで remount しない・設定tab は全ルート同 key のため shell 側は remount せず SettingsPage 内側 RouterView の fade が維持される・一覧→詳細は component が変わるため通常どおりスライド）。TASK-146 §3 #2 で方向の無い遷移は fade 化する: transitionName 計算は direction と navKind の両方を見て、direction が none でも navKind が push/pop（同depth(1)同士のtab切替・depth未設定route〔/settings配下・apps・usage・manage-*〕への移動を含む方向の定まらない遷移全般）なら name=\"page\" の fade（:css も true）とし、navKind が replace（Feed のスクロールURL書換・chip×・期間変更のURL sync・search debounce）のみ空文字 + :css=false の無演出のまま（履歴を変えない表示維持操作は遷移ではない）。SettingsPage の内側 RouterView（設定の水平tab）は name=\"page\"・mode=\"out-in\" の fade のまま component :is に route key を付ける。内側の切替が実挙動としてアニメーションするには切替成分が単一root element であることも必要: AuthPanel の3カードは1つの div（.settings-panel）にまとめ、component :is には route key を付ける（同名 component を使い回す切替でも remount させる）。複数root の panel は fragment のため Transition は class 付与を丸ごと skip する（Vue は \"renders non-element root node that cannot be animated\" を警告）。ページ遷移の fade（.page-*）は opacity + 8px の translateY の 0.2s ease で、prefers-reduced-motion: reduce では無効化する（transition-duration 0s・transform none）。スライド系 CSS（.slide-*・.app-main の position/overflow・leave-active の absolute 化）は web-browse.transition-direction・web-browse.reduced-motion 条件の期待に含む。.msg（エラー・情報メッセージ）とコピー完了表示は v-if で挿入されたとき 0.16s の fade-in（@keyframes bb-fade-in。reduced-motion では none）で出現する。popover・dialog・scrim の開閉は TASK-146 §3 で appear fade を得る（web-common.overlay-transition）"
given = "ページ遷移・設定tab 切替・login→home / logout のbranch 切替・同depth同士のpush（/receipts→/categories）・depth未設定routeへのpush（/receipts→/settings/general）・replace（Feed のスクロール書換）・エラー/コピー完了の出現（reduced-motion あり/なし）。App.vue・SettingsPage.vue・AuthPanel.vue・styles.css の source と、設定tab・branch 切替・同depth/depth未設定 push を実際に切替えた mount"
expect_return_shape = "App.vue に name=\"page\" + mode=\"out-in\" の Transition が2箇所（branch 切替を包む外側1 + public RouterView 1。外側が v-if=\"showShell より前）・shell 側 RouterView は :name=\"transitionName\" + :css=\"transitionName !== ''\" + @after-enter で component :is に :key=\"pageKey\"（第1セグメント）付き・mode 指定なし・transitionName 計算が navKind を参照する（direction none + navKind push/pop → 'page'） / 同depth(1)同士の push（/receipts→/categories）と depth未設定routeへの push（/receipts→/settings/general）で入ってくるページrootに page-enter-active・page-enter-from class・離れる側に page-leave-active（jsdom は stylesheet 無しでも patch 内で付与）・replace は class なし（:css=false のまま） / SettingsPage.vue に1箇所（RouterView v-slot）で component :is に :key（route.name）付き・AuthPanel.vue は単一root（div.settings-panel）・設定tab 切替（general→auth・auth→general）で離れる側の root に page-leave-active・page-leave-from class が付き（jsdom は stylesheet 無しのため inline transition-duration で観測）out-in により次の panel は leave 完了後に mount・旧 root は除去される・設定tab・manage 画面の切替を通じて settings-nav 要素は同一 DOM node のまま（shell 側の remount なし）・branch 切替（login→home・logout の replace→clear）で離れる側の root に page-leave-* class が付き out-in により次 branch は leave 完了後に mount・離れる branch の中身は切替前の画面のまま（login→home で home が旧branch 内に二重mount せず home の stats fetch は1回のみ）・全tab と manage 画面の切替で cannot be animated 警告なし / styles.css の .page-enter-active が opacity と transform の 0.2s ease・.page-enter-from が opacity 0 + translateY(8px)・.page-leave-to が opacity 0・prefers-reduced-motion 内で .page-* の transition-duration 0s と transform none・.msg が bb-fade-in 0.16s ease（reduced で animation none）"

[[condition]]
id = "web-shell.page-vocab-inflow-out-in"
target_function = "web/pages/ReceiptsPage.vue（.kpi-sub を囲む keyed Transition）・web/styles.css（.page-* fade語彙の定義comment）"
source = "styles.css の .page-* 定義comment（a short fade with a slight upward drift, out-in so the old page leaves first and the layout never shows both stacked）・PR#4 review（TASK-171）: keyed な .kpi-sub の Transition に mode=out-in が無く既定の同時modeで旧・新の2行が約200ms並列でin-flowに存在し、KPIカードが一瞬2行分に伸びて下位コンテンツが跳る指摘"
source_lines = "frontend/tests/unit/web/transition.test.ts:747"
description = "page fade語彙（.page-enter/leave）を in-flow の要素入れ替えに使うcallerは mode=out-in を設定する。語彙の契約は out-in（旧要素が先に離れ、layout に新旧が並列で載らない）で、App.vue の両 RouterView caller と SettingsPage のtab切替は従来どおり設定済み。既定の同時modeでは fade 中に旧・新両要素が in-flow に並存し、収め（KPIカード等）が一瞬複数行分に伸びて下位コンテンツが跳るため、RouterView 以外のcaller（ReceiptsPage の期間stepによる .kpi-sub の range keyed 入れ替え）も同じ契約に揃う"
given = "ReceiptsPage で期間を step 移動する（.kpi-sub が期間rangeの key で入れ替わる）"
expect_return_shape = "ReceiptsPage.vue の .kpi-sub を囲む Transition が name=page かつ mode=out-in を持つ（page fade語彙の in-flow caller に同時modeの使用が無い）"

[[condition]]
id = "web-shell.loading-skeleton"
target_function = "web/components/DashSkeleton.vue（TASK-105 で .view-stack+.zone ブロック構造のシルエットへ書換）・web/pages/HomePage.vue・CategoriesPage.vue・StoresPage.vue・ReceiptsPage.vue・AppsPage.vue（初回 loading と再取得）・web/styles.css（.skeleton・.sr-only）"
source = "docs/spec/spec_mcp-tools.md §12（主要データ画面の初回 loading は dash-grid と同形状の skeleton に統一〔対策D〕）+ TASK-105（.dash-grid 廃止に伴い DashSkeleton は .view-stack+.zone ブロック構造のシルエットへ・.dash-grid.loading は .view-stack.loading に合流・設計 tmp/tasks/tm-105/design_dashboard-visual.md §5-4）"
source_lines = "frontend/tests/unit/web/account-pages.test.ts:856, frontend/tests/unit/web/dashboard-shell.test.ts:713, frontend/tests/unit/web/dashboard-shell.test.ts:730, frontend/tests/unit/web/styles.test.ts:548, frontend/tests/unit/web/styles.test.ts:1057, frontend/tests/unit/web/view-pages.test.ts:686"
description = "主要データ画面（ホーム・カテゴリ・店・レシート一覧）の初回 loading は画面の .view-stack+.zone ブロック構造と同形状の skeleton（DashSkeleton.vue。CSSのみ・.skeleton class・単色で shimmer なし・全体（card を含む）が load 開始から 250ms の間は不可視〔その間に終わる速い load では一切現れない〕で、その後 fade-in し、block が opacity の pulse〔bb-sk-pulse 1.5s〕を load の間続ける。TASK-105 で旧 .dash-grid シルエットから zone ブロックのシルエットへ書換）で統一し、1行テキスト「読み込んでいます...」を出さない。小さい一覧（接続中のアプリ）も同一の .skeleton block（最小の card）で揃える（公開の認証画面〔同意・登録〕は対象外）。skeleton の装飾 block は aria-hidden=\"true\" とし、.sr-only の「読み込んでいます...」で読み上げは維持する。skeleton⇔実データの交代は handover の cross-fade（離れる側を absolute に退避して重ね、入る側が fade-in する）で遷移する（空白・即時入れ替えのどちらもない。主要4画面〔ホーム・カテゴリ・店・レシート一覧〕）。同一家計簿内の再取得（月切替・絞り込み）は既存データを不透明のまま残す（skeleton に戻さない・薄める中間状態〔dim〕は一切置かない。ContentSwap は swapKey を load 確定時にだけ変えるため押下時・再取得中は旧内容がそのまま保たれ、応答確定の瞬間に方向付き遷移が発火する）。家計簿切替は再取得ではなく文脈切替として扱う: 旧家計簿の内容は切替の瞬間に消え、skeleton が load を覆って、確定の瞬間に新家計簿の内容が現れる。trend zone も窓移動・再fetch 中に薄めない（旧窓の棒が不透明のまま残る。旧 .view-stack.loading / .zone.is-loading の opacity 規則は廃止）。レシート一覧は初回完了フラグ loaded で切替え、スクロール復帰の lookup はフラグ確定の後）"
given = "データ未取得で /・/categories・/stores・/receipts・/apps を開く / 読込完了後に月を切替える。styles.css を読む"
expect_return_shape = "初回は data-test=\"loading\" の .skeleton（aria-hidden=\"true\"・.sr-only に「読み込んでいます...」）で kpi・summary・grant 行等の実データを描かない / 完了後に skeleton が消え実データ（.view-stack 内の content-swap の子要素に appear fade の enter class） / 同一家計簿の再取得中は旧内容が不透明のまま残り skeleton に戻らない（.view-stack.loading・.zone.is-loading の opacity 規則は存在しない） / 家計簿切替中は旧家計簿の内容が消え skeleton が現れる / styles.css に .skeleton（opacity 0 から 250ms 遅延で全体が fade-in）・.skeleton .sk（var(--bb-surface-2) の単色・bb-sk-pulse の pulse）・.handover の cross-fade 規則と .sr-only があり reduced-motion 側で animation none・opacity 1（即時・静止）"

