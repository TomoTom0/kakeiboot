source = "TASK-55 起票・TASK-57 監査 A8（62日超でカードが消える）・docs/spec/spec_mcp-tools.md §12（日別の支出）+ TASK-105（card から zone 化・見出しの可視 zone-title 化・.dash-cols 左列への割当・設計 tmp/tasks/tm-105/design_dashboard-visual.md §5）+ TASK-116（棒の積み上げ化・trend fetch limit 1→5・設計 tmp/tasks/tm-116/design_breakdown-expansion.md §3-2）+ TASK-123（セグメント文法の全面改訂: 上位3+ほか・縁取り・cap 角・§4-5 配分規則・ユーザー実機指摘 2026-10-29・設計 tmp/tasks/tm-123/design_breakdown-visual.md v5 §4-1/§4-3/§4-4/§4-5）"
