# push（writeBack 原因別 push/replace 判定・one-shot nextWrite フラグ+残留防止3規則）・browsing 系 topbar ‹
# 新設（router.back・境界 fallback=pushToParent+境界更新・ルート4画面は境界で非表示・in-flight guard）・
# AxisDetail PageHead ‹ 除去（TASK-145 D2-2 の現在値 carry 廃止）・期間 pop は同一 path 判定で scroll 維持・
