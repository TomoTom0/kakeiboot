[[condition]]
id = "auth-oauth.refresh-revoke-write-failure-db-error"
target_function = "auth::oauth::token::refresh（grant 失効・旧子 access 失効・旧子 refresh 行失効の UPDATE の失敗）"
source = "設計 tmp/tasks/tm-140/design_refresh-grace-revoke.md 6章 L3（失効 UPDATE は `let _ =` でなく失敗時 db_error。既存の同形3箇所と手順3の access 失効も同じ形に揃える）"
source_lines = "backend/tests/oauth_refresh.rs:924"
description = "refresh() 内で grant 失効や旧子と対の access 失効の UPDATE が失敗した場合は、失効が記録されないまま invalid_grant を COMMIT したり新ペアを発行したりせず、server_error（500）で rollback する"
given = "trigger で UPDATE を RAISE(ABORT) させ、(a) 猶予超過の R 再送（grant 失効が失敗） (b) grant の client_id を別 client に変えた R の提示（client_mismatch の失効が失敗） (c) 猶予内の R 再送（旧子と対の access 失効が失敗） (d) 猶予内の R 再送で oauth_refresh_tokens の BEFORE UPDATE OF revoked_at trigger（旧子 refresh 行の失効が失敗。TASK-140 review LOW-2）"
expect_return_shape = "いずれも 500 で error=server_error。grant の revoked_at は NULL のまま、親 R の child_hash は C1 のまま（rollback）"

[[condition]]
id = "auth-oauth.refresh-superseded-child-survives-sweep"
target_function = "auth::oauth::token::refresh・store::cleanup_expired（失効済み refresh 行の保持）"
source = "docs/spec/spec_auth.md §4-9 手順1（期限切れの旧の子も grant 有効なら reuse・sweep の保持規則）・docs/spec/spec_data-model.md §12・§14 手順1（TASK-140 review MEDIUM-1）"
source_lines = "backend/tests/oauth_refresh.rs:701"
description = "grant が有効な間、差し替え済みの旧の子（失効済み refresh 行）は期限 + 1 日を過ぎても maintenance sweep で削除されず、後から提示されれば refresh_reuse で family を失効させる"
given = "R→C1、R 再送→C2 の後、C1 の expires_at を3日前へ操作して cleanup_expired を実行し、C1 で refresh"
