source = "ユーザー実機指摘 2026-10-26 TASK-104・設計 tmp/tasks/tm-104/design_trend-window.md（v2・REVIEW-21 指摘8件対応済み）§2・§7-3 + TASK-108（ページ送り版のmock・期待値〔mock 2025-12 追加・offset=6/12 の2ページ構成・初期窓全0は 2025-04 選択〕・設計 tmp/tasks/tm-108/design_trend-window-page.md（v3・REVIEW-25 承認）§1-6・§4-6・§6-2）+ TASK-115（cacheヒットコミット時も同式で即時再計算・設計 tmp/tasks/tm-115/design_trend-continuous-window.md（v3・承認済み）§3-1）+ ユーザー実機指摘 2026-11-03 TASK-161 指摘1（設計 tmp/tasks/tm-161/design_period_ui.md（v2）§1-3: offset 依存条件の廃止・対称化・初期両true）+ PRレビュー指摘 2026-11-07 PR#4 #4（E4・refresh の commit 経路でも lastMove をリセット: 失敗した窓移動は lastMove を commit なしに残留させ、その後の E4/refresh の all-zero commit が「失敗した移動」の痕跡で実際にはその方向の移動で到達していない all-zero 窓の chevron を誤 disable する）"
source_lines = "frontend/tests/unit/web/trend-window.test.ts:611, frontend/tests/unit/web/trend-window.test.ts:663, frontend/tests/unit/web/trend-window.test.ts:1726"
description = "全zero floor（zero-fill 相手に trend API が無限に応答するための実用打ち切り）は prev/next 対称の条件で管理する: canPrev = !(当該窓が全zero かつ 直近の窓移動が prev) / canNext = !(当該窓が全zero かつ 直近の窓移動が next)。初期状態（移動履歴なし）は両方 true（記録の無い月でも1窓ぶんの移動は常に可能——旧「全zero初期窓でも prev は生かす」保証の等価一般化。offset>=1 限定判定は絶対窓化〔TASK-161〕で廃止）。時間方向の上限は設けない（TASK-146 の未来解禁を窓でも維持。旧「初期anchorを超えない」下限は撤回・廃止——絶対窓に anchor は存在しない）。全zero floor は「dataの無い方向への自由paging停止」であり period 移動（web-common.period-step の step button）は無制限のため指摘1の導線は閉じない。記録のない期間が連続する家計簿では休止期間の手前で打ち切られ、その先は focus（period）移動で到達する。移動でない commit 経路（E4: labelQuery 変更の同一窓再fetch・明示 refresh()）は移動履歴（lastMove）をリセットする（PR#4 #4: 失敗した窓移動は lastMove を commit なしに残留させるため、リセットしないと E4/refresh の all-zero commit が失敗移動の痕跡で chevron を誤 disable する——移動でない commit は移動履歴を持たない）。cacheヒットコミット時も fetch 確定時と同一式・同値で即時再計算する（fetch応答を待たない・prefetch は canPrev/canNext に影響しない）"
given = "今日=2026-10-15。mock 2025-12・2026-06〜10月に記録（2025-12 以外の 2026-05 以前はゼロ）で / を月モード（選択月 2026-10）で開き trend-prev を押下し続ける（2窓過去で窓は 2025-05〜2025-10 の全0）/ 記録がなく初期窓が全0になる選択月（2025-04）でも開く"
expect_return_shape = "1窓過去（bar-2025-11〜bar-2026-04・2025-12 に記録があり総和>0）では trend-prev が有効なまま / 2窓過去（bar-2025-05〜bar-2025-10・bucket_totals 総和0）を表示した時点で trend-prev が disabled（prefetch で cache 済みのため prev 押下の同期タイミングで即時 disabled） / trend-next 押下で1窓過去へ復帰し trend-prev が再び有効 / 初期コミット確定直後（移動履歴なし）は trend-prev・trend-next ともに enabled（初期両true） / 初期窓が全0（2025-04 選択）でも移動履歴が無い限り trend-prev・trend-next ともに disabled にならない"

