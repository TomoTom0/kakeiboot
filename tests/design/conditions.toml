[[condition]]
id = "web-shell.navigation"
target_function = "web/App.vue（サイドバー・下部タブ・SECTION_TITLES・topbar の page title）・router /settings"
source = "TASK-14（ユーザー指摘: home と settings の混同、タブがアイコンでない、サイドバーが無い）・docs/spec_mcp-tools.md §12（NAV はデータ4節、設定・接続中のアプリは右上メニュー、pageTitle は SECTION_TITLES。ホームでは title 省略〔TASK-16〕。sidebar 見出しの brand リンクを削除し sidebar はナビ + 利用者表示のみ〔TASK-27〕。TASK-35: SECTION_TITLES を {title, icon} に拡張し NAV と一本化、表題テキストの左に該当節の AppIcon を併記）・docs/spec_mcp-tools.md §12（TASK-56: sidebar の主 nav の下に区切り付きで設定 nav を追加。tabbar は4節のまま）"
source_lines = "frontend/tests/unit/web/dashboard-shell.test.ts:268"
