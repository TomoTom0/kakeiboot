[[condition]]
id = "web-home.trend-granularity"
target_function = "web/components/TrendBars.vue（granularity prop・全粒度 axisTickIndices 間引き軸）・web/composables/trend.ts（trendGranularity・bucketSpan・spanGranularity・currentTrendKey）・web/pages/HomePage.vue（粒度別の trend call 切替）"
source = "TASK-55 起票（推移が絞り込んでいる粒度に追従・その中での内訳も）・docs/spec/spec_mcp-tools.md §12（推移は TrendBars・粒度規則）+ ユーザー実機指摘 2026-10-25 TASK-100（間引き軸ラベル・全棒 .bar-val・注記全廃）・設計 tmp/tasks/tm-100/design_trend-chart-axes.md（v3）"
source_lines = "frontend/tests/unit/web/dashboard-shell.test.ts:669, frontend/tests/unit/web/trend-granularity.test.ts:25"
description = "推移グラフは期間の粒度に追従する。月/年モードは月棒（月モードの初期窓〔focus変更直後〕は選択月を含む6か月窓・年は12か月〔web-browse.trend-month-window〕。前次操作で過去方向へスライド可〔web-home.trend-window〕。track は月棒本数で minmax(1.25rem,1fr)〔6本以下〕と minmax(0,1fr)〔dense・7本以上〕。TASK-104 の前次button対が zone 幅を96px占めたため6本以下の最小値は 2rem→1.25rem・.bars/.axis-labels の gap は 0.25rem に全帯共通化され、420px 以下の帯では軸tickは 0.65rem+端tickの端揃え〔dense と同文法〕で360pxに収まる）。週モードは選択週の7本の日棒（getAnalysisTrend granularity=day・零埋めはbackend・title/aria は「10月10日（土） N円」）。range モードは範囲長で決める（62日以下=日棒・63..366日=月曜アンカーの週棒〔週棒の押下でその週の週モードへ〕・366日超=月棒〔dense 同等の縮小+間引き〕）。週棒の title は bucket の実範囲「10/5〜10/11 N円」。軸ラベルは全粒度で axisTickIndices 間引き（day/week は shortDate・月は axisMonthLabels の items〔web-browse.trend-axis-minimal〕）。値ラベル（.bar-val）は全棒に付く（compactYen・0円は空。day/week は非denseのため全棒のまま）。日棒は button で押下するとその日のレシート一覧へ遷移する（web-home.trend-day-bar-receipts）。注記行（trend-note）は存在しない（web-browse.trend-note-removed）。日・週粒度の棒の track は minmax(0.25rem,1fr) の縮小トラック（月棒の 1.25rem 最小のままでは53本の週棒が収まらない）。Home は全モードで getAnalysisTrend を使用する（TASK-89 で summary 依存は解消済み。月モードは TASK-103 で選択月の週粒度 trend をも追加取得〔web-home.week-card〕）"
given = "今日=2026-10-15。/ を月モード（6本・月軸）・週モード前週（7本日棒）・range 2026-10-03..10-15（13本日棒）・range 2026-08-01..10-15（週棒）で開く"
