[[condition]]
id = "auth-login.counter-regression-rejected-audited"
target_function = "auth::ceremony::login_finish（sign counter 逆行）"
source = "docs/spec/spec_auth.md §2-4（逆行は webauthn-rs の拒否に従いログイン失敗とし audit に counter_regression（credential id 付き）を記録）・TASK-147 設計 tmp/tasks/tm-147/design_login-counter-toctou.md 4-3（given を実テストに合わせ改訂・検証失敗 audit は tx 内に書き COMMIT 後に 401）"
source_lines = "backend/tests/auth_login_session.rs:235"
description = "保存値を超えない counter の assertion は拒否され、audit に counter_regression が記録される（同一 assertion の再送＝リプレイは challenge の1回限り消費で counter 検査より先に弾かれるため、この条件は保存 counter 側を受信値以上にして作る）。counter 逆行以外の検証失敗（署名不正等）は別 action の login_failed として audit される。TASK-147 以降これらの audit は BEGIN IMMEDIATE 内に書き COMMIT してから 401 を返す"
