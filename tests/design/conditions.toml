expect_return_shape = "listReceipts に from/to/store/item_query/category/include_deleted・q・store_id が渡り limit/cursor 以外の文脈が欠けない。パネルが DOM 順で 101・102・103。q つき文脈の feed-back の href に q= が残る。route.query → ReceiptListQuery → route.query と ReceiptListQuery → route.query → ReceiptListQuery がいずれも元と一致し、CONTEXT_FIELDS のキー集合が ReceiptListQuery の（limit・cursor を除く）キー集合と一致する"

