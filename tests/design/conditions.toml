source = "docs/spec_auth.md §4-6"
reason = "応答ヘッダは HTML を配信する側（backend の静的配信。未実装）でしか付与できず、frontend（SPA）からは付与できない（meta 要素の frame-ancestors はブラウザが無視する）。frontend 側は多層防御として iframe 内での描画拒否を web-frame.framed-page-refuses で条件化した。ヘッダ付与は backend の frontend 配信実装時に条件化する（TASK-11 web 担当の引継ぎ事項）"
decided_at = "2026-10-14"
decided_by = "claude"

[[excluded]]
item = "request_recovery の匿名経路（Authorization 無しでの tools/call 通過・二重防御の AuthContext 無し許可）と §8-2 の DB ベース rate limit 本体"
source = "docs/spec_auth.md §5-2・§8-2（TASK-7 項目17 の実装ゲート）"
reason = "TASK-7 項目17（ChatGPT が接続切れ状態から noauth tool を発見・呼び出せるか）の確認前のため実装しない。CLI 側の依頼テーブル操作と匿名経路のアプリ内 limiter 設定（recovery_anonymous_per_minute）は Phase B で実装・条件化する"
decided_at = "2026-10-14"
decided_by = "claude"

[[excluded]]
item = "safe_fetch における名前解決結果の private アドレス拒否の実接続検証（DNS を返すモック）"
source = "docs/spec_auth.md §4-3"
reason = "実 DNS 解決を伴う検証はローカルテストで外部依存が生じるため実施しない。is_forbidden_ip の分類単体テスト（auth-oauth.private-ip-classification）と URL host のリテラル判定で担保し、resolver は同一関数を使う"
decided_at = "2026-10-14"
decided_by = "claude"

[[excluded]]
