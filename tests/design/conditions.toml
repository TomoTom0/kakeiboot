description = "期間移動（step・bar押下・popover・URL jump。全経路がperiod store変更に集約）は他の内容変更と同じ遷移で確定する（2026-11-24 ユーザー指示: 期間移動専用の仕組みは作らず、他の場合と同じアニメーションにする）。規則: committedKey = ledger + mode + labels + 画面固有条件 + 期間（urlQuery）で、期間変更は mode/labels/ledger の変更と同様に key を bump し、pane は ContentSwap の swap 語彙（reveal）で切り替わる: 進入 pane は不透明なまま clip で上から下へ覆いが解けていき、離脱 pane はその下に不透明なまま待って最後に消える。両状態が混ざるフレームも、半透明の中間像も存在しない（crossfade の中間像は 100ms 程度の一瞬でも視覚的ストレスになる — 2026-11-24 ユーザー指摘）。slide は発火させない（月の移動はページ遷移ではない）。画面別: Home/Categories は ${l}|${mode}|${labels}|${urlQuery}・Stores は+storeCategory・AxisDetail は route.fullPath を「path+期間query以外のquery（subject key）」へ置換したもの+urlQuery・Receipts は listQuery() そのもの（from/to=期間境界を含むため期間が key に入る）。Search は対象外（pageQuery の期間成分を key から除外し scope を明示的に含む従来規則のまま・PR#4 #5）。進入する pane は確定時点の完成した状態で mount される（金額・バーは mount の初期値として最終形であり、pane の中では数え上げ・モーフは起きない）。期間内変化の遷移語彙（共通契約・既存文法の拡張で新規bar実装は作らない）: 金額数値=tween（rAF約300ms・tabular-numsで桁揺れなし・PeriodHeader総額・RankedList/WeekRows金額・kpi値で使用。レビュー高1/中6+PR#4 #1で確定: committedKeyがbumpする変更（内容swap・pane fadeが演出）とmount時初期値は即時確定し〔出現の即時表示は v-if 配下mount時の初期値が担い、composable側の出現特例は廃止——呼び出し元はすべて初回load commit後の v-if 内にmountするためwatchの初回発火は最初の期間移動であり、特例はその初回移動のtweenを無アニメーション化するのみ〕、mount後の最初の変更もtween・tween中の再targetは現在の表示値から補間・0遺移もtween・旧frameは必ず停止して確定値の復活を起こさない）・期間label（「2026年9月」）=方向micro move+fade（移動方向へ約16-24px・150ms・PeriodHeader内。Receipts kpi頭も同語彙。レビュー中5で確定: mount時点の期間を基準に初回移動でも発火し・同方向連打はclass付け直しでなく再始動する）・その他text=keyed span crossfade（150ms・Receipts kpi-subは期間range keyedでpage fade語彙。レビュー中6）・bar長=width/height transition 220ms（.row-bar/.row-seg/TrendBars stack・web-common.row-bar-thickness）・行の追加/削除/並び替え=AppearList化（bb-appear: enter/leave fade+小translate・move=FLIP。RankedList/WeekRows。期間変更は pane の crossfade が担い、行単位の遷移は重ねない）・空状態=bb-fade-in。prefers-reduced-motion では slide と値の遷移を即時化するが、ContentSwap の swap 語彙（reveal）は再生する（どのフレームも完成した状態だけで中間像を持たないため。止めると対象端末で切り替えに一切アニメーションが出なくなる）。periodMove.ts は廃止（§4のmicro moveはbutton押下・bar押下側で方向を直接渡す）し、ContentSwap のslide語彙（slide-forward/back）はshell画面遷移（RouterView）専用に残る（本件のpage内利用はdir既定'swap'=fadeのみになる）。SearchPage.vue の periodMove import削除を含む期間の表示ラベル（各画面の期間ヘッダーとトップバーの期間チップ）は表示中データの属する期間を示すもので、step 押下では変わらず各画面の load 確定時にだけ切り替わる（period store の committedLabel/committedLabelShort。取得中は確定済み期間の label が残り、データより先に新しい月の名前だけが出る状態は作らない）。推移の現在月ハイライトも確定済み月（committedMonth）に従う。期間の確定は「完成した状態が1つのアニメーションで現れる」形とする（ユーザー実機指摘 2026-11-24: アニメーションの無い即時切替は違和感として却下され、数え上げ tween やバーのモーフのように変化の途中経過を見せる形も「前の月の情報が残る」として却下された）: その1つのアニメーションは pane の reveal であり、進入 pane は完成した状態で現れる。pane 内の要素単位の出現は ContentSwap の単一演出原則（ContentSwapActive）で抑えられ、確定の動きは crossfade だけになる。専用の到着アニメーション（WAAPI 駆動・epoch 等）は作らない — 他の内容変更と同じ ContentSwap の fade を使うのが規則（2026-11-24 ユーザー指示）。tween 等の値の遷移は期間内の値変化（編集等）にだけ残る。"
