[[condition]]
id = "auth-oauth.pkce-verification"
target_function = "auth::oauth::authorize::pkce_matches / token::code_exchange"
source = "docs/spec_auth.md §4-5・§4-7"
source_lines = "backend/tests/oauth_token.rs:115"
description = "code_verifier 検証は BASE64URL(SHA256(verifier)) == challenge（不一致は invalid_grant で code 消費済み）、verifier の形式違反（短い・長い・不正文字）も invalid_grant で code 消費"
given = "正しい verifier での交換成功と、不正 verifier・形式違反での交換"
