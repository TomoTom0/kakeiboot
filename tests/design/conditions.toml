[[condition]]
id = "deploy-ops.configs-command"
target_function = "kakeiboot_ops.build_configs_commands / configs subcommand（--env必須）"
source = "docs/ops/ops_deploy.md §configs〔TASK-189 実装で追加。設計: tmp/tasks/tm-189/design_promote.md D-7-1・D-7-2〕"
source_lines = "scripts/deploy/test_kakeiboot_ops.py:1841, scripts/deploy/test_kakeiboot_ops.py:1907"
description = "configsのprod配布を独立した明示的オペレーションとする subcommand: --envは必須（choices stg/prod）で・操作列は mkdir -p <deploy_root>/<env>/configs/<env>（初回構築の前提dir）→ rsync -a --no-perms --omit-dir-times --delete --checksum -i configs/<env>/ → <deploy_root>/<env>/configs/<env>/（repo→host方向・rsync_exec）→ 転送木のモード正規化（運用者自身の find/chmod〔deploy-ops.mode-normalization〕・--preview 時は付かない）の3 step。--checksumは同一性判定の正確性のため。restart・healthzは含めない（backendはconfigを起動時に1回読み込みreload機構が無く・configs操作がrestartを内蔵すると旧binary×新configsの組で起動する機会を機構的に増やすため。反映はpromoteのrestartまたは明示的なservice操作が担う）"
given = "transport=local と transport=ssh・runtime_host=gt430 の各cfg・env=prod"
expect_return_shape = "3 argv: [mkdir, -p, <deploy_root>/prod/configs/prod] と [rsync, -a, --no-perms, --omit-dir-times, --delete, --checksum, -i, configs/prod/, <deploy_root>/prod/configs/prod/] とモード正規化の [sh, -c, find...chmod...]（ssh時はmkdirと正規化がssh wrap・rsyncが -e option + host:接頭）。操作列に systemctl を含まない。--env 無しのparseはSystemExit"

[[condition]]
id = "deploy-ops.configs-preview-flag"
target_function = "kakeiboot_ops.build_configs_commands（--preview flag）/ configs subcommand"
source = "docs/ops/ops_deploy.md §configs〔TASK-189 実装で追加。設計: tmp/tasks/tm-189/design_promote.md D-7-1（--preview）〕"
source_lines = "scripts/deploy/test_kakeiboot_ops.py:1894, scripts/deploy/test_kakeiboot_ops.py:1908"
description = "--preview flagはrsyncにrsync自身の --dry-run を付与して実行する（転送なし・-i の差分だけ表示）。これがconfigs乖離確認の正経路（promote内の補助表示〔deploy-ops.promote-configs-preview〕とは別の独立した確認操作で・判断の時間的余白を提供する）。scriptの --dry-run（plan表示のみ・コマンド非実行）とは違い・--preview は差分の実体を見せる。--preview 無しの通常実行ではrsyncに --dry-run は付かない。preview は書き込みゼロが契約のため、モード正規化 step も preview 時は付かない（操作列は mkdir + rsync の2 stepのまま）"
given = "parserで [configs, --env, prod, --preview] と [configs, --env, stg] をparse・およびbuild_configs_commands のpreview引数両値での操作列構成"
expect_return_shape = "--preview 付きは rsync options に --dry-run が加わり・--preview 無しでは --dry-run が現れない。parserは args.preview=True/False を返す"

