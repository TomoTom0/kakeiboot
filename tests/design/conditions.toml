reason = "サブ手順は仮文言（固有メニュー名を含む）を docs/usage の本文として持つ実装済みで、実機確認で実UIに合わせて差し替える。画像は入手後に差し替える（差し替え手順に web-usage.figures 期待値の反転を含む）。差し替えが文言内容の範囲を超えてサブ手順の段数・構成の変更を伴う場合（例: 実機確認で開発者モード不要と判明し 5→4 段になる等）は excluded の範囲外とし、web-usage.chatgpt-link の期待値（li 件数）をその時点で改訂する。placeholder 分岐と figure 構造は web-usage.figures で、文言の枠組み（3ステップ・許可内容の語彙）は web-usage.connect-steps で条件化済み"
decided_at = "2026-10-24"
decided_by = "claude"

