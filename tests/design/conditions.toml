# feed-edit-suspends-nav と [[excluded]] 3 件（Feed 2 件・topbar 狭幅 1 件）の位置で反映。
# web-receipts.feed-snap-class は廃止し web-receipts.feed-no-snap（下記）へ id を置換した。
# TASK-27 レビュー（REVIEW-2 再レビュー）の high 指摘対応で web-shell.menu-btn-desktop-hidden を追加したが、
# 実機指摘（TASK-33 追加指摘: desktop でも sidebar を閉じたい）により menu ボタンは全幅で常時表示へ変わったため
# web-shell.menu-btn-desktop-hidden を廃止し web-shell.menu-btn-always-visible（下記）へ置換した。
# あわせて web-shell.drawer-closes-on-desktop-resize も廃止し web-shell.nav-open-state-on-resize へ置換した
# （900px 越えで閉じる仕様は、開閉状態を維持したまま sidebar 列へ切り替わる仕様へ変わったため）。

# TASK-33 実機指摘（2026-10-17: desktop 折りたたみが grid-template-columns の瞬時切替+display:none で
# アニメーションが無い・sidebar の出し入れで main が広がり位置が変わるのはおかしい）:
# desktop 折りたたみ（sidebar-collapsed・grid 列切替・display:none）を廃止し、sidebar をモバイル drawer と同じ
# fixed overlay 方式に統一した（main は常に全幅で位置不変・slide 0.2s・desktop 初期 open で scrim なし・
# 899px 以下は従来の modal drawer）。これに伴い web-shell.sidebar-overlay を新設し、
# web-shell.menu-btn-always-visible・web-shell.drawer-below-topbar・web-shell.nav-open-state-on-resize を改訂した。

