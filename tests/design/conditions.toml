source_lines = "frontend/tests/browser/verify.spec.ts:2436, frontend/tests/unit/web/url-sync.test.ts:437, frontend/tests/unit/web/url-sync.test.ts:460"
description = "tabbar 外画面（/settings/{general,auth,data,others}・/settings/{categories,stores,labels}・/apps・/usage・/usage/connect）の topbar に ‹（戻る）が置かれる（TASK-164 で /search は browsing 側へ移管し除外・10画面に縮小）。位置は brand 直後・topbar 表題の直前（menu-btn の直後は menu と隣接し不採用）。chevron-left の icon-only 44px で aria-label は「〈親名〉へ戻る」（親名は親section の表示名: / はホーム・/settings/data はデータ・/settings は設定・/settings/others はその他）。押下は PageHead と同じ parentTo への router.push + setNavIntent('back')（up 语义: 直リンクでも動き slide は back 方向。history back でない）で親マップの親 path へ遷移する。閲覧系5画面+/search と Axis 詳細は TASK-164 §2-4 で browsing 側の ‹（router.back + 境界 fallback）へ移管し（web-shell.browsing-back・web-browse.nav-boundary・Axis の PageHead ‹ は除去）、feed（一覧 link が既有）には引き続き topbar の ‹ は置かない。管理画面のデータtab active 表示（aria-current）は残る"
given = "10画面を開き ‹ の存在・位置（topbar children 順）・aria-label・icon-only を確認して押下する / '/'・'/receipts'・'/categories'・'/stores'・'/axes/category/1'・'/receipts/101'（feed）では不在を確認する（/search・閲覧系・axes の ‹ は web-shell.browsing-back・web-browse.nav-boundary・web-axis.page-back-removed）"
expect_return_shape = "全10画面で [data-test=topbar-back] が .topbar 内の .topbar-brand より後・h1.topbar-title より前に存在し svg のみを含み（text なし）・aria-label が「ホームへ戻る」（settings 4panel）/「データへ戻る」（manage-* 3画面）/「設定へ戻る」（/apps）/「その他へ戻る」（/usage・/usage/connect） / 押下で親 path（/・/settings/data・/settings・/settings/others）へ遷移し navigation は push・direction='back'（up 语义） / /receipts/:id（feed）には存在せず /search・/axes/* の topbar ‹ は browsing 側（常在・aria-label「戻る」）で /axes/* の .page-head 内 [data-test=page-back] は廃止・閲覧系ルート画面は境界位置で不在（web-browse.nav-boundary）"

[[condition]]
id = "web-browse.url-diff-guard"
target_function = "web/App.vue（shell 層の共通 URL 同期 composable: 差分ガード〔現在の route.query の keys から算出した状態が store と一致するときは書かない〕と echo 番人〔自発 replace の route 変化に反応しない〕）"
source = "設計 tmp/tasks/tm-124/design_spa-url-routing.md v2 §3 D2-6（差分ガード: 取り込み直後の watch 発火で同一 URL への無駄な replace を発行しない。echo 番人併用。ループ防止）・§3 D5 テスト計画 (i)。改訂 2026-11-10 TASK-174（設計 tmp/tasks/tm-174/design_url-history-entries.md v4 D2・影響>条件書の改訂方針）: 書き込みは単一FIFOのenqueue時no-op判定とACK区別で説明し直す — no-op判定は直前の操作の正規化状態またはqueue末尾を反映した論理状態に対して行い（確定route Aだけを基準にB→Aを削除しない・非連続の同値targetを重複排除しない）、自発書き込みのACKとURL importはcoordinatorの判定経路で区別する（web-browse.url-pending-echo）"
source_lines = "frontend/tests/unit/web/url-sync.test.ts:313"
description = "取り込みで store と URL keys が一致した直後の書き込みや、自発書き込みのACK確定では同一 URL への無駄な書き込みを発行しない。TASK-174 D2 以降の枠組みでは: enqueue 時の no-op 判定は直前の操作の正規化状態、または queue 末尾を反映した論理状態に対して行い（確定 route A だけを基準に B→A を削除しない・非連続の同値 target を重複排除しない）、自発書き込みの ACK と URL import は coordinator の判定経路で区別する（ACK なら import 抑止・境界なら確定 route の通常 import）。これがないと取り込み→書き戻しの echo が書き込みを連鎖させる"
given = "keys 無しで / を開き（既定月 2026-10 の書戻りで /?month=2026-10 が1回）・同一 query への再 replace（取り込み経由の一致）を行う"
expect_return_shape = "keys 無し流入の書き戻しは差分があるため1回だけ発行され / 再 replace（URL 変化なし）の取り込み経路では追加の router.replace は呼ばれない / ACK された自発書き込みは import に読み替えられず連鎖書き込みを起こさない"

