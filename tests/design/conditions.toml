expect_return_shape = "URL は labels=red を得るが month・from・to は載らない（期間送りの後も） / carry 流入の着地 URL は q と labels のみで month・from・to を持たない / keys 付き流入は取り込み（store は URL の期間に追従）の後、最初の writeBack で month・from・to が URL から消え q のみ（labels 未選択なら labels も無し）になる"

