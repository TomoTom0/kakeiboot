description = "trend縦棒のbar幅上限とtrack余白を縮小する: (1) bar幅上限を34px→48pxへ引き上げ、--trend-bar-w で一元管理する（--row-bar-h と対称）。bar幅は min(cell幅, 48px) の単一規則 — TrendBars（.bar/.bar-stack）と Receipts（.daily-bar・cell内中央配置）の両縦棒DOMがこの単一規則に乗る（疎なgrid〔5日範囲等〕でbarがcell幅へ伸びきらない）。cap半径 min(2, width/4)=2px不変（半径の幅基準も min(cell, token)）(2) JS mirror（TrendBars segW・Receipts dailyColW系の数値直置き）は廃止し shared/lib/barWidth.ts の barWidthCap（getComputedStyle で --trend-bar-w を読む）で読む（tokenと測定値の単一source・両DOMが同一helperを共有）(3) y軸gutterを2.5rem→2.25remへ（tick値実幅検証の上・実装時に±0.25remの調整可）(4) chevron対（trend-nav）を中列の外へ出す: 現行は trend-window grid の両側auto列（88px+gap16px）が中列を圧迫し狭幅で余白の主因（360px帯で中列≈220px・6cell≈22px）。navをplot上端帯（bar-val headroom・gridline帯）への絶対配置とし中列幅を約88px取り戻す（360px帯で中列≈308px・cell≈44px — 狭幅のbar幅・縦書きlabel余白がともに改善）。44px tap target・icon文法・ariaは不変。chevronはbarと重ならない位置（headroom+上端gridline帯）に置く。TASK-104のtrack minmax（1.25rem floor）はこの変更後に再検討（中列が広がるためwrap抑制要件は緩和）(5) zone paddingは本件では不変（全zone共通tokenの変更は全画面影響のため対象外。実測で外側余白が主因となる場合は全zone共通での圧縮を別件起票候補）(6) 実測は グラフ外側余白（zone content左端→plot左端・plot右端→zone content右端）とcell内bar間隔（cell幅−bar幅）を分けて検証する — 外側余白は assert 付き（左端=gutter+gap組成のみ・右端≈0）で検証し、nav対の配置は「plotのx-span上に重なる」実測で旧両側auto列配置と判別可能にする（中7）"
