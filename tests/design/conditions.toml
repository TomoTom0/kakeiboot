source_lines = "frontend/tests/unit/web/trend-window.test.ts:753, frontend/tests/unit/web/trend-window.test.ts:866, frontend/tests/unit/web/trend-window.test.ts:1416, frontend/tests/unit/web/trend-window.test.ts:1582, frontend/tests/unit/web/trend-window.test.ts:1735"
description = "コミット確定時（表示fetchの成功確定・cacheヒットコミットの両方）に prev 方向の隣接1窓（offset+span の仮窓）を表示fetchと同一条件（buildArgsAt: axis・metric=amount・granularity・from/to・limit=5・labelQuery があれば label_colors・filters〔AxisDetail の subject 等〕全て現時点のgetter値で同一）で prefetch する。keyOf が resultCache・表示系inFlight・lastDone・prefetch発行済み集合のいずれにも一致しない場合のみ発行する（二重発火なし）。成功時に限り resultCache へ保存し発行済み集合へ key を残す。失敗は静かに破棄し（onError へ流さない・loading を触らない）、失敗keyは発行済み集合に残さない（次のコミット確定時に再試行。試行はコミット確定時のみのため無限ループしない）。prefetch は表示系state（loading・seq・inFlight・lastDone・onError）に一切触れない。next方向と offset+span 以外の窓は prefetch しない（戻り先は往復でcacheに残る）。flush（mode/range/labelQuery/ledger 変更）時は発行済み集合ごとクリアし同条件復帰時の再発行を許す。week/range（active=false）では窓計算が表示窓と同keyのため発行しない。TASK-161: prefetch は双方向化される——各コミット確定後に ±1 か月移動窓（E2b の最頻度 k=1 がcache hitで同期commitされる）も prefetch し、E1 用の ±span 窓 prefetch も next 側へ拡張する（条件同一・失敗は silent・次コミットで再試行の規則不変）"
given = "今日=2026-10-15・mock 2026-05〜10月に記録。composable を月モード（labelQuery・subject filters 付きも）で初期化しコミット確定を待つ → prev/next で窓移動（cache済み窓へのコミット）→ from=隣接窓のみreject するmockで別月へ移動（prefetch失敗）→ flush を挟んで同条件に戻る → 週モードでも開く"
expect_return_shape = "初期コミット確定後に隣接窓（from=2025-11-01・to=2026-04-30）のfetchがちょうど1回・表示fetch（from=2026-05-01）と同一のquery条件（label_colors・item_query 等のfilters込み・axis/metric/granularity/limit 同一）/ cache済み窓や発行済み窓への prefetch は発行しない（同fromの呼び出し数が不変）・refresh等の同引数再コミットでも再発行しない / prefetch失敗時は loading=false のまま・onError は呼ばれず表示・windowKey 不変（静穏）・失敗keyは次のコミット確定時に再試行される（同fromの呼び出しが増える）/ flushを挟んで同条件に戻ると prefetch は再発行される / 週モードでは day粒度の表示fetch 1回のみ（隣接窓prefetchなし）"

