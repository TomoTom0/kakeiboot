[[condition]]
id = "web-usage.url-shown"
target_function = "web/pages/UsageConnectPage.vue（connect-url-box・connect-url・copy-url・copy-done）"
source = "docs/spec_mcp-tools.md §12（接続URL表示ブロック。接続URLの正本は frontend の runtime 生成）・docs/spec_mcp-tools.md §12（TASK-48: ユーザー指摘「コピーしましたがurlのboxの中に出て表示が崩れて、しかもアニメーションもない。文字で示すのではなく演出で示すべき」→ box 内の完了文言を廃止し copy→check の icon 切替 + pop 演出〔CSS の詳細は web-usage.copy-motion・実測は web-usage.copy-feedback-real〕・読み上げは sr-only の role=status）"
source_lines = "frontend/tests/unit/web/usage-pages.test.ts:115"
description = "接続URLは frontend が runtime 生成（location.origin + /mcp。dev / stg / prod に自動追従）し、折返し可能な code 文字列として常時表示する。コピーbutton（icon-only・aria-label「URL をコピー」）で navigator.clipboard.writeText に書き込み、成功すると button の icon が copy から check へ切り替わり（box 内に可視テキストの完了行は増えない）、「コピーしました」は button 直後の visually-hidden（sr-only）な role=status として読み上げにのみ通知される（data-test=copy-done）。数秒後に icon は copy へ戻る。失敗時は msg-error で「コピーできませんでした。URL を選択してコピーしてください。」を表示する（URL は常時選択可能なため fallback 経路は不要）"
given = "/usage/connect を開き、コピーbuttonを押す（writeText 成功 / 失敗）"
expect_return_shape = "connect-url の text が `${location.origin}/mcp`（break で折返し）・copy 押下で navigator.clipboard.writeText が同 URL で呼ばれ button の svg が check へ切替（box 内の可視テキストは増えない）し aria-label と title も「コピーしました」へ切替・copy-done（コピーしました）が role=\"status\" の sr-only として存在・数秒後に icon と aria-label が戻る・失敗（reject）で msg-error の案内"

