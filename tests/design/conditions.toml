source = "TASK-162 §2-2（設計レビュー1 高: 48px+横書きfitでは「すべての中にラベル」未達 → 縦書き+fold基準引き上げで「存在するsegment=labelが入るsegment」を構成保証）・設計 tmp/tasks/tm-162/design_breakdown_stack.md（v2）§2-2。ユーザー実機指摘 2026-11-04 22:28 指摘2「縦グラフのすべての中にラベルがないのもおかしい」"
source_lines = "frontend/tests/unit/web/trend-window.test.ts:1862"
description = "allocateStack に opts.labelMin（labelが入る最小寸法・px）を追加する: labelMin が渡された場合、配分結果が labelMin 未満のセグメントは値の小さい順に残余（rest）へ合算して再配分する（規則B の最小寸法を3pxからlabelMinへ引き上げたもの・SEG_MIN 3px との関係は labelMin>=SEG_MIN が前提）。rule C terminal（段階的合算→第一系列単色化）も同基準で進行し、1系列+残余でも labelMin×2 がbar長を超える場合は第一系列のみの単色barになる（単色barにはその系列のlabelが入る）。labelMin 未満で rest へfoldされた系列は「ほか」に集約される（TASK-129 foldIntoRest と同一経路・value は保存）。既定（labelMin undefined）は現行規則B/C のまま（横bar・widget・composition は適用外で後方互換）。本案の値は 1字+「…」の2字分 ≒ font11px×2+上下pad4px = 26px（web-browse.trend-bar-segment-label）"
given = "allocateStack に (a)labelMin=26 未満セグメントを含む構成 (b)labelMin×N>bar長の過密構成（rule C 進行）(c)labelMin 未指定 の各ケースを渡す"
expect_return_shape = "(a) labelMin 未満セグメントは rest へ合算され再配分（残るセグメントはすべて >= labelMin…ただし bar長の制約内。規則F〔bar全体<3px〕はlabelMinに先行） / (b) rule C が labelMin 基準で進行し（値最小の非残余を合算）、1系列でも収まらない場合は第一系列単色（size=bar長・その系列のlabelが入る。「収まらない」の判定は TASK-171/PR#4レビュー1 以降 bar長基準〔labelMin×2 > bar長〕のみ — bar長が十分で data比が labelMin 未満の生存series 1本は data比のまま残り、そのlabelは呼び出し側のfit判定で切り詰め/非表示へ劣化する〔web-browse.trend-bar-segment-label の例外C〕） / (c) labelMin 未指定は現行規則B/C（SEG_MIN=3px）どおり・後方互換 / fold で rest へ移った value は保存される（総和不変）"

# TASK-171（PR#4 コードレビュー指摘1: rule C terminal の発火条件が bar長基準（minimum×N を収められない）ではなく
# 生存series の data比 size が min 未満の判定になっていたため、rest が過半の bar でも全体が第一系列色の単色 bar と
# なり残余金額が描画から消え、下流の構成比 title（BarVChart・WeekRows・BreakdownBar は allocated 合計基準で n% を
# 計算）が少数系列を「…（100%）」と読んでいた。composition モードが同 stretch を「実在しない金額を描く」と拒否して
# いるのと同じ原則へ揃える改訂。併せた既存条件の改訂: web-common.stack-dimension-rules（(d) の発火条件を bar長基準と
# 明記）・web-common.allocate-label-min（(b) 同様）・web-browse.trend-bar-segment-label（例外C 追加）。
[[condition]]
id = "web-common.stack-rule-c-length-basis"
target_function = "shared/lib/stackedBars.ts（allocateStack: 規則C ladder/terminal を bar長基準〔minimum×N > length・N=保持segment数でrest込み〕へ分離し、規則B の data比 size fold は生存系列2本以上の間のみ働いて最後の1本は fold/stretch せず data比のまま残す。最終の outline map は isRest(s) || size >= SEG_MIN に統一 — 生存series が data比で SEG_MIN 未満の場合も rule F と同じ塗りのみ）"
source = "TASK-171（PR#4 コードレビュー指摘1・tmp/tasks/tm-171/）: rule C terminal 発火条件の bar長基準化・rest 金額の描画保存・pct 計算矛盾の解消"
source_lines = "frontend/tests/unit/web/trend-window.test.ts:507"
description = "規則C の terminal（第一系列単色・size=bar長）は bar長が minimum×N を収められない場合にのみ発火する。生存series の data比 size が min 未満であることは terminal の条件にならない: (1) bar長が minimum×N を収める構成では、fold 後に最小の生存series が min 未満でも data比の寸法のまま描かれ（SEG_MIN 3px 未満は縁取りなし塗りのみ・3px 以上は縁取りあり）rest の金額は描画から消えない (2) 規則B の fold（data比 size が min 未満の系列を値昇順に rest へ合算）は生存系列が2本以上の間のみ働き、最後の1本は決して fold・stretch されない（composition モードの停止と同一原則 — 実在しない金額を描かない）(3) この結果 allocated の value 総和は入力の総和と一致し（terminal 発火時を除く）、下流の構成比 title（BarVChart・WeekRows・BreakdownBar は allocated 合計基準）が少数系列を 100% と読む矛盾が解消する (4) labelMin 指定時も同基準（minimum=labelMin・N で bar長を収められない場合のみ単色化）"
given = "allocateStack（規定 stack モードと labelMin 指定）に (a) rest過半で最小系列が data比 min 未満・bar長は minimum×N を収める構成 (b) 生存series 1本が data比 min 未満・bar長十分な構成 (c) bar長が minimum×2 ちょうど/未満の構成 を渡す"
expect_return_shape = "(a) 全segment が data比どおり（fold された系列の value は rest へ移動・総和保存）で min 未満の生存series も残る（SEG_MIN 未満なら outline=false） / (b) 生存series 1本が data比の寸法・縁取りなしで残る（第一系列への単色 stretch は起きない） / (c) minimum×N = bar長 ちょうどは単色化せず全segment data比・minimum×N > bar長なら第一系列単色（size=bar長・outline=true — 既存契約どおり） / allocated の value 総和 = 入力総和（terminal 発火時を除く）"

[[condition]]
id = "web-browse.trend-bar-segment-label"
target_function = "web/components/TrendBars.vue（縦棒全segmentに縦書きlabel・fit判定・labelMin=26 適用）・web/pages/ReceiptsPage.vue（daily/weekly/monthly 縦棒〔.daily-col/.daily-bar/.daily-seg 独自DOM〕へ同一規則適用 — 共通class・fit utility・labelMin option を共用しbar DOM統合はなし〔TASK-126 併設〕）・web/styles.css（.bar-seg-label〔TrendBars と Receipts 共用class〕: writing-mode: vertical-rl・text-orientation: upright・11px/600・letter-spacing 0.02em・pad）・shared/format.ts（estimateTextWidth の高さ方向適用・字間込み）"
source = "ユーザー実機指摘 2026-11-04 22:28 TASK-162 指摘2「縦グラフのすべての中にラベルがないのもおかしい」・設計 tmp/tasks/tm-162/design_breakdown_stack.md（v2）§2-1〜§2-6（レビュー1・2: 縦書き+fold基準引き上げの全面再設計・Receipts 適用境界）+ §3-1（ink=seriesInk は縦書きでも適用）+ §0-4（分類名実分布 2〜6字・中央値4〜5字）"
source_lines = "frontend/tests/browser/verify.spec.ts:2973, frontend/tests/unit/web/styles.test.ts:1210"
description = "縦棒（TrendBars・Receipts 縦棒〔day/week/month 全粒度〕）の積み上げsegmentすべてにlabel（分類名）が入る: (1) labelは縦書き（writing-mode: vertical-rl + text-orientation: upright・文字は直立し上→下に流れる・中点は縦書きで中央に付く）。必要幅は1字分（font 11px+側余白=15px〔--bar-label-w〕）で、cell幅がこの値を下回らないことが構成保証される — TrendBars窓（6-12本）のcellはこれを満たし、Receiptsの全期間grid（日別31本等）は track の minmax floor を --bar-label-w に上げ（収まらない期間は .hscroll でscroll）「cell幅 < label幅」を構造的に排除する（TASK-162 コードレビュー高1: 360px帯の31本等分でcell≈7px < 11pxの字幅となりlabelがsegment外へはみ出す状態を解消）(2) labelが入らない高さの系列segmentは作らない: allocateStack に labelMin=26（1字+「…」の2字分）を渡し〔web-common.allocate-label-min〕、sub-26px の系列は「ほか」へfoldされる。これにより「描かれた系列segmentすべてに（最低「○…」の）labelが入る」ことが構成的に保証される（rule C terminal の単色barにもその系列のlabelが入る） (3) fit判定（縦）: 高さ = estimateTextWidth(label, 11) + 字間（letter-spacing 0.02em込み） ≤ segment高さ−4px で全文、入らなければ truncateLabelWidth の高さ版（末尾…）で入る字数まで詰める。幅は固定15pxで判定不要（(1)のfloor保証によりcell幅は常にこれ以上） (4) 例外（設計判断として明示・この3例外以外で「labelの無い系列segment」は存在しないことがverifyの受入条件）: 例外A = bar全体の高さが26px未満のbar（月額がnice scale比で小さい=bar自体が視認不能な月）はlabelを持たない。例外B = 「ほか」segmentの高さが26px未満のとき「ほか」はlabelなし（色+tooltipで識別。rest規約上これ以上foldする先がなく〔TASK-123 sub-minimum rest はdata比率維持〕残余金額の保存を優先）。例外C = 最後の生存seriesのdata比高さが26px未満（TASK-171/PR#4レビュー1: bar長はlabelMin×2を収めるが系列自身のdata比がlabelMin未満の構成。第一系列への単色stretchをしない原則〔web-common.stack-rule-c-length-basis〕によりdata比のまま残り、labelはfit判定で切り詰め/非表示へ劣化 — 例外Bと同型の位置づけ） (5) 視覚は §3 type規則（11px/600/ink=seriesInk・縦書きでも適用）。tooltip title「名称 金額（n%）」は維持（labelは切り詰め得る・titleは全情報）。bar-stack はaria-hidden維持（読み上げはbar-colのtitle/aria-labelが担う・現行不変） (6) jsdom 等の未測定環境（trackH=0・segment size 0）ではlabel非表示fallback（week-row-in-bar-label と同型・色のみで title は維持） (7) bar幅上限48px〔web-browse.trend-bar-width-margin〕により縦書きlabelはbar内中央に余裕を持つ。widget BarVChart（SVG別実装）は対象外（後日同一規則で拡張可）。横bar（週行・BreakdownBar）のsegment内labelは横書きのまま〔web-home.week-row-in-bar-label〕 — 縦棒（縦書き）と横bar（横書き）は「labelはsegmentの長辺方向に沿う」単一規則の方向適用"
given = "TrendBars を jsdom で mount（trackH 未測定）/ browser 360px で月6本窓（6字名系列を含む）・year dense・週mode day粒度を開く / Receipts を ?month=（day）・?from&to=63日以上（week）・?year=（month）で開く / 例外A（bar全体<26px）・例外B（ほか<26px）の再現data"
expect_return_shape = "jsdom（未測定）: .bar-seg にlabel要素なし（色のみ・title「名称 金額（n%）」あり） / browser: 全 .bar-seg のうち例外A/B を除く全series segment が .bar-seg-label を持ち writing-mode=vertical-rl・text-orientation=upright（Receipts の .daily-seg も同一class・同一computed値）/ 全文が入る系列は全文label（中点入り6字名も縦書きで全文）・入らない系列は末尾…切り詰め（最小「○…」）/ 年月・粒度・viewport を問わず「labelの無いseries segment」は例外A（bar全体<26px）と例外B（ほかsegment<26px）のみ / label文字矩形がsegment内に収まる（TrendBars・Receipts day/week/month すべてで高さ・幅双方の包含を getBoundingClientRect で検証 — Receipts は31本等分のday gridでも cell幅が --bar-label-w floor を下回らず包含が成立し・収まらない期間は .hscroll がscrollして document に横scrollを生じない）/ 例外A の bar と 例外B の「ほか」segment はlabelなしで title は保持 / fold 検証: sub-26px 系列を含む月は表示系列数が減り（上位N+ほか）全表示segmentが26px以上"

