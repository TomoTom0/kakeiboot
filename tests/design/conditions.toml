[[condition]]
id = "deploy-ops.exec-args-passthrough"
target_function = "kakeiboot_ops.build_exec_command（exec --env <env> -- <args...> の引数透過）"
source = "docs/ops/ops_deploy.md §運用 CLI（exec-stg / exec-prod）〔TASK-118。旧タスクの dir 属性から script 内 cd（ssh時は remote cd）へ移行。追加修正: miseタスクrun文字列から `--` を除去し、`mise run exec-stg -- --dry-run <args...>` が script へ `exec --env stg --dry-run <args...>` として渡り dry-run flag と args が共存〕"
source_lines = "scripts/deploy/test_kakeiboot_ops.py:372, scripts/deploy/test_kakeiboot_ops.py:404, scripts/deploy/test_kakeiboot_ops.py:425"
description = "exec の `--` 以降の引数が subcommand・flag を含めそのまま budget-book 実行列へ透過される（空白・記号入り引数はquote保持）。local は cwd=運用dir での `./budget-book <args...> --config-dir configs/<env>`・ssh は `cd <deploy_root>/<env> && ./budget-book <args...> --config-dir configs/<env>` のremote単一文字列。mise経由（run文字列に `--` 無し）では `--` 直後の先頭要素から argparse が `--dry-run` をscript側flagとして解釈し、残余が budget-book への args になる（`--` より後ろに置いた `--dry-run` はREMAINDER透過でdry-runとして効かない）"
given = "exec に args=['admin','token','issue','--note','家族 用']（空白入り値を含む）を渡した構成（local・ssh両transport）に加え・mise経由の引数並び `['exec','--env','stg','--dry-run','admin','user','list']`（separator無し）と `['exec','--env','stg','--','--dry-run','admin','user','list']`（separatorあり）のparser解釈"
expect_return_shape = "local は argv=['./budget-book','admin','token','issue','--note','家族 用','--config-dir','configs/<env>'] が quote崩れ無し（subprocess は引数list渡し・shell解釈なし）・cwd が運用dir / ssh は remote文字列内で空白入り引数が shlex.quote 済み（'家族 用'）でconfig-dir flag が末尾に付く / separator無しは dry_run=True・passthrough_args(args)=['admin','user','list']・separatorありは dry_run=False・passthrough_args(args)=['--dry-run','admin','user','list']（flagは透過されるだけ）"

[[condition]]
id = "deploy-ops.dry-run-plan"
target_function = "kakeiboot_ops.run_commands（--dry-run）"
source = "docs/ops/ops_deploy.md §運用操作（miseタスク・scripts/deploy/kakeiboot_ops.py）〔TASK-118。追加修正: 全タスク `mise run <task> -- --dry-run` 形式で案内。deploy/backup/backup-statusは `--` 以降がコマンド末尾へappend・exec/serviceは `${usage_args}`/`${usage_verb}` 位置へ展開（タスクrun文字列から `--` 除去済み）〕"
source_lines = "scripts/deploy/test_kakeiboot_ops.py:405, scripts/deploy/test_kakeiboot_ops.py:418, scripts/deploy/test_kakeiboot_ops.py:437"
description = "--dry-run が実行予定の全コマンドを shlex.join した `$ <cmd>` 形式で stdout へ並べて exit 0 する（転送・再起動を行わない。rsync 自身の --dry-run 併用もしない。promote のみport解決〔運用dirconfig読み取り・ssh時remote cat 2回〕を読み取り専用のplan構築前段として実行する〔deploy-ops.promote-dry-run-port-resolution〕・それ以外のfile読取は行わない）。mise経由では全タスク `mise run <task> -- --dry-run` 形式で使え・exec・serviceは `mise run exec-stg -- --dry-run admin user list` のように先頭要素が `--dry-run` の引数並びとしてscriptへ渡る"
given = "任意の command 列（実行すれば副作用の出る command を含む）への --dry-run、および mise経由 exec・service の引数並び（separator無し）のparser解釈"
expect_return = "全コマンドの `$ <cmd>` 行のみが出力され・subprocess 実行が1回も行われず・exit 0（plan表示と実行は build_*_commands の同一純関数を通るため忠実）。parserは `['exec','--env','stg','--dry-run','admin','user','list']`・`['service','--env','stg','--dry-run','status']` いずれも dry_run=True で残余が budget-book/systemctl への引数になる"

[[condition]]
id = "deploy-ops.command-not-found"
target_function = "kakeiboot_ops.run_commands（subprocess FileNotFoundError の捕捉）"
source = "docs/ops/ops_deploy.md §運用操作（miseタスク・scripts/deploy/kakeiboot_ops.py）〔REVIEW-4 Low-2。command・cwd 不在時も traceback ではなく error 報告〕"
source_lines = "scripts/deploy/test_kakeiboot_ops.py:470"
