source_lines = "frontend/tests/browser/verify.spec.ts:650, frontend/tests/unit/web/styles.test.ts:1018, frontend/tests/unit/web/trend-window.test.ts:391, frontend/tests/unit/web/trend-window.test.ts:457, frontend/tests/unit/web/trend-window.test.ts:553, frontend/tests/unit/widget/stats.test.ts:137"
description = "stackedOf の組立は上位3系列+残余「ほか」（4-5位は「ほか」へ合算され.fetch limit=5・REST/matrix の上位5契約は不変）で、bucket ごとに構成比5%未満のセグメントも「ほか」へ合算する（値0省略は従来どおり。ShareBar はこの上位3化・5% fold を適用しない — API が組んだ rows 構成を再組立しない）。寸法は全系統共通の配分純関数 allocateStack(segments, length, opts?)（length=bar の全寸法。web は px・widget は viewUnit）で規則A〜Fを適用する: 規則A（bar の全寸法を値比率で配分・gap の差引きは無い）・規則B（配分結果が最小寸法〔縁取りを含む外寸で 3px/3 unit〕未満のセグメントは値の小さい順に残余へ合算して再配分）・規則C（B でも最小寸法×N が bar 寸法を超える場合は値が最小の非残余セグメントを残余へ合算して再計算し、1系列+残余でも収まらない場合は第一系列のみの単色 bar として描く）・規則D（旧 min-height 累積超過を上端から overflow:hidden で切る仕組みは廃止・配分計算が必ず収める。容器〔.bar-stack/.daily-bar〕は border-radius も overflow も持たず〔REVIEW-5 medium-2〕・角は最上段セグメントの cap radius が担う）・規則E（寸法は JS 計算の明示値を要素へ渡り flex 自動縮小・min-height/min-width には依存しない）・規則F（bar の外寸自体が 3px/3 unit 未満になる場合は外形〔データ比率〕を優先し縁取りを適用しない塗りのみの bar として描く・規則C の単色化に先立ち適用。0円 bar なしの契約は別途維持）。帰結として 25%×4セグメントでも極端に短い bar では規則C が働き表示系列が減り、bar 全体が 3px 未満なら規則F で塗りのみになり、棒の形は常に合計値比を反映し積み木化とクリップ欠落は構造的に発生しない。TASK-129: (1) 適用系統にランキング行bar（1セグメント: allocateStack([単色セグメント], bar長px) に length=行value/画面scale×track実測 px を渡し size=bar長px がそのまま返り規則F が最小寸法を判定。share は渡さない — 入力総和で正規化されるため値の意味は length が決める）と widget bar_h・stacked_bar が加わる (2) 残余識別は StackedSegment の rest フラグ（旧: label==='ほか' 文字列判定から変更。stackedOf が組む残余は rest フラグ付き「ほか」）で行い、foldIntoRest は既存 rest セグメント（ラベルは任意 — ShareBar は「その他」）へ value を合流して総和を保存し・rest セグメントが無い場合は opts.rest.label の名前で新設する（既定 mode='stack' では「ほか」・allocator は名称を内在しない） (3) composition モード（opts { mode: 'composition', rest: { label } }・ShareBar 用）は規則A/B/F のみ適用し規則C の段階的合算→第一系列単色は適用しない（構成比の表現で残余を落として第一系列を全長へ広げる描画は元 data の金額・割合と一致しないため。B の fold で最小寸法を確保できなかった系列セグメントは規則F と同じ運用〔縁取りなし・比率どおりの塗りのみ〕で残る）。既定 mode='stack'（縦棒・週行・ランキング行bar）は現行の規則A〜F のまま不変"
given = "7系列の trend 結果（上位3+残余・5%未満 series を含む bucket・全0 bucket）で stackedOf を呼ぶ / allocateStack に (a)通常構成 (b)最小寸法未満セグメント構成 (c)最小寸法×N>bar 寸法の構成 (d)1系列+残余でも収まらない短尺 (e)bar 寸法 3px 未満 を渡す / composition モード（{ mode: 'composition', rest: { label: 'その他' } }）で最小寸法未満系列・規則C 相当の過密構成・rest フラグ付き label「その他」セグメントへの fold・rest 新設（複数 fold で最小寸法を確保）を渡す / ランキング行bar（1セグメント・length=金額写像 px）/ 実画面で 1円のみの月を含む窓と 5円行のランキングを 360px で実測"
expect_return_shape = "stackedOf: 上位3系列+「ほか」の label/色（seriesColor 写像・残余は var(--series-rest)）・5%未満の series はその bucket で「ほか」へ合算・全0 bucket は segments 空 / allocateStack（既定 stack）: (a)サイズ合計=length・各サイズ=値比率 (b)最小寸法未満は残余へ合算され再配分（残るセグメントはすべて>=3） (c)値最小の非残余が合算され全セグメント>=3 (d)第一系列のみの単一セグメント（size=length — TASK-171/PR#4レビュー1: 発火は bar長が minimum×N を収められない場合のみ。data比 size が min 未満の生存series が残っても単色化せず data比のまま残り〔SEG_MIN未満は outline=false〕・rest の金額が描画から消えることはない〔web-common.stack-rule-c-length-basis〕） (e)outline=false（縁取りなし）でサイズは値比率どおり・rest 新設の既定名は「ほか」 / composition: 規則C の単色化が起こらない（過密でも第一系列単色にならず最小寸法未満系列は outline=false で比率どおり残る）・fold は rest フラグ付きセグメント（label「その他」でも可）へ value を移動して総和保存・rest 無し時は rest.label で新設（stack との対照: 同入力でも stack は (d) の単色化に至る）・ラベル「ほか」でも rest フラグ無しは通常系列として扱われる / ランキング行bar: 1セグメント size=length・length<3 は outline=false / 実測: 全 .bar-stack でセグメント外寸合計<=棒寸法+1（クリップ欠落なし）・1円月の bar は高さ<1px で縁取りなし（computed borderWidth 0）・通常棒のセグメントは縁取りあり・ランキング行bar も長さ<3px の行は縁取りなし"

