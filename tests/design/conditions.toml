description = "Feed は route の文脈 query を ReceiptListQuery に変換して listReceipts を呼び、一覧と同じ並びで現在 id の前後のパネルを並べる。変換は CONTEXT_FIELDS（ReceiptListQuery の limit / cursor を除く全フィールド）の1表だけで対称に行い、往復で一致する。文脈には q（品目名 OR 店名の横断検索）と store_id（店 id 完全一致）も含まれ（TASK-41 で /search の行リンクから乗る）、q 付きで開いた Feed の一覧取得と「戻る」の文脈は同じ q を保つ。TASK-146 §3 #5/#18: パネル群は ContentSwap の内容wrapper（content-swap）に包まれ、文脈変更の sequence 再fetch 確定時は wrapper のみ fade で遷移し（ページroot は remount なし・web-browse.feed-no-remount）、末尾追加取得で増えたパネルは出現 fade（web-common.appear-fade）で現れる（既存パネルは不動）"
