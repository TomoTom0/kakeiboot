[[condition]]
id = "deploy-ops.promote-configs-preview"
target_function = "kakeiboot_ops.build_promote_commands step4（configs乖離補助表示）"
source = "docs/ops/ops_deploy.md §promote〔TASK-189 実装で追加。設計: tmp/tasks/tm-189/design_promote.md D-3（差分可視化3・--checksum）〕"
source_lines = "scripts/deploy/test_kakeiboot_ops.py:1152"
