source = "docs/spec/spec_mcp-tools.md §10（sections を chart 種別ごとに描画: bar_h / bar_v / line / stacked_bar / table / scatter_line、totals）・§11-1（自作 SVG）・§11-2（合計カード）+ TASK-116（bar_v 積み上げ・_meta.trend_matrix・palette/write は web と統一・設計 tmp/tasks/tm-116/design_breakdown-expansion.md §3-3）+ TASK-123（bar_v セグメント幾何の全面改訂: 上位3・縁取り stroke=viewUnit 基準・上端角丸 path・§4-5 配分・clipPath 廃止。ユーザー実機指摘 2026-10-29・設計 tmp/tasks/tm-123/design_breakdown-visual.md v5 §4-3/§4-4/§4-5/§4-8）+ TASK-129（bar_h 幾何の文法適用〔全周 stroke・データ端 cap・rx=2 廃止〕・stacked_bar の絶対scale化〔全長=rows総和/scale〕と composition モード・凡例の bar 実構成追従・報告単位 scale 集約。ユーザー実機指摘 2026-10-30「そもそも同様の表示なら個別実装にするべきでない」「今もその中のmaxが単純に100%として表示されているだけに見える」・設計 tmp/tasks/tm-129/design_ranked-row-bar.md v3 §4-1-2・§4-2・§4-4・§4-5）"
source_lines = "frontend/tests/unit/widget/stats.test.ts:34, frontend/tests/unit/widget/stats.test.ts:73, frontend/tests/unit/widget/stats.test.ts:166, frontend/tests/unit/widget/stats.test.ts:192, frontend/tests/unit/widget/stats.test.ts:281, frontend/tests/unit/widget/stats.test.ts:312"
description = "section の chart 種別ごとに対応する SVG（または table）を描き、棒の長さ・点の高さは値に比例する。合計カードに合計・件数を出す（前期比は TASK-94 で廃止）。TASK-116: bar_v（月次推移）は棒の数学（棒高さ=月合計/niceMax 比・y軸3tick・両端月label・棒単位 title〔年月+金額〕・role=img の aria-label）を不変のまま series 積み上げへ展開する — meta.trend_matrix（mcp-stats.trend-matrix-meta）を stackedOf に通し各棒をセグメント列で描く（下端=第一系列=上位降順の順・fill は seriesColor(key) 写像の CSS 変数参照・残余「ほか」は var(--series-rest)・値0セグメントは省略・各セグメント rect に「名称 金額（構成比%）」の title）。TASK-123 でセグメント幾何を改訂: 組立は上位3+「ほか」（fetch/matrix の上位5契約は不変・前端 slice(0,3)）で§4-5 配分規則（比率配分・5%未満合算・最小寸法 3 viewUnit・規則C 単色化・規則F。gap 1 unit 加算方式は廃止）を通り、境界は縁取り stroke で担保する — stroke は viewBox unit 基準（stroke-width 2〔中心線から±1unit〕・vector-effect: non-scaling-stroke は不使用・§4-8 の viewBox 比例文法）、各セグメント rect の寸法は配分寸法−2 viewUnit（stroke 含む外寸=配分寸法）で隣接セグメントは外寸同士を密着させ境界は自線1+相手線1の計 2 viewUnit（線同士の重なりなし・塗り同士も接触しない）・stroke 色 var(--seg-outline)（web-common.stack-segment-outline・widget/style.css に light/dark 定義）。角は最上段セグメント自体を上端角丸の path（radius=cap 式 min(2, 短辺/4)・baseline 側直角・stroke が角丸に沿った全周輪郭を成立させる）で描き他セグメントは rect+stroke・clipPath は廃止（web-common.stack-corner-rules）。matrix が無い・bucket と rows の数が不一致の bar_v section も fallback の単一 bar を同一の上端角丸 path+stroke で描く（fill は var(--series-1)・旧独立 rx=2 rect は廃止）。bar_h/stacked_bar の行色は index 6色から key 基準（ChartDatum.key=StatsRow.keys[0]・null は var(--series-rest)・key を持たない datum は index fallback）へ変わる（palette は --series-1..7+rest の web と同値へ統一・web-common.series-color-assignment (6)(7)）。TASK-129: bar の長さ基準は報告単位の共通 scale（web-common.bar-scale — StatsScreen が報告内の各 bar の外形金額〔bar_h=各行 value・bar_v=各 bucket 合計・stacked_bar=rows 総和〕の全体 max を barScale へ切り上げて各 chart へ渡す。bar_v 側の描画scale源切替は TASK-126 帰属のため移行期間は BarVChart 自身の niceMax と一致する場合が多い）へ統一され、bar_h の bar は 幅=value/scale×可用幅・高さ 16 viewUnit 維持で全周 stroke-width 2 viewUnit の縁取り（stroke-inclusive 外寸）とデータ端（右端）のみ cap path・基端（左端）直角（旧 rx=2 四隅一律は廃止・規則F は 3unit 未満で縁取りなし）、stacked_bar（ShareBar）は bar 全長=rows総和/scale×可用幅（対合計比の常時満長ではなくなる）で内部配分は allocateStack の composition モード（規則A/B/F・規則C 不適用・上位3化/5% fold も不適用 — API が組んだ rows 構成を再組立しない・web-common.stack-dimension-rules）となり、凡例は bar 実構成（合算後の行構成・%=bar 内構成比）から描かれ fold 時の金額は fold 先セグメントへ加算保持（総和保存）、残余は ChartDatum.key===null を rest フラグへ写像し残余名称はデータ行の「その他」。3 chart のセグメント輪郭描画（rect/path・stroke・cap・規則F 切替）は共通 SVG renderer（BarSegs.vue・widget.stats-seg-renderer）が担い chart 内部に個別実装を持たない。line 種別は backend に現状 emitter を持たない（実 report の月次は bar_v）ため test-only fixture section（別 id）による renderer カバーとして維持する"
given = "monthly_overview（bar_h 2 つ〔by_category max 30000・top_stores max 22000〕+ bar_v〔bucket 合計 max 52000〕・meta に trend_matrix・報告scale=barScale(52000)=100000）、by_category（stacked_bar・rows総和 52000・報告scale=100000）、monthly_trend（bar_v・meta に trend_matrix）、by_payment_method（table）、item_price_history（scatter_line）、line 種別は test-only の line section fixture、matrix 無しの bar_v の fixture、TASK-129 追加: 5行 stacked_bar（上位3化・5% fold 不適用の確認）と fold 発生 stacked_bar（null key 行への合算）"
expect_return_shape = "bar_h の bar 幅が value/報告scale×可用幅（monthly_overview の報告scale=100000: 30000→可用幅の0.3倍・12000→0.12倍・10000→0.1倍。section 単独の niceMax 30000→50000 と違い報告全体の max で決まる）で行 fill は key 基準写像（食費=keys[1]→var(--series-1)・日用品=keys[2]→var(--series-2)・未分類=keys[null]→var(--series-rest)）・stroke=var(--seg-outline)/stroke-width=2・rx 属性なし・データ端（右端）のみ角丸、bar_v（matrix あり）は最大値の棒が最も高く各棒がセグメント rect 列（下端=第一系列・色は var(--series-*)/var(--series-rest)・値0系列の月にその rect なし・セグメント title は「名称 金額（構成比%）」）・同 key の bar_h 行 fill と bar_v セグメント fill が同一 CSS 変数、bar_v（matrix 無し・数不一致）は単一 rect、stacked_bar は全長=rows総和/scale×可用幅（by_category は 52000/100000=0.52倍・常時満長でない）でセグメント色は key 基準・5行構成は5セグメントのまま（上位3化なし・4%行も折り畳みなし）・fold 発生時は凡例が合算後の構成で金額総和が元 rows と一致、line（test-only fixture）は points 数=行数で path を持つ、table は行数ぶんの tr、scatter_line は r=4 の点。合計カードに 52,000円・31件"

