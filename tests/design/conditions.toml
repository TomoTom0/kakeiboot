description = "窓移動の表示は2つの別々のグラフの交代ではなく、1本のグラフの表示範囲移動である。slideは prev/next 押下に由来するコミット（押下のみが立てる slideRequest）でのみ、かつコミットで windowKey が変化する場合にのみ組み立てられ要求は消費される（REVIEW-1 H1）: 初回コミット（result null・旧窓なし）・focus変更後のfetch確定（flush で要求もクリア）・refresh()・AxisDetail の同窓再init（windowKey 不変）はいずれも不発火（同一窓再fetch不発火の契約は維持）。組み立て時は旧窓（組み立て時点のコミット済みresult）と新窓のbucket列を連結した1本のstacked配列（dir='prev' は [新窓,旧窓]・dir='next' は [旧窓,新窓]・step=窓幅でbucket key重複なし=TrendBars の :key=bucket key v-for と整合で既存bar DOMは再利用される。axisWindows に窓ごとのbucket keysを保持）を表示配列として渡し、.bars と .axis-labels の2要素へ同一translateXを同時適用する（初期値・目標値は連結配列 index N〔窓境界〕bar の offsetLeft 基準・%指定不使用・初期値をtransitionなしで適用後 rAF を挟んで目標値へ移す）。移動中も旧窓の棒と新窓の棒が同時にDOMに存在し画面から消えない（fetch待ちの間は旧窓の棒が不透明のまま残り黒を出さない）。連結前にコミット窓の.bars実測幅から1track幅を算出して連結中の track/grid 幅を固定px指定し（bar幅はスライド前後で不変）・連結中は .hscroll を overflow hidden にする（phantom scroll なし）。track幅の測定はスライド未進行のコミット窓DOMで行い、slide差し替え（連打の即時トリム→新slideが同tickにcoalesceされてtrimのcleanupがDOMへ届かない）では前回pinの測定値（1track幅・gap・wrap幅）を再利用する（pin残存DOMのoffsetWidthは2窓分のため再測定するとcell幅が倍化し移動先がclippedされる。PR#2 レビュー指摘1）・trimで測定値は破棄し次回slideは再測定する。slideの開始・トリム・差し替え・unmountはそのslideがqueueしたnextTick・rAFの遅延callbackを無効化し（generation無効化）、中断されたslideの遅延callbackがリセット後または差し替え後のchartへ古いtransformを再適用しない（PR#2 レビュー指摘2）。軸ラベル（間引き位置・年形式）・.bar-val 間引き・dense判定（bars.length でなくコミット窓本数N基準）は窓ごとに計算して連結し、スライド中もトリム時も変化しない。gridline は .plot 内固定層として流さず dense（year）でも表示域全幅を保つ。transform 確定は .bars の transitionend（propertyName=transform）を単一情報源とし watchdog（220ms+50ms）を併設、いずれも冪等に finishSlide() する（slide=null・transform を transition なしでリセット・トリム前後で見た目不変・unmount 時は watchdog timer をクリア）。連打（slide進行中の再押下）は同期的に即時トリム→新方向の連結組み立て→再スライド（cacheヒットなら視覚連続・ミスなら旧窓のまま待ち）。focus変更（月チップ・棒押下・mode/labelQuery/家計簿切替）は slide なしの即時差し替え（flush で slideRequest もクリア。旧「直近方向を継承」契約は廃止・direction は連結順序の参照としてのみ残る）。移動先がcache済みなら押下と同時にスライド開始（loading にならない）・未取得でも確定後に連結スライドで入る。y軸・gridline は再マウントされない。prefers-reduced-motion: reduce ではスライド自体をスキップし即時トリム（windowKey コミットのみ・CSS保険）。TASK-158（TASK-146 §3 #14 注記の改訂。slide 契約は不変）: TrendBars の windowKey key 付け fade は廃止され（web-common.content-swap）TrendBars は windowKey 変化でも再 key 付けされない——slide 中の .bars DOM 再利用は全経路で不変・slide が唯一の演出であることも不変。TASK-161 §1-2（設計 tmp/tasks/tm-161/design_period_ui.md v2）: slide機構は E2b（focus移動・窓外 k≤span の最小slide）へ一般化される——連結列は旧窓+新窓のbucket key和集合（重複keyは1本・keyed v-forで重複月DOMは1本再利用）・移動距離は span でなく k（moveCols・boundary(bars, k) の引数一般化）・軸labelは窓ごと計算（axisWindows）から新窓単体計算の key→label map へ統一（E1全幅移動も同一経路。trim 前後でlabel位置不変）・trim契約・pin再利用・watchdogは本条件の規定どおり不変（E2b 詳細は web-home.trend-window-min-slide）"
given = "今日=2026-10-15。mock 2026-05〜10月に記録（初期コミット確定後は prev 隣接窓 2025-11..2026-04 が prefetch・cache 済み）。/ を月モードで開き trend-prev 押下（スライド中に .bars/.axis-labels の class・transform・bar key 群・bar幅・軸ラベルをrAFサンプラーで実測）→ trend-next で初期窓へ復帰 → 初期窓（offset=0）でラベル切替（同窓再fetch）→ スライド中に再押下（連打）→ スライド中に月チップでfocus変更 → emulateMedia reducedMotion で再押下 / unit（composable）では slide の連結配列・finishSlide・不発火経路・連打・flush を検証 / component（jsdom）では is-sliding 付与・axisWindows 窓ごと軸ラベル・dense不変・transitionend→finish-slide emit を検証 / 360px・year（dense）でも実測"
