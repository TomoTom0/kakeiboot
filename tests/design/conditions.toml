target_function = "mcp::tools::drafts::create_batch（要素ごとの前処理・rejected・entry_draft_ids・isError）"
source = "TASK-18 設計 tmp/tasks/tm-18/design_mcp-batch.md 1-5 入力検証の範囲・2-2 output・2-3 手順1（レビュー指摘 M2。docs/spec_mcp-tools.md §4・§7 新節へ反映）"
source_lines = "backend/tests/mcp_tools_drafts_batch.rs:545"
description = "要素の保存拒否は 1件版の前処理と同じ条件だけ（serde 形式不正・input_kind 不正・manual + image_index・validate_payload 違反・reported_filename 長さ超過）。該当要素は rejected（entry_index・errors[]）に入り保存されず、他の要素は同じ呼び出しで保存されて画像も付く。entry_draft_ids は保存要素に draft_id・拒否要素に null。引数全体の parse 失敗（drafts が配列でない・未知のトップレベルキー）と「保存する要素が 0 件」は全体の isError、1 件でも保存されれば isError=false。拒否要素の content text は「その要素だけを直して作成する。保存済みを含めて呼び直さない」"
