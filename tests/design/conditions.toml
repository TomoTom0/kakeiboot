description = "月label常時短形式化〔web-browse.trend-axis-minimal〕に伴い、年は独立した年tick行（上位tick）で提示する: (1) .axis-years 行を .axis-labels の上に同一gridで新設する（grid列を共有し各年tickは該当cell上に配置・年/月の文字矩形が交差しない） (2) 配置規則 = 「先頭の年 + 年境界」: 窓の先頭tick上にその窓の開始年を1回（例「2026」）+ 窓内で年が変わる位置（1月のcell）に新年（「2027」）を置く。年labelは数字のみ4字（0.8rem・muted・weight 500）。TASK-162 コードレビュー中4対応: 複数年の窓（任意期間の月粒度・例: 2025-07開始24か月）は最初の年境界だけでなく全ての年境界（2026-01・2027-01）に年tickを置く（年labelは年に高々1回のため年label同士の衝突は生じない・最小間隔=12cell）(3) 月tick間引きとの独立性: 年tickは月tickの間引き状態に依らず「1月のcell」に置く（月labelが間引かれたcellにも年は置かれる） (4) 端部overflow: dense（year 12本等・cell≈17-43px）と狭幅（≤420px）では両端flush規則を年行にも適用（年tickが端cellなら端寄せ・中間は中央配置。中間tickのはみ出し許容境界は実装時実測確定〔条件書除外参照〕）。TASK-162 コードレビュー中5対応: 端の判定は DOM順（:first-child）でなく cell位置（1列目/最終列）で行う — コンポーネントが is-edge-start/is-edge-end class を付け（slide中の窓ごと計算は DOM順が窓先頭と一致しない）・dense帯は全幅で両端flush・≤420px帯は月行の狭幅端揃えと同型 (5) slide追従契約（レビュー3）: .axis-years は TrendWindow のslide全工程で .bars/.axis-labels と同一処理に含める — pin（gridTemplateColumns・width固定）/transform/transition・noAnim/reduced-motion/watchdog trim/slide中断時のclear。年tickは窓ごと計算（月と同じkey→label map・slide中の共有位置は新窓基準）で trim 不変を保証（窓ごと計算した年tickがslide前後で変わらない）(6) TASK-42窓端契約・両端保証・幅ベース間引きは短形式月labelで継続。ReceiptsPage の first/last 消費は従来規則のまま影響なし"
given = "跨年窓（2025-11..2026-10）と年モード（2026-01..12）と1月開始窓を jsdom で mount / browser 360px で slide（prev）を実行（跨年窓 2025-10..2026-03 → 前窓 2025-04..09 — 記録存在範囲の canPrev floor により 1窓分。旧窓の 2026 境界が消え単年 {'2025'} になることで新窓基準の再計算を検証）/ 月label間引きが発生するdense窓"
expect_return_shape = ".axis-years が .axis-labels の直上に存在し同一 gridTemplateColumns（各年tick span の中心が該当cell中心） / 跨年窓: axis-year-2025 が窓先頭cell・axis-year-2026 が1月cellに位置（年label同士の最小間隔=12cell）/ 複数年窓（24か月）: years = [先頭cell 2025, 2026-01 cell 2026, 2027-01 cell 2027]（2回目以降の年境界も消えない・unit検証）/ 年モード（単年）: axis-year-2026 が窓先頭cellのみ / 月label間引きで 1月 の月labelが間引かれていても年tickは 1月cell に存在 / 年と月の文字矩形が交差しない（browser 実測・getBoundingClientRect）/ slide中・trim後の年tick位置が一致（新窓基準の窓ごと計算・trim不変・年境界cell中心との差±1px・slide中は .bars と同一transform と is-sliding を実測）/ 端部flush: dense帯（>420px・cell<年label幅）で先頭cellの年tickが is-edge-start で plot左端内に収まり・最終cellの年tick（1月終端窓）が is-edge-end で plot右端内に収まり .hscroll に phantom scroll を生じない（browser実測）・中間cellの年tickは中央配置のまま"

