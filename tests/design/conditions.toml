source = "TASK-93 起票（TASK-89 の対比ヘッダから比較・増減を全廃。UIは構造とメリハリで表現する設計原則）+ TASK-103（月モード4fetch・週card用trend追加）+ TASK-146 §2（週fetch の range を月跨ぎの拡張rangeへ。設計 tmp/tasks/tm-146/design_period_navigation.md §2）+ ユーザー実機指摘 2026-11-03 TASK-161 指摘5「『の支出』という表示が何のためにあるのかわからない → 除去対象」・指摘6「『2026年9月』表示の左右に移動ボタンを配置し、それより間隔を空けて右側に総額を表示する」（設計 tmp/tasks/tm-161/design_period_ui.md（v2）§4）"
