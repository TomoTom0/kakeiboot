source = "docs/spec_mcp-tools.md §7-23（前段の後に draft の消失・role の変更が起きた場合も、承認 tx 内の検出をその件の not_found / forbidden として返す）（TASK-25 設計 tmp/tasks/tm-25/design_failure-injection.md 1-3・1-4）"
source_lines = "backend/tests/mcp_tools_drafts_batch.rs:2218"
description = "MCP 層の前段解決（c.draft・require_role）を通過した後に draft が削除されても ApproveKind::NotFound、role が viewer に変更されても ApproveKind::Forbidden になり、いずれも receipt を作らず他の件に影響しない。/mcp 経由での race 再現は決定的にできない（解決と tx の間に注入 seam が無い）ため、解決済み DraftRow（domain::drafts::load_draft）を渡して DB を先に変更する注入で domain 層から直接検証する。tx 内検出本体は db-schema.approve-requires-editor-role / approve-not-found-unknown-id、MCP 層の kind→件ごと結果への写像は mcp-approve-batch.per-item-results と同一機構で検証済み（race の結合再現は除外記録参照）"
