# Task runner for budget-book. `mise tasks` lists all tasks.
# Settings (ports, paths, timeouts) live in configs/*.toml, not here.

[vars]
_.file = ["configs/deploy.toml", "configs/deploy.local.toml"]

[tasks."frontend:install"]
description = "Install frontend dependencies (frozen lockfile)"
dir = "{{config_root}}/frontend"
run = "pnpm install --frozen-lockfile"

[tasks."backend:build"]
description = "Build the Rust backend"
run = "cargo build --workspace --all-targets"

[tasks."frontend:build"]
description = "Type-check and build the frontend (web + widget) into frontend/dist"
dir = "{{config_root}}/frontend"
depends = ["frontend:install"]
run = "pnpm build"

[tasks.build]
description = "Build backend and frontend"
depends = ["backend:build", "frontend:build"]

[tasks."backend:test"]
description = "Run backend unit and integration tests"
run = "cargo test --workspace"

[tasks."frontend:test"]
description = "Run frontend unit tests (vitest)"
dir = "{{config_root}}/frontend"
depends = ["frontend:install"]
run = "pnpm test"

[tasks."frontend:browser"]
description = "Real-browser capture (chromium headless, API stubbed) into frontend/test-results/browser/"
dir = "{{config_root}}/frontend"
depends = ["frontend:install"]
run = ["pnpm exec playwright install chromium", "pnpm exec playwright test"]

[tasks."frontend:usage-shots"]
description = "Re-capture the usage-page figure assets (login/consent, 390px) into frontend/src/web/assets/usage/"
dir = "{{config_root}}/frontend"
depends = ["frontend:install"]
run = [
  "pnpm exec playwright install chromium",
  "pnpm exec playwright test tests/browser/capture.usage.spec.ts",
  "mkdir -p src/web/assets/usage",
  "cp test-results/browser/capture/390/login.png src/web/assets/usage/login.png",
  "cp test-results/browser/capture/390/consent.png src/web/assets/usage/consent.png",
]

[tasks.test]
description = "Run all tests"
depends = ["backend:test", "frontend:test"]

[tasks."backend:lint"]
description = "rustfmt check and clippy (warnings are errors)"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks."frontend:lint"]
description = "ESLint (vue/no-v-html enforced) and vue-tsc type check"
dir = "{{config_root}}/frontend"
depends = ["frontend:install"]
run = ["pnpm lint", "pnpm typecheck"]

[tasks.lint]
description = "Run all linters"
depends = ["backend:lint", "frontend:lint"]

[tasks.verify]
description = "All tests and lint; exit code is non-zero on any failure"
depends = ["lint", "test"]

[tasks."dev:backend"]
description = "Run the dev backend server (reads configs/dev/*.toml)"
run = "cargo run -p budget-book -- --config-dir configs/dev"

[tasks."dev:frontend"]
description = "Run the Vite dev server (--strictPort: fixed dev port from configs/dev/app.toml, fail when occupied)"
dir = "{{config_root}}/frontend"
depends = ["frontend:install"]
run = "pnpm dev --strictPort"

[tasks.dev]
description = "Run backend and frontend dev servers in parallel"
depends = ["dev:backend", "dev:frontend"]

# stg/prod operations against the runtime dirs ({{vars.deploy_root}}/<env>; see configs/deploy.toml).
# The work repo only runs dev; see docs/deploy.md.

[tasks."stg:deploy"]
description = "stgへdeploy（build → rsync binary/backup script/configs/stg/frontend/dist → kakeiboot-stg再起動 → healthz確認）"
depends = ["build"]
run = [
  "rsync -a target/debug/budget-book {{vars.deploy_root}}/stg/budget-book",
  "mkdir -p {{vars.deploy_root}}/stg/bin",
  "rsync -a scripts/backup/kakeiboot-backup.sh {{vars.deploy_root}}/stg/bin/kakeiboot-backup.sh",
  "rsync -a --delete configs/stg/ {{vars.deploy_root}}/stg/configs/stg/",
  "rsync -a --delete frontend/dist/ {{vars.deploy_root}}/stg/frontend/dist/",
  "systemctl --user restart kakeiboot-stg",
  "sh -c 'for i in 1 2 3 4 5; do curl -fsS http://localhost:40282/healthz && exit 0; sleep 1; done; exit 1'",
]

[tasks."prod:deploy"]
description = "prodへdeploy（build → rsync binary/backup script/configs/prod/frontend/dist → kakeiboot-prod再起動 → healthz確認）"
depends = ["build"]
run = [
  "rsync -a target/debug/budget-book {{vars.deploy_root}}/prod/budget-book",
  "mkdir -p {{vars.deploy_root}}/prod/bin",
  "rsync -a scripts/backup/kakeiboot-backup.sh {{vars.deploy_root}}/prod/bin/kakeiboot-backup.sh",
  "rsync -a --delete configs/prod/ {{vars.deploy_root}}/prod/configs/prod/",
  "rsync -a --delete frontend/dist/ {{vars.deploy_root}}/prod/frontend/dist/",
  "systemctl --user restart kakeiboot-prod",
  "sh -c 'for i in 1 2 3 4 5; do curl -fsS http://localhost:40283/healthz && exit 0; sleep 1; done; exit 1'",
]

[tasks."exec-stg"]
description = "stg運用dirでbudget-bookの任意subcommand（mise run exec-stg -- admin user list）"
dir = "{{vars.deploy_root}}/stg"
usage = "arg \"<args...>\""
run = "./budget-book ${usage_args} --config-dir configs/stg"

[tasks."exec-prod"]
description = "prod運用dirでbudget-bookの任意subcommand（mise run exec-prod -- admin token issue --kind setup --note ...）"
dir = "{{vars.deploy_root}}/prod"
usage = "arg \"<args...>\""
run = "./budget-book ${usage_args} --config-dir configs/prod"

[tasks."stg:service"]
description = "kakeiboot-stgのsystemd user service操作（mise run stg:service -- status）"
usage = "arg \"<verb...>\""
run = "systemctl --user ${usage_verb} kakeiboot-stg"

[tasks."prod:service"]
description = "kakeiboot-prodのsystemd user service操作（mise run prod:service -- is-active）"
usage = "arg \"<verb...>\""
run = "systemctl --user ${usage_verb} kakeiboot-prod"

# backup (TASK-83): daily systemd user timer kakeiboot-backup@<env> + bin/kakeiboot-backup.sh
# （deployで配布）。詳細は docs/deploy.md。

[tasks."stg:backup"]
description = "stg backup手動即時実行（timerと同一oneshot unit。完了まで待つ）"
run = "systemctl --user start kakeiboot-backup@stg.service"

[tasks."prod:backup"]
description = "prod backup手動即時実行（timerと同一oneshot unit。完了まで待つ）"
run = "systemctl --user start kakeiboot-backup@prod.service"

[tasks."stg:backup-status"]
description = "stg backup状態確認（last_success・世代dir一覧・timer・前回実行結果）"
run = [
  "sh -c 'echo \"last_success: $(cat {{vars.deploy_root}}/backups/stg/last_success 2>/dev/null || echo none)\"'",
  "sh -c 'ls -1 {{vars.deploy_root}}/backups/stg 2>/dev/null || true'",
  "systemctl --user list-timers kakeiboot-backup@stg.timer --no-pager",
  "systemctl --user show kakeiboot-backup@stg.service -p Result -p ExecMainStatus --no-pager",
]

[tasks."prod:backup-status"]
description = "prod backup状態確認（last_success・世代dir一覧・timer・前回実行結果）"
run = [
  "sh -c 'echo \"last_success: $(cat {{vars.deploy_root}}/backups/prod/last_success 2>/dev/null || echo none)\"'",
  "sh -c 'ls -1 {{vars.deploy_root}}/backups/prod 2>/dev/null || true'",
  "systemctl --user list-timers kakeiboot-backup@prod.timer --no-pager",
  "systemctl --user show kakeiboot-backup@prod.service -p Result -p ExecMainStatus --no-pager",
]
