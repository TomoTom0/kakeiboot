# Task runner for budget-book. `mise tasks` lists all tasks.
# Settings (ports, paths, timeouts) live in configs/*.toml, not here.

[tasks."frontend:install"]
description = "Install frontend dependencies (frozen lockfile)"
dir = "{{config_root}}/frontend"
run = "pnpm install --frozen-lockfile"

[tasks."backend:build"]
description = "Build the Rust backend"
run = "cargo build --workspace --all-targets"

[tasks."frontend:build"]
description = "Type-check and build the frontend (web + widget) into frontend/dist"
dir = "{{config_root}}/frontend"
depends = ["frontend:install"]
run = "pnpm build"

[tasks.build]
description = "Build backend and frontend"
depends = ["backend:build", "frontend:build"]

[tasks."backend:test"]
description = "Run backend unit and integration tests"
run = "cargo test --workspace --features budget-book/test-hooks"

[tasks."frontend:test"]
description = "Run frontend unit tests (vitest)"
dir = "{{config_root}}/frontend"
depends = ["frontend:install"]
run = "pnpm test"

[tasks."frontend:browser"]
description = "Real-browser capture (chromium headless, API stubbed) into frontend/test-results/browser/"
dir = "{{config_root}}/frontend"
depends = ["frontend:install"]
run = ["pnpm exec playwright install chromium", "pnpm exec playwright test"]

[tasks."frontend:usage-shots"]
description = "Re-capture the usage-page figure assets (login/consent, 390px) into frontend/src/web/assets/usage/"
dir = "{{config_root}}/frontend"
depends = ["frontend:install"]
run = [
  "pnpm exec playwright install chromium",
  "pnpm exec playwright test tests/browser/capture.usage.spec.ts",
  "mkdir -p src/web/assets/usage",
  "cp test-results/browser/capture/390/login.png src/web/assets/usage/login.png",
  "cp test-results/browser/capture/390/consent.png src/web/assets/usage/consent.png",
]

[tasks."scripts:test"]
description = "Run the scripts/ unit tests (deploy ops, unittest)"
run = "uv run --no-project python -m unittest discover -s scripts/deploy -p 'test_*.py'"

[tasks.test]
description = "Run all tests"
depends = ["backend:test", "frontend:test", "scripts:test"]

[tasks."backend:lint"]
description = "rustfmt check and clippy (warnings are errors)"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo clippy --workspace --all-targets --features budget-book/test-hooks -- -D warnings",
]

[tasks."frontend:lint"]
description = "ESLint (vue/no-v-html enforced) and vue-tsc type check"
dir = "{{config_root}}/frontend"
depends = ["frontend:install"]
run = ["pnpm lint", "pnpm typecheck"]

[tasks.lint]
description = "Run all linters"
depends = ["backend:lint", "frontend:lint"]

[tasks.verify]
description = "All tests and lint; exit code is non-zero on any failure"
depends = ["lint", "test"]

[tasks."dev:backend"]
description = "Run the dev backend server (reads configs/dev/*.toml)"
run = "cargo run -p budget-book -- --config-dir configs/dev"

[tasks."dev:frontend"]
description = "Run the Vite dev server (--strictPort: fixed dev port from configs/dev/app.toml, fail when occupied)"
dir = "{{config_root}}/frontend"
depends = ["frontend:install"]
run = "pnpm dev --strictPort"

[tasks.dev]
description = "Run backend and frontend dev servers in parallel"
depends = ["dev:backend", "dev:frontend"]

# stg/prod operations: thin wrappers over scripts/deploy/kakeiboot_ops.py (TASK-118).
# The runtime dir root and the execution transport (local vs ssh to the runtime
# host) come from configs/deploy.toml; see docs/ops/ops_deploy.md. The work repo only
# runs dev otherwise.

[tasks."stg:deploy"]
description = "stgへdeploy（build → 配布 → kakeiboot-stg再起動 → healthz確認。処理本体は scripts/deploy/kakeiboot_ops.py）"
depends = ["build"]
run = "uv run --no-project python scripts/deploy/kakeiboot_ops.py deploy --env stg"

[tasks."prod:deploy"]
description = "prodへdeploy（build → 配布 → kakeiboot-prod再起動 → healthz確認。処理本体は scripts/deploy/kakeiboot_ops.py）"
depends = ["build"]
run = "uv run --no-project python scripts/deploy/kakeiboot_ops.py deploy --env prod"

[tasks."exec-stg"]
description = "stg運用dirでbudget-bookの任意subcommand（mise run exec-stg -- admin user list）"
usage = "arg \"<args...>\""
run = "uv run --no-project python scripts/deploy/kakeiboot_ops.py exec --env stg ${usage_args}"

[tasks."exec-prod"]
description = "prod運用dirでbudget-bookの任意subcommand（mise run exec-prod -- admin token issue --kind setup --note ...）"
usage = "arg \"<args...>\""
run = "uv run --no-project python scripts/deploy/kakeiboot_ops.py exec --env prod ${usage_args}"

[tasks."stg:service"]
description = "kakeiboot-stgのsystemd user service操作（mise run stg:service -- status）"
usage = "arg \"<verb...>\""
run = "uv run --no-project python scripts/deploy/kakeiboot_ops.py service --env stg ${usage_verb}"

[tasks."prod:service"]
description = "kakeiboot-prodのsystemd user service操作（mise run prod:service -- is-active）"
usage = "arg \"<verb...>\""
run = "uv run --no-project python scripts/deploy/kakeiboot_ops.py service --env prod ${usage_verb}"

# backup (TASK-83): daily systemd user timer kakeiboot-backup@<env> + bin/kakeiboot-backup.sh
# （deployで配布）。詳細は docs/ops/ops_deploy.md。
# unit fileは .in 正本を render して配布（TASK-119）: units:install が
# kakeiboot-backup@.service.in の {{deploy_root}} を configs/deploy.toml で置換し、
# render済みserviceとtimerを user config dir へrsync・daemon-reload する（env非依存）。

[tasks."stg:backup"]
description = "stg backup手動即時実行（timerと同一oneshot unit。完了まで待つ）"
run = "uv run --no-project python scripts/deploy/kakeiboot_ops.py backup --env stg"

[tasks."prod:backup"]
description = "prod backup手動即時実行（timerと同一oneshot unit。完了まで待つ）"
run = "uv run --no-project python scripts/deploy/kakeiboot_ops.py backup --env prod"

[tasks."stg:backup-status"]
description = "stg backup状態確認（last_success・世代dir一覧・timer・前回実行結果）"
run = "uv run --no-project python scripts/deploy/kakeiboot_ops.py backup-status --env stg"

[tasks."prod:backup-status"]
description = "prod backup状態確認（last_success・世代dir一覧・timer・前回実行結果）"
run = "uv run --no-project python scripts/deploy/kakeiboot_ops.py backup-status --env prod"

[tasks."units:install"]
description = "backup unitをuser config dirへ配布（.in正本をdeploy_rootでrender → rsync → daemon-reload。unitはenv非依存のため接頭はunits:）"
run = "uv run --no-project python scripts/deploy/kakeiboot_ops.py install-units"
